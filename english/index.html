{id:'e5',u:'5',t:'Why We Believe What We Read Online',words:'',p:["Every day, millions of people read news on their phones, often without checking where it comes from. A message can travel around the world in a few minutes, and a false story can spread faster than the truth. This is why teachers in many countries now include \"media literacy\" in their lessons.","One reason false news spreads so easily is that it is designed to attract attention. Headlines that cause anger or surprise are shared far more often than calm, careful reports. In a well-known experiment, researchers followed thousands of online stories and found that false ones reached people about six times faster than true ones.","Psychologists point to another factor: we tend to believe information that agrees with what we already think. When a story supports our opinion, we rarely stop to ask whether it is accurate. This habit, called confirmation bias, affects everyone, including highly educated people.","So how can we protect ourselves? Experts recommend a few simple questions. Who wrote this, and why? Is there evidence, or is the text just an opinion? Do other reliable sources report the same thing? And finally, how does this make me feel? A strong emotional reaction is often a warning sign that someone wants us to share before we think.","Some companies have begun to help. Social networks now mark certain stories as \"disputed\", and search engines show reliable sources first. However, critics say that these tools are not enough, because the final decision always belongs to the reader.","Media literacy is not about distrusting everything. It is about reading with attention and being willing to change our minds. As one teacher told her students, \"Do not stop reading the news. Just stop believing it before you have checked it.\""],gl:{literacy:'אוריינות',confirm:'לאשר',bias:'הטיה',reliable:'אמין',disputed:'שנוי במחלוקת',accurate:'מדויק'},

{id:'e6',u:'5',t:'Walking: The Forgotten Exercise',words:'',p:["In an age of gyms, sports watches and expensive running shoes, it is easy to forget that the simplest exercise of all costs nothing: walking. Yet doctors say that a daily walk can do more for our health than many people imagine.","Studies show that walking for thirty minutes a day reduces the risk of heart disease and helps control weight. It also improves mood, because exercise causes the body to release chemicals that make us feel happier. People who walk regularly tend to sleep better and to feel less stress.","Walking has a surprising effect on the mind as well. In an experiment at a university, students were asked to come up with new ideas, some while sitting and others while walking. Those who walked produced about sixty percent more ideas. Many writers and scientists have known this for centuries; some of them took long walks every day when they needed to solve a problem.","Unfortunately, modern life makes walking harder. In many cities, the streets are designed for cars, not for people, and a trip of five hundred metres is often made by car. As a result, the average person walks much less than their grandparents did.","Experts suggest easy ways to change this: get off the bus one stop early, take the stairs instead of the lift, or meet a friend for a walk instead of a coffee. Some people use a small device to count their steps, and the goal of ten thousand steps a day has become popular, although doctors say that even half this number brings benefits.","The best thing about walking is that anyone can begin today. You do not need a membership, special clothes or a lot of time. You only need to open the door and take the first step."],

{id:'e7',u:'5',t:'The Mystery of the Migrating Birds',words:'',p:["Every autumn, millions of birds leave their summer homes in Europe and fly thousands of kilometres to warmer places. Some travel over deserts and seas without stopping to eat or drink. For centuries, people wondered how these small animals find their way.","Scientists have discovered that birds use several \"tools\" at the same time. During the day, many of them navigate by the position of the sun. At night, they use the stars, and some species can even sense the magnetic field of the earth, like a built-in compass. Young birds that have never made the journey before often follow older, more experienced birds.","In recent years, researchers have attached tiny devices, weighing less than a coin, to birds' backs. These devices record the route and send the information to a computer. The results were surprising. One small bird, weighing only a few grams, flew more than ten thousand kilometres in a single journey, and some birds returned each year to exactly the same tree.","Unfortunately, migration is becoming more dangerous. Cities with bright lights confuse birds that travel at night. Wetlands, where birds rest and eat, are disappearing because of building. And climate change moves the seasons, so some birds arrive when there is no longer enough food.","Conservation groups are trying to help. In several countries, cities turn off unnecessary lights during the migration season, and volunteers count birds and help to protect their resting places. Such work often depends on ordinary people: a farmer who leaves a small pond in his field may save hundreds of birds.","The story of migration shows how connected our world is. A bird that spends the summer in one country and the winter in another reminds us that nature has no borders, and that the decisions of one place can affect life thousands of kilometres away."],

{id:'g4',u:'5',t:'Should Everyone Learn to Code?',words:'',p:["Not long ago, learning to write computer programs was something only a few specialists did. Today, many governments and schools encourage every student to learn to code. Supporters say that programming is the new literacy; critics answer that not every child needs it. Who is right?","Those in favour begin with the job market. Technology plays a role in almost every industry, from farming to medicine, and people who understand how software works have a clear advantage. Even those who never become programmers can benefit: a doctor who can analyse data or a teacher who can create a simple application will work more effectively than one who cannot.","Supporters also point to the way coding trains the mind. To write a program, one must break a large problem into small steps, test each step and find the mistake when something goes wrong. These skills, known as \"computational thinking\", are useful in daily life, whether you are planning a trip or organising a school event.","However, critics raise several objections. First, the school day is limited, and every new subject means less time for something else, such as art, music or sport. Second, technology changes rapidly; the language that students learn today may be out of date in ten years. A more lasting investment, they say, would be strong reading, mathematics and communication skills.","There is also a question of fairness. In a school with old computers and a teacher who has no training, a coding course may do more harm than good, because students become frustrated and decide that technology is \"not for them\". Studies show that girls and students from poorer families are especially likely to lose interest in such conditions.","Interestingly, many experts support a middle way. They suggest that schools teach the main ideas of programming, such as logic, patterns and testing, without making every student a professional. Those who find it exciting can then continue at a higher level, either in school or on their own.","The debate, then, is less about whether coding is useful and more about how it should be taught, and to whom. A good course can open a door for a child who would never have noticed it. A poor course may close that door for ever. Perhaps the real question for every school is not \"Should we teach coding?\" but \"Can we teach it well?\""],gl:{literacy:'אוריינות',specialist:'מומחה',objection:'התנגדות',frustrated:'מתוסכל',logic:'היגיון',pattern:'דפוס'},

{id:'g5',u:'5',t:'City Gardens, Country Hearts',words:'',p:["On the roof of an old factory in the middle of a busy city, a woman named Hila is picking tomatoes. Around her, there are rows of lettuce, herbs and strawberries growing in wooden boxes. Below, cars and buses move slowly in the traffic, but up here the air smells of green leaves. \"I never thought I would be a farmer,\" Hila laughs. \"I am a graphic designer.\"","Hila is part of a growing movement. In cities around the world, people are turning roofs, balconies and empty plots into small gardens. Some do it for fun, others to save money, and many because they want to know exactly where their food comes from. In one large city, more than a quarter of the families now grow at least some of their own vegetables.","Urban gardens bring benefits that go well beyond food. Plants cool the air, absorb dust and reduce noise. A building with a green roof stays cooler in summer and warmer in winter, so it needs less electricity. Gardens also give neighbours a reason to meet: in many places, a garden has turned strangers into friends.","The social benefits can be remarkable. In one neighbourhood, residents transformed a dirty empty lot into a vegetable garden. Teenagers, who had earlier spent their evenings on the street with nothing to do, began to take care of the plants. \"When you watch something grow because of your work,\" said one of them, \"you feel proud in a way that nothing else gives you.\"","Of course, there are difficulties. City soil can contain harmful metals from old industry, so gardeners often need to test it or use boxes with clean earth. Water is expensive, and space is limited. Some owners of buildings worry about the weight of the plants on the roof, or about leaks.","Nevertheless, the movement continues to spread, helped by new ideas such as vertical gardens on walls and shared community plots. City governments are also joining in: some offer free training or give permission to use unused land.","Will city gardens ever feed a whole city? Probably not. But that may not be their main purpose. They remind us that nature is not something far away, and that even in the middle of concrete, a person with a few boxes and some patience can make something grow."],gl:{urban:'עירוני',absorb:'לספוג',transform:'להפוך',lot:'מגרש',leak:'נזילה',vertical:'אנכי'},

{id:'g6',u:'5',t:'The Value of Boredom',words:'',p:["A hundred years ago, a child who was bored on a Sunday afternoon had no choice but to look for something to do: to build a fort, to invent a game or to stare at the clouds. Today, with a phone in every pocket, boredom has nearly disappeared. A few seconds of nothing to do, and we reach for the screen. But psychologists are beginning to ask whether we have lost something valuable.","Boredom, they say, is a signal from the brain that it needs something new. When we feel bored, the mind begins to wander, and this wandering is not a waste of time. In a well-known experiment, people who first performed a very dull task, such as copying numbers from a phone book, then produced more creative ideas than those who did not. The dull task, it seems, pushed their minds to search for stimulation on their own.","Many famous writers and inventors have described how their best ideas came during quiet, empty moments: on a long train journey, in a shower or during a walk. In these moments, the brain connects pieces of information that are normally separate. If we fill every free minute with a screen, we may never give our minds the chance to do this.","This is especially important for children. Educators observe that children who are never bored depend on others to entertain them. Those who are allowed to be bored, by contrast, learn to create their own games and to enjoy their own company. Some parents have even begun to schedule \"empty time\" in their children's week, when there are no activities and no devices.","Of course, boredom is not always pleasant. For some people, long periods of nothing to do can lead to sadness or restlessness, and it is important to tell the difference between healthy boredom and loneliness. If a child seems unhappy for long periods, a conversation with an adult is a better answer than silence.","Even so, it may be time to see boredom in a new way. Instead of an enemy to be defeated at once, it can be a kind of open door. The next time you find yourself with nothing to do, you might try leaving your phone in your pocket for ten minutes. You may be surprised by where your thoughts take you."],gl:{psychologist:'פסיכולוג',stimulation:'גירוי',wander:'לנדוד',restlessness:'חוסר מנוחה',entertain:'לבדר',schedule:'לתזמן'},
q:[mc('What has happened to boredom in modern life, according to paragraph 1?',['It has nearly disappeared because of phones.','It has become more common.','It is now a school subject.','It is always dangerous.'],0,'פסקה 1.'),op('According to psychologists, what is boredom?',"A signal from the brain that it needs something new.",['signal','something new']),op('What did the experiment with a dull task show?',"People who did a dull task first produced more creative ideas.",['creative','dull']),tf('The writer says that good ideas often come in quiet, empty moments.',true,'best ideas came during quiet, empty moments'),fl('Educators say that children who are never bored depend on others to ______ them.',['entertain'],'פסקה 4.'),op('What do some parents do to give children time to be bored?',"They schedule empty time with no activities and no devices.",['empty time','no devices']),mc('What warning does paragraph 5 give?',['Long boredom can be sad for some people, so we should tell the difference between boredom and loneliness.','Boredom is always good.','Children should never be alone.','Adults should avoid boredom.'],0,'פסקה 5.'),op('What does the writer suggest at the end?',"To leave the phone in the pocket for ten minutes when bored and see where thoughts go.",['phone','ten minutes']),mc('What does the writer mean by "an open door" at the end?',['Boredom can lead to new thoughts and ideas.','A door in the school.','A way to leave home.','A kind of game.'],0,'פסקה 6.'),tf('The writer thinks boredom must be defeated immediately.',false,'Instead of an enemy to be defeated at once')]}

BGR.find(x=>x.id==='g4').p.splice(-1,0,"One practical obstacle is teacher training. A programming teacher must understand the subject and also know how to explain it to beginners, and such people are rare and often prefer to work in industry, where salaries are higher. Some schools have solved the problem by inviting volunteers from local companies, or by using online lessons together with a class teacher who guides the discussion. These solutions are not perfect, but they show that creative planning can reduce the gap.");
BGR.find(x=>x.id==='g5').p.splice(-1,0,"A small example shows how far an idea can go. In one town, a group of neighbours began to collect vegetable scraps from their kitchens and turn them into rich earth for the garden. Within a year, a local restaurant joined the project and began to bring its own scraps, and the town's amount of rubbish fell noticeably. The gardeners had not planned to change the whole town; they only wanted better tomatoes. Yet, as often happens, a small step started a much larger change.");
BGR.find(x=>x.id==='g6').p.splice(-1,0,"Schools and companies are also beginning to notice the value of quiet time. In one school, the day now begins with five minutes in which students may sit, draw or look out of the window, but may not use a device. Teachers report that lessons start more calmly and that students find it easier to concentrate afterwards. Some firms offer rooms with no screens, where employees can rest their eyes and think. None of this is expensive, and it costs nothing to try.");

litx('daffodils','I Wandered Lonely as a Cloud (William Wordsworth)','45',"I wandered lonely as a cloud\nThat floats on high o'er vales and hills,\nWhen all at once I saw a crowd,\nA host, of golden daffodils;\nBeside the lake, beneath the trees,\nFluttering and dancing in the breeze.\n\nContinuous as the stars that shine\nAnd twinkle on the milky way,\nThey stretched in never-ending line\nAlong the margin of a bay:\nTen thousand saw I at a glance,\nTossing their heads in sprightly dance.\n\nThe waves beside them danced; but they\nOut-did the sparkling waves in glee:\nA poet could not but be gay,\nIn such a jocund company:\nI gazed—and gazed—but little thought\nWhat wealth the show to me had brought:\n\nFor oft, when on my couch I lie\nIn vacant or in pensive mood,\nThey flash upon that inward eye\nWhich is the bliss of solitude;\nAnd then my heart with pleasure fills,\nAnd dances with the daffodils.",{vales:'עמקים',host:'המון',margin:'שפה',glee:'שמחה',jocund:'עליז',pensive:'מהורהר',bliss:'אושר'},[

litx('if','If— (Rudyard Kipling)','5',"If you can keep your head when all about you\nAre losing theirs and blaming it on you,\nIf you can trust yourself when all men doubt you,\nBut make allowance for their doubting too;\nIf you can wait and not be tired by waiting,\nOr being lied about, don't deal in lies,\nOr being hated, don't give way to hating,\nAnd yet don't look too good, nor talk too wise:\n\nIf you can dream—and not make dreams your master;\nIf you can think—and not make thoughts your aim;\nIf you can meet with Triumph and Disaster\nAnd treat those two impostors just the same;\nIf you can bear to hear the truth you've spoken\nTwisted by knaves to make a trap for fools,\nOr watch the things you gave your life to, broken,\nAnd stoop and build 'em up with worn-out tools:\n\nIf you can make one heap of all your winnings\nAnd risk it on one turn of pitch-and-toss,\nAnd lose, and start again at your beginnings\nAnd never breathe a word about your loss;\nIf you can force your heart and nerve and sinew\nTo serve your turn long after they are gone,\nAnd so hold on when there is nothing in you\nExcept the Will which says to them: \"Hold on!\"\n\nIf you can talk with crowds and keep your virtue,\nOr walk with Kings—nor lose the common touch,\nIf neither foes nor loving friends can hurt you,\nIf all men count with you, but none too much;\nIf you can fill the unforgiving minute\nWith sixty seconds' worth of distance run,\nYours is the Earth and everything that's in it,\nAnd—which is more—you'll be a Man, my son!",{allowance:'התחשבות',impostor:'מתחזה',knave:'נוכל',sinew:'גיד',virtue:'מידה טובה',triumph:'ניצחון'},[

litx('necklace','The Necklace (short story by Guy de Maupassant, simple retelling)','45',"Mathilde is a beautiful young woman who dreams of a rich life, but her husband is a small clerk. One day he brings an invitation to a grand ball. She cries because she has no dress and no jewels. He gives her money for a dress, and she borrows a diamond necklace from a rich friend, Madame Forestier.\n\nAt the ball, Mathilde is the most beautiful woman in the room, and she dances all night. When she returns home, she finds that the necklace is gone. The couple searches everywhere, but they cannot find it. They decide not to tell the friend. Instead, they buy an expensive new necklace, using all their money and borrowing a lot more.\n\nFor ten long years, the couple lives in poverty to pay the debt. Mathilde works hard, and her beauty fades. One day, she meets Madame Forestier by chance and tells her the whole story. Her friend, shocked, answers that her necklace was not real: it was made of cheap glass and was worth almost nothing.",{clerk:'פקיד',jewels:'תכשיטים',ball:'נשף',debt:'חוב',poverty:'עוני',fade:'לדעוך'},[

litx('paw',"The Monkey's Paw (short story by W. W. Jacobs, simple retelling)",'5',"A family receives a dried monkey's paw from a visitor who says it can give three wishes, but that the wishes bring sorrow. Mr. White laughs, but he takes the paw and wishes for two hundred pounds.\n\nThe next day, a man from the factory where the son, Herbert, works arrives at the door. Herbert has died in an accident, and the company will pay the family two hundred pounds. Mrs. White, mad with grief, forces her husband to use the second wish: to bring Herbert back.\n\nLate that night, they hear a slow knocking at the door. Mrs. White rushes to open it, but Mr. White, horrified at what might stand outside, finds the paw and makes the third wish. The knocking stops. When Mrs. White opens the door, there is only the empty, quiet street.",{paw:'כף רגל של בעל חיים',wish:'משאלה',sorrow:'צער',grief:'אבל',horrified:'מבועת',knocking:'דפיקות'},[

const STOP=new Set('about after again also always because before being between could every first found from have into just know like little made many more most much must never only other over said same should since some still such than that their them then there these they this those through very want were what when where which while will with would your'.split(' '));
function cloze(text,n=6){const sn=text.split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=4);const all=[...new Set((text.match(/[A-Za-z]{4,}/g)||[]).map(x=>x.toLowerCase()))].filter(w=>!STOP.has(w));const qs=[];
 for(const s of sn.sort(()=>Math.random()-.5)){if(qs.length>=n)break;const ws=(s.match(/[A-Za-z]{4,}/g)||[]).filter(w=>!STOP.has(w.toLowerCase()));if(!ws.length)continue;const a=ws[Math.floor(Math.random()*ws.length)];const d=all.filter(x=>x!==a.toLowerCase()&&Math.abs(x.length-a.length)<=2).sort(()=>Math.random()-.5).slice(0,3);if(d.length<2)continue;const opts=[...d,a.toLowerCase()].sort(()=>Math.random()-.5);qs.push([s.replace(new RegExp('\\b'+a+'\\b'),'_____'),opts,opts.indexOf(a.toLowerCase()),'המשפט המלא: '+s])}
 return qs}

async function initCrop(){const f=BK.files[BK.i];if(!f)return;try{BK.img=await loadImg(f)}catch(err){$('#ocr').textContent='לא הצלחתי לפתוח את התמונה';return}drawCrop()}

async function runOCR(){const st=$('#ocr');S.ocrLang=$('#ol').value;save();if(!BK.src){st.textContent='התמונה עוד נטענת…';return}

 catch(err){st.innerHTML='לא הצלחתי לזהות. בדקי חיבור לאינטרנט, או נסי תמונה חדה יותר, אנגלית בלבד, או חיתוך של אזור קטן. אפשר גם להדביק את הטקסט ידנית.'}}

 if(x==='gcheck'&&q[0]==='fill'){const v=($('#gin').value||'').trim();G.val=v;if(!v){$('#gfb').innerHTML='<div class="fb no">כתבי תשובה קודם 🙂</div>';return}const alts=q[2].split('|');const full=alts.map(a=>filled(q,a));const ok=alts.some((a,i)=>nzx(v)===nzx(a)||(full[i]&&nzx(v)===nzx(full[i])));
  if(ok)finish(true,full[0]);else wrong(full[0]||alts[0])}
 if(x==='gskip'&&q[0]==='fill'){G.tries=1;const alts=q[2].split('|');finish(false,filled(q,alts[0])||alts[0])}
 if(x==='gtile'){const T=G.tiles,i=+b.dataset.i;if(b.dataset.from==='bank'){T.bank=T.bank.filter(z=>z!==i);T.ans.push(i)}else{T.ans=T.ans.filter(z=>z!==i);T.bank.push(i)}render()}
 if(x==='greset'){G.tiles=null;render()}
 if(x==='gcheck'&&q[0]==='order'){const w=q[1].split(' ');const mine=G.tiles.ans.map(i=>w[i]).join(' ');if(nzx(mine)===nzx(q[1]))finish(true,q[1]);else wrong(q[1])}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gin'){const b=document.querySelector('[data-x=gcheck]');if(b)b.click()}});

/* ---- find the mistake ---- */
const norm=t=>t.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const ECATS=[...new Set(ERR.map(e=>e.c))];
const ES={c:''};
function vErr(){
 if(!V.ep)return hd('מצא את הטעות',['gr'])+`<div class="card"><b>✏️ טעויות שדוברי עברית עושים באנגלית</b><p class="mu">נציג משפט עם טעות נפוצה, ואת תקני אותו. אחרי ניסיון ראשון שגוי תקבלי רמז, ואחרי השני נראה את התשובה. טעויות חוזרות חוזרות אלייך שוב בסבבים הבאים. (${(S.bank||[]).length} בבנק החזרה)</p><div class="row">${[['','הכול']].concat(ECATS.map(c=>[c,c])).map(c=>`<button class="btn s ${ES.c===c[0]?'':'g'}" data-x="ecat" data-v="${esc(c[0])}">${esc(c[1])}</button>`).join('')}</div><button class="btn" style="margin-top:12px" data-x="estart">התחילי ←</button></div>`;
 const P=V.ep;if(P.i>=P.l.length)return hd('סיכום',['home'])+`<div class="card"><h2>סיימת! 🎉</h2><p>תיקנת נכון בניסיון הראשון ${P.sc} מתוך ${P.l.length}. ${(S.bank||[]).length?'הטעויות שנשארו יחזרו בסבב הבא.':'כל הכבוד, אין טעויות בבנק!'}</p><div class="row"><button class="btn" data-x="estart">עוד סבב</button><button class="btn g" data-x="eexit">חזרה</button></div></div>`;
 const e=ERR[P.l[P.i]];return hd('מצא את הטעות',null)+`<div class="card"><div class="mu">${P.i+1} מתוך ${P.l.length} · <span class="tag">${esc(e.c)}</span></div><div class="bar" style="margin:6px 0"><i style="width:${P.i/P.l.length*100}%"></i></div><p>תקני את המשפט:</p><div class="en" style="color:var(--no);font-weight:700">✗ ${esc(e.b)}</div><input class="en" id="ea" placeholder="כתבי את המשפט הנכון" autocomplete="off" ${P.done?'disabled':''}><div class="row" style="margin-top:8px">${P.done?`<button class="btn" data-x="enext">${P.i+1<P.l.length?'הבא':'לסיום'} ←</button><button class="btn g s" data-x="spkq" data-t="${esc(e.g)}">🔊</button>`:`<button class="btn" data-x="echk">בדיקה</button><button class="btn g s" data-x="eskip">אני לא יודעת</button>`}</div><div id="efb">${P.fb||''}</div></div>`}
document.addEventListener('click',e=>{const x=e.target.dataset.x;if(V.tab!=='err')return;
 if(x==='ecat'){ES.c=e.target.dataset.v;render()}
 if(x==='estart'){S.bank=S.bank||[];let all=ERR.map((_,i)=>i).filter(i=>!ES.c||ERR[i].c===ES.c);const bk=S.bank.filter(i=>all.includes(i)).slice(0,3);const rest=pickN(all.filter(i=>!bk.includes(i)),10-bk.length);V.ep={l:pickN([...bk,...rest],10),i:0,sc:0,tries:0,done:false,fb:''};render()}
 if(x==='eexit'){V.ep=null;render()}
 if(x==='enext'){const P=V.ep;P.i++;P.tries=0;P.done=false;P.fb='';render()}
 if(x==='echk'||x==='eskip'){const P=V.ep,idx=P.l[P.i],er=ERR[idx];S.bank=S.bank||[];const a=($('#ea').value||'').trim();
  if(x==='echk'&&!a){$('#efb').innerHTML='<div class="fb no">כתבי תיקון קודם 🙂</div>';return}
  if(x==='echk'&&norm(a)===norm(er.g)){const first=P.tries===0;if(first){P.sc++;gain(10,1);S.bank=S.bank.filter(i=>i!==idx)}else gain(4,1);P.fb=`<div class="fb ok">✅ ${first?'נכון, כל הכבוד!':'יפה, תיקנת!'} <span class="en">${esc(er.g)}</span><br>${esc(er.w)}</div>`;P.done=true;burst(e);render();return}
  P.tries++;
  if(x==='echk'&&P.tries<2){const w=er.g.split(' ');P.fb=`<div class="fb no">כמעט. 💡 רמז: התיקון מתחיל ב-<b class="en">${esc(w[0])}…</b> ויש בו ${w.length} מילים. נסי שוב.</div>`;render();$('#ea').value=a;return}
  if(!S.bank.includes(idx))S.bank.push(idx);P.fb=`<div class="fb no">התשובה: <b class="en">${esc(er.g)}</b><br>${esc(er.w)}<br><span class="mu">נחזור על זה בסבב הבא.</span></div>`;P.done=true;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ea'){const b=document.querySelector('[data-x=echk]');if(b)b.click()}});
render();
</script></body></html>
