<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1b5e"><title>Speak Up – אנגלית בכיף</title>
<style>
:root{--bg:#1b1240;--bg2:#2a1b5e;--card:#ffffff14;--card2:#ffffff22;--tx:#fff;--mu:#c9c1ee;--ac:#ff7ab8;--ac2:#7af0d0;--ok:#4ade80;--no:#ff6b6b;--yl:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
body{padding-bottom:84px}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px}
h1,h2,h3{margin:.3em 0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 10px}
.logo{font-weight:800;font-size:22px}.logo b{color:var(--ac)}
.pill{background:var(--card2);border-radius:99px;padding:5px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid #ffffff1f;border-radius:20px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card2);border:0;border-radius:18px;padding:14px 10px;color:var(--tx);font:inherit;text-align:center;cursor:pointer;min-height:96px}
.tile:active{transform:scale(.97)}.tile .ic{font-size:30px;display:block}.tile small{color:var(--mu)}
.btn{background:linear-gradient(90deg,var(--ac),#b28dff);color:#1b1240;border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;min-height:44px}
.btn.g{background:var(--card2);color:var(--tx)}.btn.s{padding:7px 12px;min-height:36px;font-size:15px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.en{direction:ltr;text-align:left;font-size:20px;line-height:1.8}
.en .w{cursor:pointer;border-radius:6px;padding:0 1px}.en .w:hover,.en .w.sel{background:#7af0d033}
.en .w.k{border-bottom:2px solid var(--ok)}.snt.on{background:#ffd16638;border-radius:6px}
.line{direction:ltr;text-align:left;padding:6px 8px;border-radius:10px;display:flex;gap:8px;align-items:flex-start}
.line.on{background:#ffd16638}.line .n{opacity:.5;min-width:22px;font-size:13px;padding-top:5px}
.gap{height:10px}
.opt{display:block;width:100%;text-align:right;background:var(--card2);border:2px solid transparent;border-radius:14px;color:var(--tx);padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.mc{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:14px;color:var(--tx);padding:10px 14px;margin:6px 0;font:inherit;cursor:pointer;direction:ltr}.fm{background:linear-gradient(90deg,#7af0d022,#ff7ab822);border:1px dashed #ffffff44;border-radius:12px;padding:10px;text-align:center;font-weight:800;margin-top:8px;font-size:18px}.blank{border-bottom:3px solid var(--ac);padding:0 14px;color:var(--ac)}.mc.sel{border-color:var(--ac2)}.mc.ok{border-color:var(--ok);background:#4ade8033}.mc.no{border-color:var(--no);background:#ff6b6b33}.opt.ok{border-color:var(--ok);background:#4ade8033}.opt.no{border-color:var(--no);background:#ff6b6b33}
.opt.enOpt{direction:ltr;text-align:left}
.fb{padding:10px 12px;border-radius:12px;margin:8px 0}.fb.ok{background:#4ade8026}.fb.no{background:#ff6b6b26}
input,textarea,select{width:100%;background:#0000003a;border:1px solid #ffffff33;border-radius:12px;color:var(--tx);padding:10px 12px;font:inherit}
textarea{min-height:140px}input.en,textarea.en{direction:ltr;text-align:left}
.bar{height:10px;background:#ffffff22;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
nav{position:fixed;bottom:0;left:0;right:0;background:#150d33f2;backdrop-filter:blur(8px);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff22;z-index:5}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 4px;cursor:pointer;min-width:0;flex:1}
nav button span{font-size:22px}nav button.on{color:#fff}nav button.on span{filter:drop-shadow(0 0 6px var(--ac))}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;width:min(92vw,420px);background:#fff;color:#1b1240;border-radius:18px;padding:14px 16px;box-shadow:0 10px 40px #0008;z-index:9}
.mod{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.mod>div{position:relative;background:#fff;color:#1b1240;border-radius:20px;padding:20px 18px;max-width:440px;max-height:88vh;overflow:auto;line-height:1.6}.mod h3{margin:0 0 8px}.mod ol{padding-inline-start:20px;margin:8px 0}.mod .x{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:0;background:#1b1240;color:#fff;font-size:18px;cursor:pointer}
.pop .big{font-size:22px;font-weight:800;direction:ltr;text-align:left}
.chip{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 11px;margin:3px;font-size:15px;direction:ltr}
.chip small{color:var(--mu);direction:rtl;unicode-bidi:isolate;display:inline-block}.chip .sp{margin:0 6px;color:var(--ac)}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:800;cursor:pointer}
.mu{color:var(--mu);font-size:15px}.tag{background:var(--yl);color:#1b1240;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800}
.burst{position:fixed;pointer-events:none;font-size:28px;z-index:20;animation:b 1s ease-out forwards}
@keyframes b{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-120px) scale(1.6)}}
a{color:var(--ac2)}
@media(min-width:900px){body{padding-bottom:0;padding-right:96px}nav{top:0;bottom:0;left:auto;right:0;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding-top:16px;border-top:0;border-left:1px solid #ffffff22}}
</style></head><body>

<script>
/*DATA*/
const READ=[{"id": "music", "icon": "🎧", "t": "מוזיקה", "lv": "A2", "en": "Music is a big part of my life. Every morning, I listen to my favorite songs on the bus. Last year, I learned to play the guitar, and now I practice every day. Next month, I will play in a small concert with my friends. I am a little afraid, but I am also very excited. Music always makes me feel better.", "q": [["מתי הדוברת מקשיבה לשירים האהובים עליה?", ["בבוקר באוטובוס", "בלילה במיטה", "בבית הספר", "בקונצרט"], 0, "המשפט: Every morning, I listen to my favorite songs on the bus. (every morning = כל בוקר)"], ["מה היא למדה לנגן בשנה שעברה? (Last year = עבר)", ["פסנתר", "גיטרה", "תוף", "כינור"], 1, "Last year, I learned to play the guitar. learned הוא עבר פשוט."], ["איך היא מרגישה לגבי הקונצרט?", ["משועממת", "כועסת", "קצת מפחדת וגם מתרגשת", "עייפה"], 2, "I am a little afraid, but I am also very excited."]]}, {"id": "soccer", "icon": "⚽", "t": "ספורט", "lv": "A2", "en": "My brother plays soccer for a team in our city. They train three times a week, and on Saturday they play a game. Yesterday they won, and everyone was very happy. He says that a good team needs hard work and a good friend in every position. If they win the next game, they will go to the final.", "q": [["כמה פעמים בשבוע הקבוצה מתאמנת?", ["פעם אחת", "פעמיים", "שלוש פעמים", "כל יום"], 2, "They train three times a week."], ["למה כולם היו שמחים אתמול?", ["כי הם ניצחו", "כי הם הפסידו", "כי היה חג", "כי המאמן חזר"], 0, "Yesterday they won. won הוא עבר של win."], ["מה יקרה אם הם ינצחו במשחק הבא? (תנאי)", ["הם יפסיקו לשחק", "הם ילכו לגמר", "הם יעברו עיר", "הם ינוחו"], 1, "If they win the next game, they will go to the final. מבנה תנאי: If + הווה, will + פועל."]]}, {"id": "phone", "icon": "📱", "t": "טלפון ושינה", "lv": "B1", "en": "Many teenagers use a phone for hours every day. They send messages, take photos, and watch videos. But too much time on a phone can be bad for sleep and for school. Last week, I turned off my phone after dinner, and I slept better. Now I read a book before bed. Have you ever tried it?", "q": [["מה יכול להיות רע בהרבה זמן מסך?", ["לאוכל ולספורט", "לשינה וללימודים", "לחברים ולמשפחה", "לעיניים בלבד"], 1, "too much time on a phone can be bad for sleep and for school."], ["מה הדוברת עשתה בשבוע שעבר?", ["קנתה טלפון", "שברה את הטלפון", "כיבתה את הטלפון אחרי ארוחת הערב", "צילמה הרבה"], 2, "Last week, I turned off my phone after dinner."], ["מה היא עושה עכשיו לפני השינה?", ["מקשיבה למוזיקה", "קוראת ספר", "רואה סרט", "מכינה שיעורים"], 1, "Now I read a book before bed. Now = הווה."]]}, {"id": "travel", "icon": "✈️", "t": "טיולים", "lv": "A2", "en": "We are going to travel to a beautiful island next summer. We will fly for five hours, and then we will take a boat. My sister has already packed her bag, but I have not started yet. We will stay in a small hotel near the beach. I think the trip will be the best part of the year.", "q": [["מתי הם נוסעים?", ["בחורף הקרוב", "בקיץ הבא", "בשבוע הבא", "בשנה שעברה"], 1, "next summer = הקיץ הבא."], ["מה כבר עשתה האחות?", ["הזמינה מלון", "ארזה את התיק", "קנתה כרטיסים", "הגיעה לחוף"], 1, "My sister has already packed her bag. has packed = עבר-הווה (Present Perfect)."], ["איפה הם יישנו?", ["באוהל", "אצל חברים", "במלון קטן ליד החוף", "בסירה"], 2, "We will stay in a small hotel near the beach."]]}, {"id": "food", "icon": "🍝", "t": "בישול", "lv": "A2", "en": "Yesterday I cooked dinner for my family for the first time. I made rice with tomatoes and cheese. First, I boiled the water, and then I added the rice. My mother was surprised and she said it was delicious. Tomorrow I am going to try a new recipe, and maybe I will bake a cake.", "q": [["מה הדוברת הכינה?", ["פיצה", "אורז עם עגבניות וגבינה", "סלט", "עוגה"], 1, "I made rice with tomatoes and cheese."], ["איך אמא הגיבה?", ["כעסה", "הייתה מופתעת ואמרה שזה טעים", "לא אכלה", "בכתה"], 1, "My mother was surprised and she said it was delicious."], ["מה היא מתכננת לעשות מחר? (be going to)", ["לנוח", "לנסות מתכון חדש", "לקנות סיר", "ללכת למסעדה"], 1, "Tomorrow I am going to try a new recipe. am going to = תכנון לעתיד."]]}, {"id": "friends", "icon": "💛", "t": "חברות", "lv": "B1", "en": "A good friend listens to you when you are sad. She is honest, but she is also kind. My best friend and I have known each other since we were six years old. We do not always agree, but we never stay angry for a long time. I hope we will be friends for the rest of our lives.", "q": [["איך מתוארת חברה טובה?", ["כנה וגם אדיבה", "שקטה וביישנית", "תמיד מסכימה", "תמיד צוחקת"], 0, "She is honest, but she is also kind."], ["מאיזה גיל הן מכירות?", ["שש", "שתים עשרה", "עשר", "שלוש"], 0, "have known each other since we were six years old. since = מאז."], ["מה קורה כשהן לא מסכימות?", ["הן נשארות כועסות זמן רב", "הן לא נשארות כועסות זמן רב", "הן מפסיקות לדבר", "הן שוכחות"], 1, "we never stay angry for a long time. never = אף פעם לא."]]}, {"id": "movie", "icon": "🎬", "t": "סרטים", "lv": "B1", "en": "I saw a great movie last night. It was about a girl who finds a strange door in her house. When she opens it, she enters a different world full of colors. At first she is scared, but later she meets a friendly animal who helps her. The ending surprised me, and I want to watch it again.", "q": [["מה הילדה מוצאת בבית?", ["מפתח ישן", "דלת מוזרה", "חיה קטנה", "ספר"], 1, "a girl who finds a strange door in her house."], ["איך היא מרגישה בהתחלה?", ["שמחה", "מפוחדת", "רעבה", "משועממת"], 1, "At first she is scared. At first = בהתחלה."], ["מי עוזר לה?", ["חיה ידידותית", "המורה", "אמא שלה", "קוסם"], 0, "she meets a friendly animal who helps her."]]}, {"id": "animals", "icon": "🐶", "t": "חיות", "lv": "B1", "en": "Dogs have lived with people for thousands of years. They can understand many words, and they can feel when you are sad. A dog does not only want food; it also wants love and attention. If you have a dog, you should walk it every day. Cats are different: they like to sleep a lot and they often prefer to be alone.", "q": [["כמה זמן כלבים חיים עם בני אדם?", ["כמה חודשים", "אלפי שנים", "מאה שנה", "מאז אתמול"], 1, "have lived with people for thousands of years. have lived = Present Perfect."], ["מה כלב רוצה חוץ מאוכל?", ["כסף", "אהבה ותשומת לב", "חדר משלו", "צעצוע בלבד"], 1, "it also wants love and attention."], ["מה חתולים אוהבים?", ["לרוץ הרבה", "לישון הרבה ולפעמים להיות לבד", "לשחות", "לשחק עם כלבים"], 1, "they like to sleep a lot and they often prefer to be alone."]]}, {"id": "space", "icon": "🚀", "t": "החלל", "lv": "B1", "en": "Space is very big and very quiet. The Earth moves around the sun, and the moon moves around the Earth. Scientists have sent machines to other planets to look for water. Some people believe that one day humans will live on another planet. Would you like to go there?", "q": [["סביב מה כדור הארץ נע?", ["הירח", "השמש", "מאדים", "כוכב"], 1, "The Earth moves around the sun."], ["מה המדענים מחפשים בכוכבים אחרים?", ["אוכל", "מים", "זהב", "אנשים"], 1, "to look for water."], ["מה חלק מהאנשים מאמינים שיקרה יום אחד?", ["בני אדם יחיו על כוכב אחר", "השמש תיעלם", "הירח יתרחק", "החלל יהיה רועש"], 0, "one day humans will live on another planet."]]}, {"id": "school", "icon": "📚", "t": "בית ספר", "lv": "B1", "en": "Today I had a hard test in math, but I studied for two hours yesterday, so I think I did well. In the afternoon we worked in groups and made a project about the environment. My teacher said that mistakes are a normal part of learning. After school, I always do my homework before I play. I want to go to university one day.", "q": [["כמה זמן היא למדה למבחן?", ["שעה", "שעתיים", "שלוש שעות", "חצי שעה"], 1, "I studied for two hours yesterday."], ["על מה היה הפרויקט בקבוצות?", ["על חיות", "על הסביבה", "על היסטוריה", "על מוזיקה"], 1, "a project about the environment."], ["מה המורה אמרה על טעויות?", ["הן גרועות", "הן חלק נורמלי מהלמידה", "צריך להסתיר אותן", "הן נדירות"], 1, "mistakes are a normal part of learning."]]}, {"id": "job", "icon": "💼", "t": "עבודה וכסף", "lv": "B1", "en": "My cousin has a job in a coffee shop after school. She earns some money every week, and she saves half of it. She wants to buy a computer, but it costs a lot. Her boss says she works hard and is always on time. I think I will look for a job next year too.", "q": [["איפה בת הדודה עובדת?", ["בחנות בגדים", "בבית קפה", "בבנק", "בבית ספר"], 1, "a job in a coffee shop."], ["כמה מהכסף היא חוסכת?", ["הכול", "חצי", "כלום", "רבע"], 1, "she saves half of it."], ["מה הדוברת חושבת לעשות בשנה הבאה?", ["לחפש עבודה", "לקנות מחשב", "לעזוב את בית הספר", "לנסוע"], 0, "I will look for a job next year too."]]}, {"id": "sleep", "icon": "😴", "t": "שינה ובריאות", "lv": "B1", "en": "Sleep is very important for your body and your brain. Doctors say that teenagers need about nine hours every night. If you sleep too little, you feel tired and it is hard to learn. Exercise and healthy food also help. Try to go to bed at the same time every day, and drink more water.", "q": [["כמה שעות שינה בני נוער צריכים?", ["שש", "בערך תשע", "שתים עשרה", "ארבע"], 1, "about nine hours every night."], ["מה קורה אם ישנים מעט מדי?", ["מרגישים עייפים וקשה ללמוד", "מרגישים חזקים", "מקבלים ציונים טובים", "אין שינוי"], 0, "If you sleep too little, you feel tired and it is hard to learn."], ["איזו עצה יש בסוף?", ["לאכול ממתקים", "ללכת לישון באותה שעה כל יום", "לא לשתות מים", "לישון ביום"], 1, "Try to go to bed at the same time every day."]]}];
const LIB=[{"id": "road", "kind": "שיר", "t": "The Road Not Taken", "au": "Robert Frost, 1916", "lv": "B2", "en": "Two roads diverged in a yellow wood,\nAnd sorry I could not travel both\nAnd be one traveler, long I stood\nAnd looked down one as far as I could\nTo where it bent in the undergrowth;\n\nThen took the other, as just as fair,\nAnd having perhaps the better claim,\nBecause it was grassy and wanted wear;\nThough as for that the passing there\nHad worn them really about the same,\n\nAnd both that morning equally lay\nIn leaves no step had trodden black.\nOh, I kept the first for another day!\nYet knowing how way leads on to way,\nI doubted if I should ever come back.\n\nI shall be telling this with a sigh\nSomewhere ages and ages hence:\nTwo roads diverged in a wood, and I—\nI took the one less traveled by,\nAnd that has made all the difference.", "gl": {"diverged": "התפצלו", "wood": "יער", "traveler": "מטייל", "bent": "התעקל", "undergrowth": "סבך", "fair": "יפה/הוגן", "claim": "טענה", "wanted wear": "רצה שידרכו עליו", "worn": "נשחק", "trodden": "נדרך", "doubted": "פקפקתי", "sigh": "אנחה", "ages": "דורות", "hence": "מכאן והלאה", "difference": "הבדל"}, "q": [["מה הדובר מתלבט לגביו בשיר?", ["איזו דרך לבחור ביער", "מה לאכול", "לאן לטוס", "איזה בגד ללבוש"], 0, "שתי דרכים מתפצלות ביער, והוא לא יכול ללכת בשתיהן."], ["איזו דרך הוא בוחר בסוף?", ["זו שהרבה הולכים בה", "זו שפחות הלכו בה", "הוא חוזר הביתה", "הוא לא בוחר"], 1, "I took the one less traveled by."], ["מה המסר המרכזי של השיר, לדעתך?", ["בחירות שלנו משפיעות על החיים", "צריך תמיד ללכת עם הרוב", "יערות מסוכנים", "אסור לבחור"], 0, "that has made all the difference: הבחירה שינתה הכול. (זו פרשנות, ואפשר לחשוב גם אחרת.)"]]}, {"id": "woods", "kind": "שיר", "t": "Stopping by Woods on a Snowy Evening", "au": "Robert Frost, 1923", "lv": "B2", "en": "Whose woods these are I think I know.\nHis house is in the village though;\nHe will not see me stopping here\nTo watch his woods fill up with snow.\n\nMy little horse must think it queer\nTo stop without a farmhouse near\nBetween the woods and frozen lake\nThe darkest evening of the year.\n\nHe gives his harness bells a shake\nTo ask if there is some mistake.\nThe only other sound's the sweep\nOf easy wind and downy flake.\n\nThe woods are lovely, dark and deep,\nBut I have promises to keep,\nAnd miles to go before I sleep,\nAnd miles to go before I sleep.", "gl": {"queer": "מוזר", "harness": "רתמה", "sweep": "טאטוא/תנועה", "downy": "רך כנוצה", "flake": "פתית", "promises": "הבטחות", "village": "כפר", "frozen": "קפוא"}, "q": [["מי רואה את הדובר עוצר?", ["בעל היער לא רואה אותו", "כל הכפר", "המשטרה", "אף אחד לא קיים"], 0, "He will not see me stopping here: בעל היער נמצא בבית בכפר."], ["מה הסוס חושב?", ["שזה מוזר לעצור שם", "שהוא רעב", "שהוא רוצה לשחות", "שהוא עייף מדי"], 0, "My little horse must think it queer."], ["מה משמעות השורה האחרונה החוזרת, miles to go before I sleep?", ["יש לו עוד דרך ארוכה וחובות לפני שינוח", "הוא הולך לישון בשלג", "הוא אוהב ללכת", "הוא איבד את הדרך"], 0, "I have promises to keep: יש לו התחייבויות, לכן הוא ממשיך."]]}, {"id": "fire", "kind": "שיר", "t": "Fire and Ice", "au": "Robert Frost, 1920", "lv": "B2", "en": "Some say the world will end in fire,\nSome say in ice.\nFrom what I've tasted of desire\nI hold with those who favor fire.\nBut if it had to perish twice,\nI think I know enough of hate\nTo say that for destruction ice\nIs also great\nAnd would suffice.", "gl": {"desire": "תשוקה", "favor": "להעדיף", "perish": "להיכחד", "hate": "שנאה", "destruction": "הרס", "suffice": "להספיק"}, "q": [["לפי השיר, מה קשור לאש?", ["תשוקה", "שנאה", "שינה", "פחד"], 0, "From what I've tasted of desire I hold with those who favor fire."], ["מה קשור לקרח?", ["שנאה", "אהבה", "שמחה", "ילדות"], 0, "I know enough of hate to say that for destruction ice is also great."], ["כמה פעמים הדובר אומר שהעולם יכול להיכחד?", ["פעם אחת בלבד", "פעמיים אם צריך", "שלוש", "אף פעם"], 1, "if it had to perish twice, ice would suffice (מספיק)."]]}, {"id": "hope", "kind": "שיר", "t": "“Hope” is the thing with feathers", "au": "Emily Dickinson, 1891", "lv": "B2", "en": "“Hope” is the thing with feathers -\nThat perches in the soul -\nAnd sings the tune without the words -\nAnd never stops - at all -\n\nAnd sweetest - in the Gale - is heard -\nAnd sore must be the storm -\nThat could abash the little Bird\nThat kept so many warm -\n\nI’ve heard it in the chillest land -\nAnd on the strangest Sea -\nYet - never - in Extremity,\nIt asked a crumb - of me.", "gl": {"feathers": "נוצות", "perches": "עומד על ענף", "soul": "נשמה", "tune": "מנגינה", "gale": "סערה", "sore": "קשה/כואב", "abash": "להבהיל/לבייש", "chillest": "הכי קר", "extremity": "קושי קיצוני", "crumb": "פירור"}, "q": [["למה הדוברת משווה את התקווה?", ["לציפור", "לים", "לבית", "לשעון"], 0, "The thing with feathers: ציפור קטנה שיושבת בנשמה."], ["מתי התקווה נשמעת הכי מתוק?", ["בסערה", "בלילה שקט", "בחדר", "בבוקר"], 0, "sweetest in the Gale is heard."], ["מה התקווה ביקשה בשעת קושי?", ["אפילו פירור אחד", "הרבה אוכל", "מקום לישון", "כסף"], 0, "It asked a crumb of me: היא לא ביקשה כלום, היא רק נתנה."]]}, {"id": "sonnet18", "kind": "שיר", "t": "Sonnet 18", "au": "William Shakespeare, 1609", "lv": "B2", "en": "Shall I compare thee to a summer's day?\nThou art more lovely and more temperate:\nRough winds do shake the darling buds of May,\nAnd summer's lease hath all too short a date;\nSometime too hot the eye of heaven shines,\nAnd often is his gold complexion dimm'd;\nAnd every fair from fair sometime declines,\nBy chance or nature's changing course untrimm'd;\nBut thy eternal summer shall not fade,\nNor lose possession of that fair thou ow'st;\nNor shall Death brag thou wander'st in his shade,\nWhen in his eternal lines to time thou grow'st:\nSo long as men can breathe or eyes can see,\nSo long lives this, and this gives life to thee.", "gl": {"thee": "אותך", "thou": "אתה/את", "art": "הנך", "temperate": "מתון", "buds": "ניצנים", "lease": "חוזה/תקופה", "hath": "יש (עתיק)", "complexion": "גוון", "declines": "דועך", "eternal": "נצחי", "brag": "להתפאר", "wander'st": "שוטטת"}, "q": [["למה הדובר משווה את האהובה?", ["ליום קיץ", "לחורף", "לים", "להר"], 0, "Shall I compare thee to a summer's day?"], ["למה היא טובה יותר מהקיץ?", ["היא יפה ומתונה יותר, והקיץ קצר ולפעמים חם מדי", "היא עשירה יותר", "היא גבוהה יותר", "היא צעירה יותר"], 0, "more lovely and more temperate; summer's lease hath all too short a date."], ["איך היופי שלה יישמר לנצח?", ["דרך השיר עצמו", "בציור", "בתמונות", "בבית"], 0, "So long lives this, and this gives life to thee: השיר נשאר חי, ואיתו היא."]]}, {"id": "fox", "kind": "סיפור (עיבוד)", "t": "The Fox and the Grapes", "au": "אגדה של איזופוס, עיבוד פשוט שלי", "lv": "A2", "en": "One hot day, a fox saw some sweet grapes on a high branch. He was very hungry, so he jumped to get them. He jumped again and again, but he could not reach the grapes. At last he was tired, and he walked away. \"Those grapes are not sweet,\" he said. \"I do not want them anyway.\"", "gl": {"branch": "ענף", "reach": "להגיע/לתפוס", "anyway": "בכל מקרה", "grapes": "ענבים"}, "q": [["למה השועל קפץ?", ["כדי להגיע לענבים", "כדי לברוח", "כדי לשחק", "כדי לראות את הכפר"], 0, "he jumped to get them."], ["מה הוא אמר בסוף?", ["שהענבים לא מתוקים ושהוא לא רוצה אותם", "שהוא יחזור מחר", "שהוא מבקש עזרה", "שהענבים טעימים"], 0, "Those grapes are not sweet."], ["מה המוסר? (משל)", ["אנשים מזלזלים במה שהם לא מצליחים להשיג", "צריך לאכול יותר", "שועלים חכמים", "ענבים הם קשים"], 0, "בעברית: ״הענבים חמוצים״."]]}, {"id": "magi", "kind": "סיפור (עיבוד)", "t": "The Gift of the Magi", "au": "על פי O. Henry (1905), עיבוד פשוט שלי", "lv": "B1", "en": "A young husband and wife were very poor, but they loved each other very much. Christmas was near, and each one wanted to buy a special gift. The wife had beautiful long hair, and the husband had an old gold watch. She sold her hair to buy a chain for his watch. He sold his watch to buy combs for her hair. On Christmas, they understood what happened. Now she had no hair for her combs, and he had no watch for his chain. But they were not sad, because each one gave the most important thing they had: love.", "gl": {"chain": "שרשרת", "combs": "מסרקים", "poor": "עניים", "special": "מיוחד", "gift": "מתנה"}, "q": [["מה האישה מכרה?", ["את השיער שלה", "את הטבעת", "את הבית", "את השעון"], 0, "She sold her hair to buy a chain for his watch."], ["מה הבעל מכר?", ["את השעון", "את הספרים", "את המעיל", "את הסוס"], 0, "He sold his watch to buy combs."], ["למה הם לא היו עצובים בסוף?", ["כי כל אחד נתן את הדבר החשוב ביותר: אהבה", "כי הם התעשרו", "כי חזרו הביתה", "כי קיבלו מתנות אחרות"], 0, "each one gave the most important thing they had: love."]]}];

const STOP=new Set('about after again also always because before being between could every first found from have into just know like little made many more most much must never only other over said same should since some still such than that their them then there these they this those through very want were what when where which while will with would your'.split(' '));
function cloze(text,n=6){const sn=text.split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=4);const all=[...new Set((text.match(/[A-Za-z]{4,}/g)||[]).map(x=>x.toLowerCase()))].filter(w=>!STOP.has(w));const qs=[];
 for(const s of sn.sort(()=>Math.random()-.5)){if(qs.length>=n)break;const ws=(s.match(/[A-Za-z]{4,}/g)||[]).filter(w=>!STOP.has(w.toLowerCase()));if(!ws.length)continue;const a=ws[Math.floor(Math.random()*ws.length)];const d=all.filter(x=>x!==a.toLowerCase()&&Math.abs(x.length-a.length)<=2).sort(()=>Math.random()-.5).slice(0,3);if(d.length<2)continue;const opts=[...d,a.toLowerCase()].sort(()=>Math.random()-.5);qs.push([s.replace(new RegExp('\\b'+a+'\\b'),'_____'),opts,opts.indexOf(a.toLowerCase()),'המשפט המלא: '+s])}
 return qs}

const ES={c:''};
function vErr(){
 if(!V.ep)return hd('מצא את הטעות',['gr'])+`<div class="card"><b>✏️ טעויות שדוברי עברית עושים באנגלית</b><p class="mu">נציג משפט עם טעות נפוצה, ואת תקני אותו. אחרי ניסיון ראשון שגוי תקבלי רמז, ואחרי השני נראה את התשובה. טעויות חוזרות חוזרות אלייך שוב בסבבים הבאים. (${(S.bank||[]).length} בבנק החזרה)</p><div class="row">${[['','הכול']].concat(ECATS.map(c=>[c,c])).map(c=>`<button class="btn s ${ES.c===c[0]?'':'g'}" data-x="ecat" data-v="${esc(c[0])}">${esc(c[1])}</button>`).join('')}</div><button class="btn" style="margin-top:12px" data-x="estart">התחילי ←</button></div>`;
 const P=V.ep;if(P.i>=P.l.length)return hd('סיכום',['home'])+`<div class="card"><h2>סיימת! 🎉</h2><p>תיקנת נכון בניסיון הראשון ${P.sc} מתוך ${P.l.length}. ${(S.bank||[]).length?'הטעויות שנשארו יחזרו בסבב הבא.':'כל הכבוד, אין טעויות בבנק!'}</p><div class="row"><button class="btn" data-x="estart">עוד סבב</button><button class="btn g" data-x="eexit">חזרה</button></div></div>`;
 const e=ERR[P.l[P.i]];return hd('מצא את הטעות',null)+`<div class="card"><div class="mu">${P.i+1} מתוך ${P.l.length} · <span class="tag">${esc(e.c)}</span></div><div class="bar" style="margin:6px 0"><i style="width:${P.i/P.l.length*100}%"></i></div><p>תקני את המשפט:</p><div class="en" style="color:var(--no);font-weight:700">✗ ${esc(e.b)}</div><input class="en" id="ea" placeholder="כתבי את המשפט הנכון" autocomplete="off" ${P.done?'disabled':''}><div class="row" style="margin-top:8px">${P.done?`<button class="btn" data-x="enext">${P.i+1<P.l.length?'הבא':'לסיום'} ←</button><button class="btn g s" data-x="spkq" data-t="${esc(e.g)}">🔊</button>`:`<button class="btn" data-x="echk">בדיקה</button><button class="btn g s" data-x="eskip">אני לא יודעת</button>`}</div><div id="efb">${P.fb||''}</div></div>`}
document.addEventListener('click',e=>{const x=e.target.dataset.x;if(V.tab!=='err')return;
 if(x==='ecat'){ES.c=e.target.dataset.v;render()}
 if(x==='estart'){S.bank=S.bank||[];let all=ERR.map((_,i)=>i).filter(i=>!ES.c||ERR[i].c===ES.c);const bk=S.bank.filter(i=>all.includes(i)).slice(0,3);const rest=pickN(all.filter(i=>!bk.includes(i)),10-bk.length);V.ep={l:pickN([...bk,...rest],10),i:0,sc:0,tries:0,done:false,fb:''};render()}
 if(x==='eexit'){V.ep=null;render()}
 if(x==='enext'){const P=V.ep;P.i++;P.tries=0;P.done=false;P.fb='';render()}
 if(x==='echk'||x==='eskip'){const P=V.ep,idx=P.l[P.i],er=ERR[idx];S.bank=S.bank||[];const a=($('#ea').value||'').trim();
  if(x==='echk'&&!a){$('#efb').innerHTML='<div class="fb no">כתבי תיקון קודם 🙂</div>';return}
  if(x==='echk'&&norm(a)===norm(er.g)){const first=P.tries===0;if(first){P.sc++;gain(10,1);S.bank=S.bank.filter(i=>i!==idx)}else gain(4,1);P.fb=`<div class="fb ok">✅ ${first?'נכון, כל הכבוד!':'יפה, תיקנת!'} <span class="en">${esc(er.g)}</span><br>${esc(er.w)}</div>`;P.done=true;burst(e);render();return}
  P.tries++;
  if(x==='echk'&&P.tries<2){const w=er.g.split(' ');P.fb=`<div class="fb no">כמעט. 💡 רמז: התיקון מתחיל ב-<b class="en">${esc(w[0])}…</b> ויש בו ${w.length} מילים. נסי שוב.</div>`;render();$('#ea').value=a;return}
  if(!S.bank.includes(idx))S.bank.push(idx);P.fb=`<div class="fb no">התשובה: <b class="en">${esc(er.g)}</b><br>${esc(er.w)}<br><span class="mu">נחזור על זה בסבב הבא.</span></div>`;P.done=true;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ea'){const b=document.querySelector('[data-x=echk]');if(b)b.click()}});
render();
</script></body></html>
