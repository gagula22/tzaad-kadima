<style>

, met her friends, and talked with them. She was happy. Now she turns off her phone for one hour every evening and reads a book.", "q": [["מה קרה לטלפון של נועה אתמול?", ["הוא הפסיק לעבוד ליום אחד", "הוא אבד", "הוא נשבר לגמרי", "הוא נגנב"], 0, "her phone stopped working for one day"], ["מה נועה עשתה אחר כך?", ["יצאה, פגשה חברות ודיברה איתן", "נשארה במיטה", "הלכה לישון", "קנתה טלפון חדש"], 0, "she went outside, met her friends, and talked with them"], ["מה היא עושה עכשיו כל ערב?", ["מכבה את הטלפון לשעה וקוראת ספר", "רואה סרט", "מתקשרת לחברה", "עושה שיעורי בית"], 0, "turns off her phone for one hour every evening and reads a book"]]}, "travel": {"lv": "B1", "en": "Last summer, my family travelled to Italy. We stayed in a small hotel near the sea. Every morning, we walked to a cafe and had breakfast. One day, we lost our map, so we asked a woman for help. She was very kind, and she showed us a beautiful old street. I will never forget that trip, and next year I want to visit another country.", "q": [["איפה המשפחה התארחה?", ["במלון קטן ליד הים", "בבית של חברים", "באוהל", "בדירה בעיר"], 0, "We stayed in a small hotel near the sea."], ["מה קרה ביום אחד?", ["הם איבדו את המפה וביקשו עזרה", "הם איחרו לטיסה", "הם חלו", "הם איבדו כסף"], 0, "we lost our map, so we asked a woman for help"], ["מה הדוברת רוצה לעשות בשנה הבאה?", ["לבקר במדינה אחרת", "לחזור לאיטליה", "להישאר בבית", "לעבוד"], 0, "next year I want to visit another country"]]}, "food": {"lv": "B1", "en": "Yesterday, I decided to cook dinner for my family. First, I cut some vegetables and put them in a large pot. Then I added rice, salt, and a little oil. I forgot to watch the pot, so the food was too hot at the bottom. Everyone ate it anyway and said it was good. Next time, I will check the pot more often.", "q": [["מה הדוברת החליטה לעשות אתמול?", ["לבשל ארוחת ערב למשפחה", "לקנות אוכל", "לאפות עוגה", "ללכת למסעדה"], 0, "I decided to cook dinner for my family."], ["מה השתבש?", ["היא שכחה לשים לב לסיר והאוכל נשרף בתחתית", "היא שכחה את האורז", "היא שברה סיר", "האוכל היה קר"], 0, "I forgot to watch the pot"], ["מה היא תעשה בפעם הבאה?", ["תבדוק את הסיר לעתים קרובות יותר", "תזמין אוכל", "לא תבשל", "תבקש עזרה מאמא"], 0, "Next time, I will check the pot more often."]]}, "friends": {"lv": "A2", "en": "I have a good friend. Her name is Maya. We sit together in class, and we talk about everything. When I am sad, she listens to me. Last week, I forgot my lunch, and she gave me half of hers. I want to be a good friend to her too, so I always tell her the truth.", "q": [["איפה הדוברת וחברתה יושבות?", ["יחד בכיתה", "בשורות שונות", "בקפיטריה בלבד", "בבית"], 0, "We sit together in class"], ["מה מאיה עשתה בשבוע שעבר?", ["נתנה לה חצי מארוחת הצהריים שלה", "קנתה לה מתנה", "עזרה בשיעורי בית", "הלכה איתה הביתה"], 0, "she gave me half of hers"], ["איך הדוברת רוצה להיות חברה?", ["חברה טובה שאומרת תמיד אמת", "חברה שקטה", "חברה צוחקת", "חברה עסוקה"], 0, "I always tell her the truth"]]}, "movie": {"lv": "A2", "en": "On Saturday, I went to see a film with my cousin. It was a funny film about a dog and a small boy. The seats were soft, and we had some sweets. I laughed a lot, and at the end I felt a little sad. After the film, we talked about it in the car. I want to see it again soon.", "q": [["עם מי הדוברת הלכה לראות סרט?", ["עם בן דוד", "עם אמא", "עם חברה", "לבד"], 0, "with my cousin"], ["על מה היה הסרט?", ["על כלב ועל ילד קטן", "על חללית", "על מלחמה", "על בית ספר"], 0, "a funny film about a dog and a small boy"], ["איך היא הרגישה בסוף הסרט?", ["קצת עצובה", "כועסת", "משועממת", "מפוחדת"], 0, "at the end I felt a little sad"]]}, "animals": {"lv": "A2", "en": "We have a cat at home. Her name is Lulu. She is small and white, and she likes to sleep on my bed. Every morning, she asks for food, and I give her milk and some meat. She is also very afraid of loud noise. When people shout, she goes under the table and stays there.", "q": [["איך נקראת החתולה?", ["לולו", "מיצי", "נלה", "שלג"], 0, "Her name is Lulu."], שישי"], 0, "on Saturday and Sunday"], ["מה טום עושה בחנות?", ["שם דברים על המדפים ועוזר ללקוחות", "מוכר ירקות", "מנקה את החנות", "מסדר כסף"], 0, "puts things in their place and helps people"], ["מה הוא עושה עם הכסף?", ["חוסך חצי ומוציא חצי על אוכל ובגדים", "קונה מחשב", "נותן להורים", "מוציא הכול"], 0, "He saves half of it"]]}, "sleep": {"lv": "A2", "en": "Sleep is important for your body and your mind. Most teenagers need about eight or nine hours every night. If you sleep too little, you feel tired and it is hard to learn. Try to go to bed at the same time every day. Do not drink coffee in the evening, and turn off the light before you sleep.", "q": [["כמה שעות שינה צריכים רוב בני הנוער?", ["שמונה או תשע", "ארבע", "שש", "שתים עשרה"], 0, "about eight or nine hours"], ["מה קורה אם ישנים מעט מדי?", ["מרגישים עייפים וקשה ללמוד", "מתעוררים מוקדם", "אין שום בעיה", "מרגישים חזקים"], 0, "you feel tired and it is hard to learn"], ["איזו עצה ניתנת?", ["ללכת לישון באותה שעה כל יום", "לשתות קפה בערב", "לישון עם אור", "ללכת לישון מאוחר"], 0, "go to bed at the same time every day"]]}},M2={"music": [{"lv": "A2", "en": "My cousin has a new radio. She puts it on the table in the kitchen and sings while she cooks. Her songs are happy and loud, and my aunt always laughs. Sometimes the whole family dances in the kitchen. I think music makes a house warm. Last night, even my grandfather joined us.", "q": [["איפה בת הדודה שמה את הרדיו?", ["במכונית", "בחדר השינה", "בחצר", "על השולחן במטבח"], 3, "המשפט: She puts it on the table in the kitchen"], ["מה קורה לפעמים במשפחה?", ["כולם רוקדים במטבח", "כולם צופים בטלוויזיה", "כולם יוצאים לטיול", "כולם הולכים לישון"], 0, "המשפט: the whole family dances in the kitchen"], ["מי הצטרף אתמול בלילה?", ["השכן", "המורה", "הסבא", "הדוד"], 2, "המשפט: even my grandfather joined us"]]}, {"lv": "B1", "en": "A good song can change your day. When I am angry, I choose something slow and calm. When I need energy, I play a fast song with a strong beat. My friend says this is silly, but scientists agree with me. They found that music affects the way we feel. So I always keep my music with me.", "q": [["מה הדוברת בוחרת כשהיא כועסת?", ["שקט", "שיר מהיר", "שיר ישן", "שיר איטי ורגוע"], 3, "המשפט: When I am angry, I choose something slow and calm"], ["מה היא עושה כשהיא צריכה אנרגיה?", ["רצה", "אוכלת", "ישנה", "מנגנת שיר מהיר עם קצב חזק"], 3, "המשפט: When I need energy, I play a fast song"], ["למה היא תמיד לוקחת איתה מוזיקה?", ["כי המורה אמר", "כי זה חינם", "כי מוזיקה משפיעה על התחושות", "כי החברה ביקשה"], 2, "המשפט: music affects the way we feel"]]}, {"lv": "B1", "en": "Our school has a singing group, and I joined it this year. At first, I was nervous because I did not know the other students. The teacher told us to breathe slowly and listen to each other. After a month, our voices sounded like one voice. In June, we will sing in front of all the parents.", "q": [["למה הדוברת הייתה לחוצה בהתחלה?", ["הייתה חולה", "איחרה", "שכחה את המילים", "לא הכירה את התלמידים האחרים"], 3, "המשפט: I did not know the other students"], ["מה המורה ביקש מהם לעשות?", ["לנשום לאט ולהקשיב אחד לשני", "להתאמן לבד", "לשיר חזק", "לרקוד"], 0, "המשפט: breathe slowly and listen to each other"], ["מתי הם ישירו מול ההורים?", ["בחורף", "בשבת", "בינואר", "ביוני"], 3, "המשפט: In June"]]}, {"lv": "A2", "en": "I like to learn new instruments. This month, I try the drums. They are very loud, so I play only after school. My neighbor does not like the noise, but she is kind. She asked me to stop at six in the evening, and I agreed. Next week, I want to try the piano because it is quiet.", "q": [["איזה כלי הדוברת מנסה החודש?", ["פסנתר", "גיטרה", "חליל", "תופים"], 3, "המשפט: This month, I try the drums"], ["מה השכנה ביקשה?", ["לנגן יותר חזק", "להפסיק בשש בערב", "לשיר", "להפסיק לגמרי"], 1, "המשפט: She asked me to stop at six"], ["למה הדוברת רוצה לנסות פסנתר?", ["כי הוא גדול", "כי הוא שקט", "כי הוא זול", "כי הוא חדש"], 1, "המשפט: because it is quiet"]]}], "soccer": [{"lv": "A  Now I eat the fish too, but I still do not like the bones.", "q": [["מה הדוברת לא אוהבת?", ["דג", "לימון", "חמאה", "תפוחי אדמה"], 0, "המשפט: I do not like fish"], ["מה הדודה הוסיפה?", ["סוכר", "שמן", "מלח", "לימון וקצת חמאה"], 3, "המשפט: she added lemon and a little butter"], ["ממה היא עדיין לא נהנית?", ["מהריח", "מהעצמות", "מהצלחת", "מהלימון"], 1, "המשפט: I still do not like the bones"]]}, {"lv": "B1", "en": "In many countries, people eat dinner very late. In Spain, for example, families often sit at the table after nine at night. Lunch is the main meal, and it can take two hours. Visitors are sometimes surprised, because in their own country the day ends early. Food is not only about eating but also about time with others.", "q": [["מתי משפחות בספרד אוכלות ארוחת ערב?", ["בבוקר", "בחמש", "אחרי תשע בלילה", "בשלוש"], 2, "המשפט: after nine at night"], ["מהי הארוחה העיקרית?", ["ארוחת הבוקר", "ארוחת הערב", "חטיף", "ארוחת הצהריים"], 3, "המשפט: Lunch is the main meal"], ["מה המסר של הקטע?", ["צריך לאכול מהר", "אוכל הוא גם זמן עם אחרים", "אסור לאכול מאוחר", "ספרד יקרה"], 1, "המשפט: time with others"]]}], "friends": [{"lv": "A2", "en": "I met a new girl at school today. She is quiet, and she sat alone at lunch. I took my plate and sat next to her. We talked about our favorite colors and found out that we both like green. Tomorrow, I will show her the library, because she loves books.", "q": [["איפה הילדה החדשה ישבה?", ["לבד בארוחת צהריים", "בכיתה", "בחצר", "בספרייה"], 0, "המשפט: she sat alone at lunch"], ["מה משותף לשתיהן?", ["שתיהן גבוהות", "שתיהן אוהבות ירוק", "שתיהן יפות", "שתיהן אוהבות מוזיקה"], 1, "המשפט: we both like green"], ["מה הדוברת תעשה מחר?", ["תזמין אותה הביתה", "תלך איתה לקולנוע", "תקנה לה אוכל", "תראה לה את הספרייה"], 3, "המשפט: I will show her the library"]]}, {"lv": "B1", "en": "Last month, I had an argument with my best friend. I said something bad about her new bag, and she stopped talking to me. For a week, I felt terrible. Finally, I wrote her a short letter and said I was sorry. She read it and smiled the next morning. Real friends can forgive each other.", "q": [["על מה הדוברת רבה עם חברתה?", ["על ציון", "על ילד", "על כסף", "על משהו לא נחמד שאמרה על התיק"], 3, "המשפט: something bad about her new bag"], ["מה הדוברת עשתה כדי לפייס?", ["התעלמה", "כתבה מכתב קצר וביקשה סליחה", "התקשרה", "קנתה מתנה"], 1, "המשפט: wrote her a short letter and said I was sorry"], ["מה המסר?", ["חברים נעלמים", "חברים אמיתיים יכולים לסלוח", "אסור להתנצל", "צריך לשתוק"], 1, "המשפט: Real friends can forgive each other"]]}, {"lv": "A2", "en": "My friend Ben lives far away. We cannot meet every week, so we talk by video on Sunday evenings. He shows me his room and his dog, and I show him my drawings. We play a game of cards on the screen. It is not the same as being together, but it is still fun.", "q": [["מתי החברים מדברים בווידאו?", ["בשבת", "בימי ראשון בערב", "בכל בוקר", "בחמישי"], 1, "המשפט: on Sunday evenings"], ["מה מראה בן?", ["את המכונית", "את הבית", "את החדר שלו ואת הכלב שלו", "את הגינה"], 2, "המשפט: his room and his dog"], ["מה הם משחקים?", ["שחמט", "טניס", "קלפים", "כדורגל"], 2, "המשפט: a game of cards"]]}, {"lv": "B1", "en": "In a group, it is easy to follow others and forget your own opinion. Last week, my friends in the class wanted to leave the lesson early. I did not agree, and I told them quietly. Two friends stayed with me, and the others laughed. Later, they admitted that I was right. It takes courage to say no.", "q": [["מה הכיתה רצתה לעשות?", ["לאכול", "לעזוב את השיעור מוקדם", "לשחק", "לישון"], 1, "המשפט: leave the lesson early"], ["מה הדוברת עשתה?", ["אמרה בשקט שהיא לא מסכימה", "צעקה", "התלוננה", "הלכה איתם"], 0, "המשפט: I did not agree, and I told them quietly"], ["מה צריך כדי לומר לא?", ["כסף", "אומץ", "זמן", "מזל"], 1, "המשפט: It takes courage to say no"]]}], "movie": [{"lv": "A2", "en": "Last night, we watched an old film at home. It was black and white, and nobody spoke. A man wore a funny hat and fell in the street again and again. My little sister laughed so hard that she cried. My father said that people loved this kind of film a hundred years ago.", "q": [["איך נראה הסרט?", ["חדש", "שחור לבן וללא דיבור", "מצויר", "צבעוני"], 1, "המשפט: black and white, and nobody spoke"], ["מה האיש עשה ברחוב?", ["רקד", "נפל שוב ושוב", "רץ", "שר"], 1, "המשפט: fell in the street again and again"], ["מה אבא אמר?", ["שהוא חדש", "שהוא יקר", "שהסרט משעמם", "שאנשים אהבו סרטים כאלה לפני מאה שנה"], 3, "המשפט: a hundred years ago"]]}, {"lv": "B1", "en": "I usually read the book before I see the film. Last month, I did it the other way and watched first. The film was exciting, but when I opened the book, I found many new ideas. The writer explained what the characters thought, and the film could not show that. Now I believe both are worth your time.", "q": [["מה הדוברת עושה בדרך כלל?", ["קוראת אחרי", "רואה סרט בלבד", "קוראת את הספר לפני הסרט", "לא קוראת"], 2, "המשפט: I usually read the book before I see the film"], ["מה היא מצאה בספר?", ["תמונות", "סוף אחר", "רעיונות חדשים על מה שהדמויות חושבות", "פחות דמויות"], 2, "המשפט: what the characters thought"], ["מה דעתה בסוף?", ["שאין טעם", "ששניהם שווים את הזמן", "שהסרט טוב יותר", "שהספר טוב יותר"], 1, "המשפט: both are worth your time"]]}, {"lv": "A2", "en": "We have a movie night at school every Friday. A teacher chooses the film, and we bring bags and warm clothes. The room is dark, and everyone is quiet. Sometimes there is a scary part, and the little children hold their friends. Afterwards, we talk about our favorite scene and drink hot chocolate.", "q": [["מתי יש ערב סרט בבית הספר?", ["בכל שני", "בכל בוקר", "פעם בשנה", "בכל יום שישי"], 3, "המשפט: every Friday"], ["מה התלמידים מביאים?", ["אוכל", "ספרים", "תיקים ובגדים חמים", "טלפונים"], 2, "המשפט: bags and warm clothes"], ["מה הם שותים אחרי הסרט?", ["קפה", "מים", "תה", "שוקו חם"], 3, "המשפט: hot chocolate"]]}, {"lv": "B1", "en": "Making a film takes many people, not only actors. Someone writes the story, someone builds the set, and someone takes care of the sound. When the final credits appear at the end, most viewers leave quickly. I like to stay and read the names, because every name is a person who worked hard for me.", "q": [["מי עוד עובד על סרט מלבד שחקנים?", ["כותבים, בונים תפאורה ואחראים לצליל", "רק מפיק", "רק במאי", "אף אחד"], 0, "המשפט: writes the story, builds the set, takes care of the sound"], ["מה רוב הצופים עושים בסוף?", ["ישנים", "נשארים", "עוזבים מהר", "מוחאים כפיים"], 2, "המשפט: most viewers leave quickly"], ["למה הדוברת נשארת?", ["כי חשוך", "כי היא מחכה", "כי היא עייפה", "כי כל שם הוא אדם שעבד קשה"], 3, "המשפט: every name is a person who worked hard"]]}], "animals": [{"lv": "A2", "en": "Next to our house, there is a small lake with five birds. Every morning, they swim in a line behind the mother bird. My brother brings them old bread, but the teacher says it is not healthy. Now we give them seeds. In spring, there were six little birds, and we were very happy.", "q": [["כמה ציפורים יש באגם בהתחלה?", ["שניים", "עשרה", "אחד", "חמישה"], 3, "המשפט: a small lake with five birds"], ["מה מאכילים אותם עכשיו?", ["זרעים", "לחם ישן", "בשר", "ירקות"], 0, "המשפט: Now we give them seeds"], ["מה קרה באביב?", ["הציפורים עזבו", "האגם התייבשה", "נולדו גוזלים", "הגיע חתול"], 2, "המשפט: there were six little birds"]]}, {"lv": "B1", "en": "Dogs can understand more than we think. A study showed that a dog can learn the names of hundreds of toys. When the owner asked for a toy by name, the dog went to another room and brought the right one. Scientists believe that dogs have been living with people for thousands of years, and this helps them understand us.", "q": [["מה כלב יכול ללמוד?", ["לספור", "שמות של מאות צעצועים", "לקרוא", "לדבר"], 1, "המשפט: learn the names of hundreds of toys"], ["מה הכלב עשה כשהתבקש?", ["הלך לחדר אחר והביא את הצעצוע הנכון", "ישן", "ברח", "נבח"], 0, "המשפט: went to another room and brought the right one"], ["למה כלבים מבינים אותנו?", ["כי הם חיים עם בני אדם אלפי שנים", "כי הם קטנים", "כי הם נולדים כך", "כי הם חכמים מאוד"], 0, "המשפט: living with people for thousands of years"]]}, {"lv": "A2", "en": "My uncle has a farm with many animals. In the morning, the cows give milk, and the chickens give eggs. I like to feed the sheep because they are soft and gentle. The horse is the biggest animal on the farm, and its name is Star. My uncle says that animals need love, just like people.", "q": [["מה הפרות נותנות?", ["ביצים", "בשר", "צמר", "חלב"], 3, "המשפט: the cows give milk"], ["מי הכי גדול בחווה?", ["העוף", "הכבשה", "הסוס", "הפרה"], 2, "המשפט: The horse is the biggest animal"], ["מה הדוד אומר?", ["שבעלי חיים צריכים אהבה כמו אנשים", "שהם יקרים", "שהם עובדים", "שהם מסוכנים"], 0, "המשפט: animals need love, just like people"]]}, {"lv": "B1", "en": "Many wild animals are in danger because people cut down forests. When trees disappear, the animals lose their homes and their food. Some groups work to protect these places and plant new trees. Students can help too, for example by saving paper and not wasting water. Small actions can add up, if many people do them.", "q": [["למה חיות בר בסכנה?", ["כי קר", "כי בני אדם כורתים יערות", "כי יש יותר מדי מזון", "כי הן חולות"], 1, "המשפט: people cut down forests"], ["מה קבוצות עושות?", ["מגינות על מקומות ושותלות עצים", "מוכרות", "צדות", "בונות"], 0, "המשפט: protect these places and plant new trees"], ["איך תלמידים יכולים לעזור?", ["לבנות", "לקנות חיות", "לצאת לטיול", "לחסוך נייר ולא לבזבז מים"], 3, "המשפט: saving paper and not wasting water"]]}], "space": [{"lv": "A2", "en": "Yesterday, our teacher took us to a dark field to look at the sky. The air was cold, so we wore warm coats. She showed us a bright point and said it was not a star but a planet. We looked at it through a small camera and saw a thin ring around it. Everyone was silent.", "q": [["לאן המורה לקחה אותם?", ["להר", "לבית ספר", "לקולנוע", "לשדה חשוך"], 3, "המשפט: a dark field"], ["מה המורה הראתה?", ["ירח מלא", "נקודה בהירה שהיא כוכב לכת", "כוכב נופל", "חללית"], 1, "המשפט: not a star but a planet"], ["מה הם ראו דרך המצלמה?", ["צבע", "ענן", "פנים", "טבעת דקה"], 3, "המשפט: a thin ring around it"]]}, {"lv": "B1", "en": "The moon travels around our planet, and it takes about a month to complete one circle. We always see the same side of it. Long ago, people thought that the moon made light, but today we know that it only reflects the light of the sun. When the moon looks small and thin, we are seeing only a part of the bright side.", "q": [["כמה זמן לוקח לירח להשלים סיבוב?", ["יום", "בערך חודש", "שנה", "שבוע"], 1, "המשפט: about a month"], ["מה אנחנו תמיד רואים?", ["את אותו הצד של הירח", "כוכבים", "את השמש", "את הצד השני"], 0, "המשפט: always see the same side"], ["מה הירח עושה עם אור השמש?", ["חוסם אותו", "יוצר אותו", "מחזיר אותו", "סופג אותו"], 2, "המשפט: only reflects the light of the sun"]]}, {"lv": "A2", "en": "If you could visit another planet, which one would you choose? I would choose the red planet because it is the nearest one. A trip would take about seven months. You would need a lot of food and water, and you could not open a window. But the view of the stars would be wonderful.", "q": [["איזה כוכב לכת הדוברת תבחר?", ["הקר", "הכחול", "הגדול", "האדום"], 3, "המשפט: the red planet"], ["כמה זמן ייקח הנסיעה?", ["שבוע", "שנה", "יום", "כשבעה חודשים"], 3, "המשפט: about seven months"], ["מה אי אפשר לעשות בחללית?", ["לאכול", "לפתוח חלון", "לראות כוכבים", "לישון"], 1, "המשפט: could not open a window"]]}, {"lv": "B1", "en": "A new generation of scientists is working on a mission to find life far from Earth. They send machines to places that are too dangerous for people. One machine drives slowly on a dry, red surface and takes pictures of rocks. It looks for signs of water, because where there is water, life may exist.", "q": [["מה המדענים מחפשים?", ["אנרגיה", "חיים רחוק מכדור הארץ", "מתכות", "כסף"], 1, "המשפט: a mission to find life far from Earth"], ["למה שולחים מכונות?", ["כי חת הצהריים?", ["צריך לשבת בשקט", "אף אחד לא אוכל לבד", "אסור לדבר", "צריך לאכול מהר"], 1, "המשפט: no one eats alone"], ["איך הכלל התחיל?", ["המנהל החליט", "אחרי שילד בכה בפינה", "תלמידים הצביעו", "מורה ביקש"], 1, "המשפט: a boy cried in the corner"], ["מה קרה לדוברת בגלל הכלל?", ["הפסידה", "קיבלה פרס", "הכירה שלושה חברים חדשים", "עברה כיתה"], 2, "המשפט: I met three new friends"]]}, {"lv": "B1", "en": "Exams make many students nervous. Before my last test, I tried a different method. I wrote down all my worries on a piece of paper and then threw it away. It sounds strange, but I felt lighter. During the test, I read each question carefully and did not hurry. My result was better than ever.", "q": [["מה הדוברת עשתה לפני המבחן?", ["כתבה את הדאגות ופחות את הדף", "שתתה קפה", "ישנה", "למדה כל הלילה"], 0, "המשפט: wrote down all my worries ... threw it away"], ["איך היא הרגישה אחר כך?", ["עצבנית", "קלה יותר", "חולה", "עצובה"], 1, "המשפט: I felt lighter"], ["מה התוצאה?", ["זהה", "טובה מתמיד", "לא ידועה", "רעה"], 1, "המשפט: better than ever"]]}], "job": [{"lv": "A2", "en": "My aunt is a nurse in a big hospital. She wakes up at five and takes the first bus. She helps sick people and talks kindly to them, even when she is tired. Sometimes she works at night. She says the best part of her job is when a patient says thank you and goes home healthy.", "q": [["מה הדודה עובדת?", ["מורה", "אחות בבית חולים", "מוכרת", "נהגת"], 1, "המשפט: a nurse in a big hospital"], ["באיזו שעה היא קמה?", ["בשלוש", "בשבע", "בחמש", "בשש"], 2, "המשפט: wakes up at five"], ["מה החלק הכי טוב בעבודה?", ["הלילות", "החופשה", "המשכורת", "כשחולה אומר תודה וחוזר הביתה בריא"], 3, "המשפט: a patient says thank you"]]}, {"lv": "B1", "en": "Choosing a career is not easy. Some people follow their interests, and others look for a safe job with a good salary. A teacher told us to try different activities before deciding. For example, you can volunteer, visit a place of work, or talk to adults about their day. This way, your choice will come from experience, not from fear.", "q": [["מה יועצת ממליצה?", ["לשאול חברים", "לבחור מהר", "לנסות פעילויות שונות לפני ההחלטה", "לבחור כסף"], 2, "המשפט: try different activities before deciding"], ["אילו דוגמאות ניתנו?", ["לשחק", "להתנדב, לבקר במקום עבודה, לדבר עם מבוגרים", "לנסוע לחו\"ל", "לכתוב ספר"], 1, "המשפט: volunteer, visit a place of work, or talk to adults"], ["ממה הבחירה צריכה לבוא?", ["ממזל", "מניסיון ולא מפחד", "מכסף", "מהורים"], 1, "המשפט: from experience, not from fear"]]}, {"lv": "A2", "en": "My neighbor is a baker. He starts work at midnight because the bread must be ready before the morning. When I walk to school, I smell fresh rolls from his shop. Sometimes he gives me one for free. He is tired, but he is also proud. People in our street are happy to buy from him.", "q": [["מה השכן?", ["אופה", "רופא", "נהג", "מורה"], 0, "המשפט: My neighbor is a baker"], ["מתי הוא מתחיל לעבוד?", ["בשבע", "בשתיים בצהריים", "בחצות", "בערב"], 2, "המשפט: starts work at midnight"], ["מה הוא נותן לפעמים לדוברת?", ["לחמנייה בחינם", "כסף", "פרחים", "עוגה"], 0, "המשפט: gives me one for free"]]}, {"lv": "B1", "en": "Today, many young people want to work for themselves. They start small companies online and sell things they make. This can be exciting, but it is also dangerous. At the beginning, there is often no income, and you must plan carefully. My cousin kept her old job for a year while she built her business slowly.", "q": [["מה צעירים רבים רוצים?", ["לעבוד בבנק", "ללמוד", "לנסוע", "לעבוד לעצמם"], 3, "המשפט: want to work for themselves"], ["מה הסיכון?", ["זה אסור", "בהתחלה אין הכנסה", "אין לקוחות לעולם", "יש יותר מדי כסף"], 1, "המשפט: there is often no income"], ["מה בת הדודה עשתה?", ["ויתרה", "שמרה על עבודתה הישנה שנה", "עזבה מיד", "מכרה"], 1, "המשפט: kept her old job for a year"]]}], "sleep": [{"lv": "A2", "en": "Before bed, I have a small routine. I wash my face, brush my teeth, and put my clothes on the chair. Then I read two pages of a book. My mother turns off the light and says good night. When I follow this order, I fall asleep faster, and I wake up in a better mood.", "q": [["מה הדוברת עושה לפני השינה?", ["רצה", "אוכלת", "שוטפת פנים, מצחצחת שיניים וקוראת", "רואה טלוויזיה"], 2, "המשפט: wash my face, brush my teeth"], ["כמה עמודים היא קוראת?", ["עמוד אחד", "פרק", "עשרה", "שני עמודים"], 3, "המשפט: two pages of a book"], ["מה קורה כשהיא שומרת על הסדר?", ["חולמת", "מתעוררת מוקדם", "נרדמת מהר ומתעוררת במצב רוח טוב", "לא ישנה"], 2, "המשפט: fall asleep faster"]]}, {"lv": "B1", "en": "Many people dream every night but forget their dreams in the morning. Scientists say we dream mostly during a deep part of sleep. If you wake up in the middle of a dream, you remember it better. Some people keep a book next to the bed and write down what they see as soon as they open their eyes.", "q": [["מה רבים עושים בבוקר?", ["שוכחים את חלומותיהם", "לא חולמים", "כותבים", "זוכרים הכול"], 0, "המשפט: forget their dreams in the morning"], ["מתי זוכרים חלום טוב יותר?", ["כשרצים", "כשישנים הרבה", "כשמתעוררים באמצע החלום", "כשאוכלים"], 2, "המשפט: wake up in the middle of a dream"], ["מה אנשים מסוימים שומרים ליד המיטה?", ["טלפון", "מים", "שעון", "ספר"], 3, "המשפט: a book next to the bed"]]}, {"lv": "A2", "en": "In summer, it is hard to sleep because the nights are hot. My brother puts a wet towel on his head, and I open the window. My father buys a fan that makes a quiet sound. Sometimes we sleep on the roof and look at the stars. Cool mornings feel like a gift after those nights.", "q": [["למה קשה לישון בקיץ?", ["כי קר", "כי הלילות חמים", "כי חושך", "כי רועש"], 1, "המשפט: the nights are hot"], ["מה האח עושה?", ["יוצא", "שם מגבת רטובה על הראש", "קונה מאוורר", "פותח חלון"], 1, "המשפט: puts a wet towel on his head"], ["איפה הם ישנים לפעמים?", ["על הגג", "בגינה", "ברכב", "בחוץ"], 0, "המשפט: sleep on the roof"]]}, {"lv": "B1", "en": "Teenagers often go to bed late, partly because their body clock changes during these years. This is normal, bu const LIB=[{"id": "road", "kind": "שיר", "t": "The Road Not Taken", "au": "Robert Frost, 1916", "lv": "B2", "en": "Two roads diverged in a yellow wood,\nAnd sorry I could not travel both\nAnd be one traveler, long I stood\nAnd looked down one as far as I could\nTo where it bent in the undergrowth;\n\nThen took the other, as just as fair,\nAnd having perhaps the better claim,\nBecause it was grassy and wanted wear;\nThough as for that the passing there\nHad worn them really about the same,\n\nAnd both that morning equally lay\nIn leaves no step had trodden black.\nOh, I kept the first for another day!\nYet knowing how way leads on to way,\nI doubted if I should ever come back.\n\nI shall be telling this with a sigh\nSomewhere ages and ages hence:\nTwo roads diverged in a wood, and I—\nI took the one less traveled by,\nAnd that has made all the difference.", "gl": {"diverged": "התפצלו", "wood": "יער", "traveler": "מטייל", "bent": "התעקל", "undergrowth": "סבך", "fair": "יפה/הוגן", "claim": "טענה", "wanted wear": "רצה שידרכו עליו", "worn": "נשחק", "trodden": "נדרך", "doubted": "פקפקתי", "sigh": "אנחה", "ages": "דורות", "hence": "מכאן והלאה", "difference": "הבדל"}, "q": [["מה הדובר מתלבט לגביו בשיר?", ["איזו דרך לבחור ביער", "מה לאכול", "לאן לטוס", "איזה בגד ללבוש"], 0, "שתי דרכים מתפצלות ביער, והוא לא יכול ללכת בשתיהן."], ["איזו דרך הוא בוחר בסוף?", ["זו שהרבה הולכים בה", "זו שפחות הלכו בה", "הוא חוזר הביתה", "הוא לא בוחר"], 1, "I took the one less traveled by."], ["מה המסר המרכזי של השיר, לדעתך?", ["בחירות שלנו משפיעות על החיים", "צריך תמיד ללכת עם הרוב", "יערות מסוכנים", "אסור לבחור"], 0, "that has made all the difference: הבחירה שינתה הכול. (זו פרשנות, ואפשר לחשוב גם אחרת.)"]]}, {"id": "woods", "kind": "שיר", "t": "Stopping by Woods on a Snowy Evening", "au": "Robert Frost, 1923", "lv": "B2", "en": "Whose woods these are I think I know.\nHis house is in the village though;\nHe will not see me stopping here\nTo watch his woods fill up with snow.\n\nMy little horse mus  {"id": "hope", "kind": "שיר", "t": "“Hope” is the thing with feathers", "au": "Emily Dickinson, 1891", "lv": "B2", "en": "“Hope” is the thing with feathers -\nThat perches in the soul -\nAnd sings the tune without the words -\nAnd never stops - at all -\n\nAnd sweetest - in the Gale - is heard -\nAnd sore must be the storm -\nThat could abash the little Bird\nThat kept so many warm -\n\nI’ve heard it in the chillest land -\nAnd on the strangest Sea -\nYet - never - in Extremity,\nIt asked a crumb - of me.", "gl": {"feathers": "נוצות", "perches": "עומד על ענף", "soul": "נשמה", "tune": "מנגינה", "gale": "סערה", "sore": "קשה/כואב", "abash": "להבהיל/לבייש", "chillest": "הכי קר", "extremity": "קושי קיצוני", "crumb": "פירור"}, "q": [["למה הדוברת משווה את התקווה?", ["לציפור", "לים", "לבית", "לשעון"], 0, "The thing with feathers: ציפור קטנה שיושבת בנשמה."], ["מתי התקווה נשמעת הכי מתוק?", ["בסערה", "בלילה שקט", "בחדר", "בבוקר"], 0, "sweetest in the Gale is heard."], ["מה התקווה ביקשה בשעת קושי?", ["אפילו פירור אחד", "הרבה אוכל", "מקום לישון", "כסף"], 0, "It asked a crumb of me: היא לא ביקשה כלום, היא רק נתנה."]]}, {"id": "sonnet18", "kind": "שיר", "t": "Sonnet 18", "au": "William Shakespeare, 1609", "lv": "B2", "en": "Shall I compare thee to a summer's day?\nThou art more lovely and more temperate:\nRough winds do shake the darling buds of May,\nAnd summer's lease hath all too short a date;\nSometime too hot the eye of heaven shines,\nAnd often is his gold complexion dimm'd;\nAnd every fair from fair sometime declines,\nBy chance or nature's changing course untrimm'd;\nBut thy eternal summer shall not fade,\nNor lose possession of that fair thou ow'st;\nNor shall Death brag thou wander'st in his shade,\nWhen in his eternal lines to time thou grow'st:\nSo long as men can breathe or eyes can see,\nSo long lives this, and this gives life to thee.", "gl": {"thee": "אותך", "thou": "אתה/את", "art": "הנך", "temperate": "מתון", "buds": "ניצנים", "lease": "חוזה/תקופה", "hath": "יש ( stood what happened. Now she had no hair for her combs, and he had no watch for his chain. But they were not sad, because each one gave the most important thing they had: love.", "gl": {"chain": "שרשרת", "combs": "מסרקים", "poor": "עניים", "special": "מיוחד", "gift": "מתנה"}, "q": [["מה האישה מכרה?", ["את השיער שלה", "את הטבעת", "את הבית", "את השעון"], 0, "She sold her hair to buy a chain for his watch."], ["מה הבעל מכר?", ["את השעון", "את הספרים", "את המעיל", "את הסוס"], 0, "He sold his watch to buy combs."], ["למה הם לא היו עצובים בסוף?", ["כי כל אחד נתן את הדבר החשוב ביותר: אהבה", "כי הם התעשרו", "כי חזרו הביתה", "כי קיבלו מתנות אחרות"], 0, "each one gave the most important thing they had: love."]]}];

נפוצה: If it will rain... צריך If it rains..."}, {"id": "reported", "band": "II", "lv": "A2", "t": "Reported Speech (basics)", "he": "דיבור עקיף", "hook": "איך מספרים לחברה מה מישהו אמר?", "rule": ["say + that (המורה אמרה ש...). tell + מי + that (היא אמרה לי ש...).", "בדיבור עקיף הפועל \"זז צעד אחורה\" בזמן: am/is→was, play→played, will→would, can→could.", "\"I am tired\" → She said (that) she was tired."], "f": "said (that) + זמן בעבר   ·   told me (that) + ...", "ex": [["The teacher said that we have to bring a notebook.", "המורה אמרה שאנחנו צריכים להביא מחברת."], ["Talia told her friend that she felt unwell.", "טליה אמרה לחברה שלה שהיא לא מרגישה טוב."], ["She said she was tired.", "היא אמרה שהיא עייפה."]], "q": [["mc", "He said, \"I am hungry.\" → He said that he ____ hungry.", ["was", "is"], 0, "am/is הופכים ל-was.", "צעד אחורה בזמן."], ["mc", "She ____ me that she was busy.", ["told", "said"], 0, "tell צריך מילה אחרי: told me.", "אחרי המילה יש \"me\"."], ["fill", "\"I live in Eilat.\" → She said that she ____ (live) in Eilat.", "lived", "הווה פשוט הופך לעבר פשוט.", "פועל + ed."], ["fill", "\"I will help.\" → He said he ____ help.", "would", "will הופך ל-would.", "w…"], ["order", "She told me that she was tired.", "told + מי + that + זמן בעבר."]], "tip": ""}, {"id": "relative", "band": "II", "lv": "A2", "t": "Relative Clauses", "he": "משפטי זיקה", "hook": "איך מוסיפים מידע על אדם או חפץ באמצע המשפט, בלי להתחיל משפט חדש?", "rule": ["who: לאנשים. which: לחפצים ודברים. that: לשניהם (במשפט מגדיר).", "משפט שמוסיף מידע ונפתח בפסיק (non-defining) אי אפשר עם that: My bag, which is red, is new.", "אין חוזרים על האדם: The girl who lives next door (לא who she lives)."], "f": "noun + who/which/that + שאר המשפט", "ex": [["Dan Hanan is a young writer who wrote a new book.", "דן חנן הוא סופר צעיר שכתב ספר חדש."], ["The book that I read was great.", "הספר שקראתי היה מעולה."], ["I picked up the parcel at the post office, which is across the street.", "לקחתי את החבילה בדואר, שנמצ : זמן. First, then, after that: רצף.", "both...and: גם וגם."], "f": "because / so / but / when / before / after", "ex": [["I stayed home because it was raining.", "נשארתי בבית כי ירד גשם."], ["It was raining, so I stayed home.", "ירד גשם ולכן נשארתי בבית."], ["She plays both the guitar and the piano.", "היא מנגנת גם בגיטרה וגם בפסנתר."], ["First we watched a film, then we ate.", "קודם ראינו סרט, אחר כך אכלנו."]], "q": [["mc", "I was tired, ____ I went to bed early.", ["so", "because"], 0, "so מציג תוצאה.", "העייפות היא הסיבה."], ["mc", "I went to bed early ____ I was tired.", ["because", "so"], 0, "because מציג סיבה.", "כאן יש סיבה."], ["mc", "She likes tea, ____ she doesn't like coffee.", ["but", "and"], 0, "ניגוד: but.", "ניגוד."], ["fill", "____ the meeting, I want to learn more. (before / after)", "Before", "לפני הפגישה: Before.", "B…"], ["order", "First we watched a film, then we ate.", "First, then: רצף."]], "tip": ""}, {"id": "cond2", "band": "III", "lv": "B1", "t": "Second Conditional", "he": "תנאי דמיוני", "hook": "מה היית עושה אילו היית זוכה בלוטו? זה מצב דמיוני, ולא סביר שיקרה.", "rule": ["if + עבר פשוט, would + פועל. העבר כאן לא מדבר על העבר, אלא על דמיון.", "בשימוש עם be אומרים If I were (גם בגוף ראשון ושלישי): If I were you, I would...", "כדי לתת עצה נעימה: If I were you, I would consult an expert."], "f": "If + Past Simple, would + V", "ex": [["If I won the lottery, I would travel the world.", "אילו זכיתי בלוטו, הייתי מטיילת בעולם."], ["If I were you, I would consult an expert.", "במקומך הייתי מתייעצת עם מומחה."], ["If she had more time, she would learn French.", "אילו היה לה יותר זמן, היא הייתה לומדת צרפתית."]], "q": [["fill", "If I ____ (have) a million dollars, I would buy a house.", "had", "תנאי דמיוני: עבר פשוט אחרי if.", "had."], ["mc", "If I ____ you, I would apologize.", ["were", "am"], 0, "במשפט דמיוני: If I were.", "זה דמיון, לא מציאות."], ["mc", "She would help if she ____ the answer.", ["knew", "knows"], 0, "דמיון: עבר פשוט.", "לא יודעת, אבל מדמיינים."], ["fill", "If we lived near the sea, we ____ (swim) every day.", "would swim|'d swim", "התוצאה: would + פועל.", "would + swim."], ["mc", "If it ____ sunny, we would go to the beach. (it is not sunny)", ["were", "will be"], 0, "מצב דמיוני: were.", "לא סביר שיקרה עכשיו."], ["order", "If I were you, I would consult an expert.", "If I were you + would."]], "tip": "באנגלית לא כותבים would אחרי if: If I would have... הוא טעות."}, {"id": "cond3", "band": "III", "lv": "B2", "t": "Third Conditional", "he": "תנאי בעבר שלא קרה", "hook": "אילו לא איחרתי, הייתי תופסת את האוטובוס. מדברים על העבר שאי אפשר לשנות.", "rule": ["if + past perfect (had + V3), would have + V3.", "מתאר מה היה קורה אילו משהו בעבר היה שונה. אי אפשר להגשים אותו.", "If you hadn't left the message, I wouldn't have known."], "f": "If + had + V3, would have + V3", "ex": [["If you hadn't left the message, I wouldn't have known.", "אילו לא השארת הודעה, לא הייתי יודעת."], ["If I had studied, I would have passed.", "אילו למדתי, הייתי עוברת."], ["She would have come if she had known.", "היא הייתה באה אילו ידעה."]], "q": [["fill", "If I ____ (study) harder, I would have passed the test.", "had studied|'d studied", "הערך בעבר שלא קרה: had + V3.", "had + studied."], ["mc", "If she had left earlier, she ____ the train.", ["would have caught", "would catch"], 0, "התוצאה בעבר: would have + V3.", "התוצאה בעבר."], ["mc", "If we ____ the map, we wouldn't have got lost.", ["had taken", "took"], 0, "במשפט הראשון: had + V3.", "past perfect."], ["fill", "They ____ (win) if they had played better.", "would have won", "התוצאה: would have + V3.", "would have + won."], ["order", "If I had known, I would have helped.", "If + had + V3, would have + V3."]], "tip": ""}, {"id": "unless", "band": "III", "lv": "B1", "t": "Unless & conditionals with modals", "he": "unless ותנאים עם מודאליים", "hook": "אפשר לנסח תנאי גם בלי if: unless פירושו \"אם לא\".", "rule": ["unless = if ... not. Unless you hurry, you will be late = If you don't hurry, you will be late.", "אחרי unless לא כותבים not: Unless you don't... הוא טעות.", "בחלק של התוצאה אפשר גם might, can, should: If I work fewer hours, I might feel better."], "f": "Unless + Present Simple, will + V   ·   If ..., might/could + V", "ex": [["Unless you drive within the speed limits, you will receive a fine.", "אם לא תנהגי במהירות המותרת, תקבלי קנס."], ["If I work fewer hours, I might feel better.", "אם אעבוד פחות שעות, אולי ארגיש טוב יותר."], ["If you are looking for fun, I would spend time in New York.", "אם את מחפשת כיף, הייתי מבלה בניו יורק."]], "q": [["mc", "____ you hurry, you will miss the bus.", ["Unless", "If"], 0, "Unless = if you don't: \"אם לא\".", "יש כאן משמעות שלילית."], ["mc", "Unless you ____ harder, you will fail.", ["study", "don't study"], 0, "אחרי unless אין not.", "unless כבר שלילי."], ["fill", "If I sleep more, I ____ (might / feel) better.", "might feel", "מודאל בחלק השני: might + פועל.", "might + feel."], ["fill", "We will stay home ____ it stops raining. (unless / if)", "unless", "נשארים אלא אם הגשם נפסק.", "u…"], ["order", "Unless you hurry, you will be late.", "Unless + הווה פשוט, will + פועל."]], "tip": ""}, {"id": "ppc", "band": "III", "lv": "B1", "t": "Present Perfect Continuous", "he": "הווה מושלם ממשיך", "hook": "מה ההבדל בין I have lived here ל-I have been living here? ואיך מדגישים משך?", "rule": ["have/has been + V+ing: פעולה שהתחילה בעבר, ממשיכה עד עכשיו, ומדגישה את הזמן.", "אפשר גם כשהפעולה נגמרה הרגע והתוצאה נראית עכשיו: You look tired. Have you been running?", "שואלים How long...? ועונים for / since."], "f": "have/has + been + V+ing", "ex": [["I have been studying for four years.", "אני לומדת כבר ארבע שנים."], ["How long have you been waiting?", "כמה זמן את מחכה?"], ["She has been working since morning.", "היא עובדת מאז הבוקר."]], "q": [["fill", "I ____ (wait) for an hour.", "have been waiting|'ve been waiting", "הדגשת משך: have been + ing.", "have been + waiting."], ["mc", "____ English?", ["How long have you been learning", "How long did you learn"], 0, "שואלים על משך שממשיך עד עכשיו.", "How long + Present Perfect Continuous."], ["mc", "She is tired. She ____ all day.", ["has been working", "worked"], 0, "התוצאה נראית עכשיו.", "פעולה שנמשכה עד עכשיו."], ["fill", "They ____ (live) here since 2015.", "have been living|have lived|'ve been living|'ve lived", "since + נקודת זמן.", "have + ..."], ["order", "I have been studying for four years.", "have been + ing + for/since."]], "tip": ""}, {"id": "pastperf", "band": "III", "lv": "B1", "t": "Past Perfect", "he": "עבר מושלם", "hook": "שתי פעולות בעבר: איזו קרתה קודם? העבר המושלם מראה את זו שקרתה קודם.", "rule": ["had + V3: פעולה שקרתה לפני פעולה אחרת בעבר.", "הפעולה האחרונה ב-Past Simple, הקודמת ב-Past Perfect.", "מילים נפוצות: before, after, when, by the time, already."], "f": "had + V3", "ex": [["The chef had prepared the dish before he was notified.", "השף כבר הכין את המנה לפני שהודיעו לו."], ["When I arrived, the film had started.", "כשהגעתי, הסרט כבר התחיל."], ["We had planned to drive, but the car rental was too expensive.", "תכננו לנסוע, אבל השכרת הרכב הייתה יקרה מדי."]], "q": [["fill", "When I arrived, the film ____ (start).", "had started", "הסרט התחיל קודם: had + V3.", "had + started."], ["mc", "She was sad because she ____ her keys.", ["had lost", "lost"], 0, "האובדן קרה לפני העצב: past perfect.", "זה קרה קודם."], ["mc", "After he ____ dinner, he went out.", ["had eaten", "ate"], 0, "האכילה קדמה ליציאה.", "קדמה."], ["fill", "I ____ (not / see) him before that day.", "hadn't seen|had not seen", "שלילה: hadn't + V3.", "hadn't + seen."], ["order", "When I arrived, the film had started.", "Past Simple לאירוע אחרון, had + V3 לקודם."]], "tip": ""}, {"id": "future2", "band": "III", "lv": "B2", "t": "Future Continuous & Future Perfect", "he": "עתיד ממשיך ועתיד מושלם", "hook": "איך אומרים \"בעוד שבוע בשעה כזו אני כבר אטוס\" ו\"עד אז הסרט כבר ייגמר\"?", "rule": ["Future Continuous: will be + V+ing: פעולה שתהיה באמצע בזמן מסוים בעתיד (This time next week I'll be flying).", "Future Perfect: will have + V3: פעולה שתסתיים עד זמן מסוים (by 5, by next year).", "בדרך כלל עם by (עד) מדברים על Future Perfect."], "f": "will be + V+ing   ·   will have + V3", "ex": [["This time next week, I'll be booking the flight.", "בשעה כזו בשבוע הבא אני אזמין את הטיסה."], ["The match will have finished by 4:30.", "המשחק כבר ייגמר עד 4:30."], ["By next year, she will have graduated.", "עד השנה הבאה היא כבר תסיים את הלימודים."]], "q": [["mc", "This time tomorrow I ____ on the beach.", ["will be lying", "will have lain"], 0, "פעולה שתהיה באמצע: will be + ing.", "באמצע."], ["mc", "By 8 o'clock I ____ my homework.", ["will have finished", "will be finishing"], 0, "by + זמן: סיום עד אז.", "עד אז."], ["fill", "At noon tomorrow, we ____ (drive) to Eilat.", "will be driving", "באמצע הנסיעה: will be + ing.", "will be + driving."], ["fill", "The movie ____ (finish) by 9.", "will have finished", "עד 9 זה כבר ייגמר.", "will have + finished."], ["order", "By next year, she will have graduated.", "will have + V3 עם by."]], "tip": ""}, {"id": "passive3", "band": "III", "lv": "B1", "t": "Passive: more tenses", "he": "סביל מורחב", "hook": "אפשר גם להגיד \"המחלקה נמצאת עכשיו בביקור\" או \"הבית נבנה\".", "rule": ["Present Continuous Passive: is/are being + V3 (is being built).", "Present Perfect Passive: has/have been + V3 (has been repaired).", "Past Simple Passive: was/were + V3. הפועל be משתנה לפי הזמן."], "f": "be (בזמן המתאים) + V3", "ex": [["Our Sales Department is being visited by the Director.", "מחלקת המכירות שלנו נמצאת בביקור של המנהל."], ["The bridge has been repaired.", "הגשר תוקן."], ["The Statue was given as a gift by the French.", "הפסל ניתן במתנה על ידי הצרפתים."]], "q": [["mc", "The road ____ at the moment.", ["is being repaired", "is repaired"], 0, "באמצע עכשיו: is being + V3.", "עכשיו."], ["fill", "The window ____ (break) by the storm last night.", "was broken", "עבר פשוט סביל: was + V3.", "was + broken."], ["mc", "The report ____ yet.", ["hasn't been written", "wasn't being written"], 0, "yet עם Present Perfect.", "yet."], ["fill", "The new library ____ (build) now.", "is being built", "עכשיו בסביל: is being + V3.", "is being + built."], ["order", "The bridge has been repaired.", "has been + V3."]], "tip": ""}, {"id": "reported2", "band": "III", "lv": "B1", "t": "Reported Speech with tense shift", "he": "דיבור עקיף: שינוי זמנים", "hook": "כשמספרים מה מישהו אמר, כל הזמנים זזים צעד אחורה, וגם מילים כמו here ו-tomorrow משתנות.", "rule": ["am/is → was; play → played; played → had played; will → would; can → could.", "here → there, today → that day, tomorrow → the next day, now → then.", "דיבור עקיף של שאלה: סדר מילים של משפט רגיל (She asked where I lived)."], "f": "said that + זמן אחורה   ·   asked + if/wh + סדר רגיל", "ex": [["She told him that security had sent it to Lost and Found.", "היא אמרה לו שהאבטחה שלחה את זה לאבדות ומציאות."], ["He said that he would call me the next day.", "הוא אמר שהוא יתקשר אליי למחרת."], ["She asked me where I lived.", "היא שאלה אותי איפה אני גר."]], "q": [["mc", "\"I have finished.\" → She said that she ____.", ["had finished", "has finished"], 0, "present perfect → past perfect.", "צעד אחורה."], ["fill", "\"I will call you tomorrow.\" → He said that he ____ call me the next day.", "would", "will → would.", "w…"], ["mc", "\"Where do you live?\" → She asked me where I ____.", ["lived", "did live"], 0, "בשאלה עקיפה אין did ואין סדר הפוך.", "כמו משפט רגיל."], ["fill", "\"I am tired.\" → He said he ____ tired.", "was", "am → was.", "w…"], ["order", "She asked me where I lived.", "סדר רגיל בשאלה עקיפה."]], "tip": "טעות נפוצה: I don't know where is he. צריך where he is."}, {"id": "relative2", "band": "III", "lv": "B1", "t": "Relative Clauses (extended)", "he": "משפטי זיקה מורחבים", "hook": "whose, where, ו-which שמוסיף דעה על כל המשפט.", "rule": ["whose = של מי שהוזכר: Mary, whose parents died, ...", "where למקום, when לזמן, בפסיקים: We toured p:["Most of us live in a world full of sound. Cars, phones, music and conversation follow us from the moment we wake up until we fall asleep. Many people hardly notice the noise anymore, but scientists believe that our bodies notice it all the time.","Research in several European cities has shown that people who live near busy roads or airports are more likely to sleep badly and feel stressed. In one study, children in noisy schools found it harder to concentrate, and their reading scores were lower than those of children in quiet schools. Doctors also warn that long exposure to loud sounds can raise blood pressure.","In response, some cities have started to protect quiet. In one capital, the council has marked certain parks as \"quiet areas\", where loud music and machines are forbidden. Other cities have built walls beside highways, planted trees, and changed the surface of roads so that cars make less noise. A few schools now hold \"silent lessons\" once a week, when students work without speaking or using devices.","However, creating quiet is not simple. Some residents argue that city life is meant to be lively, and that rules about noise limit their freedom. Shop owners worry that silent streets will frighten customers away. There is also the question of fairness: wealthy neighbourhoods usually have more parks and greenery, so their residents enjoy more quiet than people in crowded districts.","Interestingly, silence does not have to mean the absence of all sound. Many people find that natural sounds, such as wind, birds or running water, help them relax. Researchers call this \"restful sound\", and they recommend that planners use it when they design public spaces.","What can individuals do? Experts suggest simple habits: turn off the television when nobody is watching it, choose a quiet place to read, and spend a few minutes every day away from screens. These small choices may not change a whole city, but they can make our own days calmer. As one scientist put it, quiet is not an empty space. It is something we need in order to think clearly and listen to ourselves."],

{id:'r4',u:'5',t:'What the Robot Taught Us',words:'≈400',
p:["Last year, our school robotics team spent four months building a robot for a national competition. We worked after school, on weekends, and sometimes at night. I was the team's programmer, and I was sure that our robot would win.","On the day of the competition, everything went wrong. In the first round, the robot turned left instead of right and crashed into a wall. In the second round, one of its wheels fell off. The audience laughed, and I wanted to disappear. My teammates were silent, and our coach, Mr. Levy, looked tired.","That evening, while we packed our equipment, Mr. Levy asked us a surprising question: \"What did the robot do well?\" At first, nobody answered. Then Maya said that the arm moved smoothly. Omer said that the battery lasted longer than we had expected. Slowly, we made a list, and it was longer than any of us imagined.","Mr. Levy then asked a second question: \"And why did it fail?\" This time, the answers came quickly. I admitted that I had changed a part of the code on the last night without testing it. Omer confessed that he had not checked the wheel carefully. Nobody was blamed. We simply wrote down what we had learned.","During the following weeks, we rebuilt the robot step by step. We tested every change, and we divided the work so that two people always checked each other. When the regional competition took place in spring, the robot did not win first place, but it finished the whole course without a single mistake. The audience cheered, and this time I did not want to disappear.","I used to think that failure was the opposite of success. Now I understand that it can be a part of it. The worst moment of our season gave us our best lesson: a mistake is not the end of the story, as long as we are ready to look at it honestly and try again."],

{id:'a3',u:'3',t:'Our School Garden (article)',words:'',p:["Two years ago, the students of Ben-Gurion School decided to turn an empty yard into a garden. Today, the yard is full of green plants, flowers and even a small place for chickens.","The idea started in a science lesson. The teacher, Ms. Alon, asked the class, \"Where does our food come from?\" Many students did not know. She told them that they could learn by growing vegetables themselves.","First, the students cleaned the yard and brought good soil. Parents helped them build wooden boxes for the plants. In the first spring, they planted tomatoes, carrots and herbs. Every class has a day to water the garden, and students who forget get a funny red hat to wear for the day.","The results are surprising. In the dining room, the cook uses the garden's vegetables for school lunches. The students also sell flowers at the end of the year and use the money to buy new tools. \"I never liked salad,\" says Yoav, fifteen, \"but when you grow it yourself, it tastes different.\"","Now other schools in the area want to build their own gardens. Ms. Alon says that she is happy to help, but she warns: \"A garden needs work every day, even in the holidays.\""],gl:{soil:'אדמה',herbs:'עשבי תיבול',tools:'כלים',warn:'להזהיר'},

{id:'a4',u:'3',t:'Report: Class Trip to the Desert',words:'',p:["On Tuesday, November 12th, class 9B went on a trip to the desert. Thirty students and three teachers took part. This report describes what happened.","The bus left school at seven in the morning, and the journey took two and a half hours. When we arrived, our guide, Avi, welcomed us and gave each student a hat and a bottle of water. He explained that in the desert, people must drink a lot, even if they are not thirsty.","In the morning, we walked along a dry river and learned how animals live without much water. We saw the footprints of a fox and a large bird above us. After lunch, we visited a small farm where people grow vegetables in the sand. This was very interesting for most students.","In the afternoon, there was a problem: one student, Yael, hurt her foot. The teacher gave her first aid and the guide called a car, which took her back to the bus. She is fine now.","The trip ended at four o'clock with a short talk by the guide. He asked us to take our rubbish with us and not to touch the plants. The students agreed that this was the best trip of the year. We recommend that next year's class go there too."],gl:{journey:'נסיעה',footprints:'עקבות',"first aid":'עזרה ראשונה',rubbish:'זבל'},

{id:'a5',u:'3',t:'The Old Market (description)',words:'',p:["Every Friday morning, the old market in our city is full of life. When I walk through the entrance, the first thing I notice is the smell: fresh bread, oranges and strong coffee all mix in the air.","The market is a long street with hundreds of small stalls. On the left, men and women sell fruit and vegetables in bright colours. Their voices are loud, and they shout, \"Cheap tomatoes! Sweet melons!\" On the right, there are stalls with clothes, bags and shoes. You can buy a pair of jeans here for half the price in the mall.","My favourite place is a tiny shop at the end of the street. An old man called Mr. Haim sells spices there in big open bags. He knows everyone, and he always gives children a small sweet. When I was little, I thought he was a magician.","Of course, the market has problems too. It is very crowded, and you must be careful with your money. But for me, it is the best place in the city, because everyone is friendly and nothing is boring. I go there every Friday with my grandmother, and we always buy the same things: bread, olives and a big piece of cheese."],gl:{stall:'דוכן',spice:'תבלין',crowded:'צפוף',magician:'קוסם'},

{id:'a6',u:'3',t:'A Letter to the Editor',words:'',p:["Dear Editor,","I am writing about the new bus schedule in our town. Last month, the city decided to stop the number 12 bus after eight in the evening. As a student who lives at the edge of town, I think this is a big mistake.","I study at the evening courses at the community centre three times a week. My lessons finish at nine, and now I have no way to get home. Last Tuesday, I waited forty minutes for a taxi, and I paid fifty shekels for a ride that used to cost seven shekels by bus.","I am not the only one with this problem. Many workers also return home late, and some elderly people visit their families in the evening. For them, the bus is the only choice.","I understand that the city wants to save money, but there are other solutions. For example, the bus could run every hour after eight instead of every twenty minutes. This would cost less and still help people who need it.","I hope the city will think again. Thank you for publishing my letter.","Yours sincerely,","Eli Barak"],gl:{editor:'עורך',schedule:'לוח זמנים',solution:'פתרון',elderly:'קשישים'},

{id:'c3',u:'34',t:'Cooking at Sixteen',words:'',p:["When I was fourteen, I could not cook anything except eggs and noodles. My parents both work long hours, and we often ate food from restaurants. One evening, my father came home tired and said, \"I wish someone could make dinner tonight.\" That was the moment I decided to learn.","I started by watching videos on the Internet. My first dish was a vegetable soup, and it was a disaster: I forgot to add salt, and I cut the carrots into pieces that were too big. My sister took one spoon and asked for a sandwich instead. I was embarrassed, but I did not give up.","The next week, I asked my grandmother to teach me. She lives alone, and she was happy that someone wanted to spend time in her kitchen. She never used a recipe. Instead, she told me to taste the food all the time and to use my nose and eyes. \"A good cook listens to the food,\" she said, smiling.","Slowly, my cooking improved. Now, two years later, I make dinner for the family twice a week. Last month, I made my grandmother's chicken with rice, and my father said it tasted exactly like hers. I was so proud that I could not stop smiling.","Cooking has taught me more than just recipes. It has taught me to be patient, to plan ahead and to accept mistakes. And it has given me something precious: time with my grandmother."],gl:{noodles:'אטריות',disaster:'אסון',embarrassed:'נבוך',recipe:'מתכון',precious:'יקר'},

{id:'c4',u:'34',t:'The Park Clean-Up',words:'',p:["Every year on the first Saturday in May, the people of our neighbourhood meet in the old park for a clean-up day. This year, I took part for the first time, and I was surprised by what I found.","We started at nine in the morning. The organiser, a woman called Rina, gave everyone gloves and big plastic bags. She divided us into groups: one cleaned the playground, another worked by the pond, and the third group, mine, took the path near the football field.","At first, I thought the work would be boring, but it turned into a competition. My group collected twelve bags of rubbish in two hours, including bottles, old shoes and even a broken umbrella. It was shocking to see how much people throw on the ground. A boy of about eight asked me, \"Why do people do this?\" I could not answer.","At noon, we sat in the shade and ate sandwiches that the local bakery brought. The mayor visited too, and he promised to put more rubbish bins in the park. Rina said that this was the real success of the day, because the bins would help the park stay clean all year.","I went home tired and a little dirty, but happy. Next month, I walked in the park with my little brother, and I noticed that the path was still clean. It was a good feeling to think that I helped to make it so."],gl:{organiser:'מארגנת',pond:'בריכה קטנה',shocking:'מזעזע',mayor:'ראש עיר',bins:'פחים'},

{id:'e3',u:'5',t:'The Language We Almost Lost',words:'',p:["There are about seven thousand languages in the world, but linguists estimate that nearly half of them may disappear before the end of this century. Every two weeks, on average, the last speaker of a language dies, and with that person goes an entire way of seeing the world.","Take the case of a small island community in the Pacific. Until the 1950s, everyone there spoke the same ancient language. Then the government built a school that taught only in a larger, national language, and children were told that speaking at home in the old tongue would hold them back. Within two generations, the young people could no longer talk with their grandparents.","Linguists explain why this matters. A language is not just a list of words. It carries a community's stories, its knowledge about plants and weather, and even its ways of describing time and family. When a language vanishes, these treasures are often lost for ever.","Fortunately, there are signs of hope. On the same island, a group of elderly speakers recently began teaching \"language nests\": small classes where toddlers spend the whole day listening to the old language. The children, who are now ten, speak it fluently and teach it to their parents. Similar programs in other countries have helped languages that were once nearly silent to become living again.","Technology can help too. Researchers record the last speakers and store the sounds in digital libraries. Some communities have created phone applications and even computer games in their own languages. A teenager in the project said, \"When my phone speaks my grandmother's language, I feel that nothing is lost.\"","Yet experts remind us that recordings are not enough. A language lives only when people use it in everyday conversation: at home, in shops, in songs. This means that the future of a language does not depend on scientists alone, but on the decisions of its speakers, especially the young."],

{id:'e4',u:'5',t:'Is Fast Fashion Worth the Price?',words:'',p:["Walk into any shopping centre, and you will see rows of clothes at surprisingly low prices: a shirt for the cost of a sandwich, jeans cheaper than a pizza. This is \"fast fashion\", a business model in which stores produce new styles every few weeks and sell them cheaply to people who want to follow trends.","For customers, the benefits are clear. Young people with small budgets can look fashionable without spending much, and they can change their style as often as they like. For many families, cheap clothes are simply a way to save money.","However, the real cost is hidden. To keep prices low, factories often pay workers very little, and the conditions can be unsafe. In addition, producing clothes uses enormous amounts of water and energy. One estimate says that a single cotton shirt needs as much water as a person drinks in two and a half years.","The problem does not end in the shop. Because fast fashion is designed to be worn only a few times, millions of tonnes of clothing are thrown away every year. Many of these garments contain plastic fibres, which do not break down for hundreds of years.","Some people have started to act differently. They buy second-hand clothes, swap items with friends or repair torn clothes instead of throwing them away. A few companies now offer a service in which customers can return old clothes in exchange for a discount. Teenagers have a special role here, since they are the target of many advertisements; when they choose to buy less, the market listens.","Of course, not everyone can afford expensive, sustainable clothes. Experts therefore suggest a simple rule: before buying anything, ask yourself whether you will wear it at least thirty times. If the answer is no, perhaps you do not really need it."],

{id:'g1',u:'5',t:'The Teenage Brain and Sleep',words:'',p:["Every parent of a teenager knows the morning scene: the alarm rings, the bedroom door stays closed, and the young person inside seems to be in a deep sleep that no noise can disturb. For years, adults blamed this on laziness. Scientists now say that the explanation is much more interesting: the teenage body clock really does change.","During childhood, the brain releases a hormone called melatonin in the early evening, which makes people feel sleepy. At around the age of twelve or thirteen, however, this release moves about two hours later. As a result, a fifteen-year-old who goes to bed at ten may lie awake for hours, not because he is rebellious, but because his brain is not yet ready to sleep. In the morning, the same brain is still producing melatonin when the school day begins.","The consequences can be serious. Experts recommend that teenagers sleep between eight and ten hours every night, but surveys show that most get only six or seven. Tired students find it harder to concentrate, remember facts and control their emotions. Some studies even link lack of sleep to a higher risk of accidents among young drivers.","In response, several schools around the world have experimented with later start times. In one American district, the first lesson was moved from seven-thirty to eight-thirty. After a year, attendance had improved, fewer students fell asleep in class and, most surprisingly, test scores went up. Not all parents were pleased, however. Some worried that later finishing times would interfere with sports, jobs and family routines.","Meanwhile, there is a lot that teenagers can do by themselves. Doctors advise them to avoid screens for an hour before bed, because the bright light of a phone tells the brain that it is still daytime. They also suggest keeping the bedroom dark and cool, and going to bed and waking up at roughly the same time every day, even at weekends. Coffee and energy drinks in the afternoon should be avoided.","Understanding the science behind sleep may change the way we talk about teenagers. Instead of calling a sleepy sixteen-year-old lazy, we might start by asking whether the world around him has been designed for a brain like his. Perhaps the question is not how to wake teenagers up, but how to let them sleep."],

{id:'g2',u:'5',t:'The Library of the Future',words:'',p:["When people hear the word \"library\", they often picture a silent room full of dusty books and a strict librarian saying \"Shh!\". But in many cities, this picture is changing fast. Modern libraries are becoming lively community centres, and some experts believe they may be among the most important public places of the twenty-first century.","At first sight, this might seem strange. After all, in an age of smartphones and e-books, why would anyone need a building full of paper? The answer, say librarians, is that people need more than information; they need space, guidance and company. A library offers free internet, quiet places to study and help from trained staff, all without asking for any payment.","Many libraries now provide services that would have surprised earlier generations. In one northern city, visitors can borrow tools, musical instruments and even sewing machines. Another library has opened a studio where teenagers record podcasts. In several places, volunteers help immigrants practise the local language, and older people attend classes where they learn to use tablets.","Libraries also play an important role in fighting inequality. Not every family can afford a computer or a fast internet connection. For a child from such a family, the library may be the only place to do online homework. A librarian in a poor neighbourhood described a boy who came every day after school. \"He did not have a desk at home,\" she said. \"Here, at least, he has a chair, a light and someone who believes in him.\"","However, libraries face serious challenges. Budgets are being cut in many countries, and some branches have already closed. Critics argue that money should be spent on more urgent needs, such as hospitals and schools. Supporters answer that a small investment in libraries brings large benefits, from better reading skills to stronger communities.","The future of the library, then, may not depend on books alone. If it continues to adapt, it can remain what it has always been: a place where anyone, rich or poor, young or old, can open a door and find something new. And perhaps, in a world where so much is sold to us, the idea of a place that offers knowledge for free is more valuable than ever."],

{id:'g3',u:'5',t:'Volunteering: Who Really Benefits?',words:'',p:["On Wednesday afternoons, sixteen-year-old Shir goes to a retirement home and plays chess with a man called Mr. Peretz. At first, she thought she was doing him a favour. Today, she says, she is not sure who is helping whom. \"He has taught me patience,\" she explains, \"and he tells wonderful stories about his life. I leave feeling better than when I arrived.\"","Shir's experience is far from unusual. Researchers who study volunteering have found that people who give their time to others often gain a great deal themselves. Volunteers report feeling less lonely, more confident and more satisfied with their lives. Some studies even suggest that they live longer than people who do not volunteer, although scientists are careful to say that more research is needed.","For young people, the advantages are especially clear. Volunteering offers a chance to try different kinds of work before choosing a career. A teenager who helps at an animal shelter, for example, may discover that she wants to become a veterinarian. In addition, universities and employers appreciate applicants who have shown responsibility and care for others.","Nevertheless, some experts warn against seeing volunteering only as a way to improve one's own life. If a young person volunteers mainly to add a line to a job application, they say, the people he is supposed to help may notice. The best volunteers are those who truly listen and who respect the people they meet, instead of treating them as a project.","Another question is whether schools should require students to volunteer. Supporters believe that a required program gives everyone a chance, including teenagers who would never have looked for such activities alone. Opponents reply that forced kindness is not real kindness, and that students may come to dislike volunteering altogether. Many schools therefore choose a middle path: they require a small number of hours but let students choose the place themselves.","Whatever the answer, the story of Shir and Mr. Peretz reminds us that giving and receiving are not opposites. A game of chess, a conversation and an afternoon of attention can be a gift in both directions, and perhaps that is the best reason to volunteer."],

BGR.find(x=>x.id==='g1').p.splice(-1,0,"Weekends make the picture even more complicated. Many teenagers sleep until noon on Saturday and Sunday to repay what scientists call a \"sleep debt\". The problem is that this changes the body clock again, so on Sunday night they cannot fall asleep, and Monday morning feels even harder than before. Researchers compare this to flying across several time zones every weekend. A better solution, they say, is to limit the difference between weekday and weekend wake-up times to about one hour, and to take a short nap in the afternoon when necessary.");
BGR.find(x=>x.id==='g2').p.splice(-1,0,"None of this happens by accident. Today's librarians are trained not only to look after books but also to teach computer skills, organise events and work with social workers. In one small town, a librarian noticed that many visitors came only to get warm in winter, so she started a weekly soup afternoon. Soon, the library became a meeting place for neighbours who had never spoken before. \"We did not plan it,\" she said, \"but a library should respond to the people who actually walk through its doors.\"");
BGR.find(x=>x.id==='g3').p.splice(-1,0,"How can a young person choose a good place to volunteer? Organisers give a few simple tips. First, choose a cause that you honestly care about, because enthusiasm is easy for others to feel. Second, be realistic about your time: it is better to give two hours every week than to promise ten hours and disappear after a month. Third, ask questions at the beginning, so that you understand exactly what is expected of you. Finally, remember that mistakes are normal, and that a good organisation will help you learn from them.");

{id:'a7',u:'3',t:'Young Scientists Fair (advertisement)',words:'',p:["Do you love experiments? Do you ask \"why?\" about everything? Then the Young Scientists Fair is for you!","The fair will take place on Thursday, March 14th, in the big hall of the city museum. It is open to students from grades seven to nine. You can come alone or with a partner, but not with more than one partner.","What do you need to do? Choose a question that interests you, for example: \"Which paper plane flies farthest?\" or \"Does music help plants grow?\" Then do an experiment, write down your results and show them on a poster. You have six weeks to prepare.","On the day of the fair, a group of teachers and university students will walk around, listen to your explanations and ask questions. The three best projects will win a prize: a visit to a real science laboratory. Every participant will get a certificate and a free ticket to the museum.","Registration is free, but you must register by February 20th. Forms are available from your science teacher or at the museum desk. Come and show the world how curious you are!"],gl:{experiment:'ניסוי',certificate:'תעודה',registration:'הרשמה',participant:'משתתף'},

{id:'a9',u:'3',t:'The Bakery on Rose Street (article)',words:'',p:["On a quiet corner of Rose Street, there is a small bakery that opens at four in the morning. Its owner, Mr. Shalom, is seventy years old, and he has been baking bread there for almost fifty years.","\"My father opened this shop,\" says Mr. Shalom. \"He taught me everything. We use only flour, water, salt and time.\" He explains that good bread needs patience. The dough rests for a whole night before it goes into the oven.","Every morning, a line of customers waits outside the door. Some come for the famous round rolls, and others for the sweet cake with nuts. Many customers have been coming for thirty years, and Mr. Shalom knows their names and their favourite bread.","In the last few years, the bakery has faced a problem. A big supermarket opened nearby, and it sells bread much cheaper. Some people stopped coming. Mr. Shalom did not lower his prices, but he started to give a free roll to every child who comes with a parent.","\"Money is not the only thing,\" he says. \"When children come, they learn that bread is made by people.\" Last month, a teacher brought her whole class to see how the bread is made. Today, the shop is as busy as ever."],gl:{dough:'בצק',oven:'תנור',customer:'לקוח',supermarket:'סופרמרקט'},

{id:'a10',u:'3',t:'Report: Recycling Week at School',words:'',p:["This report describes Recycling Week, which took place at our school from May 5th to May 9th. The student council organised it, with help from three teachers.","On Monday, the council placed four coloured bins in the yard: blue for paper, green for glass, orange for plastic and grey for other rubbish. Many students were confused at first, so volunteers stood next to the bins and explained.","On Tuesday and Wednesday, each class collected old paper. Class 8A won the competition, with 120 kilograms. As a prize, they received a day trip to a nearby forest. On Thursday, an expert from the city visited the school. He showed a short film and told students how plastic can be turned into new clothes and toys.","On Friday, students made things from rubbish: a lamp from bottles, a bag from old shirts and a guitar from a box. The best works were shown in the school hall.","The week was successful. After it, the amount of rubbish in the school fell by almost a third. The council recommends holding Recycling Week every year, and adding a day for repairing broken things instead of throwing them away."],gl:{recycling:'מיחזור',council:'מועצה',bin:'פח',expert:'מומחה'},

{id:'a11',u:'3',t:'Grandma\'s House (description)',words:'',p:["My grandmother lives in a small white house at the end of a long road. When I was a child, we visited her every Saturday, and the house became my favourite place in the world.","There is a big tree in front of the house, and under it stands an old wooden table. In summer, we eat lunch there, and the leaves make a soft shadow on our plates. The air always smells of lemon, because Grandma grows lemons in the garden and uses them for everything: tea, cakes, even soap.","Inside, the rooms are small and full of things. On the walls hang many photographs of the family, some of them a hundred years old. In the living room, there is a very old clock that makes a loud noise every hour. As a child, I was afraid of it. Now it makes me smile.","My favourite room is the kitchen. Grandma stands next to the window, and she always seems to be cooking something good. She does not like machines, so she cuts everything by hand.","I am older now, and I live far away. But when I close my eyes, I can still hear the clock, smell the lemons and see the white house at the end of the road."],gl:{shadow:'צל',photograph:'תצלום',clock:'שעון',window:'חלון'},

{id:'a12',u:'3',t:'Studying English Abroad (advertisement)',words:'',p:["Do you want to speak English better and to meet friends from all over the world? Join our three-week English course in Brighton, on the south coast of England!","Our school is in a beautiful old building, five minutes from the beach. Classes are small, with no more than twelve students, so every teacher has time for each person. Lessons are from nine to twelve, and the afternoons are free for activities: football on the beach, shopping in the town or visiting museums.","Students live with local families. You will have your own room, and the family will give you breakfast and dinner. This is a great way to practise your English every day, and many students say that the family became like a second home.","The course is for ages fifteen to eighteen. The price is 7,800 shekels, which includes lessons, accommodation, meals and a weekend trip to London. The flight is not included, but we can help you to find a cheap ticket.","The next courses begin on July 3rd and July 24th. Places are limited, so register now and you will receive a free English dictionary!"],gl:{coast:'חוף',accommodation:'לינה',register:'להירשם',local:'מקומי'},

{id:'c5',u:'34',t:'The Boy Who Collected Sounds',words:'',p:["When Eitan was twelve, he got an old recorder as a birthday present. At first, he used it only to record his friends' jokes. Then, one rainy afternoon, he held the recorder out of the window and listened to the sound of the rain. It was a revelation: for the first time, he heard how many different sounds one single moment could contain.","Since then, he has become a collector of sounds. He records the morning bus, the old man who sells fruit in the market, his little sister's laugh and the waves on the beach. He keeps everything in a folder on his computer and gives each recording a name, such as \"Thursday, 7:42, bakery door\".","His friends thought the hobby was strange. \"What can you do with a hundred recordings of noise?\" one of them asked. Eitan did not know the answer until his school asked students to make a short film. He added his sounds to the pictures, and suddenly the film felt alive. Everyone in the class said it was the best film of the year.","Today, Eitan is sixteen, and he is learning to make music from his recordings. He says that the world is full of free music, and that all it takes is a pair of open ears. \"People talk about what they see,\" he says. \"But what we hear tells us just as much.\""],gl:{recorder:'מקליט',revelation:'התגלות',collector:'אספן',alive:'חי'},

{id:'c6',u:'34',t:'Moving to a New Country',words:'',p:["When my family moved from Israel to Canada three years ago, I thought it would be an adventure. In some ways it was, but nobody had told me how hard the first months would be.","The first problem was the weather. In my first winter, the temperature dropped to minus twenty, and I did not even know how to put on a proper coat. The second problem was language. I had learned English at school, but I could not understand the fast speech of my classmates, and I was afraid to speak in class.","Things changed because of a boy called Daniel. He sat next to me in maths, and one day he asked, \"Do you want to join our hockey team?\" I had never played hockey in my life. I fell on the ice about fifty times in the first week, and everyone laughed, even me. But slowly, I made friends and learned new words with every game.","Today, I speak English without thinking, and I even love the snow. But I still miss the sun, the noisy markets and my grandparents. I have learned that you can belong to two places at the same time.","If I could give one piece of advice to a new student, it would be this: say yes. Say yes to the invitation, to the strange food and to the new game. Home is not only a place; it is also the people who make you feel welcome."],gl:{adventure:'הרפתקה',proper:'מתאים',temperature:'טמפרטורה',invitation:'הזמנה'},

{id:'c7',u:'34',t:'The Last Day of Summer Vacation',words:'',p:["Every year, on the last day of the summer vacation, my cousins and I do the same thing: we ride our bikes to the old quarry outside the village. It is a deep pool, surrounded by white stones, and the water is so clear that you can see the bottom.","This year was different. My cousin Gil, who is the oldest, told us that it would be his last summer in the village, because his family was moving to the city. Nobody said anything for a while. We just sat on the stones and looked at the water.","Then Gil stood up and said, \"Let's do something we will remember.\" He told us to write a secret wish on a small piece of paper and put it in an empty bottle. We would close the bottle, throw it into the pool and promise to come back in ten years to open it.","I wrote my wish, but I will not tell you what it was. We threw the bottle, and it floated for a moment and then sank slowly. It was one of the quietest, most beautiful moments of my life.","On the way home, nobody wanted to race. We rode slowly, and the sun was low and golden. I think we all understood that something was ending, but also that something stays: the promise we made to each other."],gl:{quarry:'מחצבה',wish:'משאלה',sank:'שקע',promise:'הבטחה'},
