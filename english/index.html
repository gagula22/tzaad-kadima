<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1b5e"><title>Speak Up – אנגלית בכיף</title>
<style>
:root{--bg:#1b1240;--bg2:#2a1b5e;--card:#ffffff14;--card2:#ffffff22;--tx:#fff;--mu:#c9c1ee;--ac:#ff7ab8;--ac2:#7af0d0;--ok:#4ade80;--no:#ff6b6b;--yl:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
body{padding-bottom:84px}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px}
h1,h2,h3{margin:.3em 0}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 10px}
.logo{font-weight:800;font-size:22px}.logo b{color:var(--ac)}
.pill{background:var(--card2);border-radius:99px;padding:5px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid #ffffff1f;border-radius:20px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card2);border:0;border-radius:18px;padding:14px 10px;color:var(--tx);font:inherit;text-align:center;cursor:pointer;min-height:96px}
.tile:active{transform:scale(.97)}.tile .ic{font-size:30px;display:block}.tile small{color:var(--mu)}
.btn{background:linear-gradient(90deg,var(--ac),#b28dff);color:#1b1240;border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;min-height:44px}
.btn.g{background:var(--card2);color:var(--tx)}.btn.s{padding:7px 12px;min-height:36px;font-size:15px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.en{direction:ltr;text-align:left;font-size:20px;line-height:1.8}
.en .w{cursor:pointer;border-radius:6px;padding:0 1px}.en .w:hover,.en .w.sel{background:#7af0d033}
.snt.on{background:#ffd16638;border-radius:6px}
.line{direction:ltr;text-align:left;padding:6px 8px;border-radius:10px;display:flex;gap:8px;align-items:flex-start}
.line.on{background:#ffd16638}.line .n{opacity:.5;min-width:22px;font-size:13px;padding-top:5px}
.gap{height:10px}
.opt{display:block;width:100%;text-align:right;background:var(--card2);border:2px solid transparent;border-radius:14px;color:var(--tx);padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#4ade8033}.opt.no{border-color:var(--no);background:#ff6b6b33}
.opt.enOpt{direction:ltr;text-align:left}
.fb{padding:10px 12px;border-radius:12px;margin:8px 0}.fb.ok{background:#4ade8026}.fb.no{background:#ff6b6b26}
input,textarea,select{width:100%;background:#0000003a;border:1px solid #ffffff33;border-radius:12px;color:var(--tx);padding:10px 12px;font:inherit}
textarea{min-height:140px}input.en,textarea.en{direction:ltr;text-align:left}
.bar{height:10px;background:#ffffff22;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
nav{position:fixed;bottom:0;left:0;right:0;background:#150d33f2;backdrop-filter:blur(8px);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff22;z-index:5}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;cursor:pointer;min-width:56px}
nav button span{font-size:22px}nav button.on{color:#fff}nav button.on span{filter:drop-shadow(0 0 6px var(--ac))}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;width:min(92vw,420px);background:#fff;color:#1b1240;border-radius:18px;padding:14px 16px;box-shadow:0 10px 40px #0008;z-index:9}
.pop .big{font-size:22px;font-weight:800;direction:ltr;text-align:left}
.chip{display:inline-block;background:var(--card2);border-radius:99px;padding:3px 11px;margin:3px;font-size:15px;direction:ltr}
.chip small{color:var(--mu);direction:rtl;unicode-bidi:isolate;display:inline-block}.chip .sp{margin:0 6px;color:var(--ac)}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:800;cursor:pointer}
.mu{color:var(--mu);font-size:15px}.tag{background:var(--yl);color:#1b1240;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800}
.burst{position:fixed;pointer-events:none;font-size:28px;z-index:20;animation:b 1s ease-out forwards}
@keyframes b{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-120px) scale(1.6)}}
a{color:var(--ac2)}
@media(min-width:900px){body{padding-bottom:0;padding-right:96px}nav{top:0;bottom:0;left:auto;right:0;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding-top:16px;border-top:0;border-left:1px solid #ffffff22}}
</style></head><body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav><div id="popw"></div>
<script>
/*DATA*/
const READ=[{"id": "music", "icon": "🎧", "t": "מוזיקה", "lv": "A2", "en": "Music is a big part of my life. Every morning, I listen to my favorite songs on the bus. Last year, I learned to play the guitar, and now I practice every day. Next month, I will play in a small concert with my friends. I am a little afraid, but I am also very excited. Music always makes me feel better.", "q": [["מתי הדוברת מקשיבה לשירים האהובים עליה?", ["בבוקר באוטובוס", "בלילה במיטה", "בבית הספר", "בקונצרט"], 0, "המשפט: Every morning, I listen to my favorite songs on the bus. (every morning = כל בוקר)"], ["מה היא למדה לנגן בשנה שעברה? (Last year = עבר)", ["פסנתר", "גיטרה", "תוף", "כינור"], 1, "Last year, I learned to play the guitar. learned הוא עבר פשוט."], ["איך היא מרגישה לגבי הקונצרט?", ["משועממת", "כועסת", "קצת מפחדת וגם מתרגשת", "עייפה"], 2, "I am a little afraid, but I am also very excited."]]}, {"id": "soccer", "icon": "⚽", "t": "ספורט", "lv": "A2", "en": "My brother plays soccer for a team in our city. They train three times a week, and on Saturday they play a game. Yesterday they won, and everyone was very happy. He says that a good team needs hard work and a good friend in every position. If they win the next game, they will go to the final.", "q": [["כמה פעמים בשבוע הקבוצה מתאמנת?", ["פעם אחת", "פעמיים", "שלוש פעמים", "כל יום"], 2, "They train three times a week."], ["למה כולם היו שמחים אתמול?", ["כי הם ניצחו", "כי הם הפסידו", "כי היה חג", "כי המאמן חזר"], 0, "Yesterday they won. won הוא עבר של win."], ["מה יקרה אם הם ינצחו במשחק הבא? (תנאי)", ["הם יפסיקו לשחק", "הם ילכו לגמר", "הם יעברו עיר", "הם ינוחו"], 1, "If they win the next game, they will go to the final. מבנה תנאי: If + הווה, will + פועל."]]}, {"id": "phone", "icon": "📱", "t": "טלפון ושינה", "lv": "B1", "en": "Many teenagers use a phone for hours every day. They send messages, take photos, and watch videos. But too much time on a phone can be bad for sleep and for school. Last week, I turned off my phone after dinner, and I slept better. Now I read a book before bed. Have you ever tried it?", "q": [["מה יכול להיות רע בהרבה זמן מסך?", ["לאוכל ולספורט", "לשינה וללימודים", "לחברים ולמשפחה", "לעיניים בלבד"], 1, "too much time on a phone can be bad for sleep and for school."], ["מה הדוברת עשתה בשבוע שעבר?", ["קנתה טלפון", "שברה את הטלפון", "כיבתה את הטלפון אחרי ארוחת הערב", "צילמה הרבה"], 2, "Last week, I turned off my phone after dinner."], ["מה היא עושה עכשיו לפני השינה?", ["מקשיבה למוזיקה", "קוראת ספר", "רואה סרט", "מכינה שיעורים"], 1, "Now I read a book before bed. Now = הווה."]]}, {"id": "travel", "icon": "✈️", "t": "טיולים", "lv": "A2", "en": "We are going to travel to a beautiful island next summer. We will fly for five hours, and then we will take a boat. My sister has already packed her bag, but I have not started yet. We will stay in a small hotel near the beach. I think the trip will be the best part of the year.", "q": [["מתי הם נוסעים?", ["בחורף הקרוב", "בקיץ הבא", "בשבוע הבא", "בשנה שעברה"], 1, "next summer = הקיץ הבא."], ["מה כבר עשתה האחות?", ["הזמינה מלון", "ארזה את התיק", "קנתה כרטיסים", "הגיעה לחוף"], 1, "My sister has already packed her bag. has packed = עבר-הווה (Present Perfect)."], ["איפה הם יישנו?", ["באוהל", "אצל חברים", "במלון קטן ליד החוף", "בסירה"], 2, "We will stay in a small hotel near the beach."]]}, {"id": "food", "icon": "🍝", "t": "בישול", "lv": "A2", "en": "Yesterday I cooked dinner for my family for the first time. I made rice with tomatoes and cheese. First, I boiled the water, and then I added the rice. My mother was surprised and she said it was delicious. Tomorrow I am going to try a new recipe, and maybe I will bake a cake.", "q": [["מה הדוברת הכינה?", ["פיצה", "אורז עם עגבניות וגבינה", "סלט", "עוגה"], 1, "I made rice with tomatoes and cheese."], ["איך אמא הגיבה?", ["כעסה", "הייתה מופתעת ואמרה שזה טעים", "לא אכלה", "בכתה"], 1, "My mother was surprised and she said it was delicious."], ["מה היא מתכננת לעשות מחר? (be going to)", ["לנוח", "לנסות מתכון חדש", "לקנות סיר", "ללכת למסעדה"], 1, "Tomorrow I am going to try a new recipe. am going to = תכנון לעתיד."]]}, {"id": "friends", "icon": "💛", "t": "חברות", "lv": "B1", "en": "A good friend listens to you when you are sad. She is honest, but she is also kind. My best friend and I have known each other since we were six years old. We do not always agree, but we never stay angry for a long time. I hope we will be friends for the rest of our lives.", "q": [["איך מתוארת חברה טובה?", ["כנה וגם אדיבה", "שקטה וביישנית", "תמיד מסכימה", "תמיד צוחקת"], 0, "She is honest, but she is also kind."], ["מאיזה גיל הן מכירות?", ["שש", "שתים עשרה", "עשר", "שלוש"], 0, "have known each other since we were six years old. since = מאז."], ["מה קורה כשהן לא מסכימות?", ["הן נשארות כועסות זמן רב", "הן לא נשארות כועסות זמן רב", "הן מפסיקות לדבר", "הן שוכחות"], 1, "we never stay angry for a long time. never = אף פעם לא."]]}, {"id": "movie", "icon": "🎬", "t": "סרטים", "lv": "B1", "en": "I saw a great movie last night. It was about a girl who finds a strange door in her house. When she opens it, she enters a different world full of colors. At first she is scared, but later she meets a friendly animal who helps her. The ending surprised me, and I want to watch it again.", "q": [["מה הילדה מוצאת בבית?", ["מפתח ישן", "דלת מוזרה", "חיה קטנה", "ספר"], 1, "a girl who finds a strange door in her house."], ["איך היא מרגישה בהתחלה?", ["שמחה", "מפוחדת", "רעבה", "משועממת"], 1, "At first she is scared. At first = בהתחלה."], ["מי עוזר לה?", ["חיה ידידותית", "המורה", "אמא שלה", "קוסם"], 0, "she meets a friendly animal who helps her."]]}, {"id": "animals", "icon": "🐶", "t": "חיות", "lv": "B1", "en": "Dogs have lived with people for thousands of years. They can understand many words, and they can feel when you are sad. A dog does not only want food; it also wants love and attention. If you have a dog, you should walk it every day. Cats are different: they like to sleep a lot and they often prefer to be alone.", "q": [["כמה זמן כלבים חיים עם בני אדם?", ["כמה חודשים", "אלפי שנים", "מאה שנה", "מאז אתמול"], 1, "have lived with people for thousands of years. have lived = Present Perfect."], ["מה כלב רוצה חוץ מאוכל?", ["כסף", "אהבה ותשומת לב", "חדר משלו", "צעצוע בלבד"], 1, "it also wants love and attention."], ["מה חתולים אוהבים?", ["לרוץ הרבה", "לישון הרבה ולפעמים להיות לבד", "לשחות", "לשחק עם כלבים"], 1, "they like to sleep a lot and they often prefer to be alone."]]}, {"id": "space", "icon": "🚀", "t": "החלל", "lv": "B1", "en": "Space is very big and very quiet. The Earth moves around the sun, and the moon moves around the Earth. Scientists have sent machines to other planets to look for water. Some people believe that one day humans will live on another planet. Would you like to go there?", "q": [["סביב מה כדור הארץ נע?", ["הירח", "השמש", "מאדים", "כוכב"], 1, "The Earth moves around the sun."], ["מה המדענים מחפשים בכוכבים אחרים?", ["אוכל", "מים", "זהב", "אנשים"], 1, "to look for water."], ["מה חלק מהאנשים מאמינים שיקרה יום אחד?", ["בני אדם יחיו על כוכב אחר", "השמש תיעלם", "הירח יתרחק", "החלל יהיה רועש"], 0, "one day humans will live on another planet."]]}, {"id": "school", "icon": "📚", "t": "בית ספר", "lv": "B1", "en": "Today I had a hard test in math, but I studied for two hours yesterday, so I think I did well. In the afternoon we worked in groups and made a project about the environment. My teacher said that mistakes are a normal part of learning. After school, I always do my homework before I play. I want to go to university one day.", "q": [["כמה זמן היא למדה למבחן?", ["שעה", "שעתיים", "שלוש שעות", "חצי שעה"], 1, "I studied for two hours yesterday."], ["על מה היה הפרויקט בקבוצות?", ["על חיות", "על הסביבה", "על היסטוריה", "על מוזיקה"], 1, "a project about the environment."], ["מה המורה אמרה על טעויות?", ["הן גרועות", "הן חלק נורמלי מהלמידה", "צריך להסתיר אותן", "הן נדירות"], 1, "mistakes are a normal part of learning."]]}, {"id": "job", "icon": "💼", "t": "עבודה וכסף", /* ---- cloze generator ---- */
const STOP=new Set('about after again also always because before being between could every first found from have into just know like little made many more most much must never only other over said same should since some still such than that their them then there these they this those through very want were what when where which while will with would your'.split(' '));
function cloze(text,n=6){const sn=text.split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=4);const all=[...new Set((text.match(/[A-Za-z]{4,}/g)||[]).map(x=>x.toLowerCase()))].filter(w=>!STOP.has(w));const qs=[];
 for(const s of sn.sort(()=>Math.random()-.5)){if(qs.length>=n)break;const ws=(s.match(/[A-Za-z]{4,}/g)||[]).filter(w=>!STOP.has(w.toLowerCase()));if(!ws.length)continue;const a=ws[Math.floor(Math.random()*ws.length)];const d=all.filter(x=>x!==a.toLowerCase()&&Math.abs(x.length-a.length)<=2).sort(()=>Math.random()-.5).slice(0,3);if(d.length<2)continue;const opts=[...d,a.toLowerCase()].sort(()=>Math.random()-.5);qs.push([s.replace(new RegExp('\\b'+a+'\\b'),'_____'),opts,opts.indexOf(a.toLowerCase()),'המשפט המלא: '+s])}
 return qs}
