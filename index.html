  var hasAct=t.split(/[\s,.:;"()?!]+/).some(function(w){return /^א[א-ת]{2,}$/.test(w)&&nonVerb.indexOf(w)<0});
  var hasNum=/[0-9]|שני|שתי|שלוש|ארבע|חמש|שש |שבע|שמונה|תשע|עשר|ביום|בשבוע|מחר|דקות|שעה|פעמים|פעם אחת/.test(t);
  var hasQ=t.indexOf('?')>-1;
  var good=[],need=[];
  if(hasAct)good.push(u('fbSAct'));else need.push(u('fbNeedAct'));
  if(hasNum)good.push(u('fbSNum'));else need.push(u('fbNeedNum'));
  if(hasQ)good.push(u('fbSQ'));
  if(t.length<=100)good.push(u('fbSLen'));
  var parts=[];
  if(good.length)parts.push(good.slice(0,2).join(' '));
  if(need.length)parts.push(need[0]);
  else{var tip=u('fbT_'+jid);if(tip&&tip.indexOf('fbT_')!==0)parts.push(tip)}
  return{text:parts.join(' ')};
}
function deepFb(jid,i){
  var d=FBX[jid+'-'+(i+1)];if(!d)return '';
  var h='<div class="card"><b>'+u('deepTitle')+'</b><p style="margin:8px 0 0">'+esc(d.goal)+'</p></div>';
  h+='<div class="card"><b>'+u('deepEx')+'</b>';
  d.ex.forEach(function(e,n){h+='<div class="notice" style="margin-top:10px"><div class="small">'+(n+1)+'. '+esc(e.t)+'</div><p style="margin:6px 0">&quot;'+esc(e.a)+'&quot;</p><div class="small"><b>'+u('deepWhy')+'</b> '+esc(e.why)+'</div></div>'});
  h+='</div><div class="card"><b>'+u('deepWeak')+'</b><div class="notice" style="margin-top:10px"><p style="margin:0 0 6px">&quot;'+esc(d.weak.a)+'&quot;</p><div class="small">'+esc(d.weak.why)+'</div></div></div>';
  h+='<div class="card"><b>'+u('deepCheck')+'</b><ul style="margin:8px 0 0;padding-inline-start:20px">'+d.checks.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul></div>';
  h+='<div class="card"><b>'+u('deepNext')+'</b><p style="margin:8px 0 0">'+esc(d.next[gk()==='f'?'f':'m'])+'</p></div>';
  return h;
}
function vSay(){
  if(!hasAccess())return '<main>'+pendingNotice()+'</main>';
  var list=CARDS.filter(function(c){return c.tr===V.filter});if(V.card>=list.length)V.card=0;var c=list[V.card],id=c.k;
  var saved=S.saved.indexOf(id)>-1;
  var h='<h1 style="font-size:24px">'+u('sayTitle')+'</h1><div class="seg">'+
   [['he','עברית'],['en','אנגלית'],['il','אנגלית של ישראלים']].map(function(x){return '<button class="chip" data-a="filter" data-id="'+x[0]+'" aria-pressed="'+(V.filter===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
   '<div class="small">'+c.ctx+' · כרטיס '+(V.card+1)+' מתוך '+list.length+'</div>'+
   '<div class="card"><div class="small">במקום להגיד</div><div class="say-bad" '+(c.tr!=='he'?'dir="ltr" style="text-align:left"':'')+'>'+esc(g(c.bad))+'</div></div>';
  if(V.reveal)h+='<div class="say-good"><div class="small" style="color:inherit;opacity:.9">'+u('say')+'</div><b '+(c.tr!=='he'?'dir="ltr" style="text-align:left"':'')+'>'+esc(g(c.good))+'</b><span class="status" style="background:rgba(255,255,255,.2);align-self:flex-start">משדר: '+esc(c.tag)+'</span></div>';
  else h+='<button class="btn primary" data-a="reveal">'+u('reveal')+'</button>';
  var lang=c.tr==='he'?'he-IL':'en-US',on=V.listening&&V.mode==='card';
  h+='<div class="row wrap">'+spk(g(c.good),lang,u('readGood'),'card-'+('00'+(CARDS.indexOf(c)+1)).slice(-3)+'-good')+'</div>'+
   '<div class="card"><div class="row"><span style="color:var(--warm)">'+ic('mic')+'</span><span class="grow"><b>'+u('sayAloud')+'</b><div class="small">'+u('saySub')+'</div></span></div>'+
   (IOS?'<div class="notice" role="note" style="margin-top:10px">'+u('iosSay')+'</div><label class="small" for="saidin" style="display:block;margin-top:8px">מה אמרת</label><input type="text" id="saidin" value="'+esc(V.said)+'" '+(c.tr!=='he'?'dir="ltr" style="text-align:left"':'')+'><button class="btn primary" data-a="check" style="margin-top:10px;width:100%">'+u('check')+'</button>':'<button class="btn '+(on?'dark':'primary')+'" data-a="say" style="margin-top:10px;width:100%">'+(on?u('stopRec'):u('rec'))+'</button>')+
   (V.said||on?'<div style="margin-top:10px"><div class="small">מה שאמרת</div><div id="said" '+(c.tr!=='he'?'dir="ltr" style="text-align:left"':'')+'>'+esc(V.said)+'</div>'+(V.score!==null&&!on?'<div class="small" style="margin-top:6px">התאמה למשפט: <b>'+V.score+'%</b>'+(V.score>=80?' מצוין.':V.score>=50?u('near'):u('low'))+'</div>':'')+'</div>':'')+'</div>'+
   (V.msg?'<div class="notice" role="status">'+V.msg+'</div>':'')+
   '<div class="row"><button class="btn grow" data-a="save">'+(saved?'נשמר לחזרה':u('saveCard'))+'</button><button class="btn dark grow" data-a="nextcard">הבא</button></div>';
  return '<main>'+h+'</main>';
}
function vMe(){
  var acc=hasAccess(),t=today();
  var label=S.role==='owner'?'בעלים · גישה קבועה':S.purchased?'מנוי פעיל':acc?u('roleBeta'):'ממתין לרכישה';
  var h='<div class="top"><h1 style="font-size:24px">החשבון שלי</h1><button class="themebtn" data-a="theme">מצב כהה/בהיר</button></div>'+
   '<div class="card"><div class="row"><span class="grow"><b>סטטוס</b></span><span class="status '+(acc?'s-ok':'s-wait')+'">'+label+'</span></div>'+
   (S.role!=='owner'&&!S.purchased?'<div class="small" style="margin-top:6px">סיום תקופת הבדיקה: '+S.betaEnd+(S.extendedUntil?' · הוארך עד '+S.extendedUntil:'')+'</div>':'')+'</div>';
  if(!acc)h+='<div class="notice"><b>תקופת הבדיקה הסתיימה</b><div style="margin-top:4px">החשבון וההתקדמות שלך שמורים. אחרי הרכישה הכול חוזר מיד, בדיוק איפה שעצרת.</div></div>';
  if(S.role!=='owner'&&!S.purchased&&(S.paySwitch!=='off'||!acc)){
    h+='<h2 style="font-size:18px">'+u('choosePlan')+'</h2><div>';
    PLANS.forEach(function(p){h+='<button class="plan" data-a="plan" data-id="'+p.id+'" aria-pressed="'+(V.plan===p.id)+'"><span class="grow"><b style="font-size:17px">'+p.name+'</b><div class="small">'+p.per+' ₪ לחודש</div></span><b>'+p.price+' ₪</b></button>'});
    h+='</div><div class="small">אמצעי תשלום</div><div class="seg" style="flex-wrap:wrap">'+[['bit','ביט'],['card','כרטיס אשראי'],['apple','Apple Pay'],['google','Google Pay']].map(function(x){return '<button class="chip" data-a="method" data-id="'+x[0]+'" aria-pressed="'+(V.method===x[0])+'">'+x[1]+(x[0]==='bit'?' · מומלץ':'')+'</button>'}).join('')+'</div><div class="small">המחיר כולל מע"מ. עמלת הסליקה חלה על הרוכש ותוצג בקופה לפני התשלום (כפוף לבדיקה משפטית).</div><button class="btn primary" data-a="buy">'+u('payGo')+({bit:'ביט',card:'כרטיס אשראי',apple:'Apple Pay',google:'Google Pay'}[V.method])+'</button>';
    if(V.notice)h+='<div class="notice" role="status">'+V.notice+'</div>';
  }
  h+='<div class="card" style="border-style:dashed"><b>לוח בדיקה</b><div class="small">רק בהדמיה: מדמה את מתג התשלום ואת פעולות הבעלים בדשבורד.</div>'+
   '<div style="margin-top:10px" class="small">מתג תשלום</div><div class="seg">'+[['off','כבוי'],['testers','בודקים בלבד'],['active','פעיל']].map(function(x){return '<button class="chip" data-a="sw" data-id="'+x[0]+'" aria-pressed="'+(S.paySwitch===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
   '<div style="margin-top:10px" class="small">מגדר (לשון הפנייה)</div><div class="seg">'+[['m','גבר'],['f','אישה']].map(function(x){return '<button class="chip" data-a="gender" data-id="'+x[0]+'" aria-pressed="'+(S.gender===x[0])+'">'+x[1]+'</button>'}).join('')+'</div><div style="margin-top:10px" class="small">תפקיד</div><div class="seg">'+[['beta',u('roleBeta')],['owner','בעלים']].map(function(x){return '<button class="chip" data-a="role" data-id="'+x[0]+'" aria-pressed="'+(S.role===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
   '<div style="margin-top:10px" class="row wrap"><button class="btn grow" data-a="expire">'+u('expire')+'</button></div>'+
   '<div style="margin-top:10px"><label class="small" for="ext">הארכת תוקף עד תאריך</label><div class="row"><input type="date" id="ext" min="'+t+'" value="'+(S.extendedUntil||addDays(30))+'" class="grow"><button class="btn primary" data-a="extend">'+u('extend')+'</button></div></div>'+
   '<div style="margin-top:10px"><button class="btn" data-a="reset">איפוס כל הנתונים</button></div></div>';
  return '<main>'+h+'</main>';
}
function tabs(){
  var T=[['home','בית','home'],['lessons','שיעורים','book'],['say',u('tabSay'),'chat'],['me','אני','user']];
  return '<nav class="tabs" aria-label="ניווט ראשי"><div class="in">'+T.map(function(x){return '<button class="tab" data-a="tab" data-id="'+x[0]+'"'+(V.tab===x[0]?' aria-current="page"':'')+'>'+ic(x[2])+x[1]+'</button>'}).join('')+'</div></nav>';
}
function render(){
  var app=document.getElementById('app'),ae=document.activeElement,keep=ae&&ae.id==='ans'?ae.value:null;
  var body=!S.quizDone?vQuiz():V.tab==='home'?vHome():V.tab==='lessons'?vLessons():V.tab==='say'?vSay():vMe();
  app.innerHTML=body+(S.quizDone?tabs():'');
  if(IOS){var mb=document.querySelectorAll('[data-a="dict"]');for(var q=0;q<mb.length;q++)mb[q].remove()}
  var a=document.getElementById('ans');if(a&&keep!==null){a.focus();}
  document.title='צעד קדימה';
}

/* ---------- actions ---------- */
function streakDone(){var t=today();if(S.last===t)return;S.streak=(S.last===addDays(-1))?S.streak+1:1;S.last=t}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,i=+b.dataset.i;
  if(a==='pick'){S.quiz[V.qi]=i;if(V.qi===0)S.gender=i===0?'m':'f';if(V.qi===1)S.journey=['ch','th','br','tr','ld'][i];V.qi++;if(V.qi>=4){S.quizDone=true;V.qi=0}save()}
  else if(a==='tab'){stopVoice();V.said='';V.score=null;V.msg='';V.tab=id;V.lesson=null;V.notice=''}
  else if(a==='journey'){S.journey=id;save()}
  else if(a==='start'){V.tab='lessons';V.lesson={j:S.journey,i:i};V.step=0;V.answer='';V.feedback=null;if(!hasAccess()){V.lesson=null}}
  else if(a==='open'){V.lesson={j:b.dataset.j,i:i};V.step=0;V.answer='';V.feedback=null}
  else if(a==='back'){V.lesson=null}
  else if(a==='next'){
    stopVoice();V.msg='';var ta=document.getElementById('ans');if(ta)V.answer=ta.value;
    if(V.step===1)V.feedback=null;
    if(V.step===3){S.done[V.lesson.j+V.lesson.i]=true;streakDone();save();V.lesson=null;V.tab='home'}else V.step++;
  }
  else if(a==='filter'){stopVoice();V.filter=id;V.card=0;V.reveal=false;V.said='';V.score=null;V.msg=''}
  else if(a==='reveal'){V.reveal=true}
  else if(a==='nextcard'){stopVoice();V.card++;V.reveal=false;V.said='';V.score=null;V.msg=''}
  else if(a==='save'){var l=CARDS.filter(function(c){return c.tr===V.filter})[V.card];var k=S.saved.indexOf(l.k);if(k>-1)S.saved.splice(k,1);else S.saved.push(l.k);save()}
  else if(a==='plan'){V.plan=id}
  else if(a==='gender'){stopVoice();S.gender=id;save()}
  else if(a==='check'){var lc=CARDS.filter(function(c){return c.tr===V.filter})[V.card],iv=document.getElementById('saidin');V.said=iv?iv.value.trim():'';V.score=V.said?similarity(g(lc.good),V.said):null}
  else if(a==='speak'){V.msg='';if(!playClip(b.dataset.aid,b.dataset.t,b.dataset.l))speak(b.dataset.t,b.dataset.l)}
  else if(a==='dict'){if(V.listening&&V.mode==='dict'){stopVoice()}else{listen('he-IL','dict','');return}}
  else if(a==='say'){var ls=CARDS.filter(function(c){return c.tr===V.filter})[V.card];if(V.listening&&V.mode==='card'){stopVoice()}else{listen(ls.tr==='he'?'he-IL':'en-US','card',g(ls.good));return}}
  else if(a==='method'){V.method=id}
  else if(a==='buy'){V.notice='בהדמיה התשלום לא מחובר. בגרסה האמיתית כאן נפתחת קופה של ספק הסליקה, עם הסכום הסופי כולל עמלה.'}
  else if(a==='sw'){S.paySwitch=id;save()}
  else if(a==='role'){S.role=id;save()}
  else if(a==='expire'){S.betaEnd=addDays(-1);S.extendedUntil='';save()}
  else if(a==='extend'){var v=document.getElementById('ext').value;if(v&&v>=today()){S.extendedUntil=v;save()}}
  else if(a==='theme'){var r=document.documentElement,d=r.getAttribute('data-theme');var dark=d?d==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')}
  else if(a==='reset'){try{localStorage.removeItem(KEY)}catch(x){}location.reload();return}
  render();
});
render();
</script>
