אינו תמיד טוב יותר. בדיקה של שלושים שניות חוסכת שעה של עריכה על פוסט שאף אחד לא צריך, ומשאירה זמן לרעיונות שבאמת קשורים לקהל. הרגל כזה מקצר את זמן ההפקה, כי נשארים רק רעיונות שכבר עברו סינון.","ex":[{"t":"יועצת פנסיה","a":"הרעיון: \"מה זו קרן השתלמות\". הקהל שלי שואל על זה כל חודש, יש לי דוגמה של לקוח שחסך 12 אלף שקל, וכותרת של משפט אחד: \"קרן השתלמות היא חיסכון עם הטבת מס\".","why":"הרעיון עונה על שאלה אמיתית, יש תוספת אישית מהשטח, והוא מסתכם במשפט."},{"t":"מורה פרטי למתמטיקה","a":"הרעיון: \"עשר שיטות ללמוד לבגרות\". הקהל כבר ראה את זה מאה פעמים, ואין לי מה להוסיף. אחתוך אותו ואכתוב על טעות אחת שראיתי אצל עשרים תלמידים.","why":"הבדיקה הובילה לדחייה ולהחלפה ברעיון חד יותר שנשען על ניסיון אישי."}],"weak":{"a":"הרעיון נראה לי מעניין ולכן אפרסם אותו.","why":"\"נראה לי\" הוא לא קריטריון. אין כאן בדיקה מול הקהל, תוספת אישית או ניסוח במשפט אחד."},"checks":["האם הקהל נתקל בבעיה הזאת בפועל?","האם יש כאן תוספת אישית שאין אצל אחרים?","האם אפשר לסכם את הרעיון במשפט אחד?","האם רעיון שלא עמד בבדיקה נדחה בפועל?"],"next":{"m":"הרץ את שלושת הבדיקות על כל רעיון ברשימה שלך, ומחק לפחות אחד.","f":"הריצי את שלושת הבדיקות על כל רעיון ברשימה שלך, ומחקי לפחות אחד."}},"br-12":{"goal":"אנשים לא צריכים עוד ידע, הם צריכים תשובה שאפשר ליישם. סדר קבוע של תשובה, הסבר ודוגמה הופך כל שאלה מהשטח לפוסט שלם בלי הרבה מאמץ. שאלות מלקוחות מחכות לכם בוואטסאפ ובמיילים, ואין צורך להמציא נושאים.","ex":[{"t":"רופאת שיניים","a":"שאלה: \"כמה פעמים לצחצח?\". תשובה: פעמיים ביום. הסבר: כל לילה נוצר רובד חדש. דוגמה: מטופל שהפסיק בלילה וקיבל שלוש עששות בשנה.","why":"התשובה קצרה בהתחלה, ההסבר פשוט, והדוגמה מביאה את זה לחיים."},{"t":"מתווך דירות","a":"שאלה: \"האם להוריד מחיר?\". תשובה: אחרי שלושה שבועות בלי הצעות, כן. הסבר: מחיר גבוה מרחיק קונים. דוגמה: דירה ברמת גן ירדה ב-50 אלף ונמכרה תוך שבוע.","why":"יש הכרעה ברורה, סיבה והדוגמה כוללת מספר מהשטח."}],"weak":{"a":"אכתוב פוסט ארוך שמסביר כל מה שצריך לדעת על ביטוח, בכל התחומים.","why":"הנושא רחב מדי. אין שאלה אחת, אין תשובה ברורה, והקורא לא יסיים לקרוא."},"checks":["האם הפוסט עונה על שאלה אחת בלבד?","האם התשובה מופיעה בשורה הראשונה?","האם יש דוגמה אחת מהחיים?","האם הנושא נולד משאלה אמיתית של לקוח?"],"next":{"m":"פתח את וואטסאפ, ובחר שאלה אחת מלקוח מהחודש האחרון שתהפוך לפוסט.","f":"פתחי את וואטסאפ, ובחרי שאלה אחת מלקוח מהחודש האחרון שתהפוך לפוסט."}},"br-13":{"goal":"צילום חלש גורם לתוכן טוב להיראות לא מקצועי. אור וגובה נכונים הם הבדל גלוי לעין תוך שניות, וגם נותנים לצופה תחושה שמי שמולו מכבד אותו. הבדל קטן בשעה או בגובה נראה מיד, ולא דורש כסף או ציוד.","ex":[{"t":"יועצת עסקית שמצלמת בבית","a":"אצלם ליד חלון הסלון בשעה עשר בבוקר, כשהאור חזק. אניח את הטלפון על ערימת ספרים בגובה העיניים, אנגב את העדשה בחולצה ואסדר את הכורסה שברקע.","why":"האור, הגובה והרקע מוגדרים, ויש פעולה קטנה של ניקוי שקל לשכוח."},{"t":"מדריך טיולים בחוץ","a":"אצלם בחוץ בשעה שלפני השקיעה, עם השמש מלפנים ולא מאחור. אשען עם הטלפון על סלע בגובה העיניים, כדי שהוא יישאר יציב.","why":"יש בחירה של שעה ומקור אור, וגם פתרון יציב בלי חצובה."}],"weak":{"a":"אצלם איפה שנוח, עם מה שיש בבית, ובכל שעה שיתאפשר.","why":"אין כאן החלטה על אור, גובה או רקע. \"איפה שנוח\" לרוב אומר תאורת תקרה מעיקה וצילום מלמעלה."},"checks":["האם האור מגיע מלפנים ולא מאחור?","האם הטלפון בגובה העיניים?","האם הרקע מסודר ולא מסיח את הדעת?","האם העדשה נקייה?"],"next":{"m":"לפני הצילום הבא עמוד ליד החלון, הנח את הטלפון בגובה העיניים וצלם ניסיון של עשר שניות.","f":"לפני הצילום הבא עמדי ליד החלון, הניחי את הטלפון בגובה העיניים וצלמי ניסיון של עשר שניות."}},"br-14":{"goal":"סרטון בלי מבנה נמתח וצופים עוזבים. כשהמבנה ברור ואין מילים מיותרות, הקלטה אחת מספיקה, ואפשר להפיק סרטון ממשי בעשר דקות במקום בשעה. סרטון שנכתב מראש גם מצולם מהר יותר, וקל יותר לחזור עליו בטייק שני.","ex":[{"t":"מאמנת קריירה","a":"פתיחה: ראיון עבודה נפל בגלל משפט אחד. נקודה: אל תגידו שאתם מושלמים. נקודה: ספרו על טעות ומה למדתם. נקודה: סיימו בשאלה. סיום: רוצים תרגול? כתבו לי.","why":"הסרטון מתחיל בעניין, כולל שלוש נקודות קצרות וקריאה לפעולה בסוף."},{"t":"מאמן ריצה","a":"פתיחה: שלוש טעויות שגורמות לכאב בברכיים. נקודה: נעליים ישנות. נקודה: צעדים ארוכים. נקודה: אין חימום. סיום: שמרו את הסרטון לריצה הבאה.","why":"המספר שלוש מבטיח אורך ידוע, ובסוף יש סיכום עם פעולה."}],"weak":{"a":"אצלם את עצמי מדבר חופשי על הנושא ואחבר את מה שיצא.","why":"אין מבנה ואין תסריט. סרטונים כאלה נוטים להתארך וצופים לא מבינים מה העיקר."},"checks":["האם יש משפט אחד לכל חלק?","האם הסרטון מתחיל בהוק ולא בהקדמה?","האם הוא קצר מ-45 שניות?","האם יש רעיון אחד בלבד?"],"next":{"m":"הקלט את הסרטון היום, בטייק אחד לכל היותר שניים, ושמור אותו גם אם אינו מושלם.","f":"הקליטי את הסרטון היום, בטייק אחד לכל היותר שניים, ושמרי אותו גם אם אינו מושלם."}},"br-15":{"goal":"עריכה טובה אינה מורגשת. כשהקצב מהיר והטקסט נראה על המסך, הצופה נשאר גם בלי קול, וזו הדרך הכי קלה לשפר סרטון שכבר צולם. אפליקציות חינמיות כמו CapCut מספיקות לכל הפעולות האלה.","ex":[{"t":"סרטון של מעצבת פנים","a":"אחתוך את ההתחלה עד המשפט הראשון, אוריד שתיקות של יותר משנייה, אוסיף כתוביות בגוף גדול בחלק התחתון, ואשים מוזיקה בעוצמה של 10 אחוז.","why":"כל פעולה ספציפית וניתנת לביצוע, ויש גם רמה מספרית למוזיקה."},{"t":"סרטון של יועץ ביטוח","a":"אחתוך את כל ה\"אהההה\", אוסיף כתוביות עם שלוש מילים מודגשות בצהוב, ואסיים את הסרטון שנייה אחרי המשפט האחרון בלי שקט ארוך.","why":"יש טיפול גם בקצב וגם בכתוביות, והסיום מוגדר."}],"weak":{"a":"אשפר את הסרטון קצת, אוסיף אפקטים יפים ומעברים כדי שיראה מקצועי.","why":"אפקטים ומעברים מקשים על הצפייה ומסיחים מהמסר. חסר חיתוך של שתיקות וכתוביות, שהם מה שבאמת משפר."},"checks":["האם הוסרו שתיקות ושגיאות?","האם יש כתוביות קריאות?","האם המוזיקה שקטה מהדיבור?","האם הסרטון נגמר מיד אחרי המשפט האחרון?"],"next":{"m":"פתח סרטון ישן וחתוך ממנו את כל הרגעים שבהם לא קורה כלום, והשווה את שני האורכים.","f":"פתחי סרטון ישן וחתכי ממנו את כל הרגעים שבהם לא קורה כלום, והשווי את שני האורכים."}},"br-16":{"goal":"בפיד אנשים קוראים שורה או שתיים. כיתוב עם מבנה פשוט מסייע לקורא לסרוק ולהבין, ושאלה בסוף מזמינה תגובה במקום שתיקה. הנוסחה פשוטה מספיק כדי לכתוב כיתוב תוך חמש דקות בלי לחשוב מחדש, וכך גם ביום עמוס עדיין מפרסמים בקצב קבוע.","ex":[{"t":"שרברב שמפרסם תמונה","a":"מים בקיר? שלושה סימנים שהצנרת בסכנה. כתם על הקיר. ריח של רטיבות. חשבון מים גבוה. מי נתקל באחד מהם?","why":"הפתיחה היא שאלה, הרשימה קצרה והסיום מזמין תגובה."},{"t":"מאמנת תזונה","a":"\"אני לא אוכלת אחרי שש\" לא עובד. מה כן: ארוחת ערב עם חלבון. פרי אחד אחרי. מים ליד המיטה. איזה הרגל תנסו השבוע?","why":"הפתיחה מערערת על אמונה נפוצה, והפרטים מעשיים."}],"weak":{"a":"רגעים מיוחדים מהשבוע, תודה לכל מי שהיה שם, שבוע נהדר לכולם.","why":"אין תוכן ואין שאלה. הכיתוב עוסק במי שכתב ולא במה שהקורא יכול לקחת."},"checks":["האם המשפט הראשון עוצר גלילה?","האם כל שורה קצרה?","האם יש רווח בין פסקאות?","האם הכיתוב נגמר בשאלה או בבקשה?"],"next":{"m":"קח כיתוב ישן וכתוב אותו מחדש עם פתיחה, שלוש שורות ושאלה.","f":"קחי כיתוב ישן וכתבי אותו מחדש עם פתיחה, שלוש שורות ושאלה."}},"br-17":{"goal":"בלי בקשה, אנשים נהנים מהתוכן ומתקדמים הלאה. בקשה בודדת וקלה מאפשרת למדוד אם הקהל מוכן לעוד צעד, ומחברת בין תוכן לתוצאה אמיתית בעסק. גם שאלה פשוטה בתגובות נחשבת בקשה, ובמקרים רבים זה מספיק. מה שחשוב הוא שהבקשה חוזרת בכל פוסט, ושמודדים כמה אנשים נענו לה.","ex":[{"t":"עורכת דין לדיני משפחה","a":"רוצים שאשלח צ'קליסט של מסמכים לפני פגישה ראשונה? כתבו לי \"מסמכים\" ואשלח היום.","why":"הבקשה מפורשת, חינמית וקלה, ויש מילת מפתח אחת שקל להקליד."},{"t":"מאמן קבוצות ריצה","a":"מי מתכנן לרוץ ביום שישי? סמנו לייק, ואשלח לכם מסלול של חמישה קילומטר.","why":"הצעד הקטן מאוד, וההבטחה כוללת תוצר ברור."}],"weak":{"a":"אשמח לשמוע מה דעתכם, ואם מעניין אתכם, אפשר ליצור קשר, לעקוב, לשתף, ולבקר באתר.","why":"חמש בקשות שונות בבת אחת. כשמבקשים הכל, אף אחד לא יודע מה לעשות קודם."},"checks":["האם יש בקשה אחת בלבד?","האם הצעד קטן וקל לביצוע?","האם ברור מה יקבלו בתמורה?","האם ניסוח הבקשה מתחיל בפועל?"],"next":{"m":"הוסף קריאה אחת בסוף הפוסט הבא, וספור כמה אנשים ביצעו אותה.","f":"הוסיפי קריאה אחת בסוף הפוסט הבא, וספרי כמה אנשים ביצעו אותה."}},"br-18":{"goal":"עין מזהה דפוס מהר יותר מטקסט. עקביות בצבע וגופן בונה זיכרון, והחלטה חד-פעמית חוסכת זמן בכל פוסט, כי אין מה לחשוב על עיצוב מאפס. קל להחליט לפי מה שכבר קיים: הלוגו, הצבע של החנות או החולצה שאתם לובשים בסרטונים.","ex":[{"t":"יועצת עסקית","a":"ירוק כהה וקרם, גופן Rubik, כותרת גדולה במרכז, ושמי בפינה למטה בגודל קטן. אותו סדר בכל תמונה.","why":"יש צבעים, גופן וסדר קבוע, ולכן כל פוסט ייראה שייך לאותו מקום."},{"t":"חנות פרחים קטנה","a":"לבן ורוד ישן, גופן Assistant, תמונת פרח אחת למעלה, ושם החנות בתחתית. נשתמש בתבנית קבועה ב-Canva.","why":"יש תבנית ידועה מראש, כך שכל פוסט חדש לוקח דקות."}],"weak":{"a":"אשתמש בצבעים שיפים לי באותו יום ובגופן שנראה טוב.","why":"בלי כללים כל פוסט נראה אחרת, ואי אפשר לבנות זיהוי. חסרים ערכים קבועים."},"checks":["האם יש לכל היותר שני צבעים עיקריים?","האם יש גופן אחד?","האם מיקום הטקסט והלוגו קבוע?","האם ברור מהצד שזה אותו מותג?"],"next":{"m":"צור תבנית אחת ב-Canva או בכלי אחר, והשתמש בה בשלושת הפוסטים הקרובים.","f":"צרי תבנית אחת ב-Canva או בכלי אחר, והשתמשי בה בשלושת הפוסטים הקרובים."}},"br-19":{"goal":"אנשים לא רואים הכל. מי שראה את הסרטון לא קרא את הפוסט, ולכן שימוש חוזר הוא לא חזרתיות אלא חשיפה. תוכן אחד טוב שווה שבוע שלם בלי עבודה נוספת. כך אפשר לשמור על קצב קבוע גם בשבועות עמוסים.","ex":[{"t":"הרצאה על ניהול זמן","a":"סרטון ארוך של עשר דקות, קטע של 30 שניות על כלל השתי דקות, ציטוט \"מה שלא נכנס ליומן לא קורה\", פוסט על שלוש טעויות, ושאלה בסטורי: מה גוזל לכם זמן?","why":"יש חמש גרסאות שונות, כולן נולדו מאותה הרצאה וכל אחת מתאימה לפלטפורמה אחרת."},{"t":"פגישת לקוח (בהסכמה ובלי שמות)","a":"מהפגישה: ציטוט ללא שם, פוסט שסוגר שאלה נפוצה, סרטון קצר של התשובה, גרף עם מספר, וסטורי עם הצבעה בין שתי אפשרויות.","why":"הפגישה היא מקור לחמישה חלקים, והפרטיות של הלקוח נשמרת."}],"weak":{"a":"אפרסם את הסרטון בכל הפלטפורמות, אותו דבר בדיוק.","why":"זה פרסום חוזר ולא עיבוד. כל פלטפורמה דורשת פורמט ואורך אחרים, ולכן התוצאה חלשה."},"checks":["האם יש חמש גרסאות שונות?","האם כל גרסה מתאימה לפלטפורמה שלה?","האם הגרסאות נבנו מאותו מקור?","האם מופיעה בכל גרסה בקשה או שאלה?"],"next":{"m":"קח סרטון או פוסט שעבד טוב, והפוך אותו השבוע לשלוש גרסאות נוספות לפחות.","f":"קחי סרטון או פוסט שעבד טוב, והפכי אותו השבוע לשלוש גרסאות נוספות לפחות."}},"br-20":{"goal":"אנשים זוכרים מי ענה להם. שיחה קצרה בתגובות הופכת עוקב אנונימי למישהו שמכיר אותך, והאלגוריתם רואה שהפוסט מעורר שיח ומראה אותו עוד קצת. כדאי לקבוע שעה קבועה ביום לתגובות, כדי שזה לא ייגרר לכל היום. התחילו מהתגובות של האנשים שחוזרים אליכם, כי הם אלה שבונים קהילה.","ex":[{"t":"תגובה לשאלה בפוסט","a":"דנה, שאלה טובה. בחוזה כזה בודקים קודם את סעיף היציאה. חתמת כבר, או רק מתלבטת?","why":"יש שם, תשובה קצרה ושאלה שפותחת שיחה."},{"t":"תגובה לביקורת על מחיר","a":"יוסי, תודה שכתבת. המחיר כולל ליווי של שלושה חודשים. מה היית מצפה לקבל בתמורה?","why":"התגובה לא מתגוננת, מציגה מידע ומזמינה שיחה."}],"weak":{"a":"תודה רבה!!","why":"תגובה נחמדה אבל סגורה. אין שם, אין פרט ואין שאלה, ולכן השיחה נגמרת."},"checks":["האם התגובה מתחילה בשם?","האם יש בה פרט שמראה שקראתי?","האם יש שאלה פתוחה אחת?","האם ענו בתוך יום?"],"next":{"m":"הקדש היום עשר דקות לענות על חמש תגובות אחרונות, כל אחת עם שם ושאלה.","f":"הקדישי היום עשר דקות לענות על חמש תגובות אחרונות, כל אחת עם שם ושאלה."}},"br-21":{"goal":"עוקבים הם קהל, וחברי קהילה הם אנשים שחוזרים. טקס קבוע יוצר הרגל, והרגל יוצר שייכות. מי ששייך קונה, ממליץ ומחזיר עוד אנשים. קבוצה קטנה ופעילה שווה יותר מקבוצה גדולה שלא מגיבה.","ex":[{"t":"מאמנת ריצה","a":"קבוצת וואטסאפ של 25 רצים. כל יום ראשון אפרסם מסלול. בסוף החודש נרוץ יחד בפארק. מי שרץ מדווח במשפט אחד.","why":"יש גודל התחלה ריאלי, טקס שבועי ומפגש חודשי."},{"t":"יועץ פיננסי","a":"קבוצת טלגרם סגורה ללקוחות, ובה שאלה אחת בכל יום חמישי: \"מה החלטתם השבוע על הכסף שלכם?\". בסוף כל רבעון נקיים שיחה משותפת של חצי שעה.","why":"הנושא ממוקד, והמפגש הרבעוני מקרב אנשים."}],"weak":{"a":"אפתח קבוצה ואפרסם בה מדי פעם תוכן חדש. מי שרוצה יצטרף.","why":"אין סיבה לחזור. בלי טקס קבוע, בלי שאלה ובלי מפגש, קבוצה כזו מתמלאת בהודעות פרסום ודועכת."},"checks":["האם יש טקס קבוע עם יום ושעה?","האם הקבוצה קטנה מספיק כדי להכיר זה את זה?","האם ברור למה כל אחד מצטרף?","האם החברים מדברים זה עם זה ולא רק איתי?"],"next":{"m":"הזמן עשרה אנשים שמכירים אותך לקבוצה קטנה, ופתח אותה בשאלה אחת.","f":"הזמיני עשרה אנשים שמכירים אותך לקבוצה קטנה, ופתחי אותה בשאלה אחת."}},"br-22":{"goal":"ביקורת פומבית נקראת גם על ידי אחרים. תגובה רגועה ועניינית מראה מקצועיות, ויכולה להפוך מבקר מאוכזב ללקוח, בלי להתפשר על ערכים או מחיר. תשובה אחת טובה נקראת גם על ידי מי שלא כתב, וזה הקהל האמיתי שלה.","ex":[{"t":"ביקורת על זמן המתנה","a":"תודה על המשוב, רונית. זמן ההמתנה באמת היה ארוך השבוע בגלל שני עובדים שחלו. הוספנו משמרת, ושלחתי לך הודעה בפרטי.","why":"יש הכרה בבעיה, הסבר קצר ופעולה, והשיחה ממשיכה בפרטי."},{"t":"הערה על דיוק מקצועי","a":"יוסי, שאלה נכונה. טעיתי בנוסח וכבר תיקנתי בפוסט. תודה על ההערה.","why":"הודאה מהירה בטעות בונה אמינות ומקצרת את השיח."}],"weak":{"a":"אענה מיד, אסביר למה הוא טועה ואוכיח שיש לי הרבה לקוחות מרוצים.","why":"תגובה מתגוננת מדליקה את הוויכוח וגם מעודדת אחרים להצטרף אליו. אין כאן הכרה, ושעת הכעס שולטת בתוכן."},"checks":["האם הביקורת סווגה לפני התגובה?","האם יש הכרה במה שנכון בה?","האם התגובה מדברת בנימה רגועה?","האם המשך השיחה עבר לפרטי?"],"next":{"m":"קבע לעצמך כלל: לא עונים לביקורת לפני שעבר לפחות שעה מהקריאה הראשונה.","f":"קבעי לעצמך כלל: לא עונים לביקורת לפני שעבר לפחות שעה מהקריאה הראשונה."}},"br-23":{"goal":"שיתוף פעולה חושף אותך לקהל שכבר סומך על מישהו אחר. הצעה מדויקת וקטנה נענית בקלות, והיא גם מראה שאפשר לעבוד איתך בלי לבזבז זמן. קל יותר לקבל כן כשהבקשה קטנה ומוגדרת, וכשברור שהצד השני מרוויח גם כן.","ex":[{"t":"יועצת פנסיה ומתווך משכנתאות","a":"הצעה: מפגש משותף בזום של 30 דקות ב-12 לחודש על מה לבדוק לפני שרוכשים דירה. כל אחת מביאה לפחות 20 משתתפים, ואני אנהל.","why":"שני העסקים משלימים, והמבנה ברור: מי מביא מה, מתי ובאיזה אורך."},{"t":"מאמן ריצה ופיזיותרפיסטית","a":"פוסט משותף ב-10 לחודש: חמש תרגילי חימום לפני ריצה. כל אחד שולח לקהל שלו, ואחרי שבועיים נשווה כמה פניות קיבלנו.","why":"הפעולה קטנה, יש תאריך, ויש גם דרך למדוד את התוצאה."}],"weak":{"a":"נעשה משהו ביחד פעם, הקהלים שלנו יכולים להתאים. שווה לחשוב על זה.","why":"אין הצעה ממשית. כל צעד נשאר פתוח, והצד השני צריך להמציא את המבנה בעצמו."},"checks":["האם הקהל של השותף דומה לשלי?","האם השירות שלו משלים ולא מתחרה?","האם ברור מה כל צד נותן ומקבל?","האם יש תאריך ופעולה אחת?"],"next":{"m":"שלח היום את ההצעה לאדם אחד בלבד, והוסף בה תאריך מוצע.","f":"שלחי היום את ההצעה לאדם אחד בלבד, והוסיפי בה תאריך מוצע."}},"br-24":{"goal":"רוב התוכן מדבר לאנשים שלא מכירים, ולכן מי ששוקל לא מקבל את ההוכחה שהוא צריך, ומי שקנה לא מקבל הסבר. מאזנים בין השלבים כדי שהלקוחות ימשיכו קדימה. רשימה פשוטה של שלושה שלבים מספיקה כדי לגלות איזה שלב חסר אצלך.","ex":[{"t":"מאמנת כושר","a":"לא מכיר: פוסט על טעויות בחדר כושר. שוקל: תוצאות של שלוש מתאמנות. קנה: תוכנית שבוע ראשון וסרטון של התרגילים, ובסוף בקשה להמלצה.","why":"יש תוכן שונה לכל שלב, והלקוח שקנה לא נשכח."},{"t":"חברת ביטוח","a":"לא מכיר: מה מכסה ביטוח דירה. שוקל: מקרה תביעה ששולם בשבועיים. קנה: איך מגישים תביעה בשלושה צעדים ומי לפנות אליו.","why":"הוכחה לשוקלים והדרכה למי שקנה, ושניהם בנויים על מקרים אמיתיים."}],"weak":{"a":"כל התוכן שלי כולל מבצע, כי רוצים שיקנו.","why":"מי שלא מכיר לא קונה מפרסומת ראשונה, והלקוח הקיים לא מקבל שום דבר. חסר איזון בין השלבים."},"checks":["האם יש תוכן לכל שלושת השלבים?","האם התוכן לשוקלים כולל הוכחה?","האם יש תוכן ללקוח שכבר קנה?","האם תוכן המבצעים מופיע לאחר ערך ולא לפניו?"],"next":{"m":"ספור כמה מ-10 הפוסטים האחרונים שלך מדברים לכל שלב, וכתוב את זה שחסר.","f":"ספרי כמה מ-10 הפוסטים האחרונים שלך מדברים לכל שלב, וכתבי את זה שחסר."}},"br-25":{"goal":"פוסטים נעלמים בפיד תוך שעות, אבל מייל נשאר בתיבה. רשימת מנויים היא נכס שאפשר לקחת לכל מקום, והמנויים בחרו להיות שם, ולכן הם מוכנים יותר לפעולה. מי שנרשם מרצון הוא קהל חם, ולכן כדאי לכתוב אליו כמו לחבר ולא כמו לקהל.","ex":[{"t":"יועצת תזונה","a":"נושא: מה לאכול לפני אימון בבוקר. נקודות: ארוחה קלה, שתייה, זמן. צעד: ענו ואספר איזו ארוחה התאימה ללקוחות שלי.","why":"הנושא עונה על שאלה, יש שלוש נקודות והצעד אחד ופשוט."},{"t":"רואה חשבון","a":"נושא: שלוש הוצאות שאפשר לדווח. נקודות: טלפון, רכב, השתלמות. צעד: שלחו לי חשבונית אחת ואבדוק אותה.","why":"הנושא ספציפי, הנקודות קונקרטיות והצעד מזמין שיחה."}],"weak":{"a":"נושא: ניוזלטר חודשי. בפנים: חדשות, עדכונים ומבצעים.","why":"הנושא אינו מבטיח כלום, והתוכן הוא אוסף של עדכונים ולא שאלה אחת שהמייל פותר."},"checks":["האם הנושא מסביר מה יש במייל?","האם יש נושא אחד בלבד?","האם יש שלוש נקודות קצרות?","האם יש צעד אחד בסוף?"],"next":{"m":"הוסף לפרופיל שלך קישור להרשמה, ושלח את המייל הראשון תוך שבוע.","f":"הוסיפי לפרופיל שלך קישור להרשמה, ושלחי את המייל הראשון תוך שבוע."}},"br-26":{"goal":"מדדי ראווה כמו לייקים נותנים הרגשה טובה אבל לא מספרים אם העסק גדל. מדד שקשור לפעולה מחבר בין מה שמפרסמים לבין מה שקורה בקופה, ומאפשר החלטות בלי ניחושים. מספר שאי אפשר לפעול לפיו הוא סתם נתון, גם אם הוא גדול.","ex":[{"t":"עורכת דין","a":"פניות בשבוע, שיחות שנקבעו ולקוחות חדשים. אם הפניות נמוכות משלוש, אפרסם פעמיים בשבוע סיפור של לקוח.","why":"המדדים קשורים להכנסה, וגם יש תגובה ממשית לירידה."},{"t":"מאמן כושר","a":"מספר הודעות פרטיות, שיחות היכרות ומתאמנים חדשים. אם יש הרבה הודעות אך מעט שיחות, אקצר את התשובה ואציע ישר זמן לשיחה.","why":"הוא מזהה את הפער ויש לו פעולה מתאימה."}],"weak":{"a":"אבדוק כמה לייקים ועוקבים נוספו השבוע. אם זה עולה, כנראה הכיוון נכון.","why":"לייקים ועוקבים לא מראים שהתוכן הביא לקוחות. אין כאן החלטה או שינוי אם המספר יורד."},"checks":["האם המדדים קשורים לפעולה בעסק?","האם יש לכל היותר שלושה מדדים?","האם יש פעולה מוגדרת לירידה?","האם יש יום קבוע בשבוע לבדיקה?"],"next":{"m":"קבע ביומן עשר דקות קבועות בשבוע לבדיקת שלושת המדדים, ורשום מה שינית.","f":"קבעי ביומן עשר דקות קבועות בשבוע לבדיקת שלושת המדדים, ורשמי מה שינית."}},"br-27":{"goal":"לחץ מרחיק, ושקט מפסיד לקוחות. הודעה שמתחילה בבעיה של האדם ונותנת לו חופש לסרב מעוררת אמון, ומי שעונה כן מגיע מוכן יותר לשיחה. אדם שקיבל מקום לסרב נוטה להישאר בקשר, ולפעמים חוזר בעצמו אחרי חודש. כדאי גם לרשום מי אמר \"לא עכשיו\" ולחזור אליו בעוד חודש בהודעה קצרה.","ex":[{"t":"מאמנת עסקית","a":"שלום דנה, שמתי לב שאת מפרסמת פעמיים בשבוע ועדיין לא מקבלת פניות. זה מוכר לך? אפשר לדבר עשר דקות ואשתף מה עובד אצל אחרים.","why":"פתיחה בשם, תיאור בעיה אמיתית, שאלה והצעה קטנה בלי לחץ."},{"t":"יועץ ביטוח","a":"היי יוסי, הפוליסה שלך מתחדשת בחודש הבא. רוצה לבדוק ביחד אם אפשר לחסוך? אם לא רלוונטי, אין שום בעיה.","why":"יש עילה טבעית, בקשה קלה ומשפט שמוריד לחץ."}],"weak":{"a":"היי! יש לי מבצע מדהים לזמן מוגבל, רק עד מחר! תשובה עכשיו ותקבלו הנחה.","why":"הלחץ מרחיק. אין שאלה על הצורך שלו, ואין מקום ל\"לא\"."},"checks":["האם ההודעה מתחילה בבעיה של הלקוח?","האם יש שאלה על הרלוונטיות?","האם ההצעה קטנה וקלה?","האם יש מקום לסרב בלי אי נעימות?"],"next":{"m":"שלח היום הודעה כזו לאדם אחד שהביע עניין בעבר.","f":"שלחי היום הודעה כזו לאדם אחד שהביע עניין בעבר."}},"br-28":{"goal":"גבול ברור מגן על המשפחה ועל הלקוחות, ומאפשר לשתף בחופשיות את מה שכן מותר. מי שמחליט מראש לא צריך להתלבט מול כל פוסט. הרשימה אינה נחרטת באבן, ואפשר לעדכן אותה כשהחיים משתנים.","ex":[{"t":"יועצת שמשתפת על ילדים","a":"לא אשתף שמות או פנים של הילדים, וגם לא את בית הספר. כן אשתף סיפורים כלליים כמו \"הילד שלי שכח את התיק\" בלי פרטים מזהים.","why":"הגבול ברור, ועדיין נשאר מה לספר באופן חם."},{"t":"מאמן שעובד עם לקוחות","a":"לא אשתף תוצאות או צילומי מסך בלי אישור כתוב. כן אשתף מקרה כללי בלי שם, ואבקש מהלקוחות רשות לפני כל ציטוט.","why":"הגבול מגן על הלקוח, והבקשה לרשות כתובה מגינה על שני הצדדים."}],"weak":{"a":"אשתף מה שמרגיש לי נכון באותו רגע.","why":"תחושה משתנה לפי מצב רוח. אפשר להתחרט אחרי פרסום, ואי אפשר למחוק מה שכבר צולם והועבר הלאה."},"checks":["האם יש רשימה כתובה של נושאים סגורים?","האם הסיפורים המשותפים כבר נסגרו?","האם יש הסכמה כתובה ללקוחות שהוזכרו?","האם הפוסט יישאר מקובל גם בעוד עשר שנים?"],"next":{"m":"כתוב בהערות בטלפון את רשימת הגבולות, ובדוק אותה לפני כל פרסום.","f":"כתבי בהערות בטלפון את רשימת הגבולות, ובדקי אותה לפני כל פרסום."}},"tr-5":{"goal":"יומן הופך עסקאות למידע. הוא חושף דפוסים כמו כניסות בשעות עייפות או הזזת סטופ, שאי אפשר לזכור בעל פה. כדי שיתקיים, הרישום חייב להיות קצר.","ex":[{"t":"אחרי עסקה שנסגרה בהפסד","a":"אכתוב בטבלה: תאריך, סיבת כניסה במשפט אחד, מחיר סטופ, יעד, תוצאה ושורה על מה הרגשתי בכניסה. כל רישום ייקח פחות משתי דקות.","why":"השדות קבועים וקצרים, ולכן קל לעמוד בהם. שדה הרגש חושף דפוסים שהמספרים לבדם לא מראים."},{"t":"שבוע עמוס בעבודה","a":"אשמור בנייד תבנית של חמש שורות ואמלא אותה מיד אחרי הסגירה. ביום שישי בבוקר אקרא את כל הרישומים של השבוע.","why":"מילוי מיידי מונע שכחה, וקריאה שבועית קבועה הופכת את היומן לכלי עבודה ולא לארכיון."}],"weak":{"a":"אכתוב ביומן כל מה שקורה לי במסחר.","why":"אין מבנה ואין שדות קבועים, ולכן הרישום יהיה לא עקבי ויתיש מהר."},"checks":["האם יש רשימת שדות קבועה?","האם הרישום קצר מספיק כדי לבצע אותו בכל עסקה?","האם יש שדה על מצב רגשי?","האם נקבע מועד קבוע לקרוא את היומן?"],"next":{"m":"הכן היום גיליון או מחברת עם חמש עמודות ורשום בו את העסקה האחרונה שלך.","f":"הכיני היום גיליון או מחברת עם חמש עמודות ורשמי בו את העסקה האחרונה שלך."}},"tr-6":{"goal":"בלי תוכנית, כל תנועה בגרף נראית כהזדמנות. תוכנית טובה קצרה ומדידה, כך שאפשר לבדוק בסוף היום אם פעלו לפיה, גם כשהעסקה הפסידה.","ex":[{"t":"מסחר אחרי יום עבודה","a":"אכנס רק אם יש תרחיש כתוב לפני הכניסה, אסכן אחוז אחד מההון, אצא בסטופ שנקבע מראש ואפסיק לסחור אחרי שני הפסדים ברצף באותו יום.","why":"כל שורה ניתנת לבדיקה בכן או לא, ויש תנאי עצירה שמגן מפני יום רע שמתדרדר."},{"t":"סוף שבוע עם זמן פנוי","a":"אסחר רק בשני זמנים קבועים ביום, אכתוב את התרחיש בטלפון לפני כל עסקה, ולא אוסיף כסף לפוזיציה מפסידה בשום מצב.","why":"התוכנית מגבילה גם מתי סוחרים וגם התנהגות מסוכנת מסוימת, ולא רק את מה שנכנסים אליו."}],"weak":{"a":"אשתדל לסחור בצורה אחראית ולא להתלהב.","why":"אין כאן תנאי שאפשר לבדוק. אי אפשר לדעת בסוף היום אם הכוונה התקיימה."},"checks":["האם יש תנאי כניסה שאפשר לבדוק בכן או לא?","האם הסיכון לעסקה מוגדר במספר?","האם יש כלל יציאה ברור?","האם יש תנאי עצירה ליום?"],"next":{"m":"הדפס או העתק את התוכנית שכתבת והצמד אותה ליד המסך לפני הפעם הבאה שתסחר.","f":"הדפיסי או העתיקי את התוכנית שכתבת והצמידי אותה ליד המסך לפני הפעם הבאה שתסחרי."}},"tr-7":{"goal":"היחס מראה שאפשר להפסיד ברוב העסקאות ועדיין לא להפסיד כסף, וגם שיחס נמוך דורש אחוז הצלחה גבוה מאוד. הוא כלי תכנון ולא ערובה לתוצאה.","ex":[{"t":"חישוב לפני כניסה","a":"כניסה ב-100, סטופ ב-96, יעד ב-112. הסיכון 4 והתשואה הפוטנציאלית 12, יחס 1:3. עם 10 עסקאות ו-3 מוצלחות אני בערך באפס לפני עמלות.","why":"יש מחירים מלאים וחישוב מפורש, וגם בדיקה כמה הצלחות נדרשות כדי לא להפסיד."},{"t":"יעד קרוב מדי","a":"כניסה ב-200, סטופ ב-190, יעד ב-205. הסיכון 10 והתשואה 5, יחס 1:0.5. אצטרך להצליח ביותר משני שלישים מהעסקאות, ולכן אדלג על העסקה.","why":"הלומד מזהה יחס גרוע ובוחר לא לפעול, וזו תוצאה לגיטימית של חישוב."}],"weak":{"a":"אחפש עסקאות עם יחס טוב.","why":"לא מוגדר מה זה טוב ואין חישוב. בלי מספרים אי אפשר להשוות עסקאות."},"checks":["האם יש שלושה מחירים: כניסה, סטופ ויעד?","האם היחס חושב בחילוק של התשואה בסיכון?","האם נבדק כמה הצלחות נדרשות כדי לא להפסיד?","האם היעד מבוסס על הגרף ולא על משאלה?"],"next":{"m":"קח שלוש עסקאות שביצעת או שהיית שוקל, וחשב לכל אחת את היחס לפני הכניסה.","f":"קחי שלוש עסקאות שביצעת או שהיית שוקלת, וחשבי לכל אחת את היחס לפני הכניסה."}},"tr-8":{"goal":"הנוסחה הופכת את הגודל להחלטה מתמטית. סטופ רחוק מקטין את הפוזיציה וסטופ קרוב מגדיל אותה, כך שהסיכון בשקלים נשאר קבוע בכל עסקה.","ex":[{"t":"סטופ קרוב","a":"הון 20,000, סיכון 1% הם 200. כניסה ב-80, סטופ ב-79, מרחק 1. גודל הפוזיציה 200 יחידות, ושווי הכניסה 16,000. אבדוק שהוא לא חורג מהמגבלות שלי.","why":"החישוב מלא, והתשובה גם בודקת שווי כולל, כי פוזיציה גדולה מהון זמין היא בעיה נוספת."},{"t":"סטופ רחוק","a":"הון 10,000, סיכון 1% הם 100. כניסה ב-60, סטופ ב-54, מרחק 6. אקנה 16 יחידות, לא 17, כי עיגול כלפי מעלה יחצה את הסיכון שקבעתי.","why":"יש חישוב והחלטה לעגל למטה, פרט קטן שמשמר את כלל הסיכון."}],"weak":{"a":"אקנה כמות שנראית לי סבירה לפי הביטחון שלי בעסקה.","why":"הגודל נקבע לפי תחושה, ולכן הסיכון בשקלים משתנה בין עסקאות ואי אפשר לשלוט בו."},"checks":["האם הסיכון נקבע בשקלים ולא רק באחוזים?","האם המרחק לסטופ מופיע בחישוב?","האם הכמות מעוגלת כלפי מטה?","האם נבדק שווי הפוזיציה מול ההון?"],"next":{"m":"חשב היום גודל פוזיציה לשלוש עסקאות דמיוניות עם סטופים שונים, והשווה את הכמויות.","f":"חשבי היום גודל פוזיציה לשלוש עסקאות דמיוניות עם סטופים שונים, והשווי את הכמויות."}},"tr-9":{"goal":"סטופ טוב נגזר מהגרף ומשיקול של פסילת התרחיש. אחר כך מחשבים את הגודל לפי המרחק, ולא להפך. כלל מרכזי: לא מרחיקים סטופ אחרי הכניסה.","ex":[{"t":"עסקה על תחתית שנבחנת","a":"קניתי כי המחיר חזר מרמה ב-48. אם הוא נסגר מתחת ל-47.5 התחתית נשברה והרעיון פסול, ולכן שם הסטופ. את הגודל אחשב משם.","why":"הסטופ מנומק בפסילת התרחיש ומעט מתחת לרמה, והגודל מחושב ממנו."},{"t":"הפיתוי להזיז","a":"קבעתי סטופ ב-95 והמחיר מתקרב. אכתוב לעצמי מראש: מזיזים סטופ רק לכיוון הרווח, לעולם לא להרחיק אותו. אם נפגע, אצא ואכתוב ביומן.","why":"יש כלל מוגדר מראש כנגד הרחקת סטופ, והוא מגן מהחלטה לחוצה."}],"weak":{"a":"אשים סטופ של 2% מתחת לכניסה.","why":"אחוז קבוע לא קשור לגרף, ולכן הסטופ יכול ליפול בעומק הרמה או להיפגע ברעש רגיל."},"checks":["האם הסטופ קשור לנקודה בגרף?","האם מוסבר למה התרחיש נפסל שם?","האם יש כלל נגד הרחקת הסטופ?","האם גודל הפוזיציה נגזר מהסטופ?"],"next":{"m":"פתח גרף ישן, בחר נקודת כניסה, וסמן איפה היה הסטופ ההגיוני ולמה.","f":"פתחי גרף ישן, בחרי נקודת כניסה, וסמני איפה היה הסטופ ההגיוני ולמה."}},"tr-10":{"goal":"קריאת מבנה היא השלב הראשון בכל ניתוח, והיא מונעת התעקשות על כיוון שהגרף כבר לא תומך בו. כשהמבנה לא ברור, התשובה הנכונה היא לא לדעת.","ex":[{"t":"גרף עם מגמה","a":"שפלים ב-40, 44, 49 ופסגות ב-48, 53, 58. כל פסגה ושפל גבוהים מהקודמים, לכן המבנה עולה. אם יופיע שפל מתחת ל-49, אבחן מחדש.","why":"מוגדרים מספרים מפורשים, וגם נקודה שבה המבנה ייפסל."},{"t":"גרף מבלבל","a":"פסגות ב-70 וב-74, שפלים ב-65 וב-67, ואז שפל ב-64. המבנה התחלף מעלייה לספק. לא אסיק שהוא יורד, אחכה לפסגה נמוכה יותר שתאשר.","why":"התשובה מבדילה בין סימן ראשון לאישור, ולא ממהרת לקביעה."}],"weak":{"a":"הגרף נראה לי עולה.","why":"אין התייחסות לפסגות ושפלים, ולכן אי אפשר לבדוק את הקביעה או לדעת מתי היא נפסלת."},"checks":["האם הוזכרו פסגות ושפלים במספרים?","האם הושוו לקודמים?","האם יש נקודה שבה הקריאה משתנה?","האם יש הכרה שמבנה יכול להיות לא ברור?"],"next":{"m":"פתח גרף כלשהו וסמן בו לפחות שלוש פסגות ושלושה שפלים, ואז כתוב מילה אחת: עולה, יורד או לא ברור.","f":"פתחי גרף כלשהו וסמני בו לפחות שלוש פסגות ושלושה שפלים, ואז כתבי מילה אחת: עולה, יורד או לא ברור."}},"tr-11":{"goal":"אזור רחב נותן מקום לרעש, ולכן עדיף לסמן טווח צר ולא מספר יחיד. מספר הבחינות והזמן שעבר מצביעים על חשיבות, אבל אין ערובה שהאזור יחזיק.","ex":[{"t":"סימון על גרף שבועי","a":"סימנתי אזור בין 48 ל-49 כי המחיר חזר ממנו ארבע פעמים. אשרטט אותו כרצועה ולא כקו, ואבדוק אם נסגרים מתחתיו נרות שלמים.","why":"הסימון הוא רצועה עם ספירת בחינות, וגם מוגדר מה ייחשב שבירה."},{"t":"תמיכה שהפכה להתנגדות","a":"המחיר ירד דרך אזור 120 עד 122 שהחזיק פעמיים. כשחזר אליו מלמטה נעצר שם. אסמן את האזור כהתנגדות ואכתוב ביומן מה קרה בכל מגע.","why":"הוא מזהה החלפת תפקיד ומתעד תצפית, ולא מניח שהיא תחזור."}],"weak":{"a":"אצייר קו אופקי במקום שנראה לי חשוב.","why":"אין נימוק, אין ספירת נגיעות ואין רוחב. הקו נקבע לפי תחושה ולא לפי היסטוריה."},"checks":["האם סומן אזור ולא קו בודד?","האם נספרו הפעמים שהמחיר הגיב שם?","האם הוגדר מה נחשב שבירה?","האם יש הכרה שאזור יכול לא להחזיק?"],"next":{"m":"בחר גרף ישן וסמן אזור אחד בלבד, עם ספירת נגיעות והגדרה למה נחשבת שבירה.","f":"בחרי גרף ישן וסמני אזור אחד בלבד, עם ספירת נגיעות והגדרה למה נחשבת שבירה."}},"tr-12":{"goal":"ההשוואה היא תמיד ליחס לנפח הרגיל של אותו נכס ואותה מסגרת זמן, ולא למספר מוחלט. נפח הוא רמז לקריאת כוונות, לא תחזית.","ex":[{"t":"עלייה בנפח שונה","a":"שלושה נרות עולים ברצף. בשניים הנפח נמוך מהממוצע ובשלישי גבוה פי שניים אבל הגוף קטן. אשים לב לפער בין המאמץ לתוצאה ואבדוק מה קורה בנר הבא.","why":"הוא משווה מאמץ ותוצאה, ולא מסיק מסקנה מנר אחד."},{"t":"שבירה בנפח נמוך","a":"המחיר חצה אזור התנגדות אבל הנפח היה נמוך מהרגיל. לא אתייחס לזה כשבירה מאושרת ואחכה לראות אם נרות הבאים נסגרים מעל האזור בנפח גבוה יותר.","why":"הנפח משמש כאישור או ספק, ויש המתנה לראיה נוספת."}],"weak":{"a":"נפח גבוה אומר שהמחיר ימשיך לעלות.","why":"נפח גבוה לא מכתיב כיוון. הוא מראה פעילות, ופירוש הפעילות תלוי בהקשר ובתוצאת המחיר."},"checks":["האם הנפח הושווה לרגיל ולא למספר מוחלט?","האם הוזכר היחס בין המאמץ לתוצאה במחיר?","האם נמנעו מקביעה על סמך נר אחד?","האם נקבע מה בודקים בנר הבא?"],"next":{"m":"פתח גרף עם נפח, מצא נר אחד בנפח גבוה במיוחד וכתוב מה קרה למחיר בנרות שאחריו.","f":"פתחי גרף עם נפח, מצאי נר אחד בנפח גבוה במיוחד וכתבי מה קרה למחיר בנרות שאחריו."}},"tr-13":{"goal":"בלי הקשר מגדול, עסקה בקטן יכולה להיות נגד אזור משמעותי. החלפת מסגרות באמצע עסקה כדי להצדיק אותה היא טעות נפוצה. בוחרים מראש ונצמדים.","ex":[{"t":"מסחר אחרי העבודה","a":"אבדוק את הגרף היומי להקשר: איפה האזורים ומה המבנה. ביום שבו יש לי חצי שעה אבדוק רק את השעתי לתזמון, ולא אפתח מסגרות נוספות.","why":"שתי מסגרות ברורות ותפקיד לכל אחת, עם הגבלה על הוספת מסגרות."},{"t":"עסקה שהתחילה בקטן","a":"אם רעיון עולה בגרף של 5 דקות, אבדוק קודם ביומי אם המחיר צמוד להתנגדות. אם כן, אדלג על העסקה כי ההקשר לא תומך בה.","why":"ההקשר בגדול מהווה מסנן לפני הכניסה, ומוגדרת התוצאה של הבדיקה."}],"weak":{"a":"אסתכל על הרבה מסגרות זמן עד שאמצא אחת שמראה מה שאני מחפש.","why":"בחירה אחרי מעשה מצדיקה כל החלטה. נדרשת בחירה קבועה מראש."},"checks":["האם נבחרו שתי מסגרות בלבד?","האם לכל מסגרת יש תפקיד?","האם ההקשר נבדק לפני התזמון?","האם הבחירה נקבעה מראש?"],"next":{"m":"כתוב על פתק את שתי מסגרות הזמן שלך והתפקיד של כל אחת, והצמד ליד המסך.","f":"כתבי על פתק את שתי מסגרות הזמן שלך והתפקיד של כל אחת, והצמידי ליד המסך."}},"tr-14":{"goal":"הגדרה מדידה מונעת התעקשות על מגמה שכבר נגמרה. אין צורך בכלים מורכבים: מבנה ברור הוא קריטריון מספיק לבדיקה.","ex":[{"t":"הגדרה לפי שפלים","a":"מגמה עולה קיימת כל עוד כל שפל גבוה מהקודם. אם יהיה שפל נמוך יותר, אכתוב ביומן שהמגמה נשברה ואפסיק לחפש כניסות לעלייה עד שיתבהר.","why":"יש קריטריון אחד, תנאי פסילה, ופעולה שנגזרת מהם."},{"t":"מגמה בגרף יומי","a":"במגמה יורדת אבדוק שהפסגות נמוכות יותר. אם פסגה אחת עולה מעל הקודמת, זה אות להאט ולבדוק, ולא להניח שהמגמה התהפכה.","why":"ההבחנה בין האטה להתהפכות מונעת תגובת יתר."}],"weak":{"a":"המחיר עלה בימים האחרונים אז יש מגמה עולה.","why":"ימים בודדים הם לא מבנה. אין התייחסות לשפלים ולפסגות, ולכן אין תנאי פסילה."},"checks":["האם יש קריטריון מדיד למגמה?","האם יש תנאי שפוסל אותה?","האם התשובה מבדילה בין האטה להתהפכות?","האם יש פעולה שנגזרת מההגדרה?"],"next":{"m":"פתח שלושה גרפים והכרע לכל אחד אם יש בו מגמה עולה, יורדת או אין, לפי הקריטריון שכתבת.","f":"פתחי שלושה גרפים והכריעי לכל אחד אם יש בו מגמה עולה, יורדת או אין, לפי הקריטריון שכתבת."}},"tr-15":{"goal":"בטווח, הקצוות הם המקום היחיד שבו אפשר לקבוע סטופ קרוב ויחס סיכון-תשואה סביר. באמצע הטווח אין יתרון, ולכן בדרך כלל אין מה לעשות שם.","ex":[{"t":"זיהוי טווח","a":"המחיר נע שמונה שבועות בין 30 ל-36. נגעתי ברצפה שלוש פעמים ובתקרה ארבע. אסמן את שני האזורים ואכתוב ביומן אם הנפח משתנה ליד כל גבול.","why":"יש גבולות במספרים, ספירת נגיעות ומשימת מעקב שלא מניחה כיוון."},{"t":"באמצע הטווח","a":"כשהמחיר ב-33, באמצע הטווח, אין סיבה לפעול. אחכה שיגיע לאחד הקצוות ואבדוק אם התגובה שם תואמת לתרחיש שכתבתי מראש.","why":"הוא מזהה שבאמצע הטווח אין יתרון ושההמתנה היא החלטה."}],"weak":{"a":"הטווח הזה יישבר למעלה כי הוא נראה לי חזק.","why":"זו תחזית ולא תצפית. אין גבולות, אין ספירה, ואין מה לבדוק."},"checks":["האם יש רצפה ותקרה במספרים?","האם נספרו נגיעות?","האם יש הכרה שהכיוון אינו ידוע?","האם הוזכרה ההמתנה באמצע?"],"next":{"m":"מצא בגרף ישן טווח אחד וסמן את גבולותיו, בלי לנחש לאן יצא.","f":"מצאי בגרף ישן טווח אחד וסמני את גבולותיו, בלי לנחש לאן יצא."}},"tr-16":{"goal":"וויקוף לימד לחפש הצטברות של אותות ולא אות בודד. הכינוי צבירה הוא השערה שנבדקת בנרות הבאים, ויכול להתברר כשגוי, ואז הטווח הוא בסך הכול הפסקה.","ex":[{"t":"בחינת טווח אחרי ירידה","a":"הירידה נמשכה חודשים ואז נעצרה. הפעם האחרונה שהמחיר ירד לרצפה הייתה בנפח נמוך יותר מהקודמת. אכנה זאת צבירה אפשרית ואמתין לעוד סימנים.","why":"התשובה משתמשת במילה אפשרית וקושרת ראיה מסוימת, כלומר נפח שמתכווץ בירידות."},{"t":"מה יפסול את ההשערה","a":"אם המחיר ייסגר מתחת לרצפה בנפח גבוה, אסיק שזה לא צבירה. אכתוב את התנאי הזה לפני שאמשיך לנתח, כדי שלא אתעלם ממנו אחר כך.","why":"ההשערה כוללת קריטריון פסילה שנכתב מראש."}],"weak":{"a":"זו בטוח צבירה, אז הגיע הזמן להיכנס.","why":"וודאות מוחלטת וקפיצה לפעולה. אין סימנים ואין תנאי פסילה."},"checks":["האם יש יותר מסימן אחד?","האם הוגדר מה פוסל את ההשערה?","האם נעשה שימוש בלשון הערכה ולא בוודאות?","האם הסימנים נבדקו מול הגרף?"],"next":{"m":"בחר גרף ישן אחרי ירידה ארוכה וכתוב שלושה סימנים שמצאת ושניים שחסרים.","f":"בחרי גרף ישן אחרי ירידה ארוכה וכתבי שלושה סימנים שמצאת ושניים שחסרים."}},"tr-17":{"goal":"ההשוואה בין צבירה לחלוקה מחדדת את ההקשר: אותו טווח נקרא אחרת לפי מה שקדם לו. גם כאן מדובר בהשערה שנבדקת ולא בהכרזה.","ex":[{"t":"אותו טווח, הקשר שונה","a":"טווח בין 90 ל-100 אחרי עלייה ארוכה. הנפח הגדול הופיע בפסגות ב-100, אבל המחיר לא התקדם. זה מתאים לחלוקה אפשרית. אותו טווח אחרי ירידה היה נקרא אחרת.","why":"התשובה קושרת בין ההקשר הקודם לפירוש, והיא מראה שקריאה תלויה במה שהיה לפני."},{"t":"ניסיון פריצה שנכשל","a":"המחיר פרץ מעל 100 לרגע וחזר לטווח תוך שני נרות. אחשוב על זה כאחד הסימנים לחלוקה, אבל אחכה לעוד סימנים, ולא אסיק לבד.","why":"פריצה כושלת מוצגת כסימן אחד ולא כהוכחה."}],"weak":{"a":"אם מחיר נעצר בפסגה, זו חלוקה.","why":"עצירה אחת איננה טווח, ואין התייחסות למה שקדם לה או לנפח."},"checks":["האם הוזכר מה קדם לטווח?","האם יש לפחות שני סימנים?","האם הושמעה זהירות במילים?","האם הוגדר מה יחליש את ההשערה?"],"next":{"m":"השווה בכתב שני טווחים בגרפים, אחד אחרי ירידה ואחד אחרי עלייה, והסבר מה השתנה בקריאה.","f":"השוו בכתב שני טווחים בגרפים, אחד אחרי ירידה ואחד אחרי עלייה, והסבירי מה השתנה בקריאה."}},"tr-18":{"goal":"המבחן הוא מה קורה אחרי הפריצה: חזרה מהירה לטווח, לעיתים עם נפח, מעידה על כך שהפריצה לא נתמכה. אבל גם זו השערה, ולכן הכניסה לא נגזרת ממנה אוטומטית.","ex":[{"t":"הגדרת הבדל","a":"בשבירה אמיתית המחיר נסגר מתחת לרצפה ולא חוזר תוך כמה נרות. ב-Spring הוא יורד לרגע, אבל חוזר לטווח מהר. אגדיר מראש כמה נרות אחכה כדי להבחין.","why":"יש הגדרה מבצעית עם מספר נרות, ולא רק תיאור כללי."},{"t":"Upthrust בתקרה","a":"הטווח הוא בין 40 ל-45. המחיר עלה ל-46 וחזר ל-44 באותו יום. אסמן את זה כ-Upthrust אפשרי, אבדוק את הנפח, ולא אבצע דבר לפני שאגדיר תרחיש וסטופ.","why":"המאורע נרשם כאפשרי, ומודגש ההפרד בין זיהוי לפעולה."}],"weak":{"a":"Spring תמיד אומר שהמחיר יעלה.","why":"אין הקשר ואין תנאי. Spring הוא אירוע שנקרא בהקשר של הטווח, והוא לא מבטיח כיוון."},"checks":["האם יש הגדרה של חזרה לטווח במספר נרות?","האם נבדק הנפח?","האם יש הפרדה בין זיהוי אירוע לכניסה?","האם נמנעו מהבטחה לכיוון?"],"next":{"m":"מצא בגרף ישן פריצה מהירה שחזרה לטווח וכתוב כמה נרות עברו עד החזרה.","f":"מצאי בגרף ישן פריצה מהירה שחזרה לטווח וכתבי כמה נרות עברו עד החזרה."}},"tr-19":{"goal":"בלי מבחן, אירוע בגרף נשאר חד-פעמי. עם מבחן, יש ראיה שנייה, וכך מקטינים את הסיכוי להסתמך על תנועה מקרית. עדיין לא מדובר באישור סופי.","ex":[{"t":"השוואת נפח","a":"בפעם הראשונה נפח הנר היה 900 אלף, ובחזרה לאזור רק 300 אלף. אחשוב על זה כסימן להתמעטות הלחץ, ואבדוק אם גם הטווח בנר צר יותר.","why":"ההשוואה במספרים כוללת גם בדיקה נוספת, טווח הנר."},{"t":"מבחן שנכשל","a":"המחיר חזר לאזור ב-60, אבל הנפח היה גבוה כמו קודם והוא נסגר מתחתיו. אקבע שהמבחן לא הצליח, אכתוב זאת ביומן ולא אכריח את התרחיש להתאים.","why":"מבחן יכול להיכשל, והתשובה מקבלת את זה ולא מתעקשת."}],"weak":{"a":"אחכה לחזרה לאזור ואז אפעל.","why":"אין מה בודקים בחזרה. בלי השוואת נפח ותנאי להצלחה, זו התנהגות ולא קריטריון."},"checks":["האם הנפח הושווה לאירוע המקורי?","האם הוגדר מה נחשב מבחן מוצלח?","האם יש הכרה שמבחן יכול להיכשל?","האם הובהר שלא מדובר באישור סופי?"],"next":{"m":"מצא בגרף ישן אירוע בנפח גבוה ואת החזרה הבאה לאזורו, והשווה את שני הנפחים.","f":"מצאי בגרף ישן אירוע בנפח גבוה ואת החזרה הבאה לאזורו, והשווי את שני הנפחים."}},"tr-20":{"goal":"ההבחנה לא מתבררת מראש, אלא על ידי נקודה שמוגדרת מראש. כך לא מפרשים כל ירידה כסוף המגמה וגם לא מתעלמים מסימנים ברורים.","ex":[{"t":"הגדרת נקודת מעבר","a":"במגמה עולה עם שפל אחרון ב-45: ירידה עד 47 היא תיקון. סגירה יומית מתחת ל-45 תשבור את המבנה, ואז אחשוב מחדש ואפסיק להניח המשך עלייה.","why":"יש מחיר מדויק שמבחין בין שתי הקריאות, ופעולה שנגזרת ממנו."},{"t":"תיקון עמוק","a":"הירידה האחרונה גדולה מקודמותיה, אבל השפל עדיין גבוה מהקודם. אסווג אותה כתיקון עמוק ולא כהיפוך, אבל אסמן אותה כסימן לבדיקה נוספת.","why":"היא מכירה שיש סימני אזהרה בלי לקפוץ למסקנה."}],"weak":{"a":"כל ירידה היא התחלה של היפוך.","why":"החלטה מראש בלי קריטריון. כך כל תיקון נראה כסוף מגמה."},"checks":["האם יש מחיר או מבנה מוגדרים להבחנה?","האם נקבעה פעולה לכל אחד משני התרחישים?","האם הוכרה אי הוודאות בזמן אמת?","האם נמנעו משיפוט לפי ירידה אחת?"],"next":{"m":"בחר שלוש ירידות בגרף ישן וסווג אותן לתיקון או היפוך לפי נקודת המעבר שהגדרת.","f":"בחרי שלוש ירידות בגרף ישן וסווגי אותן לתיקון או היפוך לפי נקודת המעבר שהגדרת."}},"tr-21":{"goal":"חוק בדוק פותר ויכוח פנימי באמצע עסקה. מי שכותב חוקים מראש מקבל החלטות בראש שקט, ויכול לבדוק בהמשך אם הכללים עצמם עובדים.","ex":[{"t":"חוק כניסה ויציאה","a":"אם נר שעתי נסגר מעל 52 בנפח גבוה מהממוצע, ארכוש בגודל שחישבתי. אם נר שעתי נסגר מתחת ל-49, אצא בלי לחכות.","why":"כל תנאי מכיל מחיר, מסגרת זמן ופעולה, ואפשר לענות עליו בכן או לא."},{"t":"יציאה לפי זמן","a":"אם אחרי עשרה נרות המחיר לא התקדם לפחות מחצית מהדרך ליעד, אצא בלי קשר לסטופ. כך לא אשאיר כסף תקוע בעסקה שלא מתפתחת.","why":"הכלל כולל מדד זמן ולא רק מחיר, ומגן מתשישות של עסקה שעומדת."}],"weak":{"a":"אכנס כשהגרף ייראה חזק ואצא כשיהיה לי לא נעים.","why":"אין כאן אף תנאי מדיד. 'נראה חזק' ו'לא נעים' הם תחושות, ולכן אי אפשר לבדוק אותן."},"checks":["האם הכלל בנוי כאם-אז?","האם התנאי כולל מספר או מבנה מוגדר?","האם אפשר לענות עליו בכן או לא?","האם יש גם כלל ליציאה ולא רק לכניסה?"],"next":{"m":"קח את הכלל שכתבת, והפעל אותו על שלוש נקודות בגרף ישן. האם אפשר היה להחליט בלי היסוס?","f":"קחי את הכלל שכתבת, והפעילי אותו על שלוש נקודות בגרף ישן. האם אפשר היה להחליט בלי היסוס?"}},"tr-22":{"goal":"יותר עסקאות לא מייצרות יותר הזדמנויות, אלא יותר עמלות והחלטות עייפות. תקרה פשוטה, יחד עם פעולה מוגדרת בהגעה אליה, הופכת עצירה להחלטה מראש.","ex":[{"t":"מסחר בין פגישות","a":"מקסימום שתי עסקאות ביום. אחרי השנייה אסגור את המחשב ואצא להליכה של עשר דקות. אם יש לי רעיון נוסף, אכתוב אותו ליומן ואבדוק אותו מחר.","why":"יש מספר, ויש פעולה קונקרטית שמחליפה את הרצון להמשיך."},{"t":"אחרי הפסד","a":"אחרי הפסד לא אסחר שעה. אכתוב ביומן מה קרה ואחזור רק אם התנאים בתוכנית מתקיימים, ולא בגלל הצורך להשיב את מה שאבד.","why":"הכלל מבחין בין תנאי התוכנית לבין צורך רגשי."}],"weak":{"a":"אנסה לא לסחור יותר מדי.","why":"'יותר מדי' אינו מספר, ואין פעולה מוגדרת. הכוונה נשארת בלי תוקף."},"checks":["האם נקבעה תקרה במספר?","האם יש פעולה שמחליפה את המשך המסחר?","האם נבחן הרגש שמפעיל עסקאות מיותרות?","האם יש מקום לרישום רעיונות במקום לבצע אותם?"],"next":{"m":"ספור כמה עסקאות ביצעת בשבוע האחרון, וקבע תקרה חדשה שנמוכה במעט מהמספר הזה.","f":"ספרי כמה עסקאות ביצעת בשבוע האחרון, וקבעי תקרה חדשה שנמוכה במעט מהמספר הזה."}},"tr-23":{"goal":"מי שמבלבל בין תוצאה להחלטה מתקן את מה שלא שבור, או ממשיך מה שהצליח במקרה. שאלת הבדיקה צריכה להיות על התהליך, ורק אחר כך על הכסף.","ex":[{"t":"אחרי סטופ","a":"הסטופ נפגע וההפסד 100. אבדוק: האם נכנסתי לפי החוק, האם הגודל נכון, והאם יצאתי בסטופ. אם כן, זה הפסד רגיל ואין מה לשנות.","why":"היא מבדילה בין עמידה בתהליך לבין התוצאה, ובוחנת שלושה תנאים."},{"t":"הפסד שבא מטעות","a":"הזזתי את הסטופ והפסדתי יותר מהמתוכנן. זו לא עלות רגילה אלא טעות תהליך. אכתוב מה גרם לה ואיזה כלל אוסיף כדי למנוע אותה.","why":"הוא מודה בטעות, מזהה גורם ומתרגם אותו לכלל חדש."}],"weak":{"a":"אקח הפסד קשה ואמשיך הלאה.","why":"אין כאן בדיקה ואין למידה. גם הפסד רגיל וגם טעות נעלמים בלי תיעוד."},"checks":["האם נבדק אם עמדו בתוכנית?","האם יש הבחנה בין הפסד רגיל לטעות?","האם התשובה מנוסחת בלי האשמה עצמית?","האם יש שינוי מוגדר כשהייתה טעות?"],"next":{"m":"קח את ההפסד האחרון שלך ושאל עליו שלוש שאלות על התהליך, לפני שאתה מסתכל על הסכום.","f":"קחי את ההפסד האחרון שלך ושאלי עליו שלוש שאלות על התהליך, לפני שאת מסתכלת על הסכום."}},"tr-24":{"goal":"ניתוח מסודר מונע מסקנות מהירות כמו 'צריך להיות חכם יותר'. הוא מצמצם את הלמידה לשינוי קטן אחד שאפשר ליישם בעסקה הבאה.","ex":[{"t":"עסקה שהרוויחה","a":"הכניסה לפי החוק, הסטופ לא הוזז, אבל יצאתי כשהמחיר היה באמצע הדרך ליעד כי נבהלתי. הרווח קטן מהמתוכנן. בפעם הבאה אשאיר יעד פתוח.","why":"גם עסקה מרוויחה נבחנת, ומזוהה סטייה אחת עם תיקון ספציפי."},{"t":"עסקה שהפסידה","a":"הכניסה מוקדמת מדי, לפני שהנר נסגר. הסטופ כובד והגודל נכון. שינוי אחד: אכנס רק אחרי סגירת הנר. את השאר אשאיר כמו שהוא.","why":"היא מוצאת סיבה אחת, ומשאירה בשלום את מה שפעל."}],"weak":{"a":"העסקה לא הצליחה, ככה זה בשוק.","why":"מסקנה כללית בלי שאלות. אין זיהוי של מה עבד ומה לא."},"checks":["האם נבדקו כניסה, סטופ ויציאה בנפרד?","האם יש גם עסקה מרוויחה בניתוח?","האם הסיכום מכיל שינוי אחד ולא רשימה?","האם נכתב מה להשאיר ללא שינוי?"],"next":{"m":"נתח היום עסקה אחת אחרונה לפי שלוש השאלות ורשום ביומן שינוי אחד לעסקה הבאה.","f":"נתחי היום עסקה אחת אחרונה לפי שלוש השאלות ורשמי ביומן שינוי אחד לעסקה הבאה."}},"tr-25":{"goal":"כדי להתאושש מהפסד גדול צריך רווח גדול יותר: ירידה של 50 אחוזים דורשת עלייה של 100 אחוזים. לכן מגבלות מוקדמות חשובות יותר מכל רעיון לעסקה.","ex":[{"t":"מגבלות במספרים","a":"בהון 10,000: סיכון של 100 לעסקה, מקסימום הפסד יומי של 300, ומקסימום חודשי של 500. אם אגיע למגבלה, אפסיק לסחור עד תחילת התקופה הבאה.","why":"המגבלות מחושבות בשקלים ומחוברות לפעולה: עצירה עד התקופה הבאה."},{"t":"כסף לחיים וכסף למסחר","a":"אפריד חשבון מסחר מהחשבון השוטף. יהיו בו רק 10,000 שקל שאפשר להפסיד בלי לפגוע בהוצאות הבית, ולא אוסיף לו כסף אחרי הפסד.","why":"ההפרדה מגנה על החיים הרגילים, והכלל נגד הוספה אחרי הפסד קובע גבול."}],"weak":{"a":"אשתדל לא לסכן יותר מדי כסף.","why":"אין מספרים, ואין גבול. 'יותר מדי' משתנה בכל עסקה לפי הרגש."},"checks":["האם יש מגבלה לעסקה, ליום ולחודש?","האם הן מחושבות בשקלים?","האם מוגדר מה קורה כשמגיעים אליהן?","האם ההון המסוכן מופרד מהכסף לחיים?"],"next":{"m":"חשב את שלוש המגבלות שלך בשקלים והדבק אותן בראש היומן.","f":"חשבי את שלוש המגבלות שלך בשקלים והדביקי אותן בראש היומן."}},"tr-26":{"goal":"בלי חישוב עלויות, אסטרטגיה נראית רווחית בנייר ומפסידה במציאות. העלות מצטרפת לסיכון, ויש לכלול אותה כבר בחישוב יחס סיכון-תשואה.","ex":[{"t":"עסקה קטנה","a":"רווח צפוי 50, עמלה של 8 בכניסה ו-8 ביציאה, ופער של 4. עלות כוללת 20, ונשארים 30. אבדוק אם זה עדיין משתלם ביחס לסיכון.","why":"החישוב מלא וכולל את כל רכיבי העלות, ובודק את התוצאה מול הסיכון."},{"t":"ריבוי עסקאות","a":"עשר עסקאות בשבוע בעלות של 20 כל אחת הן 200 בשבוע. בחודש זה 800. אשווה זאת להון של 10,000 כדי לראות כמה אחוזים נבלעים בעלויות.","why":"הלומד מכפיל לתקופה ומשווה להון, ומגלה את העלות המצטברת."}],"weak":{"a":"העמלות קטנות, אז לא חשוב.","why":"בלי חישוב אי אפשר לדעת. עלות קטנה בעסקה אחת הופכת לגדולה בעשרות עסקאות."},"checks":["האם נכללו עמלת כניסה ויציאה?","האם נכלל הפער בין קנייה למכירה?","האם חושב מה נשאר מהרווח?","האם נבדקה העלות המצטברת לתקופה?"],"next":{"m":"פתח את פירוט העמלות של החשבון שלך ורשום כמה שילמת בחודש האחרון.","f":"פתחי את פירוט העמלות של החשבון שלך ורשמי כמה שילמת בחודש האחרון."}},"tr-27":{"goal":"רוב הפריצות מנצלות את המשתמש ולא את המערכת: דיוג, סיסמה חוזרת ומכשיר לא מאובטח. כמה הרגלים קבועים חוסמים את רוב הניסיונות הפשוטים.","ex":[{"t":"סיסמאות ואימות","a":"אעביר את כל חשבונות הכסף לסיסמה ייחודית לכל אחד במנהל סיסמאות, ואפעיל אימות דו-שלבי באפליקציה במקום SMS. את קודי הגיבוי אשמור בכספת פיזית.","why":"הפעולות קונקרטיות וכוללות שמירה בטוחה של קודי הגיבוי."},{"t":"הודעה חשודה","a":"אם אקבל הודעה בוואטסאפ או במייל על בעיה בחשבון, לא אלחץ על הקישור. אפתח את האתר הרשמי בעצמי, אכנס ידנית ואבדוק שם. לא אמסור קוד למי שמתקשר.","why":"הכלל מנחה מה לעשות ברגע הלחץ, ולא מסתמך על מזל."}],"weak":{"a":"אשתמש באותה סיסמה חזקה בכל מקום, כדי שאזכור אותה.","why":"סיסמה אחת לכל החשבונות הופכת דליפה באתר אחד לפריצה לכולם, וגם סיסמה חזקה אינה מספיקה לבדה."},"checks":["האם יש סיסמה ייחודית לכל חשבון?","האם האימות הדו-שלבי הוא באפליקציה?","האם יש כלל לטיפול בהודעה חשודה?","האם קודי הגיבוי שמורים בנפרד?"],"next":{"m":"הפעל היום אימות דו-שלבי באפליקציה בחשבון הכספי החשוב ביותר שלך.","f":"הפעילי היום אימות דו-שלבי באפליקציה בחשבון הכספי החשוב ביותר שלך."}},"tr-28":{"goal":"מקצוענות היא גם ידיעה מתי לא להיכנס. הימנעות מעסקה היא החלטה ולא כישלון, והיא שומרת על ההון ועל הריכוז לימים שבהם התנאים מתאימים.","ex":[{"t":"מצב רגשי","a":"לא אסחר אחרי ויכוח, אחרי הפסד גדול באותו יום, או כשיש בי צורך להוכיח משהו. במצבים האלה אסגור את הפלטפורמה ואכתוב ביומן מה עובר עליי.","why":"הכללים קושרים בין מצב רגשי לפעולה מוגדרת ולא רק לתחושה."},{"t":"חוסר בהירות","a":"אם אין מבנה ברור בגרף או שאין לי זמן לבדוק את התוכנית, לא אסחר באותו יום. אכתוב 'ללא עסקה' ביומן ואספור את זה כיום שעמדתי בתוכנית.","why":"יום בלי עסקה נרשם כהצלחה, וכך נחלש הלחץ לפעול."}],"weak":{"a":"אם אין לי חשק, אולי לא אסחר היום.","why":"זה לא כלל. אין תנאים ואין פעולה, והרגע שבו 'לא בקטע' יכול להתפרש כרצון לפעול."},"checks":["האם יש מצבים מוגדרים לאי-מסחר?","האם כל מצב ניתן לזיהוי בלי ויכוח?","האם יש פעולה לביצוע במצבים האלה?","האם יום ללא עסקה נרשם כעמידה בתוכנית?"],"next":{"m":"הדבק את שלושת מצבי אי-המסחר בראש התוכנית שלך, במקום שרואים לפני כל פתיחה.","f":"הדביקי את שלושת מצבי אי-המסחר בראש התוכנית שלך, במקום שרואים לפני כל פתיחה."}},"ld-7":{"goal":"שיחת 1:1 היא המקום שבו בעיות קטנות מתגלות לפני שהן גדלות. כשהשיחה קבועה ומוגנת מדחייה, העובד לומד שיש לו מקום לדבר, ולמנהל יש מידע שלא מגיע מהישיבות.","ex":[{"t":"שיחה עם נציגת שירות","a":"\"מה היה הכי מתסכל בשבוע האחרון? אם זה היה תלוי בך, מה היית משנה אצלנו? ובמה אוכל לעזור עד השיחה הבאה?\"","why":"שלוש שאלות פתוחות: קושי, פתרון משלה והצעת עזרה. השיחה מתמקדת בעובדת ולא בדוח של המנהל."},{"t":"שיחה עם סוכן ותיק","a":"\"יוסי, מה אתה רוצה שנדבר עליו היום? אני מביא רק שאלה אחת: מה אתה צריך ממני כדי לסגור את הרבעון?\"","why":"העובד קובע את סדר היום, והמנהל מגיע עם שאלה אחת בלבד, כך שהשיחה לא הופכת לחקירה."}],"weak":{"a":"\"נדבר כשיהיה זמן, ואם יש משהו דחוף תכתוב לי.\"","why":"אין מועד קבוע ואין נושאים. השיחה נדחית שוב ושוב, והעובד מבין שהוא לא בעדיפות."},"checks":["האם השאלות פתוחות ולא נענות ב\"כן\" או \"לא\"?","האם השיחה בנויה סביב מה שחשוב לעובד?","האם יש שאלה על עזרה שהמנהל יכול לתת?","האם נקבע יום ושעה קבועים?"],"next":{"m":"קבע היום שיחת 1:1 קבועה אחת ביומן, ושלח לעובד הזמנה חוזרת.","f":"קבעי היום שיחת 1:1 קבועה אחת ביומן, ושלחי לעובד הזמנה חוזרת."}},"ld-8":{"goal":"משוב כללי כמו \"תשתפר\" לא נותן לאדם מה לשנות. כשמתארים מקרה אחד, מה נראה בו ומה הוא גרם, העובד יכול להסכים, להתנגד או לתקן, והשיחה נשארת על העבודה ולא על האדם.","ex":[{"t":"איחורים בישיבת בוקר","a":"\"יוסי, ביומיים האחרונים נכנסת לישיבה בתשע ועשר, והתחלנו בלעדייך. בגלל זה חזרנו על ההסבר פעמיים. אשמח שנבין מה קורה ואיך נפתור.\"","why":"מתאר ימים ושעות ולא \"חוסר אחריות\", מציג את ההשפעה על הצוות ומסתיים בהזמנה לפתרון משותף."},{"t":"דוח עם טעויות","a":"\"רונית, בדוח של אתמול היו שלוש שורות עם סכומים שגויים, והלקוח שם לב. בפעם הבאה אשמח שתעברי עליו פעם אחת לפני השליחה. מתאים?\"","why":"מקרה אחד עם מספר, התוצאה אצל הלקוח ובקשה אחת קטנה. השאלה בסוף משאירה מקום לתגובה."}],"weak":{"a":"\"אתה לא מספיק מסור לעבודה, תשתפר.\"","why":"שיפוט של אופי בלי מקרה אחד. העובד לא יודע מה לשנות, ולרוב יתגונן."},"checks":["האם המשוב מתאר מקרה מסוים עם יום או מצב?","האם מתוארת התנהגות שאפשר לראות ולא תכונה?","האם נאמרה ההשפעה על העבודה או על הצוות?","האם יש בקשה או שאלה אחת בסוף?"],"next":{"m":"תן השבוע משוב אחד במבנה הזה, תוך יום מהמקרה.","f":"תני השבוע משוב אחד במבנה הזה, תוך יום מהמקרה."}},"ld-9":{"goal":"אנשים לא אומרים למנהל מה הם חושבים לפני שראו שמשוב קודם התקבל בשלום. שאלה מסוימת מקלה על התשובה, והתגובה הראשונה של המנהל קובעת אם יהיה משוב גם בפעם הבאה.","ex":[{"t":"סוף ישיבת צוות","a":"\"אני רוצה לשפר את הישיבות. מה דבר אחד שהיה עוזר לכם? אחכה בשקט, ואחרי כל תשובה אגיד רק תודה ואשאל מה עוד.\"","why":"השאלה צרה וקלה לתשובה, ההבטחה לא להגיב נותנת ביטחון, והשתיקה משאירה מקום לדבר."},{"t":"שיחה עם עובדת ותיקה","a":"\"דנה, איך אני נשמע כשאני נותן לך משימה? מה היית רוצה שאוסיף או אשנה בהסבר?\"","why":"שאלה על מצב קבוע ולא על \"הכול\", בשיחה של אחד על אחד, שבה קל יותר לדבר בכנות."}],"weak":{"a":"\"יש למישהו הערות עליי?\"","why":"שאלה רחבה וסגורה, וכל אחד מחכה שמישהו אחר ידבר. סביר שתהיה שתיקה והמנהל יסיק שהכול בסדר."},"checks":["האם השאלה מסוימת ולא כללית?","האם היא נפתחת ב\"מה\" או \"איך\" ולא ב\"האם\"?","האם מתוכננת תגובה קצרה בלי הצדקה?","האם נקבע מה יעשו עם מה שיישמע?"],"next":{"m":"בישיבה הבאה שאל את השאלה, חכה עשר שניות בשקט, ואמור רק תודה.","f":"בישיבה הבאה שאלי את השאלה, חכי עשר שניות בשקט, ואמרי רק תודה."}},"ld-10":{"goal":"רוב האכזבות של מנהלים נובעות מציפיות שלא נאמרו. כשמגדירים מראש מהי עבודה גמורה ומה קודם למה, העובד לא מנחש, והמנהל לא נאלץ לתקן בדיעבד.","ex":[{"t":"הצעת מחיר ללקוח","a":"\"הצעה גמורה היא עמוד אחד עם שלוש אפשרויות מחיר, שרונית אישרה לפני שליחה. אם יש התנגשות עם דוח החודש, ההצעה קודמת. אשמח לשמוע במילים שלך מה הבנת.\"","why":"יש הגדרה של סיום, סדר עדיפויות וגורם מאשר. החזרה במילים של העובד חושפת אי הבנה מיד."},{"t":"עובד חדש בסוכנות ביטוח","a":"\"בכל פוליסה חייבים למלא את כל השדות בטופס, ואין פשרה על זה. מהירות חשובה פחות. אם יש ספק, שואלים אותי לפני שלוחצים על שלח.\"","why":"מצוין מה אין עליו פשרה, מה פחות חשוב, ומה עושים כשיש ספק."}],"weak":{"a":"\"אני רוצה שתעשה עבודה איכותית ותהיה יוזם.\"","why":"\"איכותית\" ו\"יוזם\" הן מילים שכל אחד מפרש אחרת. אין מדד ואין מה לבדוק."},"checks":["האם מוגדר איך נראית עבודה גמורה?","האם ברור מה קודם כשיש התנגשות?","האם יש דבר אחד שלא מתפשרים עליו?","האם העובד מתבקש לחזור על מה שהבין?"],"next":{"m":"בחר משימה שמתחילה השבוע, אמור את שלושת החלקים, ובקש מהעובד לחזור עליהם.","f":"בחרי משימה שמתחילה השבוע, אמרי את שלושת החלקים, ובקשי מהעובד לחזור עליהם."}},"ld-11":{"goal":"ישיבה בלי החלטה מסתיימת בעוד ישיבה. כשמגדירים מראש מטרה והחלטה נדרשת ומסכמים באותו יום, הישיבה מתקצרת ואף אחד לא צריך לשאול אחר כך \"אז מה סגרנו\".","ex":[{"t":"ישיבת צוות שבועית","a":"\"מטרה: לסגור את לוח ההשקה של נובמבר. משתתפים: רונית, יוסי ודנה בלבד. החלטה נדרשת: האם דוחים את הקמפיין בשבוע. אורך: 25 דקות.\"","why":"יש מטרה, רשימת משתתפים מצומצמת, החלטה מסוימת וזמן. בסוף אפשר לדעת אם הצליחו."},{"t":"סיכום אחרי ישיבה","a":"\"בשש בערב שלחתי בוואטסאפ: יוסי שולח הצעה ללקוח עד חמישי, דנה מעדכנת את המחירון עד יום ראשון, ואני אאשר את התקציב מחר.\"","why":"לכל משימה יש שם ותאריך, והסיכום נשלח עוד באותו יום, כשהכול טרי."}],"weak":{"a":"\"אזמין את כולם לשעה ונראה לאן השיחה מתפתחת.\"","why":"אין מטרה ואין החלטה, ולכן אין דרך לדעת מתי סיימו. ישיבות כאלה נמשכות הרבה ונגמרות בלי משימות."},"checks":["האם המטרה מנוסחת במשפט אחד?","האם ההחלטה הנדרשת ברורה?","האם הוזמנו רק מי שצריכים?","האם בסיכום יש שם ותאריך לכל משימה?"],"next":{"m":"לפני הישיבה הבאה כתוב מטרה והחלטה נדרשת בהזמנה, ושלח סיכום באותו יום.","f":"לפני הישיבה הבאה כתבי מטרה והחלטה נדרשת בהזמנה, ושלחי סיכום באותו יום."}},"ld-12":{"goal":"עובדים מודדים מנהל לפי הפער בין מה שאמר למה שעשה. כשמקיימים הבטחות קטנות ומודים בטעות, הצוות מספר יותר, מבקש עזרה מוקדם, ופחות מנסה לנחש מה באמת קורה.","ex":[{"t":"הבטחה על חופשה","a":"\"אמרתי לדנה שאחזור אליה על החופשה באוגוסט עד יום שלישי. ביום שני אשלח לה תשובה, ואם עדיין אין, אכתוב לה שעוד לא ידוע ומתי יהיה.\"","why":"ההבטחה מקויימת בזמן, ואם אין תשובה מעדכנים במקום להיעלם. זה מה שבונה אמון."},{"t":"טעות בעדכון","a":"\"בישיבה אמרתי שהלקוח אישר את המחיר, ואז התברר שעוד לא. כתבתי לצוות באותו יום: טעיתי בעדכון, המחיר עוד לא אושר, והטיפול בזה אצלי עד מחר.\"","why":"הודאה קצרה, תיקון מיידי ומי אחראי להמשך. בלי הסברים ובלי האשמת אחרים."}],"weak":{"a":"\"אנסה להיות כן עם הצוות ולהקשיב להם יותר.\"","why":"כוונה כללית בלי מעשה. אי אפשר לדעת מתי עמדו בה, ואף אחד בצוות לא יראה שינוי."},"checks":["האם מוזכרת הבטחה או מעשה מסוים?","האם יש תאריך שבו זה יקרה?","האם כתוב מה אומרים גם כשאין תשובה?","האם אפשר לבדוק בסוף השבוע אם זה קרה?"],"next":{"m":"קיים השבוע הבטחה אחת שנשכחה, ואמור לצוות שסגרת אותה.","f":"קיימי השבוע הבטחה אחת שנשכחה, ואמרי לצוות שסגרת אותה."}},"ld-13":{"goal":"ראיון חופשי נוטה להעדיף את מי שנעים לנו. שאלות על מקרים קודמים, אותן שאלות לכולם וקריטריונים כתובים מראש מאפשרים להשוות בין מועמדים ולהבחין בין כושר דיבור לכושר עבודה.","ex":[{"t":"ראיון לנציג מכירות","a":"\"מהי עסקה שכמעט נפלה? מה היה המצב, מה עשית ומה יצא? ומה היית עושה אחרת היום?\"","why":"שאלה על מקרה אמיתי עם שלושה חלקים, ושאלת המשך שבודקת למידה."},{"t":"ראיון לסוכן ביטוח","a":"\"לפני הראיונות כתבתי שלושה קריטריונים: עמידה בלחץ, אמינות מול לקוח ולמידה מהירה. אשאל כל מועמד על מקרה אחד לכל קריטריון, ואתן ציון מ-1 עד 5 מיד אחרי.\"","why":"הקריטריונים נקבעו מראש, השאלות זהות לכולם והציון נרשם בזמן אמת, לפני שהרושם מתעמעם."}],"weak":{"a":"\"אשאל מה החוזקות והחולשות שלו, ואלך לפי תחושת בטן.\"","why":"התשובות לשאלות האלה מוכנות מראש, ותחושת בטן מעדיפה אנשים שדומים לנו. אין בסיס להשוואה בין מועמדים."},"checks":["האם השאלה על מקרה שקרה ולא על \"מה היית עושה\"?","האם אותה שאלה נשאלת לכל המועמדים?","האם נכתבו קריטריונים לפני הראיון?","האם יש ציון או הערה מיד אחרי הראיון?"],"next":{"m":"לפני הראיון הבא כתוב שלושה קריטריונים ושאלת מקרה לכל אחד.","f":"לפני הראיון הבא כתבי שלושה קריטריונים ושאלת מקרה לכל אחד."}},"ld-14":{"goal":"עובד חדש לא יודע מה מותר לשאול ומה נהוג. תוכנית קצרה עם חבר מלווה ומשימה ראשונה מצליחה מקצרת את ההתאקלמות ומונעת תחושה שהשאירו אותו לבד בשבועות הראשונים.","ex":[{"t":"נציג שירות חדש","a":"\"יום ראשון: היכרות עם הצוות וחבר מלווה, יוסי. יום שלישי: האזנה לחמש שיחות. יום חמישי: שיחה ראשונה כשיוסי לידו, ושיחת סיכום איתי של רבע שעה.\"","why":"יש חבר מלווה, התקדמות הדרגתית ושיחת סיכום קבועה, ולכן העובד לא נשאר לבד בלי כיוון."},{"t":"משימה ראשונה","a":"\"המשימה הראשונה של דנה: לעדכן עשרה לקוחות במערכת עד סוף השבוע השני. היא קטנה, ברורה ומסתיימת בהצלחה שאפשר לראות. אבדוק איתה ביום רביעי.\"","why":"משימה קצרה עם סיום ברור נותנת הצלחה מוקדמת, ובדיקה מתוכננת מונעת מצב שבו היא נתקעת בשקט."}],"weak":{"a":"\"אציג אותו לצוות ואחבר אותו למערכות, והוא כבר יבין תוך כדי.\"","why":"ההיכרות מסתיימת ביום אחד ואין המשך. העובד נשאר לבד עם כל מה שלא ברור, ולא יודע למי לפנות."},"checks":["האם כתוב שם של מי שמלווה?","האם התוכנית מחולקת לימים או לשבועות?","האם יש משימה ראשונה שאפשר לסיים?","האם נקבעה שיחה קבועה לשאלות?"],"next":{"m":"לפני שעובד חדש מגיע, כתוב את תוכנית השבוע הראשון ושלח אותה לעובד מראש.","f":"לפני שעובד חדש מגיע, כתבי את תוכנית השבוע הראשון ושלחי אותה לעובד מראש."}},"ld-15":{"goal":"אותה משימה מדליקה אחד ומשעממת אחר. כשהמנהל שואל ומקשיב ולא מנחש, הוא יכול להתאים עבודה למה שמניע כל אדם, ולקבל יותר מאמץ בלי להוסיף שכר.","ex":[{"t":"שיחה עם עובד ותיק","a":"\"שאלתי את יוסי מה היה הדבר הכי טוב בעבודה שלו בחצי השנה האחרונה. הוא אמר: כשפתרתי בעיה של לקוח לבד. אתן לו את הלקוחות הקשים.\"","why":"שאלה על רגע ממשי חושפת מה מניע, והמשימה נבנית על התשובה ולא על ניחוש."},{"t":"עובדת שהשתעממה","a":"\"רונית עושה את אותם דוחות כבר שנתיים. שאלתי מה היא רוצה ללמוד, והיא ביקשה להכיר את צד התמחור. אשלב אותה בשיחות התמחור פעם בשבוע.\"","why":"מזהה סימן לשעמום ומציע צעד קטן ומסוים בכיוון שהיא עצמה ביקשה."}],"weak":{"a":"\"אעודד את כולם ואחלק בונוס בסוף הרבעון.\"","why":"הגישה אחידה ולא מתייחסת לאף אחד. בונוס מניע חלק מהאנשים בלבד, ולא מסביר מה חסר למי שנחלש."},"checks":["האם מתואר מה מניע אדם מסוים?","האם נשאלה שאלה ולא נעשה ניחוש?","האם המשימה קשורה לתשובה?","האם אפשר ליישם את זה בלי תוספת תקציב?"],"next":{"m":"שאל השבוע עובד אחד מה היה הרגע הכי טוב שלו בעבודה לאחרונה, וכתוב את התשובה.","f":"שאלי השבוע עובד אחד מה היה הרגע הכי טוב שלו בעבודה לאחרונה, וכתבי את התשובה."}},"ld-16":{"goal":"הערכה שמבוססת על זיכרון מושפעת מהאירועים האחרונים ופוגעת באמון. יומן קצר של מקרים והשוואה לציפיות שנקבעו מראש הופכים את השיחה לענייניות ולא מפתיעה.","ex":[{"t":"שיחת סיכום שנה","a":"\"דנה, היעד היה שמונים לקוחות חדשים, והגעת לתשעים. בנובמבר סגרת לבד את העסקה עם המשרד בחולון. לשיפור: שלוש פעמים העדכון בתיעוד הגיע באיחור.\"","why":"מספר מול יעד, מקרה חיובי ומקרה לשיפור עם פרטים. אין הפתעות, כי הדברים נאמרו גם במהלך השנה."},{"t":"יומן מקרים","a":"\"בכל יום שישי אכתוב שורה על כל עובד: מה עשה טוב ומה דרש תיקון. בסוף השנה תהיה לי רשימה מסודרת, ולא אצטרך להסתמך על זיכרון.\"","why":"הרישום קטן ורגיל, ולכן אפשר לקיים אותו. בסוף השנה יש חומר אמיתי להערכה."}],"weak":{"a":"\"אגיד לו שהיה טוב השנה ושיש מקום להשתפר.\"","why":"כללי מדי ולא מבוסס על מקרים. העובד לא יודע מה היה טוב ומה לשפר, ולא ימשיך את מה שעבד."},"checks":["האם יש מספר או יעד שנקבע מראש?","האם לכל ציון יש מקרה מסוים?","האם נכלל גם משהו שעבד טוב?","האם יש יעד אחד להמשך?"],"next":{"m":"התחל יומן של שורה אחת בשבוע לכל עובד, ופתח אותו בכל יום שישי.","f":"התחילי יומן של שורה אחת בשבוע לכל עובד, ופתחי אותו בכל יום שישי."}},"ld-17":{"goal":"שיחה שנדחית גדלה: המנהל מתרגז, העובד מרגיש שמשהו לא בסדר ואף אחד לא מדבר. פתיחה עניינית, הקשבה ותוצאה שהוגדרה מראש הופכות את השיחה לכלי ניהול ולא להתפרצות.","ex":[{"t":"עובד שמזלזל בישיבות","a":"\"יוסי, בשתי הישיבות האחרונות אמרת על הרעיונות של רונית: זה לא רציני. אני רוצה להבין איך אתה רואה את זה. אחר כך נסכם איך מדברים על רעיונות בישיבה.\"","why":"עובדות בלי תווית, הזמנה לדבר ותוצאה ברורה שאליה השיחה מכוונת."},{"t":"ירידה בביצועים","a":"\"דנה, בחודשיים האחרונים המכירות ירדו מארבעים לעשרים עסקאות. לא אניח מה קרה. מה קרה מצדך, ובמה אוכל לעזור? בסוף נקבע צעד אחד לשבועיים.\"","why":"מספר אחד, הימנעות מהסקת מסקנות, שאלה פתוחה ותוצאה מוגדרת."}],"weak":{"a":"\"אגיד לו שהתנהגותו מאכזבת ואראה מה יגיד.\"","why":"אכזבה היא תווית ולא עובדה, ואין מטרה לשיחה. העובד יתגונן ולא יידע מה לשנות."},"checks":["האם הפתיחה היא עובדה ולא תווית?","האם יש שאלה שמזמינה את הצד השני לדבר?","האם מוגדר מה אמור לצאת מהשיחה?","האם נקבעו זמן ומקום פרטי?"],"next":{"m":"קבע היום מועד לשיחה שדחית, וכתוב לפניה את משפט הפתיחה.","f":"קבעי היום מועד לשיחה שדחית, וכתבי לפניה את משפט הפתיחה."}},"ld-18":{"goal":"קונפליקט שלא מטופל הופך לעבודה בנפרד, לשתיקות ולשיחות מאחורי הגב. הקשבה לכל צד לחוד מורידה את החום, ושאלה על העבודה במקום על האשמה מובילה להסכם שאפשר לבדוק.","ex":[{"t":"דנה ויוסי על לקוחות","a":"\"שוחחתי עם כל אחד לחוד. ביום שלישי אפגיש אותם ואשאל: מה צריך כדי שכל לקוח יטופל ולא יהיו כפילויות? נסכם כלל אחד ונבדוק אותו בעוד שבועיים.\"","why":"שמיעה נפרדת קודם, שאלה על העבודה ולא על האשמה, והסכם עם מועד בדיקה."},{"t":"ויכוח בקבוצת וואטסאפ","a":"\"בקבוצה התפתח ויכוח בין רונית לאורי. אעביר את הנושא לשיחה פנים אל פנים של עשר דקות, אבקש מכל אחד להציע פתרון אחד, ונבחר דבר אחד שנעשה כבר השבוע.\"","why":"מוציא את הוויכוח מהקבוצה, נותן לכל צד לדבר ומסתיים בפעולה קטנה."}],"weak":{"a":"\"אגיד להם להפסיק לריב ולהתנהג כמו מבוגרים.\"","why":"הוראה בלי הקשבה. הקונפליקט נשאר, ורק עובר למקום שהמנהל לא רואה."},"checks":["האם שמעו כל צד בנפרד קודם?","האם השאלה על העבודה ולא על מי אשם?","האם יש הסכם אחד מסוים?","האם נקבע מתי בודקים אם הוא מחזיק?"],"next":{"m":"אם יש מתח בצוות, קבע שיחה נפרדת עם כל צד, והתחל בשאלה: מה צריך שיקרה?","f":"אם יש מתח בצוות, קבעי שיחה נפרדת עם כל צד, והתחילי בשאלה: מה צריך שיקרה?"}},"ld-19":{"goal":"מנהלים נוטים להסביר קושי כתכונה של העובד. בדיקה אם חסר ידע, כלים, יכולת או רצון מאפשרת טיפול מדויק, ותוכנית קצרה עם בדיקות נותנת לעובד הזדמנות הוגנת ולמנהל בסיס להחלטה.","ex":[{"t":"נציג שמפספס יעדים","a":"\"שאלתי את אורי איפה הוא נתקע, והתברר שלא הבין את הליך הרישום. ארבעה שבועות: הדרכה של שעה בשבוע אצל יוסי, ובכל חמישי נבדוק כמה רישומים מתוך עשרים נעשו נכון.\"","why":"מאבחן את הסיבה לפני שמסיק, ומציב יעד מדיד ובדיקה שבועית."},{"t":"עובדת שהידרדרה","a":"\"רונית הייתה מצוינת ופתאום מאחרת. שאלתי בשיחה פרטית אם משהו השתנה, ונודע לי שיש עומס בבית. הסכמנו על שעות גמישות לחודש, ובסופו נבדוק שוב.\"","why":"מזהה שהסיבה אינה חוסר כישרון, מציע פתרון זמני ומוגבל בזמן וחוזר לבדוק."}],"weak":{"a":"\"אתן לו חודש, ואם לא ישתפר אתחיל לחשוב על פיטורים.\"","why":"אין אבחון, אין יעד ואין תמיכה. העובד לא יודע מה נדרש, והחודש יעבור בלי שינוי."},"checks":["האם נבדקה הסיבה: ידע, כלים, יכולת או רצון?","האם יש יעד שאפשר למדוד?","האם נקבעה בדיקה שבועית?","האם יש מועד להחלטה בסוף התקופה?"],"next":{"m":"שאל עובד אחד שמתקשה איפה בדיוק העבודה נתקעת, והקשב עד הסוף.","f":"שאלי עובד אחד שמתקשה איפה בדיוק העבודה נתקעת, והקשיבי עד הסוף."}},"ld-20":{"goal":"הכרה כללית נשמעת כמו נוהל ולא משנה דבר. הכרה שמציינת מה נעשה ומה יצא ממנו מראה שהמנהל שם לב, ומחזקת בדיוק את ההתנהגות שרוצים לראות שוב.","ex":[{"t":"סגירת פרויקט בזמן","a":"\"יוסי, בזכות זה שעברת על כל הפוליסות בערב, הלקוח קיבל תשובה בבוקר ולא התלונן. זה בדיוק מה שאני רוצה לראות. תודה.\"","why":"מעשה מסוים, תוצאה ברורה ומשפט שאומר שזו ההתנהגות הרצויה."},{"t":"הכרה מול הצוות","a":"\"לפני שנסיים, אני רוצה להגיד משהו על רונית. היא הציעה לשנות את סדר הטפסים, והזמן לטיפול ירד מעשר דקות לשש. רונית, תודה.\"","why":"מנוסח במספרים ובמה שהשתנה, ומול הצוות כשזה מתאים לרונית. כולם שומעים מה נחשב מצוין."}],"weak":{"a":"\"כל הכבוד על העבודה החודש, אתם צוות מעולה.\"","why":"אין בה מה בדיוק נעשה, ולכן לא ברור מה לחזור עליו. היא מתאימה לכולם ולכן לא נוגעת באף אחד."},"checks":["האם מצוין מה בדיוק נעשה?","האם נאמר מה השתנה בגלל זה?","האם ההכרה ניתנת בתוך ימים מהמעשה?","האם נבחר מקום שמתאים לאדם, פרטי או מול הצוות?"],"next":{"m":"היום תן הכרה מסוימת אחת למישהו מהצוות, עם שם, מעשה ותוצאה.","f":"היום תני הכרה מסוימת אחת למישהו מהצוות, עם שם, מעשה ותוצאה."}},"ld-21":{"goal":"בצוות מגוון בגיל, ברקע ובסגנון יש יותר זוויות על לקוח או על בעיה. הזוויות מגיעות רק אם יש מקום לדבר: המנהל מזמין במפורש, מכבד דעה שונה ובודק מי לא נשמע.","ex":[{"t":"ישיבה שמחליטים בה מהר","a":"\"לפני שאני מסכם, אני רוצה לשמוע את מי שעוד לא דיבר. אורי, אתה רואה בעיה בתכנון? אין צורך להסכים איתנו.\"","why":"פנייה בשם, ואישור מפורש שמותר לחלוק. כך הדעה השונה נשמעת לפני ההחלטה."},{"t":"גילאים שונים בצוות","a":"\"בפרויקט של הלקוחות הצעירים ביקשתי מרונית, החדשה בצוות, להציע שני רעיונות לפני כולם, ואחר כך שמענו את הוותיקים. בחרנו את הרעיון שלה.\"","why":"שינוי סדר הדיבור מונע מהוותיקים להכתיב כיוון, והבחירה נעשתה לפי הרעיון."}],"weak":{"a":"\"אנחנו צוות מגוון ושומעים את כולם.\"","why":"הצהרה בלי פעולה. מי שלא מדבר בישיבות ימשיך לשתוק, ואיש לא יבדוק למה."},"checks":["האם יש פעולה מסוימת שמזמינה קול שקט?","האם מבקשים דעה שונה במפורש?","האם ההחלטה נבחנת לפי הטיעון?","האם בודקים אחרי זמן מי לא דיבר?"],"next":{"m":"בישיבה הבאה פנה בשם למי שלא דיבר, ושאל מה דעתו לפני הסיכום.","f":"בישיבה הבאה פני בשם למי שלא דיברה, ושאלי מה דעתה לפני הסיכום."}},"ld-22":{"goal":"כשהצוות לא נפגש, פערי ציפיות גדלים: מי זמין, מה דחוף ומה נחשב עבודה. כללים כתובים ושיחה אנושית קבועה מונעים בלבול ובדידות, ואין צורך לעקוב אחרי מי מחובר.","ex":[{"t":"שלושה עובדים מהבית","a":"\"קבענו: זמינות בין תשע לשלוש, דחוף רק בטלפון, וכל יום ב-16:00 כל אחד שולח שלוש שורות: מה נעשה, מה נתקע ומה מחר.\"","why":"הכללים מפרידים בין דחוף ללא דחוף ומחליפים בדיקה בדיווח קצר, כך שאין צורך לעקוב."},{"t":"שיחת וידאו חברתית","a":"\"בכל יום חמישי ב-9:30 חצי שעה בלי משימות: כל אחד מספר משהו מהשבוע. התחלתי בעצמי עם סיפור על הקניות לשבת, ואחריי כולם הצטרפו.\"","why":"זמן קבוע לקשר אנושי במקום שיחות המסדרון, והמנהל מוביל בדוגמה."}],"weak":{"a":"\"אבקש מכולם להיות מחוברים ואבדוק מי מגיב מהר.\"","why":"מדידה של נוכחות ולא של תוצאות. היא יוצרת לחץ וחשדנות ואינה אומרת אם העבודה נעשתה."},"checks":["האם מוגדרות שעות זמינות?","האם ברור איזה ערוץ מיועד למה?","האם יש עדכון קבוע של מה שנעשה?","האם יש זמן לשיחה שאינה על משימות?"],"next":{"m":"קבע בצוות כלל אחד חדש על ערוץ או על זמינות, ושלח אותו בכתב.","f":"קבעי בצוות כלל אחד חדש על ערוץ או על זמינות, ושלחי אותו בכתב."}},"ld-23":{"goal":"מנהל שזמין לכולם כל הזמן נעשה צוואר בקבוק, והצוות מחכה לו. בלוק מוגן ושאלה על בעלות על כל בקשה משחררים זמן לעבודה שרק המנהל יכול לעשות ומחזירים אחריות לצוות.","ex":[{"t":"הפרעות רצופות","a":"\"ביום שלישי וביום רביעי בין תשע לאחת עשרה היומן חסום. הצוות יודע שדחוף מגיע בטלפון, והשאר ממתין לחלון שאלות של רבע שעה בשתים עשרה.\"","why":"יש שעות מסוימות, הגדרה של דחוף ומקום לכל השאר, כך שהצוות לא נשאר בלי מענה."},{"t":"בקשה שלא שייכת","a":"\"כשיוסי ביקש שאבחר לו ספק, שאלתי: מה ההמלצה שלך? הוא הציע ספק עם נימוק, ואישרתי בשתי דקות. מעכשיו יוסי מביא המלצה ולא שאלה.\"","why":"החזרת השאלה חוסכת זמן עכשיו ובעתיד, ומחזקת את היכולת של יוסי להחליט."}],"weak":{"a":"\"אנסה לא להיכנס לכל דבר ולהיות יותר מאורגן.\"","why":"כוונה בלי שינוי ביומן. אין בלוק, אין כלל ואין דרך לבדוק אם זה קרה."},"checks":["האם יש בלוק מסוים ביומן עם יום ושעות?","האם הצוות יודע מה נחשב דחוף?","האם יש מקום לשאלות שאינן דחופות?","האם יש כלל להחזרת בקשות שאינן של המנהל?"],"next":{"m":"חסום היום ביומן בלוק אחד של שעתיים לשבוע הבא, והודע על כך לצוות.","f":"חסמי היום ביומן בלוק אחד של שעתיים לשבוע הבא, והודיעי על כך לצוות."}},"ld-24":{"goal":"לחץ בלי סוף ובלי הסבר מרוקן אנשים, גם את הטובים ביותר. מנהל שמסיר משימות, מציב גבול זמן ובודק עם כל אחד אם הוא עומד בעומס, שומר על התפוקה ועל הצוות גם אחרי שהתקופה נגמרת.","ex":[{"t":"סוף רבעון עמוס","a":"\"עד סוף החודש יש לנו שלוש עדיפויות בלבד: סגירת עסקאות, מענה ללקוחות ועדכון התקציב. את הדוח החודשי ואת ההדרכה אני דוחה לנובמבר. אחרי ה-30 חוזרים לקצב רגיל.\"","why":"הסרת עומס ממשית, עדיפויות מוגדרות ותאריך סיום לתקופה."},{"t":"עובדת שנראית שחוקה","a":"\"בשיחה פרטית שאלתי את דנה איך העומס עובר עליה. היא אמרה שהיא נשארת עד תשע. העברתי שתי משימות ליוסי, והסכמנו שבחמישי היא יוצאת בארבע.\"","why":"בדיקה אישית ופעולה ממשית, ולא רק הבנה."}],"weak":{"a":"\"אגיד להם שהמאמץ מוערך ושנעבור את התקופה ביחד.\"","why":"עידוד בלי הקלה. העומס נשאר, אין תאריך סיום, ולכן העייפות רק גדלה."},"checks":["האם הוסרה או נדחתה משימה ממשית?","האם מוגדרות כמה עדיפויות בלבד?","האם יש תאריך סיום לתקופה?","האם נבדק אישית מי עומד בעומס?"],"next":{"m":"הסר או דחה השבוע משימה אחת מהצוות, והודע מתי תקופת העומס נגמרת.","f":"הסירי או דחי השבוע משימה אחת מהצוות, והודיעי מתי תקופת העומס נגמרת."}},"ld-25":{"goal":"מנהל שמסמן הכול כדחוף משאיר את הצוות בלי כיוון. בחירה של מעט דברים יחד עם הצהרה על מה שנדחה נותנת לצוות שקט לעבוד, ולמנהל תשובה ברורה כשמישהו שואל למה משהו לא קרה.","ex":[{"t":"שבוע לפני סגירת רבעון","a":"השבוע שלוש משימות: לסגור את חידושי הפוליסות, לסיים את דוח הרבעון ולראיין שני מועמדים. סדר התיקיות ועדכון האתר נדחים לשבוע הבא, ואגיד את זה לצוות בישיבת הבוקר.","why":"יש שלוש משימות מסוימות, יש רשימת דחייה, ויש רגע שבו מודיעים עליה לצוות."},{"t":"בקשה דחופה מהממונה באמצע השבוע","a":"אגיד ליוסי: אוכל לקחת את זה, וזה אומר שהצעת המחיר ללקוח תזוז ליום חמישי. מה חשוב יותר?","why":"הבקשה החדשה לא נבלעת בשקט, אלא מוצגת יחד עם המחיר שלה, וההחלטה חוזרת למי שיכול לקבל אותה."}],"weak":{"a":"אנסה לעשות קודם את הדברים החשובים.","why":"אין שמות למשימות ואין שום דבר שמוצהר כדחוי, ולכן בפועל הכול ממשיך להיות חשוב."},"checks":["האם נבחרו עד שלוש משימות?","האם יש לפחות דבר אחד שנדחה, בשמו?","האם הצוות יודע מה נדחה?","האם ברור למה אלה החשובות ולא אחרות?"],"next":{"m":"היום בבוקר כתוב שלוש משימות לשבוע ורשימת דחייה, ושתף אותן עם הצוות.","f":"היום בבוקר כתבי שלוש משימות לשבוע ורשימת דחייה, ושתפי אותן עם הצוות."}},"ld-26":{"goal":"יעד בלי מדד נשאר משאלה, ומדד בלי יעד נהפך לספירה בלי משמעות. הצמד נותן לצוות דרך להבין בעצמו אם הוא מתקדם, בלי לחכות לשיפוט של המנהל.","ex":[{"t":"סוכנות ביטוח, הרבעון הבא","a":"יעד: לשפר את החוויה של לקוחות חדשים. מדד 1: זמן מענה לפנייה ראשונה יורד מ-48 שעות ל-24. מדד 2: שיעור הלקוחות שמחדשים פוליסה עולה מ-70% ל-78%.","why":"יש כיוון אחד ושני מדדים עם נקודת פתיחה ויעד, ולכן בסוף הרבעון אפשר לענות כן או לא."},{"t":"צוות שירות בחנות","a":"יעד: פחות החזרות בגלל טעויות במשלוח. מדד 1: טעויות משלוח יורדות מ-30 בחודש ל-15. מדד 2: 100% מהמשלוחים עוברים בדיקה כפולה.","why":"מדד אחד מודד תוצאה והשני מודד פעולה שמובילה אליה, והצוות שולט בשניהם."}],"weak":{"a":"יעד: להשתפר בשירות. מדד: שירות טוב יותר.","why":"המדד חוזר על היעד ואי אפשר לספור אותו. אין מספר התחלתי ואין מספר שמגדיר הצלחה."},"checks":["האם יש יעד אחד בלבד?","האם לכל מדד יש מספר התחלתי ומספר יעד?","האם אפשר למדוד את זה בלי לשאול מישהו?","האם הצוות יכול להשפיע על המדדים?"],"next":{"m":"בחר יעד אחד לרבעון וכתוב לו מדדים. הצג אותם בישיבה הקרובה ובקש מהצוות הצעה אחת לשינוי.","f":"בחרי יעד אחד לרבעון וכתבי לו מדדים. הציגי אותם בישיבה הקרובה ובקשי מהצוות הצעה אחת לשינוי."}},"ld-27":{"goal":"מנהל שלא מבין את המספרים של הצוות מתקשה לבקש משאבים ולסרב לבקשות. הפרדה בין קבוע למשתנה מראה איפה אפשר לחסוך ובאיזה חלק בכלל יש מקום לשיקול דעת.","ex":[{"t":"תקציב צוות של חמישה","a":"קבועות: שכר חמישה עובדים, רישיונות תוכנה וחלק יחסי בשכירות. משתנות: פרסום, נסיעות ללקוחות, הדרכות וציוד. מתוך 200,000 ש\"ח לרבעון אשאיר 20,000 בצד לבלתי צפוי.","why":"הרשימה מפרידה בין מה שנעול למה שאפשר להזיז, ויש בה רזרבה במספר מוגדר."},{"t":"אירוע ללקוחות","a":"קבועות: אולם 8,000 ש\"ח והגברה 3,000 ש\"ח. משתנות: הזמנות, כיבוד לפי מספר נרשמים וצילום. אעקוב אחרי המשתנות פעם בשבוע ואשאיר 2,000 ש\"ח לבלתי צפוי.","why":"יש מספרים אמיתיים והבחנה בין מה שמחייב מעקב למה שלא. גם כאן הרזרבה נקבעה מראש."}],"weak":{"a":"אנסה לא לחרוג מהתקציב.","why":"אין רשימת הוצאות ואין הבחנה בין קבוע למשתנה, ולכן אין מה לבדוק ואין ממה לחתוך."},"checks":["האם ההוצאות מחולקות לקבועות ומשתנות?","האם יש מספרים ולא רק שמות?","האם נשארה רזרבה מוגדרת?","האם ברור איזו הוצאה אפשר לצמצם ראשונה?"],"next":{"m":"פתח גיליון עם שלוש עמודות לצוות שלך ומלא אותו לפי שלושת החודשים האחרונים.","f":"פתחי גיליון עם שלוש עמודות לצוות שלך ומלאי אותו לפי שלושת החודשים האחרונים."}},"ld-28":{"goal":"הפתעה לא נעימה שמגיעה מאוחר פוגעת באמון יותר מהבעיה עצמה. עדכון קצר ומסודר מראה שיש לך שליטה, וכשמבקשים במפורש מה צריך, הממונה יכול לעזור באמת.","ex":[{"t":"ספק מתעכב","a":"דנה, הספק מתעכב בשבוע וההשקה בסכנה. אבדוק ספק חלופי ואחזור אלייך מחר בצהריים עם מחיר. דרוש לי ממך אישור להוצאה של עד 4,000 שקל.","why":"שלושה חלקים: מה קרה, מה עושים ומה מבקשים. יש תאריך ויש סכום, ולכן קל לענות."},{"t":"עדכון שבועי","a":"השבוע סגרנו 12 מתוך 15 משימות. שלוש נתקעו בגלל תלות בצוות המכירות. אפגש עם יוסי ביום שלישי, ואבקש עזרה אם לא נתקדם עד יום רביעי.","why":"יש מספרים, סיבה, פעולה והגדרה ברורה מתי נזקקים לעזרה."}],"weak":{"a":"יש בעיה עם הספק, מה עושים?","why":"הבעיה נזרקת אל הממונה בלי הצעה ובלי תאריך, והוא נאלץ לעשות את החשיבה במקומך."},"checks":["האם נאמר מה קרה במשפט אחד?","האם יש הצעה לפתרון?","האם מוגדר מה נדרש מהממונה ועד מתי?","האם העדכון מגיע לפני שמישהו שואל?"],"next":{"m":"שלח השבוע לממונה שלך עדכון בשלושה חלקים, גם אם הכול בסדר.","f":"שלחי השבוע לממונה שלך עדכון בשלושה חלקים, גם אם הכול בסדר."}},"ld-29":{"goal":"רוב העבודה תלויה באנשים שאינם כפופים למנהל. מי שפונה רק כשהוא צריך עזרה נתפס כמי שלוקח, וקשר קטן ושוטף חוסך משא ומתן ארוך ברגע הצורך.","ex":[{"t":"נתונים ממחלקת כספים","a":"אקבע עם רונית קפה של רבע שעה לפני הבקשה, אשאל איך הרבעון אצלה, ורק אז אבקש את נתוני המכירות. בתמורה אכין לצוות שלה דוח חודשי מסודר.","why":"יש יצירת קשר לפני הבקשה, בקשה מסוימת והצעה שמועילה לצד השני."},{"t":"התנגשות על משאבים","a":"אגיד ליוסי: שנינו צריכים את המעצב בשבוע הבא. בוא נחלק, שלושה ימים אצלך ושניים אצלי, ובשבוע שאחריו נחליף.","why":"הבעיה מוצגת כבעיה משותפת, ההצעה הוגנת וההחלפה מבטיחה איזון."}],"weak":{"a":"כשאצטרך משהו אפנה אליהם ואבקש.","why":"אין קשר קיים ואין מה להציע, ולכן הבקשה תהיה עוד משימה שנוחתת על העמית."},"checks":["האם נבחר אדם מסוים?","האם הבקשה מסוימת?","האם יש משהו שהצד השני מרוויח?","האם יש מגע אחד שאינו בקשה?"],"next":{"m":"היום שלח הודעה קצרה לעמית ממחלקה אחרת ושאל מה הדבר שהכי מעכב את העבודה שם.","f":"היום שלחי הודעה קצרה לעמית ממחלקה אחרת ושאלי מה הדבר שהכי מעכב את העבודה שם."}},"ld-30":{"goal":"בלי בחירה מי הלקוח ומה לא עושים, הצוות מנסה לרצות את כולם ומתעייף. אסטרטגיה קצרה וכתובה מאפשרת לומר לא לבקשות שלא מתאימות ולהסביר למה.","ex":[{"t":"סוכנות ביטוח קטנה","a":"משרתים משפחות צעירות באזור המרכז. חזקים בזמן תגובה של יום עבודה אחד ובליווי בתביעות. לא נמכור ביטוח עסקי ולא נרדוף אחרי פוליסות קטנות מאוד.","why":"הלקוח מוגדר, יש יתרון מסוים ויש שני דברים שמוותרים עליהם."},{"t":"צוות תמיכה פנימי","a":"משרתים את צוות המכירות. חזקים בפתרון תקלות תוך 30 דקות. לא נבנה דוחות חדשים לפי בקשה, אלא רק דרך טופס רבעוני.","why":"הקהל מוגדר, היתרון נמדד והגבול כתוב, כך שאפשר לסרב בלי לריב."}],"weak":{"a":"משרתים את כל הלקוחות ורוצים להיות הכי טובים.","why":"לא נבחר קהל ולא נבחר יתרון, ואין שום דבר שהצוות מוותר עליו."},"checks":["האם הלקוח מוגדר בדיוק?","האם היתרון ניתן למדידה?","האם יש דבר שמוותרים עליו?","האם הצוות יכול לצטט את זה בעל פה?"],"next":{"m":"כתוב את שלוש השורות והצג אותן בישיבה הקרובה. בדוק אם כולם מסכימים על השורה השלישית.","f":"כתבי את שלוש השורות והציגי אותן בישיבה הקרובה. בדקי אם כולם מסכימים על השורה השלישית."}},"ld-31":{"goal":"אנשים לומדים מה מקובל מהתנהגות המנהל ולא מהצהרות. כשבוחרים התנהגות אחת ומחזקים אותה בעקביות, היא הופכת לנורמה תוך כמה שבועות.","ex":[{"t":"רוצים שיספרו על בעיות מוקדם","a":"אחרי שיוסי ידווח על טעות, אודה לו בישיבה ואשאל איך נמנע אותה בהמשך, בלי חיפוש אשמים. בנוסף אספר על טעות שלי מהחודש האחרון.","why":"התגובה לדיווח היא מה שמלמד את הצוות. הסיפור האישי מראה שזה בטוח."},{"t":"רוצים עמידה בזמנים","a":"אתחיל כל ישיבה בדיוק בשעה, גם אם חסרים אנשים, ואסיים בזמן. מי שמגיע בזמן יקבל ממני את הנושאים החשובים ראשונים.","why":"התנהגות המנהל קובעת את הנורמה, וכל ישיבה היא הזדמנות לחזק אותה."}],"weak":{"a":"אני רוצה תרבות של שיתוף פעולה.","why":"זה ערך ולא התנהגות. לא כתוב מה יעשו אחרת ביום שלישי בבוקר."},"checks":["האם נבחרה התנהגות אחת?","האם אפשר לראות אותה בעין?","האם יש פעולה של המנהל שמחזקת אותה?","האם יש משהו שצריך להפסיק לעשות כי הוא סותר אותה?"],"next":{"m":"בישיבה הקרובה ציין בפני הצוות פעולה אחת שמתאימה להתנהגות שבחרת.","f":"בישיבה הקרובה ציני בפני הצוות פעולה אחת שמתאימה להתנהגות שבחרת."}},"ld-32":{"goal":"ערכים נבחנים רק כשהם עולים בכסף או בנוחות. כשהצוות יודע מראש מה עושים באותם רגעים, ההחלטות מהירות והוגנות יותר, וקל יותר לדרוש אותן מאחרים.","ex":[{"t":"ערך השירות","a":"כשלקוח מבקש החזר על שירות שלא ממש הבטחנו, נשלם את ההחזר של 300 שקל. אסביר לצוות שזה מה שעושים כשהלקוח נפגע מהפער בין ההבטחה לביצוע.","why":"הערך מתורגם למעשה עם מספר, וההסבר לצוות הופך אותו לכלל."},{"t":"ערך האמינות","a":"אם לא נספיק במועד, נודיע ללקוח יומיים מראש ולא ביום האחרון, גם כשזה לא נעים. עשינו את זה בחודש שעבר, והלקוח נשאר איתנו.","why":"יש כלל מוגדר ודוגמה אמיתית שמראה שהמחיר היה שווה."}],"weak":{"a":"הערכים שלנו הם יושרה, מקצועיות ושירות.","why":"זו רשימת מילים. אין החלטה שבה כל ערך דרש לוותר על משהו."},"checks":["האם יש לכל ערך מקרה מסוים?","האם מופיע מחיר או ויתור?","האם הכלל ברור לצוות?","האם הערכים לא סותרים זה את זה?"],"next":{"m":"כתוב כלל אחד בנוסח \"כאשר... נעשה...\" לערך שבחרת ושלח אותו לצוות.","f":"כתבי כלל אחד בנוסח \"כאשר... נעשה...\" לערך שבחרת ושלחי אותו לצוות."}},"ld-33":{"goal":"ויכוח על ההחלטה נמשך הרבה אחרי הישיבה כשלא ברור מי מחליט. כשהשיטה מוצהרת מראש, אנשים משתפים בכנות רבה יותר ומקבלים את ההחלטה גם כשלא הסכימו איתה.","ex":[{"t":"בחירת מועד השקה","a":"אגיד בפתיחה: אני רוצה לשמוע שלוש דעות על מועד ההשקה, ואחרי זה ההחלטה אצלי. אודיע עליה עד מחר בצהריים ואסביר למה.","why":"ברור מי מחליט, מתי ואיך מודיעים, ולכן אפשר לשמוע דעות בלי חשש שהן נספרות כהצבעה."},{"t":"בחירת כלי עבודה","a":"הצוות יצביע בין שתי האפשרויות, והרוב קובע. מי שבמיעוט יתחייב לנסות את הכלי חודש ואז נבדוק שוב.","why":"ההצבעה מוצהרת מראש, ויש מנגנון שמחזיר את המיעוט לשיתוף פעולה."}],"weak":{"a":"נשמע את כולם ונראה מה יוצא.","why":"לא ברור מי מחליט ומתי, ולכן כל אחד יוצא עם ציפייה אחרת לתוצאה."},"checks":["האם נאמר מי מחליט?","האם נקבע מתי תתקבל ההחלטה?","האם הצוות יודע איך יעודכן?","האם השיטה נאמרה לפני הדיון ולא אחריו?"],"next":{"m":"בישיבה הבאה פתח במשפט אחד שמסביר איך תתקבל ההחלטה.","f":"בישיבה הבאה פתחי במשפט אחד שמסביר איך תתקבל ההחלטה."}},"ld-34":{"goal":"כשמשימה שייכת לשניים, כל אחד מניח שהשני מטפל בה. בעלים בודד ולוח גלוי מורידים את הצורך לרדוף אחרי אנשים ומאפשרים לזהות מוקדם מה נתקע.","ex":[{"t":"פרויקט אירוע","a":"הזמנות ללקוחות: דנה, עד יום ג'. אולם והגברה: יוסי, עד יום ד'. כיבוד: רונית, עד יום ה'. הכול בלוח משותף, ובכל בוקר אסתכל עליו דקה.","why":"לכל משימה בעלים אחד ותאריך, והלוח הגלוי מחליף שאלות סטטוס."},{"t":"שני אנשים על אותה משימה","a":"במקום \"דנה ויוסי יטפלו בלקוח\" אכתוב: דנה אחראית על הלקוח עד יום ד', ויוסי עוזר לה. אם יש תקלה, דנה מעדכנת אותי.","why":"יש בעלים אחד ועוזר מוגדר, כך שהשותפות לא מטשטשת את האחריות."}],"weak":{"a":"כולם יעבדו על זה ויעדכנו אותי.","why":"אין בעלים ואין תאריך, ולכן אף אחד לא יודע מי מעדכן ומתי."},"checks":["האם לכל משימה יש שם אחד?","האם יש תאריך?","האם הסטטוס נראה לכולם?","האם ברור מה עושים כשהמשימה נתקעת?"],"next":{"m":"הקם היום לוח משותף לפרויקט אחד, עם עמודות: משימה, בעלים, תאריך וסטטוס.","f":"הקימי היום לוח משותף לפרויקט אחד, עם עמודות: משימה, בעלים, תאריך וסטטוס."}},"ld-35":{"goal":"מנהל שמדלג מעל ראש הכפופים אליו מפרק את הסמכות שלהם. פגישה קבועה בשלושה נושאים מאפשרת לדעת מה קורה בלי לשלוף משימות מידיהם, ועוזרת להם לגדול כמנהלים.","ex":[{"t":"פגישה שבועית עם מנהלת צוות","a":"נפתח בשלוש שאלות: איפה אנחנו מול יעד הרבעון? מי בצוות שלך צריך תשומת לב? מה חוסם אותך ומה אוכל לפתור? אסיים בהחלטה אחת שהיא של דנה.","why":"השאלות מכסות תוצאות, אנשים וחסמים, וההחלטה נשארת אצל המנהלת."},{"t":"עובד מתלונן על מנהל הצוות","a":"אשמע את התלונה ואגיד: אבקש ממך לדבר על זה ישירות עם יוסי. אעדכן את יוסי שהנושא עלה, ונפגש שלושתנו אם לא יהיה שיפור.","why":"המנהל הישיר נשאר הכתובת לבעיות של הצוות שלו, ואין עקיפה בחשאי."}],"weak":{"a":"אשאל את העובדים מה קורה אצל המנהל שלהם.","why":"זו עקיפה שפוגעת בסמכות של המנהל ויוצרת חשש לגבי מה נאמר עליו מאחורי גבו."},"checks":["האם הפגישה עוסקת בתוצאות ולא בפרטי המשימות?","האם יש שאלה על האנשים בצוות?","האם יש שאלה על חסמים?","האם ההחלטות נשארות אצל המנהל הישיר?"],"next":{"m":"קבע השבוע פגישה אישית אחת עם מנהל שכפוף אליך, והשתמש בשלוש השאלות.","f":"קבעי השבוע פגישה אישית אחת עם מנהל שכפוף אלייך, והשתמשי בשלוש השאלות."}},"ld-36":{"goal":"עצה מוכנה נשמעת מועילה אבל מלמדת מעט. שאלות מכוונות גורמות לאדם למצוא את הפתרון בעצמו, ואז הוא לוקח עליו אחריות. עצה ניתנת רק אחרי שהוא ניסה לחשוב.","ex":[{"t":"מלווים נציגה צעירה בסוכנות","a":"אשאל את מיכל: מה ניסית עם הלקוח הזה? ממה לדעתך הוא חושש? מה הצעד הקטן הבא? רק אחרי שתענה אוסיף ניסיון משלי בשני משפטים.","why":"שלוש שאלות לפני עצה, והניסיון האישי קצר ומגיע אחרי שהיא חשבה."},{"t":"עובד שרוצה לעבור תפקיד","a":"אשאל את אמיר: איזה חלק בעבודה נותן לך אנרגיה? מה יהיה אחרת בעוד שנה אם תישאר כאן? עם מי כדאי לדבר? נסכם יחד שני צעדים שהוא בוחר.","why":"השאלות פותחות את החשיבה, והצעדים נבחרים על ידי העובד ולכן הוא יתמיד בהם."}],"weak":{"a":"אספר לו מה אני הייתי עושה במצב כזה.","why":"העצה מבוססת על הסיפור של המנטור, והאדם לא מתרגל חשיבה עצמאית. לא נבדק אם זה בכלל מתאים לו."},"checks":["האם יש לפחות שלוש שאלות פתוחות?","האם העצה נדחתה לסוף?","האם האדם בוחר את הצעד הבא?","האם הסיפור האישי קצר?"],"next":{"m":"בשיחה הבאה עם מי שאתה מלווה, שאל שלוש שאלות לפני שתיתן עצה.","f":"בשיחה הבאה עם מי שאת מלווה, שאלי שלוש שאלות לפני שתתני עצה."}},"ld-37":{"goal":"הקדמה ארוכה יוצרת חרדה, ושיחת סיום מעורפלת יוצרת תקווה כוזבת. ההחלטה קודמת לכול, הסיבה מבוססת על עובדות, והצעד הבא ברור כדי שאפשר יהיה להתכונן.","ex":[{"t":"קידום","a":"דנה, החלטנו לקדם אותך לראש צוות המכירות מהראשון בחודש. הסיבה: הובלת שלושה פרויקטים וסגרת אותם בזמן. בשבוע הבא ניפגש לדבר על תפקיד, שכר והעברת סמכויות.","why":"ההחלטה בפתיחה, הסיבה מבוססת על עובדות, והצעד הבא נקבע עם מועד."},{"t":"סיום העסקה","a":"יוסי, הגענו להחלטה לסיים את ההעסקה ב-30 בנובמבר. הסיבה: בשלושת החודשים האחרונים לא עמדת ביעדי המכירות, למרות שתי שיחות ותכנית שיפור. ביום חמישי תיפגש עם משאבי אנוש להסדרת הסיום.","why":"ההחלטה נאמרת מיד, הסיבה מבוססת על עובדות שהוא כבר מכיר, ואין מקום לתקווה לא מציאותית."}],"weak":{"a":"דנה, רציתי לשבת איתך על כמה דברים ולראות איך הכול מתקדם, ויש גם משהו שנדבר עליו בהמשך.","why":"אין החלטה בפתיחה, והאדם יושב ומנחש מה עומד לקרות. הוא מפסיק להקשיב מרוב דאגה."},"checks":["האם ההחלטה נאמרת במשפט הראשון?","האם הסיבה מבוססת על עובדות?","האם יש צעד הבא עם מועד?","האם הנושא תואם מראש עם משאבי אנוש או הגורם הרלוונטי?"],"next":{"m":"לפני שיחה קשה כתוב את שלושת המשפטים הראשונים וקרא אותם בקול פעם אחת.","f":"לפני שיחה קשה כתבי את שלושת
