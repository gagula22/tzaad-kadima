*{box-sizing:border-box}

var FBX={"ch-1":{"goal":"הרושם הראשוני נקבע בשניות, ולכן מה שרואים לפני המילה הראשונה משפיע על כל המשך הפגישה. תשובה טובה מתארת התנהגות שאפשר לראות: עמידה, מבט ופתיחה.","ex":[{"t":"פגישה עם לקוח חדש","a":"אכנס, אעצור שנייה בפתח, אסתכל על שני המשתתפים, אחייך ואגיד: \"שמח להכיר, בוא נתחיל\".","why":"יש כאן עצירה, מבט ומשפט פתיחה מוכן, כך שאין מקום להתעסקות בטלפון או במחשב."},{"t":"ישיבת צוות שבועית","a":"אניח את הפלאפון הפוך על השולחן, אעמוד ליד הכיסא עד שכולם מתיישבים, ואפתח במשפט: \"בוקר טוב, יש לנו שלושה נושאים להיום\".","why":"הפתיחה מסמנת שליטה, והמשפט ממסגר את הפגישה לפני שמישהו מתחיל לדבר."}],"weak":{"a":"אגיד שלום ואנסה להיראות בטוח.","why":"\"להיראות בטוח\" הוא רצון ולא פעולה. אי אפשר לבדוק אם עשית את זה."},"checks":["האם התשובה מתארת מה רואים: עמידה, מבט או הבעה?","האם יש משפט פתיחה מנוסח במילים?","האם אפשר לבצע את זה כבר בפגישה הבאה?","האם יש רגע של עצירה לפני שמתחילים לדבר?"],"next":{"m":"לפני הפגישה הבאה, תרגל את הכניסה פעם אחת מול מראה או בפתח הדלת: עצירה, מבט, משפט פתיחה.","f":"לפני הפגישה הבאה, תרגלי את הכניסה פעם אחת מול מראה או בפתח הדלת: עצירה, מבט, משפט פתיחה."}},"ch-2":{"goal":"קצב ועצירות הם הכלי החזק ביותר של הקול. דיבור איטי יחסית ועצירה קצרה לפני משפט חשוב משדרים שליטה, ודיבור מהיר וגבוה משדר לחץ.","ex":[{"t":"הצגת החלטה לצוות","a":"\"ההחלטה שלנו היא… (עצירה של שתי שניות) לדחות את ההשקה בשבועיים.\" אסמן את העצירה בעט על הדף.","why":"המשפט החשוב מגיע אחרי שקט, והשקט גורם לכולם להקשיב. הסימון בכתב עוזר לזכור לעצור."},{"t":"שיחת מכירה בטלפון","a":"לפני המחיר אקח נשימה, אאט את הקצב ואגיד: \"העלות היא… (עצירה) שלושת אלפים שקל לחודש.\"","why":"עצירה לפני מספר חשוב נותנת לו משקל ומונעת מהמספר להישמע כמו התנצלות."}],"weak":{"a":"אדבר יותר לאט.","why":"ללא משפט מסוים ומקום עצירה, קשה ליישם. \"לאט\" הוא כיוון ולא תכנית."},"checks":["האם יש משפט אחד מסוים שאותו מדגישים?","האם סימנת איפה עוצרים?","האם התשובה מתייחסת לקצב ולא רק לטון?","האם אפשר להקליט את זה בטלפון ולשמוע שוב?"],"next":{"m":"הקלט את עצמך אומר את המשפט פעמיים, פעם מהר ופעם עם עצירה, והשווה.","f":"הקליטי את עצמך אומרת את המשפט פעמיים, פעם מהר ופעם עם עצירה, והשווי."}},"ch-3":{"goal":"שאלה פתוחה וקשב אמיתי יוצרים קרבה מהר יותר מסיפור על עצמך. שאלה פתוחה לא נענית ב\"כן\" או \"לא\" וגורמת לאדם לספר.","ex":[{"t":"הפסקת קפה עם עמית חדש","a":"\"איך עבר עלייך השבוע בפרויקט החדש?\" ואחרי התשובה: \"ומה היה הכי מאתגר שם?\"","why":"השאלה הראשונה פתוחה, והשנייה מראה שהקשבת ומעמיקה את השיחה."},{"t":"פגישה ראשונה עם לקוח","a":"\"מה גרם לך לחפש פתרון דווקא עכשיו?\" אחכה לתשובה בלי להפסיק, ואז אחזור על מה ששמעתי במילים שלי.","why":"השאלה חושפת מניע, והחזרה על מה שנאמר משדרת הקשבה אמיתית."}],"weak":{"a":"\"היה לך שבוע טוב?\"","why":"אפשר לענות עליה במילה אחת, והשיחה נגמרת לפני שהתחילה."},"checks":["האם השאלה מתחילה ב\"איך\", \"מה\" או \"למה\"?","האם אי אפשר לענות עליה ב\"כן\" או \"לא\"?","האם יש שאלת המשך שמראה קשב?","האם השאלה טבעית לשיחה, ולא נשמעת כמו ראיון?"],"next":{"m":"בהפסקת הקפה הבאה, שאל שאלה פתוחה אחת, ואחרי התשובה שאל שאלת המשך אחת.","f":"בהפסקת הקפה הבאה, שאלי שאלה פתוחה אחת, ואחרי התשובה שאלי שאלת המשך אחת."}},"ch-4":{"goal":"עובדה נשכחת וסיפור נזכר. סיפור קצר עם מצב, בעיה ופתרון משכנע יותר מרשימת נתונים, כי אנשים מזהים בו את עצמם.","ex":[{"t":"שכנוע להחליף כלי עבודה","a":"\"בפרויקט הקודם כל עדכון נמשך שעתיים, כי שלחנו קבצים במייל. הסטטוס התבלבל פעמיים והלקוח התלונן. עברנו לכלי משותף, והעדכון ירד לעשר דקות. אני מציע לעשות את זה גם כאן.\"","why":"שלושה משפטים: מצב, בעיה ופתרון עם מספר, ובסוף הצעה ברורה."},{"t":"בקשה לתקציב","a":"\"בחודש שעבר איבדנו שלושה לקוחות כי התשובה אליהם התעכבה. הוספנו תגובה אוטומטית ומאז לא איבדנו אף אחד. עם תקציב קטן נוכל להרחיב את זה לכל הערוצים.\"","why":"יש כאן תוצאה שאפשר למדוד, והסיפור מוביל לבקשה."}],"weak":{"a":"\"חשוב לשנות כי זה יעיל יותר ומודרני.\"","why":"אין מצב, בעיה או פתרון. \"יעיל\" ו\"מודרני\" הן מילים שכל אחד אומר ואף אחד לא זוכר."},"checks":["האם יש מצב מסוים שמישהו יכול לדמיין?","האם הבעיה מוצגת במספר, בזמן או בתוצאה?","האם הפתרון מוביל לבקשה ברורה?","האם הסיפור קצר: שלושה עד ארבעה משפטים?"],"next":{"m":"בחר סיפור אחד מהעבודה שלך וספר אותו בשלושה משפטים לאדם אחד לפני סוף השבוע.","f":"בחרי סיפור אחד מהעבודה שלך וספרי אותו בשלושה משפטים לאדם אחד לפני סוף השבוע."}},"th-1":{"goal":"הזיכרון עובד על תמונות ומקומות, לא על רשימות. תמונה מוזרה שמחוברת למקום מוכר נשארת, ורשימה יבשה נשכחת.","ex":[{"t":"רשימת קניות","a":"חלב: בקבוק ענק חוסם את דלת הכניסה. ביצים: ביצים קופצות במחבת במטבח. לחם: כיכר לחם כמו כרית על הספה בסלון.","why":"כל פריט מקבל תמונה מוגזמת ומקום קבוע בבית, והסדר נשמר לפי הסיור בחדרים."},{"t":"שלושה נושאים לישיבה","a":"תקציב: ערימת מטבעות בכניסה לדירה. לוח זמנים: שעון ענק תלוי במטבח. צוות: חברי הצוות יושבים בשורה על הספה בסלון.","why":"הנושאים הופכים לתמונות שאפשר \"לראות\" במהלך הישיבה בלי להסתכל בדף."}],"weak":{"a":"אחזור על הרשימה כמה פעמים.","why":"חזרה בלי תמונה ובלי מקום היא שיטה חלשה וגוזלת זמן."},"checks":["האם לכל פריט יש תמונה מוחשית?","האם התמונה מוזרה או מוגזמת?","האם הפריטים מחוברים למקומות קבועים בסדר קבוע?","האם אפשר לשחזר אותם אחרי שעה?"],"next":{"m":"קח רשימה אמיתית של חמישה פריטים, קשר אותם לחמישה מקומות בבית, ובדוק את עצמך בערב.","f":"קחי רשימה אמיתית של חמישה פריטים, קשרי אותם לחמישה מקומות בבית, ובדקי את עצמך בערב."}},"th-2":{"goal":"מיקוד פירושו משימה אחת בכל פעם, בלי הפרעות. עבודה בקטעים של כעשרים וחמש דקות, ואז הפסקה קצרה, מביאה יותר מכמה שעות של עבודה מפוזרת.","ex":[{"t":"כתיבת הצעת מחיר","a":"אעבוד עשרים וחמש דקות על ההצעה בלבד. אכבה את ההתראות בטלפון, אסגור את המייל והטאבים, ואשאיר רק את המסמך פתוח.","why":"התשובה כוללת משימה אחת, משך זמן מוגדר ורשימה של מה שנסגר."},{"t":"לימוד לקראת בחינה","a":"בשעה שמונה אפתח טיימר, אשים את הטלפון בחדר אחר, ואלמד פרק אחד. בהפסקה של חמש דקות אקום ואשתה מים.","why":"המשימה מוגדרת, ההפרעה מורחקת פיזית וההפסקה מתוכננת."}],"weak":{"a":"אנסה להתרכז יותר ולא להסתכל בטלפון.","why":"\"לנסות\" ו\"להתרכז\" הם רצון. אין כאן שינוי של הסביבה או זמן מוגדר."},"checks":["האם נבחרה משימה אחת בלבד?","האם יש משך זמן מוגדר?","האם כתוב מה נסגר או מורחק?","האם יש הפסקה מתוכננת בסוף?"],"next":{"m":"קבע היום קטע אחד של עשרים וחמש דקות, וכתוב לפניו מה אתה מכבה.","f":"קבעי היום קטע אחד של עשרים וחמש דקות, וכתבי לפניו מה את מכבה."}},"th-3":{"goal":"החלטה טובה מתחילה בשאלה מה רוצים להשיג, ואחר כך משווים אפשרויות לפי כמה קריטריונים קבועים, ולא לפי תחושה רגעית.","ex":[{"t":"בחירת ספק","a":"המטרה: ספק שיספק בזמן. אשווה שני ספקים לפי מחיר, זמן אספקה והמלצות. ספק א׳ זול ב-10% אבל מאחר בשבועיים, ולכן אבחר בספק ב׳.","why":"המטרה מנוסחת, הקריטריונים ברורים וההחלטה נובעת מהם."},{"t":"קבלת הצעת עבודה","a":"אני רוצה צמיחה מקצועית. אשווה לפי שכר, הכשרה ונסיעות. הצעה א׳ משלמת יותר, אבל הצעה ב׳ כוללת הדרכה צמודה, ולכן היא מתאימה למטרה.","why":"ההחלטה נבחנת מול המטרה ולא רק מול הנתון הבולט."}],"weak":{"a":"אבחר במה שמרגיש לי נכון.","why":"תחושה היא נקודת התחלה ולא קריטריון. קשה להסביר אותה לאחרים או לבדוק אותה אחר כך."},"checks":["האם נאמר מה המטרה של ההחלטה?","האם יש שלושה קריטריונים או פחות?","האם שתי האפשרויות נבדקו מול אותם קריטריונים?","האם ההחלטה נובעת מההשוואה?"],"next":{"m":"קח החלטה קטנה מהשבוע, כתוב מטרה ושלושה קריטריונים, והשווה בטבלה של שתי עמודות.","f":"קחי החלטה קטנה מהשבוע, כתבי מטרה ושלושה קריטריונים, והשווי בטבלה של שתי עמודות."}},"th-4":{"goal":"חשיבה ביקורתית היא להפסיק לרגע לפני שמאמינים לטענה ולשאול: מי אומר, על סמך מה, ומה היה משכנע אותי שהיא שגויה.","ex":[{"t":"טענה בחדשות","a":"\"שלושה מתוך ארבעה עסקים נסגרים בשנה הראשונה.\" אשאל מי פרסם, על סמך איזה מדגם, ובאילו מדינות. אם המקור הוא מכירת קורס, אחשוד.","why":"השאלות בודקות מקור, בסיס ואינטרס, לפני שמקבלים את המספר."},{"t":"המלצה של חבר","a":"\"כולם עוברים לכלי הזה.\" אבדוק כמה אנשים בפועל, באילו תחומים, ומה אחוז הנוטשים אחרי חודש. נתון על נטישה גבוהה יפריך את הטענה.","why":"התשובה מגדירה במפורש איזה נתון ישנה את דעתו, וזו לב החשיבה הביקורתית."}],"weak":{"a":"לא מאמין לכל מה שאומרים.","why":"חשדנות כללית היא לא שיטה. חסר מה בודקים ומה ישכנע."},"checks":["האם נבדק מי אומר את הטענה?","האם נבדק על סמך מה?","האם נכתב איזה נתון יפריך אותה?","האם הנתון הזה אפשר למצוא בפועל?"],"next":{"m":"בחר טענה אחת שהאמנת לה השבוע, וחפש נתון אחד שיכול להפריך אותה.","f":"בחרי טענה אחת שהאמנת לה השבוע, וחפשי נתון אחד שיכול להפריך אותה."}},"br-1":{"goal":"מי שמדבר לכולם לא מדבר לאף אחד. נישה היא אדם אחד מוגדר, הבעיה שלו והתוצאה שהוא רוצה, ומשם מתחיל כל תוכן.","ex":[{"t":"מאמן כושר","a":"אני עוזר לאמהות לילדים קטנים לחזור לכושר בעשרים דקות ביום, בלי מכון ובלי ציוד.","why":"האדם, הבעיה והתוצאה ברורים: אפשר לדמיין את הלקוחה ולכתוב לה תוכן."},{"t":"יועץ פיננסי","a":"אני עוזר לעצמאים להפריד בין הכסף של העסק לכסף הפרטי ולהבין כמה נשאר בסוף חודש.","why":"הקהל והכאב מוגדרים ספציפית, והתוצאה ניתנת למדידה."}],"weak":{"a":"אני עוזר לאנשים להצליח בחיים.","why":"\"אנשים\" ו\"להצליח\" רחבים מדי. אין קהל, בעיה או תוצאה."},"checks":["האם יש קהל מוגדר ולא \"כולם\"?","האם הבעיה מנוסחת כפי שהאדם עצמו אומר אותה?","האם התוצאה ברורה ומדידה?","האם אפשר לדמיין אדם מסוים שמתאים?"],"next":{"m":"כתוב את המשפט, ובדוק אותו על אדם אחד אמיתי: האם הוא יגיד \"זה בדיוק אני\"?","f":"כתבי את המשפט, ובדקי אותו על אדם אחד אמיתי: האם הוא יגיד \"זה בדיוק אני\"?"}},"br-2":{"goal":"שלוש השניות הראשונות מחליטות אם ממשיכים לצפות. פותחים בבעיה או בהפתעה, ורק אחר כך נותנים ערך.","ex":[{"t":"סרטון על ישיבות","a":"\"המשפט הזה הורס לך כל ישיבה: ״בוא נחזור לזה אחר כך״.\" ואז: שלוש חלופות שעובדות.","why":"הפתיחה מצטטת משפט מוכר, מעוררת הזדהות ומבטיחה פתרון."},{"t":"סרטון על חיסכון","a":"\"הפסדתי שלושת אלפים שקל בגלל טעות אחת בהוראת קבע. הנה איך לבדוק את זה בדקה.\"","why":"מספר אישי ומוחשי, והבטחה לערך מהיר."}],"weak":{"a":"\"שלום לכולם, היום אני רוצה לדבר על ישיבות.\"","why":"פתיחה ללא מתח או הפתעה, והצופה גולל הלאה."},"checks":["האם המשפט הראשון מעורר סקרנות, כאב או הפתעה?","האם הוא קצר: עד שמונה מילים?","האם יש הבטחה לערך בהמשך?","האם הוא נמנע מ\"שלום לכולם\"?"],"next":{"m":"כתוב שלוש פתיחות לאותו סרטון, ובחר את זו שהכי גורמת לך להמשיך לצפות.","f":"כתבי שלוש פתיחות לאותו סרטון, ובחרי את זו שהכי גורמת לך להמשיך לצפות."}},"br-3":{"goal":"הפלטפורמות מעדיפות תוכן שרואים עד הסוף ומשתפים. כך צריך לעבוד: למדוד מה נצפה, להבין למה, ולהכפיל את מה שעבד.","ex":[{"t":"סרטונים קצרים","a":"אבדוק אחרי שבוע את אחוז הצפייה עד הסוף. אם הוא מתחת ל-30%, אקצר את ההקדמה לשלוש שניות ואבדוק שוב בשבוע הבא.","why":"יש מדד אחד, סף, פעולה בעקבותיו ומועד בדיקה חוזר."},{"t":"פוסטים","a":"אספור כמה אנשים שמרו או שיתפו כל פוסט. הפוסט עם הכי הרבה שמירות יהפוך לסדרה של שלושה פוסטים באותו נושא.","why":"המדד מעיד על ערך אמיתי, והתובנה הופכת מיד לתכנית."}],"weak":{"a":"אסתכל על הסטטיסטיקות ואראה מה עובד.","why":"אין מדד, סף או החלטה בעקבות התוצאה."},"checks":["האם נבחר מדד אחד ברור?","האם יש מספר שמגדיר \"טוב\" או \"נמוך\"?","האם נכתבה פעולה אם התוצאה נמוכה?","האם נקבע מתי בודקים שוב?"],"next":{"m":"בחר מדד אחד לשבוע הקרוב וכתוב אותו על פתק ליד המחשב.","f":"בחרי מדד אחד לשבוע הקרוב וכתבי אותו על פתק ליד המחשב."}},"br-4":{"goal":"קצב קבוע וקטן מנצח התלהבות חד-פעמית. מי שמפרסם באופן קבוע בונה אמון, ומי שנעלם חוזר לאפס.","ex":[{"t":"קצב שבועי","a":"שלוש פעמים בשבוע, בימי ראשון, שלישי וחמישי בשמונה בבוקר. בכל יום ראשון בערב אכין את כל התכנים לשבוע ואשתמש שוב בשני פוסטים ישנים.","why":"יש ימים קבועים, שעה, זמן הכנה מרוכז ושימוש חוזר בתכנים קיימים."},{"t":"קצב מציאותי","a":"פוסט אחד בשבוע, בכל יום שלישי. אכתוב אותו ביום ראשון, ואם אפספס שבוע אחד אחזור בשבוע הבא בלי להפסיק.","why":"הקצב ריאלי, ויש כלל להתמודדות עם החמצה, וזה מה ששומר על המשכיות."}],"weak":{"a":"אעלה תוכן כמה שיותר, כל יום.","why":"קצב לא ריאלי נשבר אחרי שבועיים, ואז אין תוכן בכלל."},"checks":["האם הקצב ריאלי גם בשבוע עמוס?","האם נקבעו ימים ושעות?","האם יש זמן הכנה קבוע?","האם יש כלל מה עושים כשמפספסים?"],"next":{"m":"קבע קצב נמוך מהרצוי, ועמוד בו ארבעה שבועות לפני שמעלים אותו.","f":"קבעי קצב נמוך מהרצוי, ועמדי בו ארבעה שבועות לפני שמעלים אותו."}},"tr-1":{"goal":"רוב ההפסדים נובעים מהתנהגות ולא מניתוח: כניסה מפחד להחמיץ ופחד לצאת בהפסד. תוכנית כתובה מראש מצמצמת החלטות רגשיות. התוכן חינוכי בלבד.","ex":[{"t":"כלל נגד FOMO","a":"לא אכנס לעסקה בלי תרחיש כתוב, נקודת יציאה והפסד מרבי. אם הנכס כבר זז 5% בלי שהייתי מוכן, אדלג עליו ואחכה לסט-אפ הבא.","why":"הכלל מוגדר לפני ההזדמנות ומתאר גם מה עושים כשמפספסים."},{"t":"המתנה לפני כניסה","a":"אחרי שאני רואה סט-אפ אחכה עשר דקות ואכתוב ביומן למה נכנס. אם אין לי שלוש סיבות, אדלג.","why":"השהיה וכתיבה מאטות את הרגש ומחייבות הצדקה."}],"weak":{"a":"אנסה לא להתרגש ולא להיכנס מהר.","why":"זה רצון. אין כלל שאפשר לבדוק אחרי העסקה."},"checks":["האם הכלל כתוב ומוגדר מראש?","האם אפשר לבדוק אחר כך אם עמדו בו?","האם מתואר מה עושים כשמפספסים?","האם הוא מתייחס לרגש מסוים, כמו פחד להחמיץ?"],"next":{"m":"כתוב כלל אחד קצר, ובסוף כל יום ציין ביומן אם עמדת בו.","f":"כתבי כלל אחד קצר, ובסוף כל יום ציני ביומן אם עמדת בו."}},"tr-2":{"goal":"ניהול סיכונים פירושו לקבוע מראש כמה מההון מסכנים בעסקה אחת. גודל הפוזיציה נגזר מהמרחק לסטופ ולא מהתחושה. התוכן חינוכי בלבד.","ex":[{"t":"דוגמה חישובית","a":"אסכן אחוז אחד מההון בעסקה. בהון של 10,000 זה 100. אם הסטופ במרחק של 2%, הפוזיציה תהיה 5,000.","why":"הסיכון מוגדר באחוז, מתורגם למספר, ומשם מחושב הגודל."},{"t":"שרידות לרצף הפסדים","a":"אסכן חצי אחוז לעסקה, כי עשר הפסדים רצופים יעלו לי חמישה אחוזים בלבד ואוכל להמשיך.","why":"הבחירה מנומקת בשרידות, שזה הנימוק המרכזי לניהול סיכונים."}],"weak":{"a":"אכניס סכום שנוח לי ושלא יכאיב.","why":"\"נוח\" הוא תחושה, ואין כאן קשר לסטופ או לאחוז מהון."},"checks":["האם הסיכון מוגדר באחוז מההון?","האם הפוזיציה נגזרת מהסטופ?","האם יש נימוק, כמו רצף הפסדים?","האם אפשר לחשב את זה לפני כל עסקה?"],"next":{"m":"כתוב נוסחה אחת שמחשבת גודל פוזיציה מתוך הון, אחוז סיכון ומרחק לסטופ.","f":"כתבי נוסחה אחת שמחשבת גודל פוזיציה מתוך הון, אחוז סיכון ומרחק לסטופ."}},"tr-3":{"goal":"גרף מספר איפה היה ביקוש ואיפה היה היצע. מתחילים מהתמונה הגדולה, כמו טווח, מגמה וכמות נפח, ורק אחר כך יורדים לפרטים. התוכן חינוכי בלבד.","ex":[{"t":"תיאור גרף יומי","a":"בגרף היומי הנכס עלה 40% ועכשיו נע בטווח צדדי כבר שלושה שבועות. הנפח יורד בכל גל, ויש תמיכה סביב אותו אזור שנבדק פעמיים.","why":"מתחילים ממבנה (עלייה ואז טווח), ואחר כך נפח ואזורים. אין תחזית."},{"t":"שלושה מסגרות זמן","a":"בשבועי יש מגמה עולה, ביומי תיקון, ובארבע שעות מבנה של שפל גבוה. המסגרות מסכימות רק בשבועי.","why":"מציגים מהגדול לקטן ומציינים היכן אין הסכמה."}],"weak":{"a":"נראה שהגרף הולך לעלות.","why":"זו תחזית ולא תיאור, ואין בה מבנה, נפח או אזורים."},"checks":["האם מתחילים מהמבנה הגדול?","האם מצוין נפח?","האם מוזכרים אזורים של תמיכה או התנגדות?","האם זה תיאור של מה שרואים ולא ניחוש?"],"next":{"m":"בחר גרף יומי אחד ותאר אותו בשלושה משפטים בלי המילים \"יעלה\" או \"ירד\".","f":"בחרי גרף יומי אחד ותארי אותו בשלושה משפטים בלי המילים \"יעלה\" או \"ירד\"."}},"tr-4":{"goal":"שיטת וויקוף מתארת מחזור: צבירה, עלייה, חלוקה וירידה. מחפשים סימנים בנפח ובמחיר, ולא מנחשים. התוכן חינוכי בלבד, ואינו המלצה.","ex":[{"t":"זיהוי צבירה","a":"הנכס ירד 60% ועכשיו נע בטווח צר. בירידות לתחתית הנפח קטן, ובעליות הנפח גדל, מה שמתאים לשלב צבירה. אחכה לבדיקת היצע נמוכה.","why":"הטענה נשענת על יחס נפח ומחיר ומציינת מה עוד צריך להתממש."},{"t":"זיהוי חלוקה","a":"אחרי עלייה ארוכה הנכס מתקשה לעבור את אותו אזור. בכל ניסיון הנפח גבוה והנר נסגר חלש, ולכן שוקל שלב חלוקה.","why":"יש סימנים מדידים ולשון זהירה של \"שוקל\" ולא ודאות."}],"weak":{"a":"וויקוף אומר שהמחיר ירד.","why":"אין שלב במחזור, סימן בנפח או מחיר, וזו תחזית."},"checks":["האם נקבע שלב במחזור?","האם יש סימן בנפח וגם סימן במחיר?","האם מוזכר מה עוד צריך להתממש?","האם הלשון זהירה ולא קובעת?"],"next":{"m":"בחר נכס שאתה עוקב אחריו וכתוב באיזה שלב הוא, ומה יפריך את ההערכה שלך.","f":"בחרי נכס שאת עוקבת אחריו וכתבי באיזה שלב הוא, ומה יפריך את ההערכה שלך."}},"ld-1":{"goal":"המעבר מביצוע להובלה: התוצאה שלך היא התוצאה של הצוות. מי שממשיך לעשות הכול בעצמו הופך לצוואר בקבוק.","ex":[{"t":"מנהל חדש בצוות","a":"אפסיק לכתוב את הדוח השבועי בעצמי. אלמד את דנה לכתוב אותו בשני שבועות, ובשבוע השלישי אבדוק רק את המסקנות.","why":"יש משימה מסוימת, אדם, תקופת לימוד ושלב שבו משחררים."},{"t":"שחרור משימות","a":"אפסיק לענות בעצמי ללקוחות קטנים. אכין מסמך תשובות מוכנות ואעביר את זה לשני אנשים, ואבדוק רק מקרים חריגים.","why":"ההעברה מלווה בכלי, ואחריה נשארת בקרה מצומצמת."}],"weak":{"a":"אנסה להאציל יותר.","why":"אין משימה, אדם או שלב. זו כוונה כללית."},"checks":["האם נבחרה משימה מסוימת להפסיק?","האם נקבע למי מעבי השני. (טון יורד על \"השני\")"}},{"t":"שפת גוף בזום","idea":{"m":"בזום המצלמה היא העיניים של האחר. מסתכלים אליה כשמדברים, מושיבים אותה בגובה העיניים, והחלון בחזית. אחרת נראה שמסתכלים הצידה או למטה.","f":"בזום המצלמה היא העיניים של האחר. מסתכלים אליה כשמדברים, מושיבים אותה בגובה העיניים, והחלון בחזית. אחרת נראה שמסתכלים הצידה או למטה."},"ex":{"m":"תאר איך תסדר את הפגישה הבאה שלך בזום: מצלמה, תאורה ומבט.","f":"תארי איך תסדרי את הפגישה הבאה שלך בזום: מצלמה, תאורה ומבט."},"ph":{"m":"למשל: אניח את המחשב על ספרים, אפנה לחלון ואביט במצלמה כשאדבר.","f":"למשל: אניח את המחשב על ספרים, אפנה לחלון ואביט במצלמה כשאדבר."}},{"t":"הודעות קצרות","idea":{"m":"הודעת וואטסאפ טובה מכילה את העיקר בשורה הראשונה: מה אני צריך ממך ועד מתי. אחריה, רק פרט אחד אם חייבים. הודעה ארוכה נקראת חצי, וקצרה מדי נשמעת קרה.","f":"הודעת וואטסאפ טובה מכילה את העיקר בשורה הראשונה: מה אני צריך ממך ועד מתי. אחריה, רק פרט אחד אם חייבים. הודעה ארוכה נקראת חצי, וקצרה מדי נשמעת קרה."},"ex":{"m":"כתוב מחדש הודעת וואטסאפ ארוכה שלך כך שהשורה הראשונה תכיל את העיקר.","f":"כתבי מחדש הודעת וואטסאפ ארוכה שלך כך שהשורה הראשונה תכיל את העיקר."},"ph":{"m":"למשל: דנה, תאשרי לי את התאריך עד מחר, כדי שאסגור את האולם.","f":"למשל: דנה, תאשרי לי את התאריך עד מחר, כדי שאסגור את האולם."}},{"t":"אימייל שנקרא","idea":{"m":"אימייל שנקרא מתחיל בנושא שאומר מה בפנים, ופותח בבקשה או בהחלטה. אחרי זה מגיעות שלוש נקודות לכל היותר, ושורה אחרונה שאומרת מה הצעד הבא ומי עושה אותו.","f":"אימייל שנקרא מתחיל בנושא שאומר מה בפנים, ופותח בבקשה או בהחלטה. אחרי זה מגיעות שלוש נקודות לכל היותר, ושורה אחרונה שאומרת מה הצעד הבא ומי עושה אותו."},"ex":{"m":"כתוב נושא ושורת פתיחה לאימייל שאתה צריך לשלוח השבוע.","f":"כתבי נושא ושורת פתיחה לאימייל שאת צריכה לשלוח השבוע."},"ph":{"m":"למשל: נושא: אישור הצעה עד יום ג'. אבקש לאשר את הצעת המחיר עד שלישי.","f":"למשל: נושא: אישור הצעה עד יום ג'. אבקש לאשר את הצעת המחיר עד שלישי."}},{"t":"מסר בדקה","idea":{"m":"כל מסר אפשר לסדר לדקה בשלושה חלקים: מה העיקר, שתי סיבות, ומה הצעד הבא. מתחילים בעיקר, כי זה מה שהאחר יזכור גם אם יחתכו אותך באמצע.","f":"כל מסר אפשר לסדר לדקה בשלושה חלקים: מה העיקר, שתי סיבות, ומה הצעד הבא. מתחילים בעיקר, כי זה מה שהאחר יזכור גם אם יחתכו אותך באמצע."},"ex":{"m":"נסח דקה על הנושא הכי חשוב שלך השבוע: עיקר, שתי סיבות, צעד הבא.","f":"נסחי דקה על הנושא הכי חשוב שלך השבוע: עיקר, שתי סיבות, צעד הבא."},"ph":{"m":"למשל: אני מציע להחליף ספק. הוא מאחר, והוא יקר. נחליט עד חמישי?","f":"למשל: אני מציעה להחליף ספק. הוא מאחר, והוא יקר. נחליט עד חמישי?"}},{"t":"משוב בונה","idea":{"m":"משוב שאפשר ליישם מתאר התנהגות מסוימת ואת השפעתה, ומציע שינוי אחד. \"בישיבה קטעת את דנה פעמיים, והיא הפסיקה לדבר. בפעם הבאה תן לה לסיים\".","f":"משוב שאפשר ליישם מתאר התנהגות מסוימת ואת השפעתה, ומציע שינוי אחד. \"בישיבה קטעת את דנה פעמיים, והיא הפסיקה לדבר. בפעם הבאה תן לה לסיים\"."},"ex":{"m":"כתוב משוב אחד למישהו: מה ראית, איזו השפעה היה לזה, ומה תבקש לשנות.","f":"כתבי משוב אחד למישהו: מה ראית, איזו השפעה היה לזה, ומה תבקשי לשנות."},"ph":{"m":"למשל: בהצגה דיברת שמונה דקות בלי שאלות. הקהל התנתק. בפעם הבאה עצור באמצע.","f":"למשל: בהצגה דיברת שמונה דקות בלי שאלות. הקהל התנתק. בפעם הבאה עצור באמצע."}},{"t":"קבלת ביקורת","idea":{"m":"כשמבקרים אותך, לא עונים מיד. נושמים, מבקשים דוגמה אחת (\"אפשר דוגמה?\"), ומסכמים מה שהבנת. רק אחר כך מחליטים אם להסכים, להסכים חלקית או לא להסכים.","f":"כשמבקרים אותך, לא עונים מיד. נושמים, מבקשים דוגמה אחת (\"אפשר דוגמה?\"), ומסכמים מה שהבנת. רק אחר כך מחליטים אם להסכים, להסכים חלקית או לא להסכים."},"ex":{"m":"כתוב מה תגיד בפעם הבאה שמבקרים אותך: בקשת דוגמה, ומשפט סיכום.","f":"כתבי מה תגידי בפעם הבאה שמבקרים אותך: בקשת דוגמה, ומשפט סיכום."},"ph":{"m":"למשל: אפשר דוגמה אחת? אם הבנתי, הדוח היה ארוך מדי. אחשוב על זה.","f":"למשל: אפשר דוגמה אחת? אם הבנתי, הדוח היה ארוך מדי. אחשוב על זה."}},{"t":"שכנוע בלי לחץ","idea":{"m":"כדי לשכנע בלי לדחוף, שואלים מה חשוב לאדם ומחברים אליו את ההצעה. \"אמרת שחשוב לך לחסוך זמן, והפתרון הזה חוסך שעה ביום\". הצד השני מגיע למסקנה בעצמו.","f":"כדי לשכנע בלי לדחוף, שואלים מה חשוב לאדם ומחברים אליו את ההצעה. \"אמרת שחשוב לך לחסוך זמן, והפתרון הזה חוסך שעה ביום\". הצד השני מגיע למסקנה בעצמו."},"ex":{"m":"כתוב שאלה אחת על מה שחשוב למישהו, ומשפט שמחבר אליו הצעה שלך.","f":"כתבי שאלה אחת על מה שחשוב למישהו, ומשפט שמחבר אליו הצעה שלך."},"ph":{"m":"למשל: מה הכי חשוב לך בפוליסה? אם זה מחיר, הנה האפשרות הזולה.","f":"למשל: מה הכי חשוב לך בפוליסה? אם זה מחיר, הנה האפשרות הזולה."}},{"t":"ניהול ויכוח","idea":{"m":"בוויכוח מתחילים מהסכמה: \"אנחנו שניים רוצים שהפרויקט יצליח\". אחר כך מפרידים בין העובדות למה שאני מרגיש, ושואלים \"מה היית משנה?\". כך הוויכוח הופך לפתרון.","f":"בוויכוח מתחילים מהסכמה: \"אנחנו שניים רוצים שהפרויקט יצליח\". אחר כך מפרידים בין העובדות למה שאני מרגיש, ושואלים \"מה היית משנה?\". כך הוויכוח הופך לפתרון."},"ex":{"m":"כתוב משפט הסכמה ושאלה שתפתח בהן ויכוח אחד שמחכה לך.","f":"כתבי משפט הסכמה ושאלה שתפתחי בהן ויכוח אחד שמחכה לך."},"ph":{"m":"למשל: שנינו רוצים שהלקוח יישאר. מה לדעתך היינו יכולים לעשות אחרת?","f":"למשל: שנינו רוצים שהלקוח יישאר. מה לדעתך היינו יכולים לעשות אחרת?"}},{"t":"שיחה קשה","idea":{"m":"שיחה קשה מתחילה במטרה ולא במבוכה: \"אני רוצה לדבר על משהו כי חשוב לי שנמשיך לעבוד טוב\". אחר כך אומרים עובדה אחת, שואלים לדעתו, ומקשיבים עד הסוף.","f":"שיחה קשה מתחילה במטרה ולא במבוכה: \"אני רוצה לדבר על משהו כי חשוב לי שנמשיך לעבוד טוב\". אחר כך אומרים עובדה אחת, שואלים לדעתו, ומקשיבים עד הסוף."},"ex":{"m":"כתוב את שני המשפטים הראשונים של שיחה קשה שאתה דוחה.","f":"כתבי את שני המשפטים הראשונים של שיחה קשה שאת דוחה."},"ph":{"m":"למשל: חשוב לי שנעבוד טוב ביחד. רציתי לדבר על האיחורים בשבוע האחרון.","f":"למשל: חשוב לי שנעבוד טוב ביחד. רציתי לדבר על האיחורים בשבוע האחרון."}},{"t":"התרגשות לפני הופעה","idea":{"m":"התרגשות ופחד נראים בגוף אותו דבר, ולכן אפשר לומר לעצמך \"אני נרגש\" ולא \"אני מפחד\". נשימה איטית של ארבע שניות פנימה ושש החוצה, שלוש פעמים, מרגיעה את הדופק.","f":"התרגשות ופחד נראים בגוף אותו דבר, ולכן אפשר לומר לעצמך \"אני נרגש\" ולא \"אני מפחד\". נשימה איטית של ארבע שניות פנימה ושש החוצה, שלוש פעמים, מרגיעה את הדופק."},"ex":{"m":"כתוב מה תעשה בחמש הדקות לפני הופעה או פגישה חשובה: נשימה ומשפט פנימי.","f":"כתבי מה תעשי בחמש הדקות לפני הופעה או פגישה חשובה: נשימה ומשפט פנימי."},"ph":{"m":"למשל: אנשום שלוש פעמים ואגיד לעצמי: אני מוכן ויש לי מה לומר.","f":"למשל: אנשום שלוש פעמים ואגיד לעצמי: אני מוכנה ויש לי מה לומר."}},{"t":"פתיחה וסיום","idea":{"m":"הדקה הראשונה והאחרונה של דיבור הן מה שזוכרים. פותחים בשאלה, מספר או סיפור קצר, ולא ב\"שלום, אני רוצה לדבר על...\". וסוגרים בבקשה אחת ברורה, ולא ב\"זה הכול\".","f":"הדקה הראשונה והאחרונה של דיבור הן מה שזוכרים. פותחים בשאלה, מספר או סיפור קצר, ולא ב\"שלום, אני רוצה לדבר על...\". וסוגרים בבקשה אחת ברורה, ולא ב\"זה הכול\"."},"ex":{"m":"כתוב פתיחה בת משפט אחד וסיום בבקשה אחת לדיבור שאתה עומד לתת.","f":"כתבי פתיחה בת משפט אחד וסיום בבקשה אחת לדיבור שאת עומדת לתת."},"ph":{"m":"למשל: פתיחה: כמה שעות הלכו לפגישות השבוע? סיום: אני מבקש לבטל אחת מהן.","f":"למשל: פתיחה: כמה שעות הלכו לפגישות השבוע? סיום: אני מבקשת לבטל אחת מהן."}},{"t":"הצגה בפני קבוצה","idea":{"m":"בהצגה בפני קבוצה אומרים בתחילה מה הסדר: \"שלושה חלקים, עשר דקות\". כל חלק נפתח במשפט מפתח, ומסתכלים בכל פעם על אדם אחר בחדר. כך הקבוצה מתמצאת ומרגישה שמדברים אליה.","f":"בהצגה בפני קבוצה אומרים בתחילה מה הסדר: \"שלושה חלקים, עשר דקות\". כל חלק נפתח במשפט מפתח, ומסתכלים בכל פעם על אדם אחר בחדר. כך הקבוצה מתמצאת ומרגישה שמדברים אליה."},"ex":{"m":"כתוב את שלושת חלקי ההצגה הבאה שלך, ומשפט מפתח אחד לכל חלק.","f":"כתבי את שלושת חלקי ההצגה הבאה שלך, ומשפט מפתח אחד לכל חלק."},"ph":{"m":"למשל: חלק אחד: איפה אנחנו. שתיים: מה השתנה. שלוש: מה מבקשים.","f":"למשל: חלק אחד: איפה אנחנו. שתיים: מה השתנה. שלוש: מה מבקשים."}},{"t":"הומור טבעי","idea":{"m":"הומור שעובד הוא קטן ועל עצמך או על המצב המשותף. \"התקציב שלנו כמו הקפה במשרד: קצת, ושוב נגמר\". הומור על אחרים או בנושאים רגישים עלול להרחיק.","f":"הומור שעובד הוא קטן ועל עצמך או על המצב המשותף. \"התקציב שלנו כמו הקפה במשרד: קצת, ושוב נגמר\". הומור על אחרים או בנושאים רגישים עלול להרחיק."},"ex":{"m":"כתוב הערה הומוריסטית קצרה על מצב משותף בעבודה שלך, בלי לפגוע באיש.","f":"כתבי הערה הומוריסטית קצרה על מצב משותף בעבודה שלך, בלי לפגוע באיש."},"ph":{"m":"למשל: הישיבה הזאת הייתה אמורה להיות חצי שעה, אז עברנו כבר לארוחת ערב.","f":"למשל: הישיבה הזאת הייתה אמורה להיות חצי שעה, אז עברנו כבר לארוחת ערב."}},{"t":"נטוורקינג","idea":{"m":"נטוורקינג טוב הוא לתת לפני לבקש. פונים לאדם עם הערה אמיתית על עבודתו, מציעים עזרה קטנה או חיבור, ואחרי הפגישה שולחים הודעה קצרה. הקשר נבנה כשהוא לא תלוי בבקשה.","f":"נטוורקינג טוב הוא לתת לפני לבקש. פונים לאדם עם הערה אמיתית על עבודתו, מציעים עזרה קטנה או חיבור, ואחרי הפגישה שולחים הודעה קצרה. הקשר נבנה כשהוא לא תלוי בבקשה."},"ex":{"m":"כתוב הודעה קצרה לאדם מקצועי שאתה מעריך: הערה אמיתית ועזרה קטנה שאתה יכול להציע.","f":"כתבי הודעה קצרה לאדם מקצועי שאת מעריכה: הערה אמיתית ועזרה קטנה שאת יכולה להציע."},"ph":{"m":"למשל: קראתי את הפוסט שלך על ביטוח. אני יכול להפנות אליך שלושה לקוחות שמחפשים.","f":"למשל: קראתי את הפוסט שלך על ביטוח. אני יכולה להפנות אליך שלושה לקוחות שמחפשים."}}],"th":[{"t":"ארמון הזיכרון","idea":{"m":"בוחרים מסלול קבוע ומוכר, למשל הדרך מהכניסה לבית עד המיטה, ומסמנים בו חמש עד עשר תחנות לפי הסדר. כל פריט חדש מונח בתחנה אחת כתמונה בולטת. כדי להיזכר, צועדים במסלול בראש.","f":"בוחרים מסלול קבוע ומוכר, למשל הדרך מהכניסה לבית עד המיטה, ומסמנים בו חמש עד עשר תחנות לפי הסדר. כל פריט חדש מונח בתחנה אחת כתמונה בולטת. כדי להיזכר, צועדים במסלול בראש."},"ex":{"m":"בחר מסלול מוכר, כתוב חמש תחנות בו לפי הסדר, והנח בכל אחת פריט מהרשימה שלך.","f":"בחרי מסלול מוכר, כתבי חמש תחנות בו לפי הסדר, והניחי בכל אחת פריט מהרשימה שלך."},"ph":{"m":"למשל: דלת כניסה, מראה, מטבח, מקרר, מרפסת.","f":"למשל: דלת כניסה, מראה, מטבח, מקרר, מרפסת."}},{"t":"זיכרון שמות","idea":{"m":"שם נשכח כי לא הקשבנו לו ברגע ההיכרות. חוזרים על השם בקול מיד, משתמשים בו פעם נוספת בשיחה, ומקשרים אותו לתמונה או לאדם מוכר עם אותו שם.","f":"שם נשכח כי לא הקשבנו לו ברגע ההיכרות. חוזרים על השם בקול מיד, משתמשים בו פעם נוספת בשיחה, ומקשרים אותו לתמונה או לאדם מוכר עם אותו שם."},"ex":{"m":"כתוב שם של אדם שפגשת לאחרונה, ומה תקשור אליו כדי לזכור אותו.","f":"כתבי שם של אדם שפגשת לאחרונה, ומה תקשרי אליו כדי לז  אבדוק קודם סעיף ביטול ותשלומים, ואקרא אותם לאט."}},{"t":"מניעת הסחות","idea":{"m":"מזהים את שלוש ההסחות שחוזרות הכי הרבה, ומוסיפים לכל אחת חיכוך: הטלפון בחדר אחר, האתר חסום, ופתק לרעיונות שקופצים. ההסחה עדיין אפשרית, אבל דורשת מאמץ.","f":"מזהים את שלוש ההסחות שחוזרות הכי הרבה, ומוסיפים לכל אחת חיכוך: הטלפון בחדר אחר, האתר חסום, ופתק לרעיונות שקופצים. ההסחה עדיין אפשרית, אבל דורשת מאמץ."},"ex":{"m":"כתוב שלוש הסחות שחוזרות אצלך ופעולה שתקשה על כל אחת.","f":"כתבי שלוש הסחות שחוזרות אצלך ופעולה שתקשה על כל אחת."},"ph":{"m":"למשל: וואטסאפ, הטלפון בתיק בחדר אחר.","f":"למשל: וואטסאפ, הטלפון בתיק בחדר אחר."}},{"t":"עבודה עמוקה","idea":{"m":"עבודה עמוקה היא גוש של תשעים דקות על משימה אחת קשה, עם תוצר מוגדר מראש. קובעים אותו ביומן בשעה שבה החשיבה חדה, ומתחילים בטקס קבוע, כמו כוס מים ופתיחת מסמך ריק.","f":"עבודה עמוקה היא גוש של תשעים דקות על משימה אחת קשה, עם תוצר מוגדר מראש. קובעים אותו ביומן בשעה שבה החשיבה חדה, ומתחילים בטקס קבוע, כמו כוס מים ופתיחת מסמך ריק."},"ex":{"m":"קבע ביומן גוש אחד לשבוע הקרוב וכתוב את התוצר שתסיים בו.","f":"קבעי ביומן גוש אחד לשבוע הקרוב וכתבי את התוצר שתסיימי בו."},"ph":{"m":"למשל: יום שלישי 9:00 עד 10:30, טיוטה ראשונה של הצעת המחיר.","f":"למשל: יום שלישי 9:00 עד 10:30, טיוטה ראשונה של הצעת המחיר."}},{"t":"תעדוף","idea":{"m":"שואלים על כל משימה: כמה היא משפיעה על המטרה, ועד מתי היא באמת חייבת להיעשות. חשוב ודחוף נעשה היום, חשוב ולא דחוף מקבל זמן ביומן, והשאר מואצל או נמחק.","f":"שואלים על כל משימה: כמה היא משפיעה על המטרה, ועד מתי היא באמת חייבת להיעשות. חשוב ודחוף נעשה היום, חשוב ולא דחוף מקבל זמן ביומן, והשאר מואצל או נמחק."},"ex":{"m":"כתוב חמש משימות שלך והצמד לכל אחת: היום, ביומן, להאצלה או למחיקה.","f":"כתבי חמש משימות שלך והצמידי לכל אחת: היום, ביומן, להאצלה או למחיקה."},"ph":{"m":"למשל: לשלוח הצעה ללקוח, היום. לסדר ארכיון, למחיקה.","f":"למשל: לשלוח הצעה ללקוח, היום. לסדר ארכיון, למחיקה."}},{"t":"ניהול אנרגיה","idea":{"m":"האנרגיה משתנה במהלך היום, ולכן משבצים משימות קשות לשעות החזקות ומשימות קלות לשעות החלשות. מעקב קצר של שלושה ימים חושף מתי החדות שלך גבוהה.","f":"האנרגיה משתנה במהלך היום, ולכן משבצים משימות קשות לשעות החזקות ומשימות קלות לשעות החלשות. מעקב קצר של שלושה ימים חושף מתי החדות שלך גבוהה."},"ex":{"m":"רשום באילו שעות החדות שלך גבוהה ובאילו נמוכה, ושבץ משימה קשה אחת לשעה החזקה.","f":"רשמי באילו שעות החדות שלך גבוהה ובאילו נמוכה, ושבצי משימה קשה אחת לשעה החזקה."},"ph":{"m":"למשל: שעות חזקות 8 עד 11, חלשות אחרי הצהריים. הצעת מחיר ב-9, מיילים ב-15.","f":"למשל: שעות חזקות 8 עד 11, חלשות אחרי הצהריים. הצעת מחיר ב-9, מיילים ב-15."}},{"t":"שינה וריכוז","idea":{"m":"שינה לא מספקת פוגעת בקשב ובזיכרון כבר למחרת. קובעים שעת כיבוי קבועה למסכים ושעת קימה קבועה, ובודקים אחרי שבוע איך משתנה הריכוז.","f":"שינה לא מספקת פוגעת בקשב ובזיכרון כבר למחרת. קובעים שעת כיבוי קבועה למסכים ושעת קימה קבועה, ובודקים אחרי שבוע איך משתנה הריכוז."},"ex":{"m":"כתוב באיזו שעה תכבה מסכים הערב, ומה תעשה במקומם.","f":"כתבי באיזו שעה תכבי מסכים הערב, ומה תעשי במקומם."},"ph":{"m":"למשל: מסכים נכבים ב-22:30, קריאה של עשר דקות ואור כבוי ב-23:00.","f":"למשל: מסכים נכבים ב-22:30, קריאה של עשר דקות ואור כבוי ב-23:00."}},{"t":"דחיינות","idea":{"m":"דוחים משימה כשהצעד הראשון נראה גדול או לא ברור. מגדירים צעד של חמש דקות שאפשר להתחיל מיד, כמו לפתוח קובץ ולכתוב כותרת, ומתחייבים רק אליו.","f":"דוחים משימה כשהצעד הראשון נראה גדול או לא ברור. מגדירים צעד של חמש דקות שאפשר להתחיל מיד, כמו לפתוח קובץ ולכתוב כותרת, ומתחייבים רק אליו."},"ex":{"m":"בחר משימה שאתה דוחה וכתוב צעד ראשון של חמש דקות שאפשר לעשות עכשיו.","f":"בחרי משימה שאת דוחה וכתבי צעד ראשון של חמש דקות שאפשר לעשות עכשיו."},"ph":{"m":"למשל: לפתוח את הדוח ולכתוב את שלוש הכותרות.","f":"למשל: לפתוח את הדוח ולכתוב את שלוש הכותרות."}},{"t":"הרגלים קטנים","idea":{"m":"הרגל חדש נבנה כשמצמידים אותו להרגל קיים ומקטינים אותו מאוד: אחרי הקפה של הבוקר, כותבים משפט אחד ביומן. כשזה יציב, מגדילים לאט.","f":"הרגל חדש נבנה כשמצמידים אותו להרגל קיים ומקטינים אותו מאוד: אחרי הקפה של הבוקר, כותבים משפט אחד ביומן. כשזה יציב, מגדילים לאט."},"ex":{"m":"כתוב הרגל חדש בניסוח: אחרי X, אעשה Y בגודל של פחות משתי דקות.","f":"כתבי הרגל חדש בניסוח: אחרי X, אעשה Y בגודל של פחות משתי דקות."},"ph":{"m":"למשל: אחרי צחצוח שיניים, עשר כפיפות ברכיים.","f":"למשל: אחרי צחצוח שיניים, עשר כפיפות ברכיים."}},{"t":"עצירה לפני תגובה","idea":{"m":"בין הגירוי לתגובה יש רווח של נשימה אחת. כשמקבלים הודעה מכעיסה, מחכים עשר שניות או כותבים טיוטה בלי לשלוח, ורק אחר כך בוחרים מה לענות.","f":"בין הגירוי לתגובה יש רווח של נשימה אחת. כשמקבלים הודעה מכעיסה, מחכים עשר שניות או כותבים טיוטה בלי לשלוח, ורק אחר כך בוחרים מה לענות."},"ex":{"m":"כתוב משפט עצירה קבוע שתגיד לעצמך כשאתה כועס, ומה תעשה בעשר השניות.","f":"כתבי משפט עצירה קבוע שתגידי לעצמך כשאת כועסת, ומה תעשי בעשר השניות."},"ph":{"m":"למשל: לא עכשיו. נשימה, כוס מים, ואז אענה.","f":"למשל: לא עכשיו. נשימה, כוס מים, ואז אענה."}},{"t":"מטריצת החלטות","idea":{"m":"כשיש שלוש אפשרויות ויותר, בונים טבלה: אפשרויות בשורות וקריטריונים בעמודות. נותנים לכל קריטריון משקל מאחד עד חמש וציון לכל אפשרות, ומכפילים. אם התוצאה מפתיעה, בודקים מה באמת חשוב.","f":"כשיש שלוש אפשרויות ויותר, בונים טבלה: אפשרויות בשורות וקריטריונים בעמודות. נותנים לכל קריטריון משקל מאחד עד חמש וציון לכל אפשרות, ומכפילים. אם התוצאה מפתיעה, בודקים מה באמת חשוב."},"ex":{"m":"בחר החלטה עם שלוש אפשרויות, כתוב שלושה קריטריונים עם משקל, ותן ציון לכל אפשרות.","f":"בחרי החלטה עם שלוש אפשרויות, כתבי שלושה קריטריונים עם משקל, ותני ציון לכל אפשרות."},"ph":{"m":"למשל: מחיר (משקל 5), שירות (4), קרבה (2).","f":"למשל: מחיר (משקל 5), שירות (4), קרבה (2)."}},{"t":"יומן החלטות","idea":{"m":"בזמן החלטה חשובה כותבים: מה החלטתי, למה, מה ציפיתי שיקרה, ועד מתי אבדוק. אחרי המועד חוזרים ובודקים. כך לומדים מהחשיבה ולא רק מהתוצאה.","f":"בזמן החלטה חשובה כותבים: מה החלטתי, למה, מה ציפיתי שיקרה, ועד מתי אבדוק. אחרי המועד חוזרים ובודקים. כך לומדים מהחשיבה ולא רק מהתוצאה."},"ex":{"m":"כתוב החלטה אחת מהשבוע: מה החלטת, למה, מה אתה מצפה שיקרה ומתי תבדוק.","f":"כתבי החלטה אחת מהשבוע: מה החלטת, למה, מה את מצפה שיקרה ומתי תבדקי."},"ph":{"m":"למשל: החלטתי לשכור עובד נוסף כי יש רשימת המתנה. בדיקה בעוד חודש.","f":"למשל: הח אם יש הנחיה לאן מסתכלים?","האם אפשר לבצע את זה לפני הפגישה הבאה?"],"next":{"m":"לפני שיחת הווידאו הבאה, בדוק במסך איך אתה נראה, ותקן רק דבר אחד: גובה המצלמה.","f":"לפני שיחת הווידאו הבאה, בדקי במסך איך את נראית, ותקני רק דבר אחד: גובה המצלמה."}},"ch-16":{"goal":"בוואטסאפ קוראים את השורה הראשונה ומחליטים אם להמשיך. כשהעיקר שם, ההודעה נענית מהר יותר. חום נשאר עם מילה אחת כמו תודה.","ex":[{"t":"תיאום עם קבלן","a":"יוסי, תאשר לי עד מחר בצהריים שאתם מגיעים ביום ראשון בשמונה. אם לא, אחפש קבלן אחר. תודה!","why":"שורה ראשונה עם בקשה ומועד, תוצאה ברורה, ומילה חמה בסוף."},{"t":"הודעה לקבוצת הורים","a":"היי הורים, חשוב: הטיול ביום חמישי מתחיל בשבע ולא בשמונה. נא לאשר עם אגודל.","why":"העיקר בפתח, והבקשה לאישור קלה ומיידית."}],"weak":{"a":"היי מה נשמע, יש לי שאלה קטנה, אתה פנוי?","why":"ההודעה לא מכילה את השאלה. הצד השני צריך לענות רק כדי לשמוע מה רוצים, וחבל על הסבב."},"checks":["האם העיקר בשורה הראשונה?","האם יש מועד או פעולה מסוימת?","האם אפשר לקרוא את זה בחמש שניות?","האם יש מילה חמה אחת?"],"next":{"m":"היום, לפני שאתה שולח הודעה לא קצרה, קרא רק את השורה הראשונה ובדוק אם העיקר שם.","f":"היום, לפני שאת שולחת הודעה לא קצרה, קראי רק את השורה הראשונה ובדקי אם העיקר שם."}},"ch-17":{"goal":"רוב האנשים סורקים אימייל ולא קוראים אותו. נושא ספציפי ושורה ראשונה שמכילה את העיקר הופכים אותו לדבר שנענה, במקום להישאר בתיבה.","ex":[{"t":"אימייל ללקוח על הצעת מחיר","a":"נושא: הצעת מחיר לחידוש פוליסה, תוקף עד 30.11. רונית, מצורפת ההצעה. אבקש תשובה עד יום חמישי כדי לשמור על המחיר.","why":"הנושא כולל מה ועד מתי. הפתיחה מציגה בקשה, ויש סיבה אמיתית לדחיפות."},{"t":"אימייל לצוות אחרי ישיבה","a":"נושא: שלוש החלטות מישיבת יום שני. 1. ההשקה נדחית ל-15.1. 2. דנה אחראית על התקציב. 3. הצעד הבא: סיכום עד רביעי.","why":"שלוש נקודות, ובכל אחת החלטה או אחראי, כך שאין צורך לפתוח קובץ כדי להבין."}],"weak":{"a":"נושא: שאלה. בוקר טוב, רציתי לשאול משהו בקשר לעניין שדיברנו עליו.","why":"הנושא ריק והפתיחה לא אומרת מה הנושא. הקורא יצטרך לנחש, ובסוף כנראה ידחה את האימייל."},"checks":["האם הנושא אומר מה בפנים?","האם הפתיחה מכילה את העיקר?","האם יש עד שלוש נקודות?","האם יש בסוף צעד הבא עם מי ומתי?"],"next":{"m":"לפני שליחת האימייל הבא, שכתב את הנושא כך שמי שקורא רק אותו יבין מה אתה רוצה ממנו.","f":"לפני שליחת האימייל הבא, שכתבי את הנושא כך שמי שקורא רק אותו יבין מה את רוצה ממנו."}},"ch-18":{"goal":"מסר מסודר הוא קל לזכור ולהעביר הלאה. הבעיה הנפוצה היא להתחיל מרקע. כשהעיקר בפתח, גם בפגישה מקוצרת או בשיחה במעלית המסר עובר.","ex":[{"t":"ישיבה עם מנהלת","a":"אני מציעה להעביר את הגבייה לחשבונית דיגיטלית. זה חוסך שעתיים בשבוע, ומקטין טעויות. נתחיל בספטמבר?","why":"עיקר, שתי סיבות מספריות, ושאלה שמסיימת בהחלטה."},{"t":"שיחה עם בעל הבית","a":"אני מבקש לתקן את הדוד לפני החורף. הוא מטפטף כבר חודש, ובחורף נצטרך מים חמים. אפשר לתאם איש מקצוע השבוע?","why":"הבקשה בפתח, שתי סיבות מוחשיות, והצעד הבא ברור."}],"weak":{"a":"יש כמה דברים שרציתי להעלות, קודם אתן קצת רקע על מה שהיה.","why":"הרקע בא לפני העיקר. אם יקטעו אותך, העיקר לא יגיע בכלל."},"checks":["האם העיקר נאמר בפתח?","האם יש שתי סיבות בלבד?","האם יש צעד הבא או בקשה בסוף?","האם אפשר לומר את זה בדקה?"],"next":{"m":"הקלט את עצמך אומר את הדקה שלך, ובדוק אם העיקר נשמע בחמש השניות הראשונות.","f":"הקליטי את עצמך אומרת את הדקה שלך, ובדקי אם העיקר נשמע בחמש השניות הראשונות."}},"ch-19":{"goal":"משוב על אופי (\"אתה לא מקשיב\") מעורר התגוננות. משוב על התנהגות והשפעה נותן משהו שאפשר לשנות. בקשה לשינוי אחד בלבד מגדילה את הסיכוי שיקרה.","ex":[{"t":"משוב לעובד שמאחר","a":"יוסי, השבוע הגעת לישיבה אחרי שמונה וחצי שלוש פעמים, ואנחנו התחלנו בלעדייך. אבקש שתגיע עד שמונה ועשרים.","why":"מתאר מספר ומועד, את ההשפעה על הצוות, ובקשה אחת מסוימת."},{"t":"משוב לבן הזוג","a":"בארוחה אתמול הסתכלת בטלפון כמעט כל הזמן, והרגשתי שאני מדברת לעצמי. נשמח לשים את הטלפונים במגירה בארוחות?","why":"תיאור עובדתי, רגש אישי בגוף ראשון, והצעה משותפת במקום האשמה."}],"weak":{"a":"אתה פשוט לא מקשיב לאף אחד.","why":"זו הכללה על אופי. אין התנהגות מסוימת שאפשר לשנות, ולכן האדם יתגונן במקום לשמוע."},"checks":["האם יש התנהגות מסוימת ולא תכונה?","האם מתוארת ההשפעה?","האם יש בקשה אחת לשינוי?","האם הניסוח נמנע מ\"תמיד\" ומ\"אף פעם\"?"],"next":{"m":"השבוע, תן משוב אחד בנוסח התנהגות, השפעה ובקשה, והתחל במשפט אחד חיובי אם הוא אמיתי.","f":"השבוע, תני משוב אחד בנוסח התנהגות, השפעה ובקשה, והתחלי במשפט אחד חיובי אם הוא אמיתי."}},"ch-20":{"goal":"תגובה מיידית להגנה מעבירה את השיחה לוויכוח. בקשת דוגמה נותנת זמן, ומראה שהביקורת נלקחת ברצינות. בלי להסכים בהכרח, אפשר להפיק ממנה משהו.","ex":[{"t":"הערה על הצגה ללקוח","a":"תודה. אפשר דוגמה מהצגה? אם הבנתי נכון, היו יותר מדי נתונים בשקף הראשון. אבדוק אם לצמצם.","why":"הדוגמה מבהירה את הביקורת, והסיכום מראה הקשבה בלי להתחייב מראש."},{"t":"אמא אומרת שאני לא מתקשרת","a":"זה כואב לי לשמוע. אפשר לומר מתי הרגשת שלא התקשרתי? אני רוצה להבין.","why":"הכרה ברגש, בקשת דוגמה, ובלי הגנה מיידית."}],"weak":{"a":"זה לא נכון, אני עשיתי הכול כמו שצריך.","why":"הגנה מיידית עוצרת את השיחה, והמבקר ירגיש שלא שומעים אותו. אין כאן שום מידע על מה בדיוק הפריע."},"checks":["האם יש בקשה לדוגמה מסוימת?","האם יש משפט סיכום של מה שנאמר?","האם נמנעתי מהצדקה מיידית?","האם השארתי לעצמי זמן להחליט?"],"next":{"m":"בפעם הבאה שתקבל הערה, בקש דוגמה אחת לפני שאתה מגיב.","f":"בפעם הבאה שתקבלי הערה, בקשי דוגמה אחת לפני שאת מגיבה."}},"ch-21":{"goal":"לחץ גורם להתנגדות. כשההצעה נבנית על מה שהאדם אמר שחשוב לו, הוא שומע אותה כפתרון לבעיה שלו ולא כמכירה.","ex":[{"t":"לקוחה מתלבטת בין שתי פוליסות","a":"מה הכי מטריד אותך אם משהו קורה? ... אמרת שהכי חשוב לך לא לשלם מהכיס על שיניים. הפוליסה הזו מכסה אותן במלואן.","why":"השאלה מגלה את הערך, וההצעה מצטטת אותו במילים שלה."},{"t":"שכנוע מנהל לאמץ כלי חדש","a":"מה הכי מעכב אתכם בשבוע? ... אם זה העדכונים הידניים, הכלי הזה מבצע אותם לבד ומחזיר לכם בערך שעתיים בשבוע.","why":"מתחיל מהכאב של המנהל, ולא מרשימת תכונות."}],"weak":{"a":"זו הזדמנות מדהימה, כדאי לך להחליט היום.","why":"לחץ זמן בלי קשר לצורך. הלקוח לא הבין למה זה מתאים לו, ולכן ירגיש דחוף ויתנגד."},"checks":["האם יש שאלה על מה שחשוב לאדם?","האם ההצעה מחוברת לתשובה שלו?","האם נמנעתי מלחץ של זמן?","האם האדם יכול לסרב בנוחות?"],"next":{"m":"בשיחה הבאה שבה אתה רוצה לשכנע, שאל \"מה הכי חשוב לך בזה?\" ובנה את ההצעה על התשובה.","f":"בשיחה הבאה שבה את רוצה לשכנע, שאלי \"מה הכי חשוב לך בזה?\" ובנהי את ההצעה על התשובה."}},"ch-22":{"goal":"ויכוח שמתחיל בהאשמה מייצר הגנה. מי שמוצא תחילה מטרה משותפת ושואל שאלה פתוחה, מקטין את המתח ופותח פתרון.","ex":[{"t":"ויכוח עם שותף על תקציב","a":"שנינו רוצים שהעסק ירוויח. אני רואה שההוצאות עלו בעשרים אחוז. איך אתה רואה את זה, ומה היית מקצץ?","why":"הסכמה על המטרה, עובדה אחת מספרית, ושאלה פתוחה."},{"t":"ויכוח עם אחות על חג","a":"שתינו רוצות שאמא תהיה שמחה. אני מרגישה לחוצה מהתכנון. מה היית רוצה שנעשה אחרת השנה?","why":"מתחיל במשותף, מדבר על הרגש בגוף ראשון ומזמין הצעה."}],"weak":{"a":"אתה תמיד עושה מה שאתה רוצה בלי להתחשב בי.","why":"האשמה כללית עם \"תמיד\" מזמינה הגנה וחזרה על ההאשמה, והשיחה לא מתקדמת."},"checks":["האם יש מטרה משותפת בפתיחה?","האם יש הפרדה בין עובדה לרגש?","האם יש שאלה פתוחה?","האם נמנעתי מ\"תמיד\" ו\"אף פעם\"?"],"next":{"m":"בוויכוח הבא, פתח במשפט אחד שמציין מה משותף לכם, לפני שאתה מביע דעה.","f":"בוויכוח הבא, פתחי במשפט אחד שמציין מה משותף לכם, לפני שאת מביעה דעה."}},"ch-23":{"goal":"דחיית שיחה קשה מגדילה אותה. פתיחה עם מטרה חיובית ועובדה אחת מורידה התגוננות, ומאפשרת לשמוע את הצד השני במקום לריב.","ex":[{"t":"שיחה עם עובדת על ירידה בביצועים","a":"רונית, חשוב לי שתצליחי כאן. בחודשיים האחרונים פספסנו שלושה מועדים בפרויקט שלך. איך את רואה את זה?","why":"מטרה חיובית, עובדה מספרית, ושאלה שמזמינה את הצד שלה."},{"t":"שיחה עם חבר שלא החזיר כסף","a":"יוסי, הקשר ביננו חשוב לי ולכן אני מעדיף לומר בגלוי. לפני חצי שנה הלוויתי לך אלפיים שקל. איך נסדר את זה?","why":"המשפט הראשון שומר על הקשר, ושני הבאים עובדתיים ופותרים."}],"weak":{"a":"אנחנו צריכים לדבר. משהו מפריע לי כבר הרבה זמן.","why":"פתיחה מלחיצה ועמומה. הצד השני מתכונן לגרוע מכול, ולא ברור על מה מדברים."},"checks":["האם יש מטרה חיובית בפתיחה?","האם יש עובדה אחת מסוימת?","האם יש שאלה לצד השני?","האם ניסחתי בלי האשמה?"],"next":{"m":"קבע היום זמן לשיחה קשה אחת, וכתוב את שני משפטי הפתיחה שלה.","f":"קבעי היום זמן לשיחה קשה אחת, וכתבי את שני משפטי הפתיחה שלה."}},"ch-24":{"goal":"מי שמנסה לא להתרגש בדרך כלל מתרגש יותר. הדרך היעילה היא לתת להתרגשות שם חיובי ולהרגיע את הגוף בנשימה, ולהוסיף שגרה קבועה.","ex":[{"t":"הצגה בפני הנהלה","a":"חמש דקות לפני, אצא להליכה קצרה במסדרון, אנשום שלוש פעמים ארבע פנימה ושש החוצה, ואגיד לעצמי: אני נרגש, וזה אומר שזה חשוב לי.","why":"שגרה מדויקת עם נשימה, תנועה ומשפט פנימי שנותן שם חיובי."},{"t":"ראיון עבודה","a":"בלובי אשים את הטלפון בתיק, אנשום באיטיות, ואחזור על שני משפטים שאומר בהתחלה על עצמי.","why":"הנשימה מרגיעה והחזרה על משפטי הפתיחה נותנת עוגן."}],"weak":{"a":"אנסה להירגע ולא לחשוב על זה.","why":"\"לא לחשוב\" לא עובד, ואין כאן פעולה מסוימת. הגוף נשאר באותה התרגשות."},"checks":["האם יש פעולה פיזית כמו נשימה?","האם יש משפט פנימי?","האם יש תזמון, כמו חמש דקות לפני?","האם הגדרתי את זה כהתרגשות ולא פחד?"],"next":{"m":"תרגל את הנשימה הזאת פעם אחת היום, כדי שבפעם הבאה שתתרגש היא כבר תהיה מוכרת.","f":"תרגלי את הנשימה הזאת פעם אחת היום, כדי שבפעם הבאה שתתרגשי היא כבר תהיה מוכרת."}},"ch-25":{"goal":"פתיחה חלשה מבזבזת את תשומת הלב כשהיא בשיאה, וסיום חלש משאיר את הקהל בלי כיוון. פתיחה מסקרנת וסיום עם בקשה מסוימת הופכים דיבור לפעולה.","ex":[{"t":"דיבור בפני הצוות על ישיבות","a":"פתיחה: כמה שעות הלכו לנו השבוע על ישיבות? שתים עשרה. סיום: אבקש שנבטל שתיים מהן החל משבוע הבא.","why":"מספר מסקרן בפתיחה, ובסיום בקשה אחת שאפשר לבצע."},{"t":"הרצאה לשכונה על בטיחות","a":"פתיחה: בשנה שעברה היו כאן שלוש פריצות בבניין אחד. סיום: אני מבקשת שכל אחד מכם יתקין נעילה נוספת עד סוף החודש.","why":"פרט אמיתי שתופס תשומת לב, ובקשה עם מועד."}],"weak":{"a":"שלום לכולם, היום אדבר על הבטיחות. תודה רבה שהקשבתם.","why":"פתיחה ללא מסר וסיום שמסתיים בתודה בלבד. אין מה לזכור ואין מה לעשות."},"checks":["האם הפתיחה מסקרנת ולא רק מציגה נושא?","האם הסיום מכיל בקשה אחת?","האם יש בו מועד או צעד?","האם אפשר לומר כל אחד מהם בפחות מחצי דקה?"],"next":{"m":"כתוב פתיחה וסיום לדיבור הקרוב שלך, ואמור אותם בקול לפני שתכתוב את האמצע.","f":"כתבי פתיחה וסיום לדיבור הקרוב שלך, ואמרי אותם בקול לפני שתכתבי את האמצע."}},"ch-26":{"goal":"קבוצה שלא יודעת לאן מובילים אותה מאבדת קשב. מפת דרכים ומשפטי מפתח מאפשרים לחזור לעניין גם אחרי הסחה. מבט משתנה נותן תחושת שיח ולא הרצאה.","ex":[{"t":"הצגת תוצאות רבעון","a":"שלושה חלקים: מכירות, עלויות, ותוכנית. משפטי מפתח: \"המכירות עלו בשמונה אחוז\", \"העלויות נשארו יציבות\", \"אנחנו מבקשים תקציב נוסף לשיווק\".","why":"יש מבנה ברור ומשפט מפתח לכל חלק, שאפשר לזכור גם אחרי הפסקה."},{"t":"הצגה בפני ועד הבית","a":"אתחיל במילים: \"שלושה נושאים, עשר דקות\". אדבר על המעלית, על החניה ועל התקציב, ובכל נושא אסתכל על שכן אחר.","why":"הכרזת הסדר מרגיעה, והמבט המתחלף מערב את כולם."}],"weak":{"a":"אכין מצגת טובה ואדבר בצורה ברורה.","why":"אין מבנה ואין משפטי מפתח. המצגת היא כלי ולא תכנית לדיבור."},"checks":["האם יש שלושה חלקים בלבד?","האם יש משפט מפתח לכל חלק?","האם הכרזתי בהתחלה על הסדר והזמן?","האם תכננתי לשנות את המבט בין אנשים?"],"next":{"m":"לפני ההצגה הבאה, הכרז בקול על שלושת החלקים במשפט אחד, ובדוק שהוא ברור.","f":"לפני ההצגה הבאה, הכריזי בקול על שלושת החלקים במשפט אחד, ובדוקי שהוא ברור."}},"ch-27":{"goal":"הומור נבנה מהמשותף ומהחולשות שלנו, לא מהחולשות של אחרים. מספיק משפט אחד, ואין צורך להסביר או לצחוק בעצמך.","ex":[{"t":"ישיבה שנמשכת הרבה","a":"יש לנו כאן סיכוי טוב לשבור שיא ישיבה. אני מציע שנבקש ארוחת ערב מהמנהל.","why":"הומור על המצב המשותף ועל עצמי. כולם נהנים ואף אחד לא נפגע."},{"t":"טעות שלי בהצגה","a":"אני רואה שבשקף הזה החלטתי להפתיע את כולם. תחזירו לי בבקשה את המספר הנכון.","why":"מקבלת את הטעות בחיוך ומתקדמת. זה מרגיע את הקהל."}],"weak":{"a":"אספר בדיחה שראיתי באינטרנט כדי להרגיע את האווירה.","why":"בדיחה מוכנה לא קשורה למצב, ועלולה להיות פוגעת. הומור טוב נולד מהרגע ומהמשותף."},"checks":["האם ההומור על עצמי או על מצב משותף?","האם אף אחד לא נפגע?","האם הוא קצר, משפט אחד?","האם הוא מתאים לאווירה?"],"next":{"m":"היום, מצא הזדמנות אחת להעיר הערה קטנה וחביבה על המצב המשותף, והמשך הלאה.","f":"היום, מצאי הזדמנות אחת להעיר הערה קטנה וחביבה על המצב המשותף, והמשיכי הלאה."}},"ch-28":{"goal":"אנשים עונים למי שנתן להם ערך. פנייה שמתחילה בבקשה נשמעת כניצול. הערה אמיתית, הצעה קטנה, ומעקב קצר בונים קשר שאפשר לחזור אליו אחר כך.","ex":[{"t":"אחרי הרצאה בכנס","a":"דנה, ההרצאה שלך על שימור לקוחות עזרה לי מאוד, במיוחד הדוגמה של הטלפון אחרי חודש. אשמח לשלוח לך מאמר שקראתי על הנושא.","why":"הערה מסוימת, הצעה קטנה ומיידית, בלי שום בקשה."},{"t":"הודעה אחרי פגישה ראשונה","a":"היה נעים להכיר אותך אתמול. כפי שהבטחתי, מצורף הקישור לספר. אשמח להמשיך לשוחח בעוד חודש.","why":"מקיים הבטחה, מוסיף ערך, ומציע המשך בלי לחץ."}],"weak":{"a":"אשלח לו בקשה ללינקדאין ואבקש שיעזור לי למצוא עבודה.","why":"בקשה מיידית מאדם שלא מכיר אותי. אין ערך ואין קשר קודם, ולכן סביר שלא יענה."},"checks":["האם יש הערה אמיתית על האדם או עבודתו?","האם יש הצעה לעזור?","האם אין בקשה מיידית?","האם יש מעקב קצר אחרי הפגישה?"],"next":{"m":"השבוע, שלח הודעה אחת למישהו שאתה מעריך, עם הערה אמיתית והצעת עזרה אחת.","f":"השבוע, שלחי הודעה אחת למישהו שאת מעריכה, עם הערה אמיתית והצעת עזרה אחת."}},"th-5":{"goal":"בשיעור הזיכרון קישרנו פריטים לחדרים. כאן מרחיבים את זה למסלול קבוע עם סדר, שאפשר להשתמש בו שוב ושוב. הסדר של המסלול מאפשר לזכור רשימה ארוכה, נאום או סדר יום בלי דף.","ex":[{"t":"רשימת נושאים לישיבה","a":"מסלול: דלת, קולב, מראה, מטבח, ספה. בדלת תקוע שטר ענק של 40 אלף (תקציב). על הקולב תלויים עובדים בחולצות זהות (גיוס). במראה רואים לקוח כועס (תלונות).","why":"כל תחנה מקבלת תמונה מוזרה אחת עם רמז לנושא, והסדר נקבע על ידי המסלול ולא על ידי הזיכרון."},{"t":"ברכה בחתונה של אחיין","a":"אשתמש באותו מסלול. בדלת: סבתא מחבקת (פתיחה). בקולב: תינוק תלוי (סיפור ילדות). במראה: הכלה והחתן (הברכה). במטבח: כוסות מורמות (סיום).","why":"המסלול נשאר קבוע ורק התמונות מתחלפות, ולכן אפשר להשתמש בו שוב לכל רשימה חדשה."}],"weak":{"a":"אזכור את הרשימה לפי הסדר בראש.","why":"אין מסלול ואין תמונות. בלי תחנות מוגדרות אין לזיכרון במה להיעזר."},"checks":["האם המסלול מוכר מספיק כדי לצעוד בו בעיניים עצומות?","האם לכל תחנה יש פריט אחד בלבד?","האם התמונה בכל תחנה מוזרה או גדולה?","האם אפשר לעבור על המסלול מההתחלה ולחזור על הכול לפי הסדר?"],"next":{"m":"הערב עבור על המסלול ברגל או בראש, ואמור בקול את הפריטים לפי הסדר.","f":"הערב עברי על המסלול ברגל או בראש, ואמרי בקול את הפריטים לפי הסדר."}},"th-6":{"goal":"שכחת שם היא הרגע המביך שכולנו מכירים, ובכל זאת כמעט אף אחד לא מתאמן עליה. שלושה מהלכים בדקה הראשונה, חזרה, שימוש וקישור, מחליפים את התקווה שנזכור.","ex":[{"t":"היכרות באירוע משפחתי","a":"\"נעים מאוד, דנה.\" אענה: \"נעים מאוד, דנה\", אגיד את השם שוב באמצע השיחה, ואקשר אותה לדנה בת הדודה שלי, כי לשתיהן שיער מתולתל.","why":"יש חזרה מיידית, שימוש שני בשיחה וקישור למישהי מוכרת. שלוש נקודות אחיזה לשם."},{"t":"לקוח חדש בסוכנות","a":"אחרי שיוסי אמר את שמו, אכתוב אותו בפתק לצד מה שביקש, ובסוף הפגישה אסכם: \"יוסי, אשלח לך הצעה עד מחר\".","why":"הכתיבה והמשפט הסוגר מחזקים את השם, והלקוח מרגיש שרואים אותו."}],"weak":{"a":"אשים לב יותר לשמות.","why":"אין פעולה מוגדרת ברגע ההיכרות. כוונה לא מחליפה חזרה וקישור."},"checks":["האם יש חזרה על השם בקול מיד אחרי ששמעו אותו?","האם יש שימוש שני בשם בתוך השיחה?","האם השם מקושר לתמונה או לאדם מוכר?","האם נבחר רגע מסוים לבצע, ולא רק כוונה כללית?"],"next":{"m":"באירוע או בפגישה הבאה חזור על כל שם בקול מיד כשאתה שומע אותו, וכתוב אותו בפתק בסוף היום.","f":"באירוע או בפגישה הבאה חזרי על כל שם בקול מיד כשאת שומעת אותו, וכתבי אותו בפתק בסוף היום."}},"th-7":{"goal":"הזיכרון מתחזק דווקא כשצריך להתאמץ כדי להיזכר. חזרה מרווחת משתמשת בזה: מעט זמן בכל פעם, והרבה פחות שכחה. הקושי הקל בהיזכרות הוא סימן שהלמידה עובדת.","ex":[{"t":"מילים בשפה חדשה","a":"עשר מילים בספרדית שלמדתי היום. מחר בבוקר אכסה את התרגום ואנסה להיזכר, ביום חמישי שוב, ובשבת הבאה שוב. מילה שנכשלה חוזרת למחר.","why":"יש שלושה תאריכים קבועים, ניסיון היזכרות לפני בדיקה, וכלל ברור לטיפול בטעויות."},{"t":"נהלי חברה לקראת מבחן הסמכה","a":"אקרא את הפרק פעם אחת ואכתוב חמש שאלות על כרטיסיות. ביום ראשון אענה מהזיכרון, ביום רביעי שוב, ורק על מה שטעיתי אחזור לפרק.","why":"השאלות על כרטיסיות הופכות חזרה לניסיון היזכרות, והזמן מתמקד במה שלא נשאר."}],"weak":{"a":"אקרא הכול שוב בערב שלפני המבחן.","why":"חזרה אחת צפופה בסוף יוצרת תחושת ידע, אבל אין בה הפרשים ואין היזכרות, ולכן מה שנלמד נשכח מהר."},"checks":["האם יש לפחות שלושה תאריכים קבועים?","האם ההפרשים בין החזרות גדלים?","האם מנסים להיזכר לפני שפותחים את התשובה?","האם מה שנכשל חוזר מוקדם יותר?"],"next":{"m":"קבע היום ביומן שלוש תזכורות קצרות של חמש דקות לנושא שבחרת.","f":"קבעי היום ביומן שלוש תזכורות קצרות של חמש דקות לנושא שבחרת."}},"th-8":{"goal":"הערות שמעתיקים מילה במילה נראות מסודרות, אבל המוח כמעט לא עבד. ניסוח עצמי ושאלה חושפים מה הבנו ומה לא, ומייצרים חומר שאפשר לבחון בו את עצמנו.","ex":[{"t":"ישיבת צוות שבועית","a":"סיכום: הלקוח ממתין שבועיים למחיר, ורונית שולחת עד יום ג'. שאלה: מי עונה ללקוח ועד מתי? אחר כך אכסה את הסיכום ואענה מהזיכרון.","why":"הסיכום קצר ובמילים עצמיות, והשאלה הופכת אותו לבדיקה."},{"t":"סרטון לימוד על מיסוי עצמאים","a":"אעצור כל חמש דקות ואכתוב משפט אחד: \"מקדמות הן תשלום על חשבון המס, לפי ההכנסה הצפויה\". בצד אכתוב: איך נקבע גובה המקדמה?","why":"העצירה בנקודות קבועות מחייבת הבנה לפני שממשיכים, והשאלה בצד מכוונת לחזרה."}],"weak":{"a":"אכתוב כמה שיותר ממה שהמרצה אומר, כדי לא לפספס.","why":"העתקה היא כתיבה בלי חשיבה. אין כאן ניסוח עצמי ואין שאלה, ולכן אין במה לבדוק את ההבנה."},"checks":["האם הסיכום במילים עצמיות ולא מועתק?","האם הוא משפט אחד לכל קטע?","האם יש שאלה שהקטע עונה עליה?","האם אפשר לענות עליה אחרי שמכסים את ההערות?"],"next":{"m":"בישיבה או בשיחה הבאה כתוב שלושה משפטי סיכום ושלוש שאלות, וכסה את הסיכומים כדי לענות.","f":"בישיבה או בשיחה הבאה כתבי שלושה משפטי סיכום ושלוש שאלות, וכסי את הסיכומים כדי לענות."}},"th-9":{"goal":"קריאה שכל חלקיה זהים מבזבזת זמן על מה שלא חשוב. שאלה מראש מכוונת את תשומת הלב, ומאפשרת לקרוא פחות ולהבין יותר ממה שחשוב באמת.","ex":[{"t":"דוח רבעוני של עשרים עמודים","a":"שאלה: האם ירדה המכירה באזור הצפון? אסרוק את התוכן והסיכום, אקרא לאט רק את פרק הצפון, ואדלג על שאר האזורים.","why":"השאלה קובעת מה לקרוא ומה לדלג, והקריאה האיטית מוקצית רק לחלק הרלוונטי."},{"t":"פוליסת ביטוח חדשה","a":"אחפש קודם: החרגות, השתתפות עצמית ותקופת אכשרה. אקרא אותם פעמיים לאט, ואת שאר הדפים אסרוק לפי כותרות בלבד.","why":"נבחרו מראש שלושה נושאים שמשפיעים על הכסף. הם נקראים היטב, והשאר נסרק."}],"weak":{"a":"אקרא מהר יותר ואנסה להבין.","why":"מהירות בלי מטרה פוגעת בהבנה. לא נאמר מה מחפשים ואיפה מאטים."},"checks":["האם יש שאלה אחת ברורה לפני הקריאה?","האם ברור אילו חלקים נקראים לאט?","האם ברור על מה מדלגים?","האם בסוף אפשר לענות על השאלה במשפט אחד?"],"next":{"m":"לפני הקריאה הבאה כתוב שאלה אחת על פתק, סרוק כותרות, וקרא לאט רק את החלק שעונה עליה.","f":"לפני הקריאה הבאה כתבי שאלה אחת על פתק, סרקי כותרות, וקראי לאט רק את החלק שעונה עליה."}},"th-10":{"goal":"כוח רצון נשחק במהלך היום, ולכן עדיף לשנות את הסביבה מאשר להילחם בפיתוי שוב ושוב. מעט חיכוך מראש חוסך הרבה החלטות קטנות באמצע העבודה.","ex":[{"t":"כתיבת דוח בבית","a":"הסחה: וואטסאפ. אשים את הטלפון במטבח. הסחה: חדשות. אחסום את האתר במחשב. הסחה: רעיון קופץ. אחזיק פתק ואכתוב שורה, בלי לפתוח חיפוש.","why":"לכל הסחה יש פעולה מסוימת, וגם לרעיון שקופץ יש מקום לנחות בלי להפריע."},{"t":"עבודה מול המחשב במשרד","a":"הסחה: מיילים חדשים. אסגור את תיבת הדואר. הסחה: הודעות בקבוצה. אשתיק אותה לשעה. הסחה: שיחה נכנסת. אהפוך את הטלפון על פניו.","why":"כל הסחה נפתרת בפעולה של שנייה, שנעשית לפני תחילת העבודה ולא באמצעה."}],"weak":{"a":"אנסה להתאפק ולא להסתכל בטלפון.","why":"זו הסתמכות על כוח רצון בלי שינוי בסביבה. הטלפון נשאר בהישג יד, וההתאפקות חוזרת כל כמה דקות."},"checks":["האם נבחרו הסחות אמיתיות שחוזרות, ולא כלליות?","האם לכל הסחה יש פעולה מסוימת?","האם הפעולה נעשית לפני שמתחילים לעבוד?","האם יש מקום לרשום רעיון שקופץ?"],"next":{"m":"בסשן העבודה הבא בצע את הפעולות לפני שאתה מתחיל, וסמן בפתק כל פעם שרצית להסיח את הדעת.","f":"בסשן העבודה הבא בצעי את הפעולות לפני שאת מתחילה, וסמני בפתק כל פעם שרצית להסיח את הדעת."}},"th-11":{"goal":"משימות חשובות דורשות רצף שלא נשבר, ושיחות קצרות וניתוקים מפרקים אותו. גוש מוגן עם תוצר ברור מאפשר התקדמות אמיתית, ומבדיל בין עבודה לבין עיסוק.","ex":[{"t":"סגירת רבעון במשרד","a":"אקבע ביום ד' 8:00 עד 9:30 גוש לבדיקת התאמות בנק. התוצר: כל החריגים מעל 500 שקל ברשימה אחת. דלת סגורה, טלפון בחדר אחר, ורק אחר כך אפתח מייל.","why":"השעה, האורך והתוצר ידועים מראש, ולכן קל לדעת אם הגוש הצליח."},{"t":"הכנת הצעה ללקוח גדול","a":"בבוקר יום ראשון, תשעים דקות. התוצר: טיוטה שלמה של ההצעה, גם אם לא מלוטשת. אתחיל בכוס מים ובפתיחת קובץ חדש, ואודיע לצוות שאהיה זמין בעשר ורבע.","why":"התוצר מוגדר כטיוטה ולא כשלמות, והודעה לצוות מונעת הפרעות."}],"weak":{"a":"אקדיש יום שלם לעבוד על הצעה, בלי שיפריעו לי.","why":"אין שעות, אין תוצר ואין הסכמה עם אחרים. יום שלם בלי מבנה הופך בקלות לעבודה מפוזרת."},"checks":["האם יש שעת התחלה וסיום ביומן?","האם התוצר מוגדר במשפט אחד?","האם יש טקס פתיחה קבוע?","האם מי שעלול להפריע יודע מתי הגוש מסתיים?"],"next":{"m":"קבע השבוע גוש אחד כזה, ובסופו כתוב אם התוצר הושג.","f":"קבעי השבוע גוש אחד כזה, ובסופו כתבי אם התוצר הושג."}},"th-12":{"goal":"הכול נראה דחוף כשאין סדר. הפרדה בין חשוב לדחוף מונעת מההודעה האחרונה בוואטסאפ להכתיב את היום, ומפנה זמן לדברים שאין להם מועד אבל משפיעים הכי הרבה.","ex":[{"t":"יום עמוס בסוכנות ביטוח","a":"חידוש פוליסה שפוקעת מחר: היום. שיחה עם לקוח פוטנציאלי: מחר ב-10, ביומן. עדכון טבלת עמלות: להאצלה לרונית. סידור מגירת מסמכים ישנים: מחיקה.","why":"לכל משימה יש החלטה מנומקת, ולמשימה שפוקעת מחר יש מועד אמיתי."},{"t":"סוף שבוע לפני אורחים","a":"לקנות אוכל: היום, כי החנות נסגרת. לתקן ידית בארון: ביומן ליום ראשון. לצחצח מרפסת: ליוסי, שביקש לעזור. לתלות תמונות: למחוק, אין מועד.","why":"יש הבחנה בין דחוף באמת, חשוב בלי מועד, ודברים שאפשר לוותר עליהם."}],"weak":{"a":"אעשה קודם את מה שהכי מציק לי.","why":"מה שמציק אינו תמיד מה שמשפיע. בלי מדד חיצוני כמו מועד או השפעה, מתעדפים לפי תחושה."},"checks":["האם לכל משימה יש החלטה אחת מתוך ארבע?","האם 'היום' מוגבל למשימות שאפשר לסיים?","האם יש מועד אמיתי למשימות הדחופות?","האם משימה אחת לפחות הואצלה או נמחקה?"],"next":{"m":"הבוקר מיין את הרשימה לארבע הקטגוריות, ובצע ראשונה את המשימה החשובה.","f":"הבוקר מיני את הרשימה לארבע הקטגוריות, וביצעי ראשונה את המשימה החשובה."}},"th-13":{"goal":"זמן פנוי וכוח אינם אותו דבר. שעה בשיא האנרגיה מועילה לעבודה קשה יותר משעה של עייפות, ולכן מתאימים משימות לשעות במקום לדחוף הכול ללוח זמנים אחיד.","ex":[{"t":"בוקר מול אחר צהריים","a":"החדות שלי גבוהה בין שמונה לאחת עשרה ויורדת אחרי שתיים. בשעות הבוקר אכתוב הצעות, ואת השיחות הטכניות והמיילים אעביר ל-15:00 עד 17:00.","why":"הרישום מבוסס על ניסיון אישי, ולכל סוג משימה מוקצה חלון שמתאים לו."},{"t":"עבודה מהבית עם ילדים","a":"הבית שקט אחרי עשר בלילה, אבל האנרגיה שלי אז נמוכה, ולכן רק משימות פשוטות: סידור קבצים ותשובות קצרות. את הלימוד אעשה ב-6:30, לפני שהילדים קמים.","why":"הבחירה לא נקבעת לפי השעה הפנויה אלא לפי רמת האנרגיה, ולכל סוג עבודה יש מקום."}],"weak":{"a":"אעבוד בכל שעה פנויה ואתאמץ יותר כשהעייפות מגיעה.","why":"אין בחירה לפי שעות. עבודה קשה בשעה חלשה נמשכת יותר זמן ומתסכלת."},"checks":["האם התשובה מבוססת על מה שקרה בפועל בימים האחרונים?","האם נקבעו שעות מסוימות לעבודה קשה?","האם יש מקום למשימות קלות בשעות החלשות?","האם נלקחו בחשבון הפסקות?"],"next":{"m":"במשך שלושה ימים רשום בשעות קבועות דירוג אנרגיה מאחד עד חמש, ובסופם שבץ את המשימה הקשה לשעה הגבוהה.","f":"במשך שלושה ימים רשמי בשעות קבועות דירוג אנרגיה מאחד עד חמש, ובסופם שבצי את המשימה הקשה לשעה הגבוהה."}},"th-14":{"goal":"שינה היא חלק מהלמידה והריכוז ולא בונוס. שינוי קטן ומתמשך בערב עדיף על ניסיונות מפוזרים להשלים שינה בסוף השבוע, ובעיקר אפשר למדוד אותו.","ex":[{"t":"ערבים עם טלוויזיה ומסך","a":"מסכים נכבים ב-22:30. הטלפון נטען במטבח. עד 23:00 מקלחת ואז קריאה בספר.","why":"יש שעה קבועה, מקום לטלפון ופעילות חלופית, כך שאין ריק שמתמלא בגלילה."},{"t":"קימה מוקדמת לעבודה","a":"אקום ב-6:30 גם ביום שישי, כדי שהשעון לא יזוז. אם יש עייפות, אישן עשרים דקות בצהריים ולא אאחר את השינה בלילה.","why":"שעת קימה קבועה שומרת על הקצב, ויש כלל ברור לטיפול בעייפות שלא פוגע בלילה."}],"weak":{"a":"אנסה ללכת לישון מוקדם יותר.","why":"אין שעה, אין פעולה ואין מדד. 'מוקדם יותר' לא ניתן לבדיקה."},"checks":["האם נקבעה שעה מסוימת?","האם יש פעולה שמחליפה את המסך?","האם יש מקום קבוע לטלפון?","האם אפשר למדוד אחרי שבוע את השינוי?"],"next":{"m":"הערב כבה מסכים בשעה שקבעת, ורשום בבוקר דירוג ריכוז מאחד עד חמש.","f":"הערב כבי מסכים בשעה שקבעת, ורשמי בבוקר דירוג ריכוז מאחד עד חמש."}},"th-15":{"goal":"הקושי הוא לרוב בהתחלה ולא במשימה כולה. צעד קטן וברור מוריד את ההתנגדות, ובדרך כלל ממשיכים אחריו. ההבדל בין דוחים למתחילים הוא גודל הצעד הראשון.","ex":[{"t":"טופס מס שנדחה","a":"הצעד: למצוא את שלושת התלושים האחרונים ולהניח אותם על השולחן. חמש דקות, ואז מותר להפסיק.","why":"הצעד ברור, פיזי ומוגבל בזמן, ולכן אין מה להתלבט."},{"t":"שיחה לא נעימה עם שכן","a":"הצעד: לכתוב בפתק שלושה משפטים על הרעש בלילה. עוד לא מדברים איתו, רק כותבים.","why":"הצעד הראשון מוריד את החשש, כי אין צורך להתעמת עכשיו."}],"weak":{"a":"אתחיל מחר בבוקר, כשיהיה לי יותר כוח.","why":"הדחייה הופכת לתוכנית. אין צעד מסוים ואין שעה, ומחר הקושי יהיה אותו קושי."},"checks":["האם הצעד אורך חמש דקות או פחות?","האם אפשר להתחיל ממנו מיד, בלי הכנה?","האם ברור איך נראה צעד שהסתיים?","האם המחויבות היא רק לצעד ולא למשימה כולה?"],"next":{"m":"עשה עכשיו את הצעד של חמש הדקות, ורק אחר כך החלט אם להמשיך.","f":"עשי עכשיו את הצעד של חמש הדקות, ורק אחר כך החליטי אם להמשיך."}},"th-16":{"goal":"הרגלים נשברים כשהם גדולים מדי או תלויים בהחלטה יומית. עוגן בהרגל קיים וגודל קטן מאוד נותנים להרגל סיכוי להחזיק גם בימים גרועים, ואחר כך אפשר להגדיל.","ex":[{"t":"קריאה יומית","a":"אחרי הקפה של הבוקר אקרא עמוד אחד. כשזה יציב שבועיים, אקרא שני עמודים.","why":"העוגן קיים, הפעולה קטנה, וההגדלה מתוכננת רק אחרי יציבות."},{"t":"פעילות גופנית בבית","a":"אחרי כיבוי המחשב בסוף העבודה אעשה חמש שכיבות סמיכה. גם ביום גרוע מספיקות חמש.","why":"הכלל לא מותנה במצב רוח, ולכן אין צורך להחליט כל יום מחדש."}],"weak":{"a":"אתחיל להתאמן שעה כל יום.","why":"הגודל גדול והתזמון לא מוגדר. ביום עמוס ההרגל נשבר, ואז קשה לחזור אליו."},"checks":["האם יש עוגן בהרגל שכבר קיים?","האם הפעולה אורכת פחות משתי דקות?","האם אפשר לעשות אותה גם ביום גרוע?","האם ברור מתי מגדילים?"],"next":{"m":"בחר היום עוגן אחד, בצע את הפעולה הקטנה מיד אחריו, וסמן וי בלוח.","f":"בחרי היום עוגן אחד, בצעי את הפעולה הקטנה מיד אחריו, וסמני וי בלוח."}},"th-17":{"goal":"תגובה מהירה נותנת הקלה קצרה ויוצרת נזק ארוך בקשרים עם לקוחות, משפחה ועמיתים. עצירה קצרה לא מבטלת את הרגש, היא רק מאפשרת לבחור מה לעשות איתו.","ex":[{"t":"הודעה כועסת מלקוח בוואטסאפ","a":"משפט העצירה: \"קודם נושמים\". אכתוב תשובה בהערות, אשאיר אותה עשר דקות, ואקרא שוב לפני שליחה. אמחק כל משפט שמאשים.","why":"יש משפט קבוע, זמן המתנה מוגדר וקריטריון לעריכה."},{"t":"ויכוח על כסף בבית","a":"אבקש דקה לעצמי, אלך לשטוף פנים, ואחזור עם שאלה במקום האשמה: \"מה הכי מדאיג אותך בהוצאה הזאת?\"","why":"הבקשה מוצגת כהפסקה ולא כבריחה, ויש תכנית לחזור לשיחה בצורה אחרת."}],"weak":{"a":"אנסה לא להתעצבן ולהגיב בצורה רגועה.","why":"זו כוונה כללית ואין בה פעולה לרגע הקשה. בלי משפט וזמן, ברגע הכעס מגיבים כרגיל."},"checks":["האם יש משפט עצירה מנוסח?","האם יש פעולה מסוימת בזמן ההמתנה?","האם נקבע כמה זמן מחכים?","האם יש תכנית לתגובה אחרי העצירה?"],"next":{"m":"בפעם הבאה שתרגיש עצבים, אמור את משפט העצירה וחכה עשר שניות לפני שתענה.","f":"בפעם הבאה שתרגישי עצבים, אמרי את משפט העצירה וחכי עשר שניות לפני שתעני."}},"th-18":{"goal":"השוואה בראש נוטה להישען על מה שבולט ברגע. מטריצה מחייבת להחליט מראש מה חשוב, ומגלה גם מתי הלב מעדיף אפשרות אחרת מזו שהניקוד נותן.","ex":[{"t":"בחירת משרד חדש","a":"קריטריונים: שכר דירה (משקל 5), קרבה ללקוחות (4), חניה (3). גבעתיים: 3, 5, 2 = 41. תל אביב: 2, 5, 4 = 42. רמת גן: 4, 2, 3 = 37. ההפרש קטן, אז אוסיף קריטריון: נגישות בתחבורה ציבורית.","why":"יש חישוב מפורש עם משקלים, וההפרש הקטן מוביל לבדיקה נוספת ולא להכרעה אוטומטית."},{"t":"חבילת חופשה למשפחה","a":"משקלים: מחיר 5, פעילות לילדים 4, זמן נסיעה 3. אילת: 2, 5, 3 = 39. הצפון: 4, 3, 5 = 47. קפריסין: 3, 5, 2 = 41. הצפון מנצח, וקל להסביר את זה לילדים.","why":"המספרים מראים למה אפשרות מנצחת, וקל להסביר את ההחלטה לכל המשפחה."}],"weak":{"a":"אשווה בין האפשרויות ואבחר את הטובה ביותר.","why":"אין קריטריונים ואין משקלים, ולכן \"הטובה ביותר\" נקבעת לפי התחושה ברגע ההחלטה."},"checks":["האם יש לפחות שלוש אפשרויות וכמה קריטריונים?","האם לכל קריטריון יש משקל לפי חשיבותו?","האם הציונים והמשקלים נכפלו וסוכמו נכון?","האם נבדק מה עושים כשהתוצאה צמודה או מפתיעה?"],"next":{"m":"בחר החלטה אחת מהשבוע, בנה לה מטריצה של עשר דקות, והשווה את התוצאה להרגשה שלך.","f":"בחרי החלטה אחת מהשבוע, בני לה מטריצה של עשר דקות, והשווי את התוצאה להרגשה שלך."}},"th-19":{"goal":"הזיכרון משכתב: אחרי שהתוצאה ידועה נדמה לנו שידענו מראש. רישום בזמן אמת שומר על מה שחשבנו באמת, ומאפשר להבחין בין החלטה טובה שהסתיימה רע לבין החלטה גרועה שהצליחה במזל.","ex":[{"t":"שכירת עובד נוסף","a":"החלטתי לגייס עובד כי יש רשימת המתנה של שמונה לקוחות. מצפה שההכנסה תעלה בלפחות עשרים אחוז בתוך שלושה חודשים. בדיקה בעוד שלושה חודשים. אם לא, אבדוק אם הבעיה בגיוס או בביקוש.","why":"יש הנמקה, תחזית עם מספר ומועד בדיקה, כך שאפשר להשוות אחר כך מציאות לציפייה."},{"t":"מעבר לספק אינטרנט חדש","a":"החלטתי לעבור כי המחיר נמוך ב-40 שקל בחודש. מצפה לאותה מהירות. אבדוק אחרי חודשיים: האם היו ניתוקים ומה השירות. אם יותר משניים, אחזור.","why":"יש קריטריון מדיד ותנאי חזרה, ואי אפשר לשכתב אחר כך מה ציפינו."}],"weak":{"a":"אזכור למה החלטתי כשיגיע הזמן.","why":"אחרי שהתוצאה ידועה הזיכרון נוטה להתאים את עצמו אליה. בלי רישום קשה לדעת מה חשבנו בפועל."},"checks":["האם נרשמה ההנמקה לפני שהתוצאה ידועה?","האם יש ציפייה שאפשר לבדוק?","האם יש מועד בדיקה?","האם ברור איך מבחינים בין החלטה טובה למזל?"],"next":{"m":"פתח היום קובץ או מחברת אחת להחלטות, ורשום בה את ההחלטה הבאה שאתה מקבל.","f":"פתחי היום קובץ או מחברת אחת להחלטות, ורשמי בה את ההחלטה הבאה שאת מקבלת."}},"th-20":{"goal":"הטיות הן קיצורי דרך של המוח שפועלים בלי שמרגישים. אי אפשר לבטל אותן, אבל אפשר לזהות את הרגע שבו הן פועלות ולהכניס שאלה אחת שמפרקת אותן.","ex":[{"t":"משא ומתן על מחיר רכב משומש","a":"המוכר פתח ב-90 אלף. אבדוק מחיר שוק לפי שלושה אתרים לפני כל הצעה, כדי שהמספר שלו לא יקבע את הטווח שלי. אם השוק 70 אלף, אפתח ב-65.","why":"המספר הראשון נבדק מול מקור חיצוני, והעיגון מנוטרל לפני שמציעים."},{"t":"פרויקט שנמשך מעבר לתכנון","a":"השקענו בו ארבעה חודשים, אבל אם הייתי מתחיל היום ויודע מה שאני יודע על הלקוח, לא הייתי לוקח אותו. אציע לצוות לסיים בשבועיים או לעצור.","why":"ההשקעה שכבר נעשתה לא נכנסת לשיקול, ומשווים רק מה צפוי מכאן והלאה."}],"weak":{"a":"אני לא מושפע בקלות, אני מחליט לפי ההיגיון.","why":"אי אפשר להתגונן מהטיה בלי לזהות אותה. הטענה שאין השפעה מונעת את השאלה שמגלה אותה."},"checks":["האם נבחרה החלטה אמיתית ולא דוגמה כללית?","האם מופיע הרגע שבו ההטיה פועלת?","האם נשאלה השאלה על התחלה מאפס?","האם ההשקעה שכבר נעשתה יוצאת מהחשבון?"],"next":{"m":"היום, לפני החלטה שאתה מתלבט בה, שאל: מאיפה בא המספר הראשון, ומה הייתי עושה אם הייתי מתחיל מאפס?","f":"היום, לפני החלטה שאת מתלבטת בה, שאלי: מאיפה בא המספר הראשון, ומה הייתי עושה אם הייתי מתחילה מאפס?"}},"th-21":{"goal":"כשנדמה לנו שהבנו משהו, מחפשים אישור ומתעלמים מהשאר. חיפוש מכוון של מידע שסותר מגן מפני טעות יקרה, ומחזק את הדעה אם היא עומדת בבדיקה.","ex":[{"t":"ירידה במכירות","a":"ההנחה: הירידה במכירות נובעת מהמחיר. מה שיסתור: לקוחות שקנו במחיר גבוה מהמתחרים ועדיין עזבו, או ירידה גם במוצר שלא התייקר. אבקש את הנתונים מדנה.","why":"ההנחה מנוסחת, ומוגדר מראש איזה מידע יסתור אותה ומי יספק אותו."},{"t":"בחירת שיטת דיאטה","a":"ההנחה: השיטה הזאת עובדת. אחפש מקרים שבהם היא לא עבדה ומה היו הסיבות, ואשאל את רופאת המשפחה מה היא חושבת עליה.","why":"החיפוש מופנה אל מי שעלול להתנגד, ולא רק אל מי שכבר מצליח."}],"weak":{"a":"אחפש מידע ברשת ואראה מה כתוב על זה.","why":"חיפוש כללי מוביל לרוב לתוצאות שמסכימות עם ניסוח השאלה. לא נקבע מה היה סותר."},"checks":["האם ההנחה כתובה בבירור?","האם יש לפחות שני דברים שהיו סותרים אותה?","האם ברור מי או איפה אפשר לקבל אותם?","האם יש נכונות לשנות את הדעה אם הם נמצאים?"],"next":{"m":"בחר דעה אחת שאתה בטוח בה, וחפש השבוע שני מקורות שמציגים את הצד ההפוך.","f":"בחרי דעה אחת שאת בטוחה בה, וחפשי השבוע שני מקורות שמציגים את הצד ההפוך."}},"th-22":{"goal":"איכות התשובה תלויה באיכות השאלה. שאלה מאשימה או כללית מביאה תשובות הגנתיות או עמומות, ושאלה מדויקת מצביעה על מה שאפשר לבחון ולשנות.","ex":[{"t":"צוות שלא עומד בלוחות זמנים","a":"במקום \"למה אתם תמיד מאחרים?\" אשאל: \"באיזה שלב המשימה נתקעת הכי הרבה זמן בשבועיים האחרונים?\"","why":"השאלה מעבירה את הדיון מאשמה לתהליך, וניתנת לתשובה מסוימת."},{"t":"נער שמסרב להכין שיעורים","a":"במקום \"למה אתה עצלן?\" אשאל: \"מה הכי קשה לך כשאתה מתחיל, והאם זה משתנה כשאני יושב לידך?\"","why":"השאלה בודקת מה המכשול ומה עוזר, ולא שופטת."}],"weak":{"a":"אשאל אותו למה זה לא עובד.","why":"השאלה רחבה, ולרוב מקבלת תשובה כללית כמו \"אין זמן\". אין בה נקודה שאפשר לבדוק."},"checks":["האם השאלה מתחילה ב\"מה\" או \"איך\"?","האם היא נמנעת מהאשמה?","האם אפשר לענות עליה בעובדה או במספר?","האם התשובה עשויה להצביע על פעולה?"],"next":{"m":"בשיחה הבאה שבה משהו לא עובד, החלף \"למה\" בשאלה של \"מה\" או \"איך\", וקבל תשובה אחת מסוימת.","f":"בשיחה הבאה שבה משהו לא עובד, החליפי \"למה\" בשאלה של \"מה\" או \"איך\", וקבלי תשובה אחת מסוימת."}},"th-23":{"goal":"קל לקפוץ לפתרון, אבל לפעמים הוא עונה על בעיה שלא קיימת. ניסוח מדויק, כמה השערות וניסוי זול מונעים בזבוז זמן ומאפשרים לדעת מה באמת עבד.","ex":[{"t":"לקוחות שלא חוזרים","a":"בעיה: 14 מתוך 40 לקוחות לא חידשו השנה. סיבות: מחיר, שירות איטי, מתחרה זול. ניסוי: אתקשר לחמישה מהם ואשאל מה גרם להם לעזוב.","why":"הבעיה מנוסחת במספר, יש כמה סיבות, והבדיקה זולה ומתבצעת לפני הפתרון."},{"t":"קבוצת וואטסאפ של ועד הבית","a":"בעיה: בשלוש ההודעות האחרונות ענו רק שניים מ-20 דיירים. סיבות: שעת ההודעה, אורך, חוסר עניין. ניסוי: הודעה קצרה בשבע בערב עם שאלה אחת.","why":"אפשר למדוד את התוצאה בהודעה הבאה, ולא מתחילים בפתרון גורף כמו להחליף קבוצה."}],"weak":{"a":"הבעיה שהצוות לא מתאמץ, אז נעשה ישיבה ונדבר איתם.","why":"הניסוח כולל פרשנות ולא עובדה. אין מספר, אין סיבות חלופיות ואין בדיקה."},"checks":["האם הבעיה מנוסחת במשפט אחד ועם מספר?","האם יש לפחות שלוש סיבות אפשריות?","האם הניסוי קטן וזול?","האם ברור איזו תוצאה תאשר או תפריך את ההשערה?"],"next":{"m":"בחר בעיה אחת קטנה, ובצע את שלושת הצעדים על דף אחד לפני שאתה מחפש פתרון.","f":"בחרי בעיה אחת קטנה, וביצעי את שלושת הצעדים על דף אחד לפני שאת מחפשת פתרון."}},"th-24":{"goal":"כשמדמיינים כישלון, קל יותר לומר דברים שלא נעים לומר על תוכנית. מהרשימה ההפוכה נגזרים כללים מסוימים שמונעים את הטעויות לפני שהן קורות.","ex":[{"t":"השקת שירות חדש","a":"להבטיח כישלון: לא לבדוק עם לקוח, לתמחר בלי חישוב, ולהשיק באמצע אוגוסט. כללים: שלושה לקוחות מנסים לפני ההשקה, גיליון עלויות, השקה בספטמבר.","why":"כל דרך לכישלון הופכת לכלל שאפשר לסמן עליו וי."},{"t":"ארוחת שישי למשפחה מורחבת","a":"להבטיח כישלון: לא לברר מי צמחוני, לא לספור כיסאות, ולהתחיל לבשל ב-17:00 לארוחה ב-19:00. כללים: לברר יום קודם, לספור מקומות, להתחיל ב-14:00.","why":"הרשימה מתארת פעולות ולא חששות כלליים, ולכן אפשר להפוך אותה לכללים."}],"weak":{"a":"אחשוב על כל מה שיכול להשתבש.","why":"הרשימה כללית וקשה להפוך אותה לפעולה. חסר ההיפוך לכללים."},"checks":["האם יש יעד אחד ברור?","האם הרשימה מתארת פעולות שמבטיחות כישלון, ולא חששות כלליים?","האם כל פריט הופך לכלל?","האם הכללים אפשריים ליישום?"],"next":{"m":"לפני התוכנית הבאה כתוב שלוש דרכים להבטיח כישלון, והפוך אותן לשלושה כללים.","f":"לפני התוכנית הבאה כתבי שלוש דרכים להבטיח כישלון, והפכי אותן לשלושה כללים."}},"th-25":{"goal":"הרבה החלטות נשענות על \"ככה עושים\". פירוק לעובדות מבדיל בין מה שהכרחי לבין הרגל, ופותח אפשרויות זולות או פשוטות יותר שלא נראו קודם.","ex":[{"t":"הוצאה קבועה על ביטוח","a":"בטוח: יש צורך בכיסוי לנזק מעל 50 אלף שקל. מקובל: כיסוי מלא לכל תקלה קטנה. אבדוק פוליסה עם השתתפות עצמית גבוהה יותר ואחסוך את ההפרש.","why":"מופרדת הדרישה האמיתית מהרגל המקובל, והמסקנה היא בדיקה מסוימת."},{"t":"ישיבות צוות שבועיות","a":"בטוח: כל אחד צריך לדעת על מה אחרים עובדים ומה תקוע. מקובל: שעה בחדר עם כולם. אנסה עדכון כתוב של חמש שורות, ורק מי שתקוע מצטרף לשיחה של רבע שעה.","why":"הצורך האמיתי הוא מידע ולא ישיבה, ולכן אפשר לנסות פתרון זול יותר."}],"weak":{"a":"ככה כולם עושים, אז זה כנראה נכון.","why":"ההנחה נשענת על נוהג ולא על סיבה. השיעור מבקש לברר מה הכרחי באמת."},"checks":["האם יש הפרדה בין מה שבטוח למה שמקובל?","האם מה שנרשם כבטוח באמת אי אפשר לערער עליו?","האם נבנתה אפשרות חדשה מהעובדות?","האם אפשר לבדוק את האפשרות בקטן?"],"next":{"m":"בחר הוצאה או נוהג אחד, כתוב שלוש עובדות בטוחות עליו, ובדוק חלופה אחת שנובעת מהן.","f":"בחרי הוצאה או נוהג אחד, כתבי שלוש עובדות בטוחות עליו, ובדקי חלופה אחת שנובעת מהן."}},"th-26":{"goal":"האשמת אדם נותנת הקלה קצרה והבעיה חוזרת. ציור הקשרים בין הגורמים מראה את הלולאה שמשחזרת אותה, ומאפשר להתערב בנקודה שבה שינוי קטן משפיע על הכול.","ex":[{"t":"טעויות חוזרות בהזמנות","a":"הזמנות רבות, ואז עומס, ואז מהירות, ואז טעויות, ואז תיקונים, ואז עוד עומס. נקודה לשינוי: רשימת בדיקה של שלוש שורות לפני אישור הזמנה.","why":"הגורמים מחוברים ברצף שחוזר להתחלה, והשינוי נבחר במקום קטן אחד."},{"t":"ריבים בבית על הכלים","a":"מישהו מתעצבן ומעיר, אז האחרים נעלבים ולא מצטרפים, אז העומס עליו גדל והוא מתעצבן יותר. נקודה לשינוי: לוח תורנות קבוע, כדי שלא יהיה צורך להעיר.","why":"הלולאה מראה שההערה מחמירה את מה שהיא באה לתקן, והשינוי מבטל את הצורך בה."}],"weak":{"a":"הבעיה היא שיוסי לא מתאמץ, ולכן צריך לדבר איתו.","why":"האשמה בגורם אחד לא מסבירה למה הבעיה חוזרת. חסרים קשרים בין גורמים ונקודת התערבות במערכת."},"checks":["האם יש לפחות שלושה גורמים?","האם הם מחוברים כך שהמעגל נסגר?","האם נבחרה נקודה אחת לשינוי?","האם הנקודה אינה האשמת אדם?"],"next":{"m":"צייר על דף את הלולאה של בעיה אחת שחוזרת אצלך, ובחר נקודה אחת לשנות השבוע.","f":"ציירי על דף את הלולאה של בעיה אחת שחוזרת אצלך, ובחרי נקודה אחת לשנות השבוע."}},"th-27":{"goal":"מילים כמו \"סביר\" או \"כנראה\" מובנות אחרת לכל אדם. אחוז מפורש מחייב לחשוב, מאפשר להשוות בין הערכות ולבדוק אחרי זמן אם התחושה שלנו מכוילת.","ex":[{"t":"סגירת עסקה עם לקוח","a":"70 אחוז שיוסי יחתום עד סוף החודש, כי שאל על תנאי תשלום ועדיין מתלבט בין שני ספקים. אם עד ה-20 אין תשובה, אתקשר. אסמן אם חתם.","why":"יש אחוז, נימוק ופעולה מוגדרת למקרה שהתחזית מתעכבת."},{"t":"יום גשם בטיול משפחתי","a":"40 אחוז שירד גשם אחר הצהריים, לפי התחזית ולפי השמיים. לכן נטייל בבוקר ונשאיר גיבוי: מוזיאון קרוב. אם ירד גשם, זה לא אומר שטעיתי, רק שזה בטווח הצפוי.","why":"ההערכה מובילה לתוכנית עם גיבוי, והתוצאה לא נשפטת כנכונה או שגויה על פי מקרה אחד."}],"weak":{"a":"כנראה שיחתום, יש לי תחושה טובה.","why":"\"כנראה\" לא נותן מספר ולא מאפשר בדיקה. אי אפשר לדעת אם התחושה צודקת לאורך זמן."},"checks":["האם יש אחוז ולא רק מילה?","האם יש נימוק של משפט אחד?","האם יש פעולה שתלויה בתוצאה?","האם נקבע מתי בודקים אם התחזית התממשה?"],"next":{"m":"כתוב היום שלוש תחזיות עם אחוזים, וסמן אחרי שבוע אילו מהן התממשו.","f":"כתבי היום שלוש תחזיות עם אחוזים, וסמני אחרי שבוע אילו מהן התממשו."}},"th-28":{"goal":"טעות היא מידע יקר רק אם מפיקים ממנה כלל. חקירה שקטה ועניינית, בלי האשמה עצמית, הופכת אירוע בודד להרגל שמונע את הטעות הבאה.","ex":[{"t":"טעות במחיר בהצעה ללקוח","a":"מה קרה: שלחתי הצעה עם מחיר ישן. ההנחה: שהקובץ מעודכן. כלל חדש: לפני שליחה בודקים את תאריך הקובץ מול רשימת המחירים, ורונית מאשרת.","why":"יש עובדה, הנחה שגויה וכלל שאפשר לבצע בדיוק, עם אחראית."},{"t":"איחור לפגישה חשובה","a":"מה קרה: הגעתי באיחור של עשרים דקות. ההנחה: הדרך נמשכת חצי שעה, בלי פקקים. כלל חדש: בפגישות מחוץ לעיר מחשבים את הדרך לפי שעת השיא ויוצאים רבע שעה מוקדם יותר.","why":"ההנחה מנוסחת במספר, והכלל החדש משנה את דרך החישוב ולא רק את הכוונה."}],"weak":{"a":"טעיתי, צריך להיזהר יותר בפעם הבאה.","why":"אין שאלה על מה קרה ואין כלל מסוים. \"להיזהר\" הוא כוונה ולא פעולה."},"checks":["האם תוארה העובדה בלי האשמה?","האם זוהתה ההנחה או הכלל שהובילו לטעות?","האם הכלל החדש מנוסח כפעולה?","האם ברור מתי ומי מפעיל אותו?"],"next":{"m":"כתוב היום את הטעות האחרונה בשלוש שאלות, והוסף את הכלל החדש לרשימת בדיקה קבועה.","f":"כתבי היום את הטעות האחרונה בשלוש שאלות, והוסיפי את הכלל החדש לרשימת בדיקה קבועה."}},"br-5":{"goal":"הצעת ערך טובה מאפשרת לזר להבין תוך שנייה מה מקבלים ממך. בלי תוצאה ובלי זמן, כל הצעה נשמעת כמו כל הצעה אחרת, והקהל ממשיך לגלול. כדי לבדוק, קראו אותה בקול: אם אפשר להוסיף \"ולכן מה?\" בסוף, חסרה תוצאה.","ex":[{"t":"אימון כושר לאמהות טריות","a":"אלווה אמהות אחרי לידה לחזור לכושר בשלושה אימונים של 20 דקות בשבוע, בבית, עם גומיות בלבד. תוך שמונה שבועות הן יעלו במדרגות בלי להתנשף.","why":"יש קהל מוגדר, תוצאה שאפשר לדמיין, וזמן ותנאים. מי שקוראת יודעת מיד אם זה מתאים לה."},{"t":"רואה חשבון לעצמאים","a":"בפגישה אחת אסדר לעצמאים תיקייה ולוח תשלומים, וכך יפסיקו לפחד ממכתבי מס. בסוף החודש הם יידעו בדיוק כמה כסף לשים בצד.","why":"הכאב מוגדר (פחד ממכתבים), יש תהליך קצר ותוצאה שמורגשת בתוך חודש."}],"weak":{"a":"אעזור לאנשים להצליח בעסק שלהם בצורה מקצועית ואישית.","why":"אין כאן קהל, תוצאה או זמן. כל יועץ יכול לכתוב את המשפט הזה, ולכן הוא לא מבדיל אותך."},"checks":["האם ברור למי ההצעה מיועדת?","האם יש תוצאה שאפשר לראות או למדוד?","האם מופיע פרק זמן או היקף?","האם אדם זר היה מבין אותה בלי הסבר נוסף?"],"next":{"m":"הקרא את ההצעה לחבר מחוץ לתחום ובקש ממנו לחזור עליה במילים שלו.","f":"הקריאי את ההצעה לחבר מחוץ לתחום ובקשי ממנו לחזור עליה במילים שלו."}},"br-6":{"goal":"קול מזוהה גורם לאנשים להכיר פוסט שלך גם בלי שם. תכונה בלי כלל היא משאלה, ורק כלל מאפשר לבדוק כל טקסט לפני שמפרסמים אותו. כללים קטנים וקבועים חוסכים הרבה שכתובים, ומאפשרים גם לאדם אחר לכתוב בשמכם.","ex":[{"t":"יועצת משכנתאות","a":"ישיר: הפסקה הראשונה מכילה את המספר. סבלני: כל מונח מקצועי מוסבר במשפט אחד. צנוע: לא אשתמש במילה \"הכי\" בלי הוכחה.","why":"שלוש תכונות, ולכל אחת כלל שאפשר לסמן ב-V או ב-X על כל פוסט."},{"t":"מאמן ריצה","a":"אכתוב כמו שמדברים בזמן ריצה: משפטים קצרים, בדיחה אחת בפוסט, ותמיד סיום בצעד אחד שאפשר לעשות מחר בבוקר.","why":"הכלל נשען על קול אמיתי, והסיום הקבוע יוצר תבנית שהקהל מזהה."}],"weak":{"a":"אהיה מקצועי, אמין ומעניין.","why":"שלוש מילים שכל אחד רוצה להיות, בלי כלל. אי אפשר לדעת אם פוסט מסוים עומד בהן."},"checks":["האם יש שלוש תכונות ולא יותר?","האם לכל תכונה יש כלל שאפשר לבדוק?","האם הקול נשמע כמו הדיבור האמיתי?","האם אפשר לזהות את הקול בפוסט בלי השם?"],"next":{"m":"קח את הפוסט האחרון שלך, ובדוק אם כל אחד משלושת הכללים מתקיים בו.","f":"קחי את הפוסט האחרון שלך, ובדקי אם כל אחד משלושת הכללים מתקיים בו."}},"br-7":{"goal":"סיפור קצר מחליף עשר טענות. הוא מראה את הערכים והמקצועיות בפעולה, ומאפשר לקהל להרגיש אותך לפני שהוא מכיר אותך. כדאי לשמור כמה כאלה בהערות בטלפון, כדי שיהיה מה לשלוף כשאין רעיון.","ex":[{"t":"מורה לנהיגה","a":"ביום הראשון שלי כמורה, תלמיד בן 40 בכה בתוך הרכב. עצרתי בצד ושתקתי דקה. הבנתי שהוא לא פוחד מהכביש אלא מלהיכשל שוב, ומאז כל שיעור שלי נפתח בשאלה אחת.","why":"יש רגע מדויק, רגש אמיתי ומסקנה שמשפיעה על העבודה היום."},{"t":"מוכרת בחנות בגדים","a":"לפני שנתיים לקוחה החזירה שמלה ואמרה שהיא מרגישה בה לא נעים. לא ניסיתי לשכנע. שאלתי מה כן נעים לה, ומאותו יום כל שיחה אצלי מתחילה בשאלה הזאת.","why":"הפרט הקטן (שמלה, משפט) מוכיח שהסיפור אמיתי, והסוף מראה שיטה."}],"weak":{"a":"תמיד רציתי לעזור לאנשים, ולכן בחרתי במקצוע הזה, ועם השנים למדתי הרבה.","why":"זה תקציר ולא סיפור. אין רגע, אין פרט ואין מה לדמיין, ולכן אי אפשר להזדהות."},"checks":["האם יש רגע אחד ולא תקופה שלמה?","האם יש פרט שאפשר לדמיין, כמו מקום או משפט?","האם מופיע גם רגש ולא רק עובדות?","האם הסיפור מסתיים במסקנה שקשורה לעבודה?"],"next":{"m":"ספר את הסיפור בקול לאדם אחד, ושים לב באיזה משפט הוא חייך או הרים גבה.","f":"ספרי את הסיפור בקול לאדם אחד, ושימי לב באיזה משפט הוא חייך או הרים גבה."}},"br-8":{"goal":"הביוגרפיה היא המקום הראשון שאנשים קוראים כשהם מחליטים אם לעקוב. היא צריכה לענות על שלוש שאלות: זה בשבילי, אפשר לסמוך, ומה עושים עכשיו. אפשר לעדכן אותה כל רבעון, לפי ההוכחה החדשה ביותר.","ex":[{"t":"שרברב עם דף עסקי","a":"מתקן נזילות בתל אביב והסביבה. 12 שנה, כ-2,000 תיקונים, הגעה באותו יום. לתיאום, הודעה בוואטסאפ.","why":"כל משפט עונה על שאלה: איפה, כמה ניסיון, ומה עושים עכשיו."},{"t":"מאמנת לחיי זוגיות","a":"אני מלווה זוגות לדבר על כסף בלי לריב. עבדתי עם 90 זוגות, רובם התחילו כשכל שיחה הסתיימה בטריקת דלת. הקליקו על הקישור לשיחת היכרות.","why":"הקהל מוגדר, ההוכחה כוללת מספר וגם תמונה, והקריאה לפעולה מפורשת."}],"weak":{"a":"אמא, אוהבת קפה, שמחה בחיים. כאן אשתף השראה.","why":"זה תיאור של אישיות ולא של ערך. לא ברור למי זה מועיל, מה ההוכחה ומה לעשות הלאה."},"checks":["האם ברור למי מועילים?","האם יש הוכחה אחת עם מספר או מקרה?","האם מופיע צעד הבא ברור?","האם הכל נכנס בלי לגלול?"],"next":{"m":"החלף היום את הביוגרפיה שלך בגרסה של שלושה משפטים, ובדוק אותה אחרי שבוע.","f":"החליפי היום את הביוגרפיה שלך בגרסה של שלושה משפטים, ובדקי אותה אחרי שבוע."}},"br-9":{"goal":"רוב הצופים בפרופיל חדש לא קוראים הכל. הם מחפשים תשובה לשאלה אחת: מי זה ומה יוצא לי מזה. פרופיל מסודר חוסך להם לנחש, וגם משפר את סיכוי המעקב. בדקו אותו מהטלפון של אדם זר, כי כך רוב הקהל רואה אותו.","ex":[{"t":"מאמנת שינה לתינוקות","a":"תמונה שלי מחייכת באור יום. השם \"רונית | שינה לתינוקות\". קישור יחיד לשיחת היכרות. פוסט נעוץ: שלוש שיטות לשינה רגועה, ומה אפשר לצפות בשבוע הראשון.","why":"השם כולל מילת חיפוש, יש קישור אחד ופוסט נעוץ שמסביר את הערך."},{"t":"יועץ משכנתאות","a":"תמונה בחולצה מכופתרת בלי משקפי שמש. שם: \"יוסי כהן, משכנתאות\". הקישור מוביל ללוח זמנים לפגישה. הפוסט הנעוץ הוא סיפור קצר על זוג שחסך 90 אלף שקל.","why":"הפרטים מקצועיים וברורים, ויש הוכחה בפוסט הנעוץ."}],"weak":{"a":"תמונה מהחופשה, שם: \"Yossi\", ובביו: \"אוהב חיים\". קישור לאינסטגרם של אחי.","why":"אין רמז לתחום, התמונה לא מעידה על מקצוע, והקישור מוביל למקום לא קשור."},"checks":["האם הפנים נראות בבירור בתמונה?","האם בשם יש מילה שמסבירה במה עוסקים?","האם יש קישור אחד בלבד שמוביל לצעד הבא?","האם פוסט נעוץ מסביר מה אפשר לקבל כאן?"],"next":{"m":"בקש מחבר לגלול בפרופיל שלך חמש שניות, ושאל אותו במה עוסקים כאן.","f":"בקשי מחבר לגלול בפרופיל שלך חמש שניות, ושאלי אותו במה עוסקים כאן."}},"br-10":{"goal":"עמודים הופכים את השאלה \"על מה לכתוב היום\" לשאלה קלה יותר: \"איזה עמוד השבוע\". הם גם מונעים לבלבל בין מטרות, כי כל עמוד משרת משהו אחר: אמון, ידע או מכירה. כשפוסט לא מתאים לאף עמוד, זה סימן טוב שאפשר לוותר עליו.","ex":[{"t":"מאמן כושר אישי","a":"עמוד 1: טעויות בחדר כושר, למשל שכחת חימום. עמוד 2: תוצאות של מתאמנים, למשל פחות 6 קילו בשלושה חודשים. עמוד 3: יום באימון, למשל ארוחת בוקר לפני סשן בשש בבוקר.","why":"שלושה עמודים עם מטרות שונות: ידע, הוכחה וקרבה. לכל אחד יש כבר רעיון ממשי."},{"t":"סוכנות ביטוח משפחתית","a":"עמוד שאלות של לקוחות: \"האם הרכב מכוסה בהשכרה?\". עמוד תביעות שנסגרו: תביעת צנרת שהושלמה בשבועיים. עמוד צוות: מי עונה לטלפון ומה היא אוהבת.","why":"הרעיונות נולדו מהעבודה האמיתית, ויש גם אנושיות וגם מקצועיות."}],"weak":{"a":"אפרסם מה שמתחשק לי באותו יום: טיפ, תמונה של קפה, או ציטוט.","why":"בלי עמודים כל פוסט מתחיל מאפס, והקהל לא מבין מה עוקבים אחריו. קשה גם למדוד מה עבד."},"checks":["האם יש שלושה עד ארבעה עמודים בלבד?","האם לכל עמוד יש מטרה אחרת?","האם לכל עמוד יש לפחות שני רעיונות ממשיים?","האם העמודים מבוססים על העבודה האמיתית?"],"next":{"m":"הדבק את שלושת העמודים בהערות בטלפון, והוסף מתחת לכל אחד רעיון אחד לשבוע הקרוב.","f":"הדביקי את שלושת העמודים בהערות בטלפון, והוסיפי מתחת לכל אחד רעיון אחד לשבוע הקרוב."}},"br-11":{"goal":"יותר תוכן
